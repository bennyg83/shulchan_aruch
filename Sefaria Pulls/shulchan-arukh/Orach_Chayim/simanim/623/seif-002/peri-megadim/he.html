<b>ותוקעין</b> עיין ט״ז עיין לבוש הרבה טעמים שמערבבין שלא יוכל לקטרג וחירות מעונות וזכר לשופר של יובל ביוה״כ יע״ש ובא״ר ה׳ בשם תוס׳ פ׳ אלו קשרים להראות שהוא י״ט בליל מוצאי יוה״כ ולכן אומרים בליל מוצאי יה״כ כמו בשבת וי״ט יום טוב איש לחבירו בשם מט״מ יע״ש. וביה״ש משמע נמי תוקעין עמ״א ד׳ ואי״ה שם יבואר:
