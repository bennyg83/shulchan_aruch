<b> דקי"ל מפטיר וכו'</b> -  ואף דהגמרא מיירי היכי דשייר להמפטיר פסוקים שלא קראן מתחלה ולכך עולה למנין ובזה הלא כבר קראן מתחלה ומבואר לעיל בסוף סימן קל"ז דכשחוזר עם אחד מה שכבר קרא לאחר אינו עולה מן המנין הכא שאני כיון דלא אפשר בענין אחר שכבר סיים הפרשה ששייך לשבת זו וכמבואר שם דהיכא דלא אפשר עולה למנין:
