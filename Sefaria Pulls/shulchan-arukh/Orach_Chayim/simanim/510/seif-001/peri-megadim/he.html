<b>מוללין</b> עט״ז רש״י ביצה י״ב ע״ב ובמשנה י״ד ב׳ אבל הרשב״א ז״ל סובר נפה וכברה בשבת חטאת בי״ט אסור ע׳ אות ג׳ ואפשר מן שומר הפירי ולאלתר אף בנפה וכברה רק דמיחזי לימים הרבה עמ״א ד׳ ובא״ר אות ד׳ וע׳ לבוש בהג״ה דבנפה אסור בי״ט ואפ״ה בס״ב כתב דלבו ביום שרי וצ״ל בין נפה לבו ביום ואי״ה במ״א ב׳ יבואר עוד:
