(ז) מותר לתובעו - היינו אפילו לילך לעיר אחרת ולתובעם שם ואפילו אם יכול למצאם שם אחר המועד ג"כ דגביית חוב בעלמא אין זה בכלל סחורה:<br>
(ח) לגבות מעותיו - ואפילו למיקם עמם בדינא ודיינא שרי:<br>
