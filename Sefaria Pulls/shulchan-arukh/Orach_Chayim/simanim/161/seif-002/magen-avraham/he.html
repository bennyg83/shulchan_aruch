<b>היה אחד צבע</b>. ואם הוא טבח ומוכר שומן ויש דם ושומן על ידו מבעיא ספ"א דזבחים ולא איפשטא ונ"ל דבטבילת נדה אזלי' לחומרא ובנט"י לקולא עיין ברמב"ם פ"ג ממקואות ונ"ל דה"ה בכל הדברים החוצצין:<br>
<b>שהדיו</b>. ומי שכותב תדיר אין הדיו חוצץ:<br>
<b>גלדי מכה</b>. ואם מצטער בנטילתו אינו חוצץ (ב"י סמ"ג וסמ"ק יש"ש):
