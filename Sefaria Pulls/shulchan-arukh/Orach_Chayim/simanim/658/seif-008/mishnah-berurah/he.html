(לג) שקנו אתרוגים - לאכילה:<br>
(לד) מתפיסת הבית - ר"ל מה שירשו מאביהם ועדיין לא חלקו:<br>
(לה) ואין האחים מקפידים - דאז נחשב כשלו:<br>
(לו) אין מחילתם בסתם מועלת - שאע"פ שאין מקפידים על האכילה מקפידין הם על המצות שאף הם רוצים לקיים המצות כמוהו:<br>
(לז) לפי שאינן מקפידין - שגם הם יכולים לקיים המצות כמוהו:
