<b>יפה תענית</b>. ותשוב' עמו (ס"ח) ועיין ברבה קהלת ומ"מ אין מחויב להתענות דהא שמואל אמר החלומות שוא ידברו (רשב"א סי' קל"ב):<br>
<b>ואפי' בשבת</b>. כ' ע"ת בשם כ"ג מה"ב דאם יש י' שמתענין בשבת מתפללין מנחה בקול רם ולומר ענינו בסוף התפלה ולע"ד דאין נכון לעשות כן עכ"ל ועמ"ש ססי' קי"ט ובטור סימן זה ובסימן תקס"ו:
