[ג] <b>ומשער וכו'.</b> צריך עיון דבטור מבואר שזה דעת ר"י ופליג על רש"י שהוא סברא ראשונה ואם כן היאך הרכיב הלבוש שני הדעות. ולענין הלכה השולחן ערוך וב"ח פסקו כר"י אבל בים של שלמה סוף פרק אין צדין פסק כשניהם לקולא כיון שהוא מילי דרבנן ימלא במדה עצמו ולא בידיו או ישער בכלי אחר, ונראה לי לתרץ בזה דעת הלבוש:
