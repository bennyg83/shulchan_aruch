<b> צומח מן הארץ ותלוש ואינו מקבל טומאה</b> -  עיין מ"ב דכל זה דרשינן מקראי הלכך דאורייתא נינהו ולעיכובא דהיינו דבר שאינו צומח מארץ או מחובר או דבר שראוי לקבל טומאה מן התורה פסול מדאורייתא אכן דבר שראוי לקבל טומאה מדרבנן פסול רק מדרבנן וע"כ אם אין לו לסכך רק בדבר זה יש לומר דיסכך בו ולא יברך [פמ"ג]:
