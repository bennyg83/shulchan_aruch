<b>(ס"ק יג) שלא כו'</b> משום דלהאומרים א"צ כוונה (ועסי' קנ"ט סעיף י"ב וי"ג כו') ול"ש לברך עלי' ר"ל נטילה ראשונה דהא כ' בסעיף י"א דאם שכח לברך עד אחר הניגוב אפ"ה מברך וה"נ כיון דעדיין הוא קודם ברכת המוציא:<br>
