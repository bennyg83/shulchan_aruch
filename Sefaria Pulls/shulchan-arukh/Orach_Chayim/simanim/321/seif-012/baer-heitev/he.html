<b>פירות. </b> שהם גדולי קרקע ושייך במינו טחינה:<br>
<b>לאכלו. </b> או שהתרנגולים יאכלו מיד שרי לחתוך שלא אסרו על האדם לאכול מאכלו בחתיכות גדולות או קטנות א"כ הוי דרך אכילתו בכך ר"ן ב"י. ומזה היתר לעשות מזריע"ה דהיינו שחותכין הצנון דק דק. ועכ"פ אסור לעשות עד אחר יציאת בה"כ דבעי סמוך לסעודה ממש כמ"ש סי' שי"ט אחרונים:
