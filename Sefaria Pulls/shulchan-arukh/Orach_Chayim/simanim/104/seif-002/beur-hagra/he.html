<b>ס"ב אבל בענין כו'. </b>עתוס' ל"א א' ד"ה ומוצאו אבל הרא"ש הסכים להר' יוסף וכתב דאי בתוך י"ח היכי קאמר ומוצאו בזויות זו והלא אסור לצאת ממקומו כו' וז"ש בש"ע אא"כ הוא בתחנונים כו' ור"ל כמ"ש במתני' אפילו נחש כרוך על עקבו כו' וברישא אמר לא ישיבנו בדיבור וסיפא בהילוך וזה שמסיים והולך הטוש"ע ואפילו נחש כו':
