<b> נשים מזמנות לעצמן רשות</b> -  ודעת הגר"א בביאורו שהעיקר כהרא"ש ותר"י שנשים מזמנות לעצמן חוב. אך העולם לא נהגו כן:<br>
<b> אבל כשאוכלות עם האנשים</b> -  פשוט דהיינו אפילו אשה אחת:<br>
<b> ויוצאות בזמון שלנו</b> -  ומשמע מדברי היד הקטנה דהיא אסורה לברך ברכת הזימון ולהוציא את האנשים אלא שצריכה לשמוע ולצאת מהזימון שמברכין האנשים:
