<b>הזריז וכו'</b>. נפל תינוק לבור עוקר חוליא ומעליהו אף על פי שהוא מתקן בה מדרגה בשעת עקירתו, ננעל הדלת בפני תינוק שובר הדלת ומוציאו אף על פי שהוא מפצל אותם כמין  עצי' שראוים למלאכ' שמא יבעת התינוק וימות [רמב"ם גמר'] ולא אמרינן שאפשר לקרקש ליה באגוזים מחוץ [גמרא ע"ש ומשמע קצת בהגמ"ר דאין להקל בזה]:
