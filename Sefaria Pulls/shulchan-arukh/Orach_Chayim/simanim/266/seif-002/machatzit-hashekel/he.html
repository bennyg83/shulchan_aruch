<b>(ס"ק ב) כיסוי כו'</b> נ"ל דיתן החמור לגוי כו' הקשה בספר ת"ש כיון דהיא משא כבד דאין הגוי יוכל לשאת ה"ל כאין עמו גוי ומותר ליתן על החמור ותי' דכה"ג דנותנו לגוי או מפקירו אין צריך לתת עליה כשהיא מהלכת כו'. ולא יחמר ישראל אחריה כיון דהיא משא כבד טריחא מילתא טובא ליתן עליה וליטלה ממנו כל עת וע"ש מ"ש עוד:
