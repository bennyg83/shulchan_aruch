<b>אפי' הוא עכו"ם</b>. וכתב הרא"ש בשם ריב"א דעכו"ם או אשה נאמנים להכחיש ישראל:<br>
<b>שאומר</b>. אפי' אינו אומר שיסתכן רק שאומר שאפשר שיכבד עליו החולי נותנין לו שאנו חוששין שמא יסתכן [ב"ח מהר"ש לבוש ומהרי"ל]:<br>
<b>צריך אני</b>. אפי' הרופאים אומרים שהמאכל יזיקהו שומעין לחולה [רדב"ז ח"א פ"ו כ"ה] עמ"ש בשמו סימן ש"ל:
