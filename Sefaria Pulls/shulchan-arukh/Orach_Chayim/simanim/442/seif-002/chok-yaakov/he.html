<b>ומלוגמא </b> פירש תחבושת עשויה מקמח ותאנים וכיוצא בהם שאדם לועס ונותן ע"ג מכה והרמב"ם בפי' המשניות פ"ח דשביעית משנה א' ובפ' כ"ד דכלים משנה ג' פי' מלוגמא הוא מלא לוגמא שלועס חטין ע"ג מכתו וע"ל ר"ס תס"ו:<br>
<b>שנסרחה. </b> ודוקא בנסרחה קודם פסח או נסרחה ואח"כ נתחמצה וכן הדין בחמץ שעיפשה כמבואר בסעיף ט':
