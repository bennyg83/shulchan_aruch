<b>ומתפלל. </b> ומתנה ואומר אם לא התפללתי תהא לחובתי ואם התפללתי תהא לנדבתי <small>(ב"י מ"א)</small>:<br>
<b>מוסף. </b> מפני שהיא חטאת ואין באה בנדבה ואע"ג שמוסף שבת היה עולה מ"מ בשבת בלא"ה אין יכול להביא קרבן נדבה כמו שיתבאר ועיין בהרא"ש:<br>
<b>ברכה. </b> דכיון דהתחיל להתפלל ע"ד שלא התפלל שויה עליה כחובה ואפי' בתפלת ערבית שהיא רשות פוסק. מ"א:
