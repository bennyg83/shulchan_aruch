<b>אוכל ושותה</b>. נ"ל דבת"ח אסור דמשעה שחלם צריך להתענו' כמ"ש סי' רפ"ח ס"ד וכ"כ של"ה דמשעה שחלם לא ישמש מטתו:<br>
<b>אבל אם ישן</b>. אפי' תוך סעודתו (ב"י):<br>
<b>וי"א כו'</b>. ונוהגין להתנו' אפי' לשתיה ונכון הוא [לבו' וב"ח] ונ"ל דהכל לפי מה שהוא אדם אם רגיל לשתות בלילה מותר לשתות בלא תנאי ועסי' תקפ"א ס"ב בהג"ה:
