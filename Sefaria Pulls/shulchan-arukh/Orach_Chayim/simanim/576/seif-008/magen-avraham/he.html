<b>ירקון</b>. תבואה שהכסיפו פניה. שדפון רוח שמריק הזרע מן התבואה:<br>
<b>פי התנור</b>. פי' תבואה שראויה לעשות פת כמלא פי תנור ובגמ' אבעי' להו אם ר"ל ככיסוי התנור או כשורות הלחם הדבקים בפי התנור זה אצל זה א"נ זה למעלה מזה:<br>
<b>באותו הפרכי'</b>. ודוקא במכה מהלכ' אבל בשאינ' מהלכת מתענין ולא מתריעים כמ"ש סי"ב:
