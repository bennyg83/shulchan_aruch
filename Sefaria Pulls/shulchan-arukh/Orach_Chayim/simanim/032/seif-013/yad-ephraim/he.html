<b>(במג"א ס"ק לה) </b>רגל האלף. ר"ל ברגל צריך לגרור כל הרגל ובפני האל"ף צריך לגרור כמ"ש לעיל סעיף י"ח והיינו אם כותב הקו האמצעי קודם ואחר כך כ' יו"ד התחתונה או העליונ' ונגע' בו צריך יגרור היודין ואם כתב הי' העליונה קודם ואח"כ בכתיבת הקו נגע בו צריך לגרור הקו והי' התחתונה וכן להיפך אם כתב התחתונ' קודם:
