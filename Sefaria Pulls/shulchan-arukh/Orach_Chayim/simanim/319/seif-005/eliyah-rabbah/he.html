[ה] <b>מן העלין וכו'.</b> אבל העלין מעופשין אפילו ראויין לאכילה על ידי הדחק אסור לבוררן מאוכל כמו שכתב סוף סימן תרי"א (מגן אברהם), ושם הביא דברי המגיד ואינו ראיה דיש לומר האיסור שמכין לחול או דאינו לאלתר ועיין בשלטי גיבורים פרק אלו קשרים שנהג לבררו מערב שבת ומלבושי יום טוב כתב המחמיר תבוא עליו ברכה:
