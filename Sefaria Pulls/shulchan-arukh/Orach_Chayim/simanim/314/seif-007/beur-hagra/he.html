<b>ס"ז ודוקא.</b> מדאמרינן בערובין במנעול קטיר במיתנא ש"מ דפותתת אסור ועתוס' ורא"ש שם והתוס' הלכו לשיטתן דס"ל הכל בכלי כנ"ל אבל לפי הרשב"א והר"ן הנ"ל בס"א בתיבות מותר. וזה דעת המתירין דלמטה שכ' הסמ"ק וטוש"ע:<br>
<b>ומטעם זה.</b> עט"ז:<br>
<b>ושבירת כו'.</b> נמשך אחר לשון הטור שכ' ובסמ"ק כתב ושבירת כו':
