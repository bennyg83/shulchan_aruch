<b>מרוצה</b> לקהל עט״ז ושלא להתפלל בחזקה ועא״ר וצריך לכוין להוציא כ״א. ואם יש לו שונא ומכוין שלא להוציאו הכל א״י. ואבל אם אין הגון כמותו נמי יראה דאבל מתפלל לכאורה אבל על א״ו תוך יב״ח י״ל על שאר קרובים שוין המה בזה ואין מעלה לא׳ יותר על חבירו ועסי׳ תר״ס אות ב׳ י״ל גדל פרע שלשים יום ושיעור גערה בי״ד יע״ש:
