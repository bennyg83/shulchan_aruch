<b> מברך בהמ"ז על אחד</b> -  ושותהו כמש"כ במ"ב ומתפלל ואח"כ מבדיל על האחר אבל ברישא שאין לו אלא כוס אחד ואינו יכול לשתות ממנו עד אחר הבדלה משמע מב"ח וא"ז דיבדיל מיד קודם התפלה והטעם כדי שלא יתאחר שתיית הכוס הרבה מעת שבירך עליו בהמ"ז אבל אין העולם נוהגין כן אלא מתפללין ואח"כ מבדילין וכן משמע קצת בדה"ח:
