<b>(ס"ק י) סעודת כו'</b> שאוכלים בשר כו' הוא לפי מנהג המדינות שנוהגים עפ"י הדין ואין מחמירין למנוע אכילת בשר ויין מר"ח ואילך ואין נמנעים כ"א בסעודה מפסקת:<br>
