<b>ס"כג היתה.</b> כריב"י שם מדפרכינן מיניה לרבא בסוכה כ"ב שם ד"ה כוותיה ומדהביא הגמ' אותו שם:<br>
<b>ולא יהיה.</b> סוכה שם:<br>
<b>ולא במשך.</b> רמב"ם וכנ"ל:<br>
<b>ויש פוסלין.</b> דלא קי"ל כריב"י דס"ל כאבוה. הרא"ש שם ומה שהביא הגמרא אותו שם תי' הריטב"א דלמ"ד רואין אמרינן יחבוט ובהא ל"פ רבנן ועתוס' שם ד"ה ובלבד ודלא כמ"א:
