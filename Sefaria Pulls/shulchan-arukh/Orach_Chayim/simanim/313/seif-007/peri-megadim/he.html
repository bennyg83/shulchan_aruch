<b>שרין</b> עט״ז כלים שא״א להשתמש כ״א ע״י פירוק והידוק לאו מכה בפטיש וגם לאו בונה הוא דעשוי מתחלה לכן ושרי וזייג״ר להעמידו בשבת ע׳ שו״ת פנים מאירות ועמ״ש בסי׳ ש״ח סנ״א ושמעתי אומרים בשם רב אחד כשהוא מתנועע מותר להעמיד קצת יותר וכשאין מתנועע כלל אסור ויש מקום לחילוק זה מ״מ אין להקל ע״י ישראל כ״א ע״י עכו״ם:
