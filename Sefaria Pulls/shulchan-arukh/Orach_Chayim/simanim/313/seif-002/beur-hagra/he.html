<b>ס"ב ואסור.</b> עמ"א. אבל הטור השמיטו משום שמפ' כפרש"י דל"ק אנקמז אלא אאינו קשור וא"ל בוכנא כו' ר"ל הא תנינן נגר שיש כו'. כמ"ש רש"י שם שראשו עבה וראוי לבוכנא והיינו דגלוסטרא ומ' מרש"י דאפי' אינו קשור כלל וע"ש ד"ה עשה והא דקאמר כ"פ בשאינו כו' משום ר"א הוא וכ"מ מרש"י שם ד"ה כשאין ניטל ע"ש ובד"ה דין כו':
