<b>ס"א יהא זהיר.</b> שם כל המקיים כו' יהא חלקי ואף בעני אמרינן בסוף פיאה שבת כו':<br>
<b>בכביצה.</b> נלמד מסוכה כמ"ס בס"ה ובסוכה אמרו מיומא ע"ט ב' דכביצה בעי סוכ' אע"ג דדחי בסוכ' מ"מ ביומא רבי ירמיה ור"פ ורבא לא ס"ל כן:<br>
<b>ואם א"א.</b> כנ"ל סי' רפ"ח ס"ב:<br>
<b>ומי שלא.</b> תוס' בפסחים ק"א א' דאמרינן שם טעימו כו':
