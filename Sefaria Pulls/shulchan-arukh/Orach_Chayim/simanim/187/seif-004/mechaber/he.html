<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i>אם לא הזכיר <i data-commentator="Mishnah Berurah" data-label="י"></i>בבונה ירושלים מלכות בית דוד מחזירין אותו: <small>הגה ואומרים על הנסים בחנוכה ובפורים קודם על הכל וכו' ואם לא אמרו אין מחזירין אותו [טור] וע"ל סי' תרפ"ב ומ"מ יוכל לאמרו בתוך שאר הרחמן ויאמר הרחמן הוא יעשה לנו נסים כמו שעשה בימים ההם וכו' והכי נהוג [כל בו]:</small>
