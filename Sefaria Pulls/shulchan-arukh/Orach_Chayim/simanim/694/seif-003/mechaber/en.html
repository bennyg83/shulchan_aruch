<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> One is not exacting with their money on Purim. Rather, one should give to anyone who extends their hands. And in places where <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> they have a custom to give even <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="יא"></i> to non-Jews -<i data-commentator="Ba'er Hetev" data-order="3"></i> one should give.
