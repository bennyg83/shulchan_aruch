<b>ולומד. </b> והכל לפי הענין אם יש לו מנוחה בסוכה לומד בסוכה וצ"ע אם צריך ספרים הרבה וטורח לו להעלותם לסוכה ויש להחמיר מ"א ובלבוש סי' תר"מ ס"ד משמע דא"צ להעלותם לשם כמו גבי כרים וכ"מ שם בש"ע דא"צ לילך לסוכת חבירו לאכול מה"ט:<br>
<b>רצה. </b> אם יש לו מנוחה שם ואם יש בה"כ בעירו הולך לבה"כ ב"ח והבדלה דוקא בסוכ'. ט"ז:
