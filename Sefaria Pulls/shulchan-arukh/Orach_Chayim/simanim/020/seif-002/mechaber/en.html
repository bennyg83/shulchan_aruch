<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> <i data-commentator="Magen Avraham" data-order="2"></i> One does not sell a &lt;i&gt;tallis&lt;/i&gt; with &lt;i&gt;tzitzis&lt;/i&gt;<i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ו"></i> to a <i data-commentator="Mishnah Berurah" data-label="ז"></i> gentile <i data-commentator="Magen Avraham" data-order="3"></i> lest he travel with a Jew on the road <i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> and kill him. Even to pawn or deposit a &lt;i&gt;tallis&lt;/i&gt; with &lt;i&gt;tzitzis&lt;/i&gt; with a gentile is forbidden <i data-commentator="Mishnah Berurah" data-label="ח"></i> unless temporary when there is no such concern.
