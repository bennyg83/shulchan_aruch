[יב] <b>[לבוש] והוא מכיר וכו'.</b> כן לשון הטור וספר צידה לדרך ומגיד שם, וצריך עיון דלשון המשנה שם אם היה מותר מערב שבת מתיר את כולו ושומטו משמע דהכי קאמר אף שמותר קצת מתיר את כולו וכן הוא במשניות עם הרמב"ם ועם תוספות יום טוב ובמשנה דירושלמי הוא מתיר את כליו וכן הוא בהרא"ש וברמזים ורבינו ירוחם שם ורי"ף:
