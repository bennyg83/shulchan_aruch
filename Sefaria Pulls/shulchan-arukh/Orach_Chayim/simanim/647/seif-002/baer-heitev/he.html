<b>שנשרו. </b> לכן יש ליזהר מלתלוש רוב עלי הערבה שבלולב ועיין סימן תרס"ד סעיף ד'. ויש לדקדק בזה שלפעמים נושרין על ידי תחיבתן לתוך הלולב וגם ע"י נענוע:<br>
