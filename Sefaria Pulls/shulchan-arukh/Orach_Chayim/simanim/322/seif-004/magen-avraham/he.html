<b>שיניו אסור</b>. ואם קטמו חייב (רמב"ם פי"א) ומשמע בגמ' דפ"א ע"ב דאם הזמינו חבירו לסעודה בשבת ולא היה אפשר לו להכין מע"ש שום דבר לחצוץ בו שיניו מותר לטלטל קיסם לחצוץ בו שיניו אם אין לו ד"א מפני כבוד הבריות שגנאי הוא לו שפעמים שנראה הבשר שבין השינים מבחוץ וערסי' שי"ב ונ"ל דבמקום שאין נחשב זה לגנאי אסור:
