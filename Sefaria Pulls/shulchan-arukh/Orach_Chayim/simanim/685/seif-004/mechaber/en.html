<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> On the fifth Shabbos, which is the twenty-ninth of Adar, we take out two scrolls: from the first we read <i data-commentator="Mishnah Berurah" data-label="יב"></i> that week’s regular portion, and from the second <i data-commentator="Mishnah Berurah" data-label="יג"></i> Hachodesh hazeh lachem, and the haftarah is from Rishon be’achad lachodesh:
