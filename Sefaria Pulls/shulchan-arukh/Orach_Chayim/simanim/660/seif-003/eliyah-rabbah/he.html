[ג] <b>[לבוש] א' דישראל וכו'.</b> תמיהני שאין זה אמצעי שזה תיבת שלושים, ועיינתי בפירוש רש"י דסוכה דף מ"ה וכתב שהוא א' דמאחריהם, והיינו ממש תיבת שלושים ושבע דומיא דנו"ן ויו"ד, והיה נראה בעיני שיש טעות סופר בלבוש אך ראיתי שגם הבית יוסף ואבודרהם ותוספות יום טוב שם כתבו כלבוש וצריך עיון להשוות טעות בכולם:
