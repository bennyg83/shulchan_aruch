<b>אין לברך</b>. ומ"מ קורין בלא ברכה שלא תשתכח תורת קריאה [תניא] ומשמע שהחזן קורא בקול רם כמו בשאר פעמים וכ"מ בב"י בשם הרשב"א:<br>
<b>והעולה קורא</b>. והאידנ' נוהגים שאחד קורא מהחומש והש"ץ קורא מהס"ת וצ"ל הטעם משום דיש אנשים שאין יודעים לקרות בניגון וטעמים ואפי' מקרין אותם ויהיו מתביישים לכן מקרין להש"ץ וערסי' קל"ט:
