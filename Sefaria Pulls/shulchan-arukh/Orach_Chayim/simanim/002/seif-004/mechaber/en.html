<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Turei Zahav" data-order="3"></i> He should put <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Sha'arei Teshuvah" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> on the right shoe first and not tie it; then put on the <i data-commentator="Mishnah Berurah" data-label="ו"></i> left and tie it; then return and tie the right.<small>With our shoes, which have no laces, he puts on the right <i data-commentator="Mishnah Berurah" data-label="ז"></i> first (Tosafos Bava Metzia ch. 7 61a).</small>
