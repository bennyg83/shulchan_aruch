<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> Unless he is married, one should take care not to grasp the organ except <i data-commentator="Ba'er Hetev" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> from the <i data-commentator="Mishnah Berurah" data-label="כו"></i> corona downwards and urinate, lest he bring forth <i data-commentator="Turei Zahav" data-order="13"></i> <i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i> seed in vain.<i data-commentator="Mishnah Berurah" data-label="כז"></i> However, it <i data-commentator="Magen Avraham" data-order="14"></i> <i data-commentator="Eshel Avraham" data-label="א" data-order="2"></i> is a <i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> pious practice to take such care even if one <i data-commentator="Ba'er Hetev" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="כח"></i> is married.
