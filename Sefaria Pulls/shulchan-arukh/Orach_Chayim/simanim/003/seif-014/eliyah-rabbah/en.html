[יד] <b>“He is married,” etc.</b> Taz explained: specifically when at that time he is regularly with his wife in the sense of “bread in his basket.” <i>Magen Avraham</i> wrote: if his wife is not with him or she is a <i>niddah</i>, it is forbidden. See <i>Even HaEzer</i> 23 and Taz <i>Yoreh De’ah</i> as cross-referenced there.
