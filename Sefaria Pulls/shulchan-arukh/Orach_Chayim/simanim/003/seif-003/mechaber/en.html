<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> If one wishes to <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> work about the anus with a pebble or a chip of wood in order to open up his rectum [i.e.<i data-commentator="Ba'er Hetev" data-order="3"></i> he has trouble relieving himself], he should work about it before he sits but should not work about it after he sits, because [this exposes him to the] danger of witchcraft.
