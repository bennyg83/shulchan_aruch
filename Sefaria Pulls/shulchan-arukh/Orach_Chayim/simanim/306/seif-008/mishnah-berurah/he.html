(לז) הרהור בעסקיו מותר - דכתיב ודבר דבר דבור אסור הרהור מותר:<br>
(לח) מצוה שלא יחשוב וכו' - ומכ"ש אם יש לו ע"י ההרהור טרדת הלב ודאגה דיזהר בזה עיין בב"י:<br>
(לט) ויהא בעיניו וכו' - וכדאיתא במכלתא פ' יתרו ששת ימים תעבוד ועשית כל מלאכתך וכי אפשר לאדם לעשות כל מלאכתו בששת ימים אלא שבות כאלו כל מלאכתך עשויה:
