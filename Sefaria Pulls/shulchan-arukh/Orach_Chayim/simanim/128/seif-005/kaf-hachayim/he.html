<b>ה) שם. והכהנים מהמנין.  </b>וטעמא כתב ב"י בשם הר' מנוח משום דכהנים בכלל ברכה כדאמרינן בכתובות ח' ע"ב ברכת חתנים בעשרה וחתנים מן המנין ע"כ, והלבוש כתב דכתיב ואני אברכם אמר הקב"ה מי מברך את הכהנים אני מברך אותם כשהם מברכין את ישראל לפיכך הם ממנין עשרה עכ"ד, ועיין סוטה ל"ח ע"ב ומד"ר נשא סוף פי"א ודו"ק:
