<b>(ס"ק יג) חוץ כו'</b> ונ"ל דוק' כו' עסי' מ"ו כו' ר"ל דהא לדעת הרב"י שם אפי' האיר היום אינו מברך אם לא שמע קול התרנגול וניהו דרמ"א חולק שם דמ"מ מברך על טובת העולם מ"מ כשעדיין לא האיר היום דאיכא למ"ד אפי' שמע קול תרנגול לא יברך וא"כ כשלא שמע דאיכא תרתי לריעותא שלא שמע וגם לא האיר היום אינו ראוי לברך:
