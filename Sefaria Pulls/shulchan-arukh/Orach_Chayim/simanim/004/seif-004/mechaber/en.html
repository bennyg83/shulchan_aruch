<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i> Even one who has washed his hands must not constantly touch his anus, because it leads to sinful thoughts. Nor <i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> should he <i data-commentator="Turei Zahav" data-order="4"></i> touch a bloodletting site, for handling it harms the wound.
