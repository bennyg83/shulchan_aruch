<i data-commentator="Turei Zahav" data-order="9"></i> <i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i> If he was <i data-commentator="Ba'er Hetev" data-order="13"></i> <i data-commentator="Sha'arei Teshuvah" data-order="13"></i> awake all <i data-commentator="Mishnah Berurah" data-label="כז"></i> night, there is a doubt whether he must wash his hands in the morning for prayer and to remove an evil spirit <i data-commentator="Mishnah Berurah" data-label="כח"></i> from his hands. Rema:<i data-commentator="Magen Avraham" data-order="11"></i> He washes without a blessing (Rosh klal 4; Rashba siman 191).<small> <i data-commentator="Mishnah Berurah" data-label="כט"></i>(<i data-commentator="Magen Avraham" data-order="12"></i> <i data-commentator="Ba'er Hetev" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="ל"></i>.</small>
