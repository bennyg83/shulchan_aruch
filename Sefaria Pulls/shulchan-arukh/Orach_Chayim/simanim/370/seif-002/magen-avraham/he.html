<b>מחמת כבדן</b>. צ"ע דמה גבול יש לכובד זה דמשוי שקשה לא' נוח לב' ומ"מ כ' דוקא דברים המוקצים ע"ש ויש להחמיר:<br>
<b>וי"א דכל זה</b>. קאי אסעיף זה ולא אסעיף א':<br>
