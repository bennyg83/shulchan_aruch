<b>פתח</b> עט״ז ועמ״א י״ב. וקשה דא״כ הדרא קושיא לדוכתיה דמה ספק שייך כאן כיון דהספירה היה כראוי רק הברכה ספק פשיטא ספק ברכות לקולא אף למ״ד ספירה בזה״ז ד״ת ועט״ז אות ו׳ דמנה בלא ברכה יצא ובשלמא אי הספק בספירה עצמה שפיר למ״ד ד״ת חוזר וסופר ומברך ג״כ כמו בק״ש בסי׳ ס״ז וע״ש בט״ז א׳ ומ״א יע״ש ועא״ר וא״ז וצ״ע:
