<b>ס"י וא"צ לנענע. </b>לא כב"ש:<br>
<b>אם זימן כו'. </b>כמש"ש דזימנין כו' וכמטלטל כו':<br>
<b>ואם הוא כו'. </b>דאיסור טלטול אינו אלא משום דמוקצה וכמ"ש בהג"א ד"ה ואין אדם כו' אבל תרנגולת העומדת כו' אבל בא"צ אלא לזוג אפי' זימן כל השובך לא היה דעתו אלא לזוג אלא דסומך על מה שיברור ונמצא איגלי למפרע שבתחלה קמטלטל כו':
