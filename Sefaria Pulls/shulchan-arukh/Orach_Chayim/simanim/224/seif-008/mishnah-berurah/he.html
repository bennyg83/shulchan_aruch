(יא) ועל מלכי וכו' - ומשמע בגמרא אפילו סומא כשיודע שהמלך עובר מברך ועיין בפמ"ג שמצדד דאם הוא סומא שלא ראה מאורות מימיו יברך בלא שם ומלכות:<br>
