<b> ואין לבטל שום מנהג וכו'</b> -  עיין במגן אברהם שהאריך בזה והנה מה שכתב דאפילו יש במנהג צד איסור אין לבטלו כמש"כ מהרי"ק ש"ט עיין בתשובת ח"ס סקנ"ט שאין אנו שומעין לו דכבר דחה ליה פר"ח במנהגי איסור שלו שס"י בראיות ברורות וכן נראה מתשובת הריב"ש סרנ"ו ע"ש ועיין תשובת יכין ובועז סקי"ח שהאריך בדיני מנהג [פ"ת]:
