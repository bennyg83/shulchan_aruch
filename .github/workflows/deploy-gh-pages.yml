# Deploy Orach Chayim web reader → https://bennyg83.github.io/shulchan_aruch/
name: Deploy web reader to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/deploy-gh-pages.yml"
      - "newtry/OC_Mobile/oc-web-reader/**"
      - "newtry/OC_Mobile/oc318-mobile-reader/public/corpus/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (sparse — repo is large)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            newtry/OC_Mobile/oc-web-reader
            newtry/OC_Mobile/oc318-mobile-reader/public

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: newtry/OC_Mobile/oc-web-reader/package-lock.json

      - name: Verify corpus is present
        run: test -f newtry/OC_Mobile/oc318-mobile-reader/public/corpus/oc1/catalog.json

      - name: Install dependencies
        working-directory: newtry/OC_Mobile/oc-web-reader
        run: npm ci

      - name: Build (GitHub Pages base path)
        working-directory: newtry/OC_Mobile/oc-web-reader
        env:
          GITHUB_ACTIONS: true
          VITE_BASE: /shulchan_aruch/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: newtry/OC_Mobile/oc-web-reader/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
