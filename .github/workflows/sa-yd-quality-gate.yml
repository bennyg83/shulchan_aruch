name: YD quality gate

on:
  pull_request:
    branches: [yd-cleanup, "yd/**"]
    paths:
      - "newtry/YD_001/**"
      - "full_dictionary (1).md"
      - ".github/workflows/sa-yd-quality-gate.yml"
  push:
    branches: [yd-cleanup]
    paths:
      - "newtry/YD_001/**"
      - ".github/workflows/sa-yd-quality-gate.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: newtry/YD_001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: newtry/YD_001/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Block format validation
        run: npm run pipeline:validate -- --root output

      - name: Quality validation (report)
        run: npm run pipeline:validate:quality -- --write-reports
        continue-on-error: true

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yd-quality-report
          path: newtry/YD_001/checklist-output/
          if-no-files-found: ignore
