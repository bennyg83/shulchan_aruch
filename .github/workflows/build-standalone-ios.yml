name: Build Standalone iOS App (fully offline)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'newtry/OC_Mobile/oc-web-reader/**'
      - 'newtry/OC_Mobile/oc318-mobile-reader/public/corpus/oc1/bundles/**'
      - 'newtry/OC_Mobile/oc318-mobile-reader/public/corpus/oc1/catalog.json'
      - '.github/workflows/build-standalone-ios.yml'

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 90

    steps:
      - name: Checkout (sparse — web reader + corpus bundles)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            newtry/OC_Mobile/oc-web-reader
            newtry/OC_Mobile/oc318-mobile-reader/public/corpus/oc1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: newtry/OC_Mobile/oc-web-reader/package-lock.json

      - name: Install web reader dependencies
        working-directory: newtry/OC_Mobile/oc-web-reader
        run: npm ci

      - name: Build web reader (Capacitor standalone — no PWA service worker)
        working-directory: newtry/OC_Mobile/oc-web-reader
        env:
          VITE_STANDALONE: "true"
        run: npm run build:standalone

      - name: Assemble corpus into dist
        working-directory: newtry/OC_Mobile/oc-web-reader
        run: bash scripts/assemble-standalone-corpus.sh

      - name: Sync Capacitor iOS project
        working-directory: newtry/OC_Mobile/oc-web-reader
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: newtry/OC_Mobile/oc-web-reader/ios/App
        run: pod install

      - name: Import code signing certificate
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install provisioning profile
        if: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 != '' }}
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/shulchanaruch.mobileprovision"
          mkdir -p "$(dirname "$PROFILE_PATH")"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

      - name: Build and export signed IPA
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
        working-directory: newtry/OC_Mobile/oc-web-reader/ios/App
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/ShulchanAruch.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/export"
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          cp ExportOptions.plist "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.bennyg83.shulchanaruch string $PROVISIONING_PROFILE_NAME" "$EXPORT_PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.bennyg83.shulchanaruch $PROVISIONING_PROFILE_NAME" "$EXPORT_PLIST"

          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST"

          cp "$EXPORT_PATH/App.ipa" "$GITHUB_WORKSPACE/ShulchanAruch.ipa"
          ls -lh "$GITHUB_WORKSPACE/ShulchanAruch.ipa"

      - name: Build for iOS Simulator (unsigned — validates project when signing secrets missing)
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 == '' || secrets.BUILD_PROVISION_PROFILE_BASE64 == '' }}
        working-directory: newtry/OC_Mobile/oc-web-reader/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build
          echo "::warning::Signed IPA not produced — set BUILD_CERTIFICATE_BASE64, P12_PASSWORD, BUILD_PROVISION_PROFILE_BASE64, APPLE_TEAM_ID, PROVISIONING_PROFILE_NAME, and CODE_SIGN_IDENTITY repository secrets for device IPA export."

      - name: Upload IPA artifact
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ShulchanAruch-iOS
          path: ShulchanAruch.ipa
          retention-days: 90
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' }}
        run: |
          gh release delete ios-standalone --yes 2>/dev/null || true
          git push --delete origin ios-standalone 2>/dev/null || true
          gh release create ios-standalone \
            --title "iOS App — Fully Offline (Standalone)" \
            --notes "## Shulchan Aruch — Fully Offline iOS App

          All 697 simanim are bundled inside the app — **no internet required, ever**.

          **Installation (ad-hoc IPA):**
          1. Download \`ShulchanAruch.ipa\` below
          2. Install with Apple Configurator, Xcode Devices window, or a trusted sideload tool
          3. Your device UDID must be included in the provisioning profile used to sign this build
          4. Open the app — all content is immediately available, even in airplane mode

          For easier distribution, consider uploading the IPA to TestFlight using your Apple Developer account.

          Built from commit \`${{ github.sha }}\` on \`${{ github.ref_name }}\`." \
            ShulchanAruch.ipa
        env:
          GH_TOKEN: ${{ github.token }}
