name: Build Android APK (TWA)

on:
  workflow_dispatch:
  push:
    paths:
      - 'newtry/OC_Mobile/apk/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@latest

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Configure Bubblewrap SDK paths
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<'EOF'
          {
            "jdkPath": "/usr/lib/jvm/temurin-17-amd64",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF
          # Resolve the actual ANDROID_SDK_ROOT value
          sed -i "s|\$ANDROID_SDK_ROOT|${ANDROID_SDK_ROOT}|g" ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Generate signing keystore
        working-directory: newtry/OC_Mobile/apk
        run: |
          keytool -genkey -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Shulchan Aruch, OU=App, O=bennyg83, L=Unknown, ST=Unknown, C=US"

      - name: Generate Android project with Bubblewrap
        working-directory: newtry/OC_Mobile/apk
        run: bubblewrap update --skipPwaValidation
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: android123
          BUBBLEWRAP_KEY_PASSWORD: android123

      - name: Build APK
        working-directory: newtry/OC_Mobile/apk
        run: bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: android123
          BUBBLEWRAP_KEY_PASSWORD: android123

      - name: Find APK
        id: find_apk
        working-directory: newtry/OC_Mobile/apk
        run: |
          APK=$(find . -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -lh $APK

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShulchanAruch-release-signed
          path: newtry/OC_Mobile/apk/${{ steps.find_apk.outputs.apk_path }}
          retention-days: 90
          if-no-files-found: error
