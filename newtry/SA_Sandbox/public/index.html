<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SA Sandbox Viewer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f4f0; color: #1a1a1a; }
  #header { background: #2c1810; color: #f5f0e8; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  #header h1 { font-size: 1rem; font-weight: 600; letter-spacing: 0.03em; flex-shrink: 0; }
  #controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input[type=number], button { padding: 5px 10px; border-radius: 4px; border: 1px solid #888; font-size: 0.875rem; }
  button { background: #5a3a1a; color: #fff; border-color: #5a3a1a; cursor: pointer; }
  button:hover { background: #7a5030; }
  #status { margin-left: auto; font-size: 0.8rem; opacity: 0.7; }
  #main { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 50px); }
  #sidebar { background: #fff; border-right: 1px solid #ddd; overflow-y: auto; padding: 12px; }
  #sidebar h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-bottom: 8px; }
  .seif-btn { display: block; width: 100%; text-align: left; padding: 5px 8px; margin-bottom: 2px; border: 1px solid transparent; border-radius: 3px; background: none; cursor: pointer; font-size: 0.85rem; }
  .seif-btn:hover { background: #f0ece4; }
  .seif-btn.active { background: #2c1810; color: #fff; }
  #content { padding: 20px; overflow-y: auto; }
  .seif-header { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-bottom: 16px; }
  .commentary { border: 1px solid #ddd; border-radius: 6px; margin-bottom: 16px; overflow: hidden; }
  .commentary-title { background: #f0ece4; padding: 8px 12px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.04em; color: #5a3a1a; }
  .commentary-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .he-col { background: #fffdf8; padding: 12px; border-right: 1px solid #eee; direction: rtl; font-size: 0.9rem; line-height: 1.7; }
  .en-col { background: #fff; padding: 12px; font-size: 0.9rem; line-height: 1.7; }
  .seg { padding: 4px 0; border-bottom: 1px dotted #eee; }
  .seg:last-child { border-bottom: none; }
  .garbage-badge { display: inline-block; background: #c00; color: #fff; font-size: 0.7rem; padding: 1px 5px; border-radius: 3px; margin-left: 6px; vertical-align: middle; }
  #scan-panel { background: #fff; border: 1px solid #ddd; border-radius: 6px; margin: 16px 0; padding: 16px; }
  #scan-panel h2 { font-size: 0.9rem; margin-bottom: 12px; color: #2c1810; }
  .scan-row { display: flex; gap: 16px; font-size: 0.85rem; flex-wrap: wrap; }
  .stat-box { background: #f5f4f0; border-radius: 4px; padding: 8px 14px; text-align: center; }
  .stat-num { font-size: 1.4rem; font-weight: 700; display: block; }
  .stat-num.red { color: #c00; }
  .stat-num.green { color: #060; }
  .stat-label { font-size: 0.75rem; color: #666; }
  .slug-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #f0ece4; font-size: 0.85rem; }
  .slug-row:last-child { border-bottom: none; }
  #empty-state { color: #888; font-style: italic; text-align: center; padding: 40px; }
  #nav-row { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
</style>
</head>
<body>
<div id="header">
  <h1>SA Sandbox Viewer</h1>
  <div id="controls">
    <select id="vol-sel">
      <option value="oc1">OC1</option>
      <option value="yd1">YD1</option>
    </select>
    <input type="number" id="siman-input" min="1" max="697" value="1" style="width:70px" />
    <button id="load-btn">Load Siman</button>
    <button id="scan-btn">Load Scan Report</button>
  </div>
  <span id="status">Ready</span>
</div>

<div id="main">
  <div id="sidebar">
    <h2>Seifim</h2>
    <div id="seif-list"></div>
  </div>
  <div id="content">
    <div id="empty-state">Enter a siman number and click Load Siman, or click Load Scan Report to see the garbage analysis.</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentBundle = null;
let currentSeif = null;
let scanData = null;

function brSegs(html) {
  return html.split(/<br\s*\/?>/).filter(s => s.trim());
}

function isGarbage(text) {
  const GARBAGE_RE = /terrorist|heaven'?s people|kgb|lord'?s prayer|starwork|star work|lycott|bible and the bible|hand recoils|first dish|saturday\b|muktzeh.*allocat|magen avraham anglicized|m\.m\.m|d\.d\.d|her age\b|the craft\b|waker of the dawn|confession of the lord|lord enlightened|a jerusalemite\b|\bcolumn:\s*$|head of maha|chief there\b|3rd prayers of confession/i;
  return GARBAGE_RE.test(text.replace(/<[^>]+>/g, ' '));
}

async function loadBundle(vol, siman) {
  $('status').textContent = `Loading ${vol} siman ${siman}…`;
  try {
    const r = await fetch(`/bundles/${vol}/siman${siman}.json`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    currentBundle = await r.json();
    $('status').textContent = `Loaded ${vol} siman ${siman} (${currentBundle.seifim.length} seifim)`;
    renderSidebar(currentBundle);
    renderSeif(currentBundle, currentBundle.seifim[0]);
  } catch (e) {
    $('status').textContent = `Error: ${e.message}`;
    $('content').innerHTML = `<div id="empty-state">Could not load bundle — run <code>npm run build:${vol}</code> first.</div>`;
  }
}

function renderSidebar(bundle) {
  const list = $('seif-list');
  list.innerHTML = bundle.seifim.map(n =>
    `<button class="seif-btn" data-seif="${n}" onclick="selectSeif(${n})">Seif ${n}</button>`
  ).join('');
}

function selectSeif(n) {
  document.querySelectorAll('.seif-btn').forEach(b => b.classList.toggle('active', +b.dataset.seif === n));
  renderSeif(currentBundle, n);
}

function renderSeif(bundle, seifNum) {
  currentSeif = seifNum;
  const seifData = bundle.data[String(seifNum)];
  if (!seifData) { $('content').innerHTML = `<div id="empty-state">Seif ${seifNum} not found in bundle.</div>`; return; }

  const vol = $('vol-sel').value;
  const siman = $('siman-input').value;

  let html = `<div class="seif-header">${vol.toUpperCase()} Siman ${siman} — Seif ${seifNum}</div>`;
  html += `<div id="nav-row">
    <button onclick="navigate(-1)">← Prev seif</button>
    <button onclick="navigate(1)">Next seif →</button>
  </div>`;

  // Mechaber first
  const mech = seifData.mechaber;
  if (mech) html += renderCommentary('Mechaber', mech.he, mech.en);

  // Then all other included sources in order
  for (const dk of (seifData._included || [])) {
    const sm = bundle.sourceMeta.find(s => s.dataKey === dk);
    const title = sm ? sm.title : dk;
    const item = seifData[dk];
    if (item) html += renderCommentary(title, item.he, item.en);
  }

  $('content').innerHTML = html;
}

function renderCommentary(title, he, en) {
  const heSegs = brSegs(he || '');
  const enSegs = brSegs(en || '');
  const maxRows = Math.max(heSegs.length, enSegs.length);
  const hasGarbage = isGarbage(en || '');
  const badge = hasGarbage ? '<span class="garbage-badge">GARBAGE</span>' : '';

  let rows = '';
  for (let i = 0; i < maxRows; i++) {
    const heSeg = heSegs[i] || '';
    const enSeg = enSegs[i] || '<span style="color:#c00;font-style:italic">missing</span>';
    rows += `<div class="seg" style="display:contents">
      <div class="he-col seg" style="border-right:1px solid #eee;padding:8px 12px">${heSeg}</div>
      <div class="en-col seg" style="padding:8px 12px">${enSeg}</div>
    </div>`;
  }

  return `<div class="commentary">
    <div class="commentary-title">${title}${badge} <span style="color:#888;font-weight:400">(${heSegs.length} HE / ${enSegs.length} EN segs)</span></div>
    <div class="commentary-body" style="display:grid;grid-template-columns:1fr 1fr">
      <div class="he-col" style="background:#fffdf8;padding:10px 12px;direction:rtl;font-size:.9rem;line-height:1.7;border-right:1px solid #eee">
        ${heSegs.map(s => `<div class="seg">${s}</div>`).join('')}
      </div>
      <div class="en-col" style="background:#fff;padding:10px 12px;font-size:.9rem;line-height:1.7">
        ${enSegs.map(s => `<div class="seg">${s}</div>`).join('')}
      </div>
    </div>
  </div>`;
}

function navigate(delta) {
  if (!currentBundle || !currentSeif) return;
  const idx = currentBundle.seifim.indexOf(currentSeif);
  const next = currentBundle.seifim[idx + delta];
  if (next) selectSeif(next);
}

async function loadScanReport() {
  $('status').textContent = 'Loading scan report…';
  try {
    const r = await fetch('/scan-results/garbage-report.json');
    if (!r.ok) throw new Error(`HTTP ${r.status} — run npm run scan first`);
    scanData = await r.json();
    renderScanReport(scanData);
    $('status').textContent = `Scan: ${scanData.totalGarbage} garbage files (${scanData.scannedAt.slice(0,10)})`;
  } catch(e) {
    $('content').innerHTML = `<div id="empty-state">Could not load scan report: ${e.message}<br>Run <code>node scripts/scan.mjs</code> first.</div>`;
  }
}

function renderScanReport(data) {
  const { summary, totalGarbage, garbageBySlug } = data;
  const totalFiles = summary.oc1.total + summary.yd1.total;
  const slugsSorted = Object.keys(garbageBySlug).sort((a,b) => garbageBySlug[b].length - garbageBySlug[a].length);

  const clean = totalGarbage === 0;

  let html = `<div id="scan-panel">
    <h2>Corpus Scan Report — ${new Date(data.scannedAt).toLocaleString()}</h2>
    <div class="scan-row" style="margin-bottom:16px">
      <div class="stat-box"><span class="stat-num ${clean ? 'green' : 'red'}">${totalGarbage}</span><span class="stat-label">Garbage files</span></div>
      <div class="stat-box"><span class="stat-num">${totalFiles.toLocaleString()}</span><span class="stat-label">Total files</span></div>
      <div class="stat-box"><span class="stat-num">${summary.oc1.garbage}</span><span class="stat-label">OC1 garbage</span></div>
      <div class="stat-box"><span class="stat-num">${summary.yd1.garbage}</span><span class="stat-label">YD1 garbage</span></div>
    </div>`;

  if (clean) {
    html += `<p style="color:#060;font-weight:600">✅ No garbage found — corpus is clean!</p>`;
  } else {
    html += `<h3 style="font-size:.85rem;margin-bottom:8px;color:#2c1810">Garbage by commentator slug:</h3>`;
    for (const slug of slugsSorted) {
      const entries = garbageBySlug[slug];
      const byVol = {};
      entries.forEach(e => { byVol[e.vol] = (byVol[e.vol]||0)+1; });
      const volStr = Object.entries(byVol).map(([v,n]) => `${v}:${n}`).join(', ');
      html += `<div class="slug-row">
        <span>${slug}</span>
        <span style="color:#c00;font-weight:600">${entries.length} files <span style="color:#888;font-weight:400">[${volStr}]</span></span>
      </div>`;
    }

    html += `<details style="margin-top:16px"><summary style="cursor:pointer;font-size:.85rem;color:#2c1810">Sample garbage previews</summary>
      <div style="margin-top:8px;font-size:.8rem;font-family:monospace">`;
    for (const slug of slugsSorted.slice(0,6)) {
      html += `<div style="margin-bottom:8px"><strong>[${slug}]</strong>`;
      garbageBySlug[slug].slice(0,2).forEach(e => {
        html += `<div style="color:#888;padding-left:8px">${e.vol}/${e.si}/${e.se}: "${e.preview.replace(/</g,'&lt;').slice(0,80)}"</div>`;
      });
      html += `</div>`;
    }
    html += `</div></details>`;
  }

  html += `</div>`;
  $('content').innerHTML = html;
}

$('load-btn').addEventListener('click', () => {
  loadBundle($('vol-sel').value, $('siman-input').value);
});
$('scan-btn').addEventListener('click', loadScanReport);
$('siman-input').addEventListener('keydown', e => { if(e.key==='Enter') loadBundle($('vol-sel').value, $('siman-input').value); });
</script>
</body>
</html>
