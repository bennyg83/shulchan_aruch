<b>There, from Rav Tachlifa's statement: 'I saw Rav Huna,' and so forth, Moed Katan 25a and Menachot 32b.</b> Beit Yosef writes in the name of Rabbeinu Manoach that where the study hall is crowded and space is limited for the students, it is permitted to sit level with the sacred books and commentaries.
