<b>מתנות כו'. </b>קל"ב א':<br>
<b>וכן בכוי. </b>כר' יוחנן שם דחייב בכל המתנות מריבוייא דקרא ופוסק הרמב"ם כר' יוסי שם פ' א' דכוי בריה בפ"ע הוא דכן ס"ל ר' יוחנן ע"כ דאל"כ קשה אצטריך קרא למעוטי ספיקא וכמ"ש ביומא ע"ד אבל הבא מן התייש והצבייה דלא נפיק מקרא מודה ר' יוחנן להסוגיא שם וז"ש בסי"ח צבי כו' אבל כו' (ע"כ):
