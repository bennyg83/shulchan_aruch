(סעיף טו) <b>לא נתן המתנות לכהן אלא אכלן כו' פטור כו'.</b> עי' בס' בה"י שכתב דמשמע בגמ' דלאו דוקא מתנות כהונה דה"ה תרומות ומעשרות כשעדיין ביד ישראל ולא בא ליד כהן פטור אם אכלן. והקשה דלא משמע הכי ברמב"ם פ"א דמעשר דין ה' אלא דמיד כשהרים חייב בתשלומין אף שלא בא עדיין ליד כהן וכבר הקשה כן בגמ' ותירצו ע"ש:
