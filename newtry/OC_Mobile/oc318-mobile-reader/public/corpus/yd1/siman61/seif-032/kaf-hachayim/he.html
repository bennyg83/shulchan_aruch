<b>לב) שם הגה. וכן אם החבר אינו רוצה לקבלן נותנן לע"ה.  </b>ואם החבר עשיר אף שהוא רוצה לקבל כיון שא"צ ואיכא כהן עני ואנו מצווין להחיותו יתן לע"ה עני. תו' חולין ק"ד ע"ב רש"ל פ' הזרוע סי' ב' ל"ח או' ג' כנה"ג בהגב"י או' ה' שו"ג או' כ"ב. מחב"ר או' ח' ער"ה או' ו' מזמור לדוד על סעי' זה. זב"צ או' ך' דר"ת או' ל"ח.
