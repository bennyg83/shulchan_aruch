<b>ומ"מ כו'. </b>שם במתני':<br>
<b>וכנגד כו'. </b>כ"מ בי"ט כ"ח א' כמאן לא כר"י כו' אלמא קילי ממנה נגד מנה:<br>
<b>אבל חלבו כו'. </b>שם ב' ומעשר בהמה ששחטו כו':<br>
