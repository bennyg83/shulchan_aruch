<b>או יבשה. </b>ולא אמרינן כיון שהצפורן היא יבשה ודאי היתה תחובה כבר בכותל זמן רב עד שנתיבש ונתחככה שם הבהמה ונתחבה לה בגבה כו' עכ"ל עט"ז ואישתמיטתיה ש"ס ערוכה (דף נ"ג ע"א) דאיתא התם להדיא איפכא דביבשה מסתבר טפי לאיסורא דכיון דיבשה היא עבידי דמשתמט' מיד ארי וכן הוא בחידושי הרשב"א ושאר פוסקים והוא פשוט:
