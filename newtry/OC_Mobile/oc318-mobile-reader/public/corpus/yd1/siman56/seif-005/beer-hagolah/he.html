מימרא דאביי שם ד' בטדי:<br>
כפי' הרי"ף והרמב"ם בפ"ח מה"ש והרשב"א והתוספות שהבטדא הוא ארבע אצבעות וכ"כ ר"ח:<br>
לרש"י בפירושו שם דבטדא הוא מלא אצבע:<br>
מימרא דאביי שם:<br>
טור בשם הרי"ף והרא"ש ודלא כמר בר רב אשי שם וכמ"ש התוס' שם בשם ר"ח ור"ת דקיי"ל כוותי' בכל דוכתין בר ממיפך שבועה וחיורי וסי' כולו הפך לבן.
