<b>לעמוד מפני אביו. </b>יש להסתפק סומא אי חייב לעמוד מפני אביו ואמו ורבו כשיודע שהם לפניו או לא. ובנ"צ הארכתי בזה והוכחתי מן הש"ס דיש חילוק בין חכם לאביו ואמו ורב מובהק. דבחכם ורבו שאינו מובהק פטור הסומא דלא כבה"ט של הרב מהרי"ט ז"ל לקמן סימן רמ"ד סק"א בשם בה"י אבל באביו ואמו ורבו מובהק גם סומא חייב:
