<b>ד) שהפקיד  </b>או שלח ביד עכו"ם. ואף לכתחלה מותר להפקיד או לשלוח ביד עכו"ם דברים האסורים מה"ת בחותם בתוך חותם. ודברים האסורים מדרבנן בחותם א'. וכמ"ש להדיא מרן המחבר (ר"ס קל). ש"ך סק"ג. כנה"ג הגה"ט סק"ג. פר"ח סק"ג. לחה"פ סק"א וכן הסכים בזב"צ סק"א. ודחה ד' ה' קהל יהודה שכ' לד' מרן דדוקא דיעבד ע"ש.
