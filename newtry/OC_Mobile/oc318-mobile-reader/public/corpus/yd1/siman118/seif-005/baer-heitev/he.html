<b>כשרה. </b> כתב הט"ז משמע דוקא דיעבד אבל לכתחלה לא:<br>
<b>וכיוצא. </b> נראה פשוט שבכלל זה תרנגולת שניכר בה ניקור הגידין של צואר כמו שישראל עושין שיש לסמוך על זה. ט"ז:<br>
<b>דרבנן. </b> מבואר בת"ה באיסור דרבנן אפילו ראה יהודי שהיה החותם נשבר ומקולקל לגמרי והיה ניכר בודאי שנפתח החותם מותר בענין זה. ש"ך:
