<b>כג) שם כשר לכתוב תפילין</b> ויש פוסלין מפני שאינו בקשירה שהרי אפשר לו להניח תפילין בצנעה ואינו מניח לכן אין להקל מג"א סע"ק ז' ר"ז אות ב' שמן המאור ועיין מה שהאריך מחה"ש בביאור זה וי"א בהגב"י ישי"ע אות ד' ולענין הלכה לכתחילה יש להחמיר כדברי האחרונים ובדיעבד יש לסמוך על דברי מר"ן ז"ל שקבלנו הוראותיו:
