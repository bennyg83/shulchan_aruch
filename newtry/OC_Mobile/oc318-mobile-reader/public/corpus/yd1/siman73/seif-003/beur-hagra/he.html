<b>לצלי כו'. </b>כפי' בה"ג דהא דרבר"ה לצלי לחודה נמי קאמר:<br>
<b>וי"א תוס' שם ד"ה וחתוכיה דלבשלו אח"כ קאמר דלצלי לבדו א"א לומר ומשום סמפונות דא"כ מאי קאמר אבל טחלא כו' </b>אי איכא סמפונות אמאי לא ואי ליכא מאי קמ"ל ומשום דם דידיה א"צ כמ"ש בריש סי' ע"ו דנורא מישב שייב ומה שלא פירש מותר דדם האיברים שלא פירש מותר:
