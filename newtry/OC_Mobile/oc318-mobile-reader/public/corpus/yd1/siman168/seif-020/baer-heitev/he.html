<b>להלוות. </b> כתב הט"ז ואע"ג דבס"ז כתב דוקא שהמלוה לא ידע שבשביל ישראל כו' הכא שאני שידוע שהעובד כוכבים לצורך עצמו לוה:<br>
<b>מישראל. </b> ול"ד לדלעיל ס"ו דאם ישראל פודהו אסור דהתם מיד שנותן לו הישראל משכון ולוה עליו מיחזי דלוה לצורך ישראל א"נ התם כיון שמשכנו בע"כ ודאי לא הקנהו לו אבל הכא איכא למימר הקנהו לו. ש"ך:
