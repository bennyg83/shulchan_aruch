<b>כל אחד מעכב על חבירו. </b>הטעם דבשנה ראשונה יש טיפול מרובה לפי שהיא דקה וצריכה להכניסה ולהוציאה ויש סברא להיפך שאדרבה שנה שניה יש טיפול מרובה לפי שצריכה מזונות הרבה ע"כ כל אחד יש לו סברא לטובתו ומעכב על חבירו שתהיה העיסקא עד כלות שני הזמנים האלו שכל אחד אומר אני איני רוצה בזמן אחד מהם לתת לך החצי:
