If he said to him, "Here are 200 zuz from now, so that you will take his place in <i data-commentator="Ba'er Hetev" data-order="21"></i>the king's service" — which involves a fixed amount — it is forbidden. But if he said to him, "Exempt me from the service," it is permitted. <i data-commentator="Turei Zahav" data-order="18"></i><i data-commentator="Siftei Kohen" data-order="25"></i><small>(See siman 173.)</small>
