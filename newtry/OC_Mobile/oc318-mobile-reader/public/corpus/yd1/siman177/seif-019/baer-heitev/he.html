<b>הפקיד. </b> כתב מהרש"ל מי שהלוה לחבירו ואח"כ אמר המלוה למחצית שכר ונאנס חייב הלוה באונסים ואם הרויח הכל שלו ואם נותן מעצמו מותר ליקח דאין זה רבית מאחר שלא התנה תחלה בכך:<br>
<b>רבית. </b> כיון דלא נתנו לו בתורת מלוה ולא שייך לומר קרוב לשכר ורחוק להפסד רשע אלא היכא דהתנה להיות רחוק להפסד וקרוב לשכר. מרדכי:
