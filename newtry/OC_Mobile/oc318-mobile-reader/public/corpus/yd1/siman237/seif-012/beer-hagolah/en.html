<b>Mishnah, Shevuot 19b.</b><br>
<b>According to Rav Ashi's interpretation there, Shevuot 20a, and in Nedarim there.</b> Ramban and the Rosh rule likewise.<br>
<b>Rambam, chapter 4 of Hilchot Shevuot, and the Ran, following Abaye.</b> According to Rav Ashi's interpretation, the Mishnah's text would have to be distorted.
