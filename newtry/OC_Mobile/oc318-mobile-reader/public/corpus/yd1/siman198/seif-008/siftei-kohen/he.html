<b>כחול כו'. </b>לשון בה"ג דף פ"ה ריש ע"ב וכי טבלה לא תישוף משחא ולא תכחול עיניה דאמר שמואל כוחלת אם לרפואה הרי זה חוצץ ואם בשביל שתראה עיניה פורעת אין חוצץ. ושנו חכמים כחול שחוץ מן העין חוצץ אמר רבי יהודא כל השמנים אין חוצצים חוץ משמן המור ונהגו בנות ישראל בעצמן שאין סכות שמן בשעת טבילה כל עיקר ע"כ:
