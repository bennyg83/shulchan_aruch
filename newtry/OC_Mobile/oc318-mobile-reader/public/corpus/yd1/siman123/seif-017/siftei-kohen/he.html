<b>דהיינו משנמשך על הגת כו'. </b>וכ"ש אם נמשך חוץ לגת לבור דהוי המשכה ואם נוגע אח"כ אפילו מה שבגת אסור כן הוא בש"ס ופוסקים:<br>
<b>אם יש בהן טופח כו'. </b>הא לאו הכי לא נאסר אלא מה שנגע וע"ל סי' קכ"ו ס"ה וסימן קכ"ט סי"ג:
<b>עד שולי הגת. </b>לאפוקי אם לא פינה רק למעלה אין כאן המשכה כיון שיש ענבים תחת היין:
