<b>אין מלין כו'. </b>מתני' פ"כ דמגילה <small>(כ' א'):</small><br>
<b>ביום כו'. </b>מפורש בתורה:<br>
<b>ומשעלה כו'. </b>מתני' שם:<br>
<b>עבר כו'. </b>ממ"ש ומשעלה כו' יצא מכלל דקודם לכן לא יצא:<br>
<b>מלו כו'. </b>ממ"ש בשבת קל"ז א' אמרי דר"י רישא כגון כו' דלא כו' ובב"י כתב דשני דינים אלו סותרין זא"ז ועמ"ז וש"ך <small>(וע"ל סי' רס"ד ס"ק י'):</small>
