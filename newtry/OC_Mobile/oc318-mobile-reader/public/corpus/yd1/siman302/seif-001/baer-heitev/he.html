<b>מותר. </b> וה"ה אם ניתק ממנו חוט א' תולין להקל בכלאים דרבנן. ש"ך:<br>
<b>דאורייתא. </b> והט"ז כתב דהך בדיקה דצביעה מהני אף בדאורייתא וכן מוכח בש"ס בהדיא ומ"ש הטור חילוק זה בין דאורייתא לדרבנן קאי רק אחלוקה שניה שכתב שם או ינתק חוט א' ממנו והוא מותר דבזה שייך לחלק דאין תולין בספק מן התורה להקל. ע"ש באורך:
