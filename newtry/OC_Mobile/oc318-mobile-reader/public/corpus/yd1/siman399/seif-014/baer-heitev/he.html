<b>ומסרו. </b> כתב הט"ז ראיתי להזכיר פה מה שראיתי בקצת מקומות כשקוברין מת ביו"ט ראשון ע"י עממים באים ישראלים ומחזירים העפר לתוך הקבר על המת עד זיבולא בתרייתא והוא איסור גמור בעיני דהרי מלאכה גמורה היא ויש בזה משום בונה ופשיטא דאסור ע"י ישראל. ע"כ יש ליזהר בזה לעשות ע"י עובדי כוכבים על כל צרה שלא תבוא עכ"ל:
