<b>ה) [סעיף ב'] השוחט את הבהמה ומצא בה עובר וכו'  </b>מותר דנפקא לן מכל בבהמה תאכלו. ש"ך סק"ג. פר"ח או' ד' ועיין לעיל סי' י"ג או' יו"ד.<br>
<b>ו) שם. אבל אם הפרים ע"ג קרקע אסור.  </b>דאז אסור מפני מראית העין כמו לענין שחיטה דלעיל (סי' י"ג סעי' ב') וזהו כדברי ר' יהודה בגמ' (חולין ע"ד ע"ב) והי"א הוא דברי ר"מ. ט"ז סק"ב.
