<b>מראשו כו'. </b>ל"ד דהא נתבאר בסי' שלפני זה דאסור להקיף ראשו וזקנו אלא ר"ל מראש גופו עד סוף גופו. פרישה:<br>
<b>שמותר כו'. </b>דודאי לרפואה קמכוין דאי ליפוי אדרבה ניוול הוא לו ואפשר דאפילו במפרש דליפוי קא עביד לא משגחינן ביה אלא אמרינן ודאי לרפואה קעביד. ב"י וכ"כ הב"ח אלא שנראה מדבריו כחולק אמפרש דליפוי קעביד ע"ש:
