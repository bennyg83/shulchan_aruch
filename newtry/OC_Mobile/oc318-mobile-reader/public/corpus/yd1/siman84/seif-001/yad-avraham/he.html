(סימן פ"ד סעיף ד') <b>ויש אוסרין אפי' מת בתוך הפרי ופירש כו'.</b> מה שהקשה הפמ"ג בשפתי דעת דבפירוש מתה דהוי דרבנן כמ"ש הכרתי ופלתי ואמאי פסקו לחומרא. י"ל דבדתיקו מחמירין בדרבנן כמ"ש ברש"ל הביאו הק"נ ספ"א דביצה. והפמ"ג עצמו כ"כ בא"ח סי' רמ"ד. וצ"ע דבסי' קס"ב שם כתב בהיפך דבלא תיקו הוי ספק חסרון ידיעה:
