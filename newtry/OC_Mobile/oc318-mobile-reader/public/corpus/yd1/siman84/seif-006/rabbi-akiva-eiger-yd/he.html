(סימן פ"ד ט"ז סקי"ב) <b>אם יש שם מילבי"ן קטנים.</b> בתשו' הב"י סימן נ"ו כ' וז"ל הגע בעצמך אם נמצא מילבי"ן ואח"כ אפילו אם לא ימצא עוד וכי שרי עכ"ל:<br>
(ט"ז סקי"ז) <b>שאין כאן אלא ספק א' דנימוח.</b> ובתשו' ב"ח ח"ב סי' ס"ג מתיר מטעם ס"ס. ספק דלא פירש לעיסה וספק דנימוח ובטלי בס' ואף אם עודה עיסה עיי"ש:
