<b>נעקר כו'. </b>דהלכה כרב באיסורי:<br>
(ליקוט) מהצלעות גדולות. דמש"ש בין נעקרו כו' היינו ע"כ מהצלעות גדולות מדכללינהו עם נשתברו ועוד דאל"כ מאי פריך והאר"י ברוב כו' וא"כ ה"ה כה"ג כיון דעקירת הצלע לא פסיל בקטנות הוי כאלו נעקרה חצי חוליא לבד דכשר. שם בת"ה (ע"כ):<br>
<b>ודוקא כו' וה"ה כו'. </b>עש"ך בשם ד"מ ס"ק ח' וס"ק ט':
