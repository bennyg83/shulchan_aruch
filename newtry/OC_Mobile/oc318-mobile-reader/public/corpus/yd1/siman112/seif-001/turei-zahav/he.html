<b>ואפילו במקום דליכא משום חתנות. </b>כגון שאין לו בנים דלא פלוג רבנן:<br>
<b>אלא פת של חמשת כו'. </b>שזהו דבר חשוב ומביא לידי קירוב דעת:<br>
<b>אם אינו עולה על שלחן מלכים. </b>לשון הטור שכתב וגם אינו חשוב כו' משמע דמסתמא א"צ שאלה על זה אם עולה על שלחן מלכים אלא בודאי אינו עולה וכ"כ בלבוש ומו"ח ז"ל לענין פת של קטנית כו':
