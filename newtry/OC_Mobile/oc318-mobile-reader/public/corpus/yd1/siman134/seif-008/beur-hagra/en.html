<b>Or, etc.</b> Tosafot there, s.v. 'And if,' in the name of the Yerushalmi, Hagahot Ashri there, and the other authorities.<br>
<b>If there is not, etc.</b> This is the dispute of Abaye and Rava there. The Mishnah there states, 'Yayin nesech,' etc. This is the meaning of the earlier phrase, 'whether new.'
