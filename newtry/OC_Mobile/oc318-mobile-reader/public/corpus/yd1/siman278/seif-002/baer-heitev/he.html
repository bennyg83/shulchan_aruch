<b>בגידים. </b> אבל אסור לדבק היריעות בדבק סביב העמודים כי בימים רבים מתייבש הדבק ומתרפה מעל העמודים כ"כ מהרי"ו ובד"מ מסיים בשמו מיהו בשעת הדחק שרי ולא נמצא כן במהרי"ו שם עכ"ל הש"ך:<br>
<b>במשי. </b> וה"ה בין היריעות כן הוא בת"ה שם ומוכח שם להדיא דכ"ש אם נתפר במשי במקום הקרע שכשר בשעת הדחק עכ"ל נה"כ:
