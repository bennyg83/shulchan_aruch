<b>לשתי. </b> כתבו הט"ז והש"ך דיש מחלוקת בין הפוסקים איזה מקרי שתי ואיזה ערב והלכך לענין מעשה יש להחמיר כתרווייהו דבין באורך בין ברוחב צריך שפ"ה וכ"פ הב"ח:<br>
