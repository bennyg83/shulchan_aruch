<i data-commentator="Beur HaGra" data-order="21"></i><i data-commentator="Be'er HaGolah" data-order="23"></i>כרם שלא הגיעו ענביו להיות כפול הלבן אלא עדיין הם בוסר וזרע בתוך ירק או תבואה והשרישו ה"ז לא קידש ואעפ"כ קונסין אותו ואוסרין הזרע אבל הבוסר מותר ואם עקר הזרע קודם שיעשו הענבים כפול הלבן הרי זה מותר בהנאה מקצתן נעשו כפול הלבן ומקצתן לא נעשו את שנעשו נתקדשו ואת שלא [נעשו] מותרים:
