(ט"ז סק"ד) <b>ותימא על הב"י.</b> לכאורה תמי' על תמיהתו דהר"ן לא כ"כ אלא לענין אף אם אין אוסר דבר שאינו שלו מ"מ אסור באכילה דלאו איהו אסיר אלא דלא שרי אבל לפסק הש"ע דאדם אוסר דש"ש אלא דאמרינן לצעורי' מכוין בזה ל"ש סברת הר"ן דהא דאמרי' דלא שחט כלל לעבודת כוכבים וממילא גם באכילה שרי ועי' בסמוך בש"ך סק"ה:
