<b>ב) שם. השוחט לשם עכו"ם וכו'  </b>וה"ה אם אמר ששוחט לשיתוף לשם שמים ודבר אחר נמי שוחט לע"ז מיקרי. שמ"ח או' א' ולא מבעיא אם ישראל שחטו לשיתוף דהו"ל זבחי מתים כיון דמצווה על השיתוף אלא אפי' גוי ששחט לשיתוף אע"ג דלא מוזהר עלה כמ"ש רמ"א באו"ח סי' קנ"ו מ"מ לדידן הו"ל תקרובת ובכלל זבחי מתים. תב"ש או' א'.
