<b>שייחד. </b> דאז הוי כחצרו של ישראל מש"ה מותר בהנאה ט"ז. וכתב עוד אפילו מפתח לחוד הוי כחותם א' <small>(וכבר כתבתי לעיל בסימן קי"ח דבנה"כ השיג עליו בזה דלא הוי מפתח כחותם א')</small> וגם סתימת מגופה לא הוי כחותם א' אלא בהפסד מרובה ואם רואה חותמו מקולקל אין לאסור אלא כשנראה שנסתר בכונה ע"י אדם כדלקמן ס"ח בהג"ה עכ"ל הש"ך:
