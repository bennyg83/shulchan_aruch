<b>ב) ואם  </b>העמידה בידים אע"ג דהלכה אח"כ ד"א הילוך יפה לא יצאתה מחזקת מסוכנת דנקל טפי ללכת מלקום בעצמה. תב"ש או' י"ג. זב"ר שם. מנחת יוסף או' א' אמנם הרב זב"צ או' ב' כתב להוכיח דלא כהתב"ש וכתב דאם לא עמדה בגערה או במקל והעמידוה בידים ואח"כ הלכה ד"א הילוך יפה דלא הוי מסוכנת וכתב דכן עשו מעשה להכשיר יעו"ש.
