בלילה דעת ב"י בנר אחד וזהו אינו דא"כ יכול לראות הניזוק אימת היה אם אמצע שחיטה או סוף שחיטה: רק איירי בשוחט באפילה ואמת מתחילה פסול הא בדיעבד כשר כדלעיל:<br>
אם פרכסה אפילו כתלי בה"ש מלא דם שמא אמצע שחיטה זינקה:<br>
