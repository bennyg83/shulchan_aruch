<b>(3) And if</b> they stand it up in a shout or with a stick and it stands—even if it does not eat at all—behold it is in presumption of health and permitted even if it did not convulse at all. Shulchan Melachim seif 5; Kometz seif 7; Zivchei Ratzon among the tamidim seif 2; Zivchei Tzedek seif 3.
