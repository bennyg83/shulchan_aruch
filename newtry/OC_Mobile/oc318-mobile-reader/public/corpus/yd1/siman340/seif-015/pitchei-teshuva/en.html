<b>One who hears a blasphemy of the Divine Name.</b> Tiferet LeMoshe leaves unresolved whether one who saw a Torah scroll burned on Shabbat, or heard blasphemy on Shabbat, must rend after Shabbat. Mishnat Chachamim, Laws of Idolatry, negative commandment 13, Tzafnat Paneach 10, raises the same doubt.
