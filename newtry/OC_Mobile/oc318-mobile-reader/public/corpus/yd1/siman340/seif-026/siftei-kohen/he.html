<b>יצא ידי קריעה כו'. </b>אבל אמרו לו מת וקרע ולא מת ואח"כ מת לא יצא ידי קריעה. רמב"ן בסת"ה ומביאו הטור:<br>
<b>ידי קריעה. </b>ולענין ז' ימי אבילות קרוב היה לומר כיון שחלה עליו אבלות ונהגו אע"פ שבטל מקצת הימים בשוגג עולין לו ואין תשלומין לאבלות ודבר זה צריך תלמוד רמב"ן שם ומביאו הטור וע"ל סימן שצ"ו:
