(Seif 6) <b>They circumcise</b> him. Bekhor Shor to Sanhedrin 47 writes that if they forgot and did not circumcise him, they open the grave and circumcise him; see Knesset Yechezkel siman 44 and Responsa Noda BiYehudah Tinyana siman 164. And our master wrote likewise above, at the end of siman 263.
