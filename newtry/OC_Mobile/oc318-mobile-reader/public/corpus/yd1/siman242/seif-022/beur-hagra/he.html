<b>א"ל למדתני כו'. </b>כמ"ש בסכ"ג ע"ש ועמ"ש בהג"ה:<br>
<b>ואם רצה כו'. </b>בת"ה מסתפק בזה מהא דפ"ו דעירובין <small>(ס"ז ב') </small>דא"ש בדרבנן עבדינן כו' ודחה דשם אינו יודע ודאי שעובר כו' וכמש"ו הרואה רבו כו' הואיל כו' ומתני' ערוכה היא בספ"ב דברכות א"ל למדתנו רבינו כו' וכ"ש לפי' תוס' דכל אבילות מדרבנן ערא"ש וכן אין מקבלין כו':
