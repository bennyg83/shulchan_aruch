<b>שאסור לחכם כו'. </b>נראה דהיינו דוקא אם מתיר בסתם וכן נראה מהראיות שהביא בהגמ"יי שם מרפ"ק דסנהדרין (דף ח') גבי רב דבקי במומי וס"פ כל היד (נדה דף כ') סוף ע"א גבי ר' חנינא דפלי קורטא דגרגישתא וריש בכורות גבי כל חיותא דרב מרי בר רחל אבל אם אומר לשואל טעם בדבר ומראה לו פנים או שמביא ראיות מתוך הספר מותר:
