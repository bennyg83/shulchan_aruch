<b>אסור. </b> כתב הט"ז ואם עבר ועשה כן א"צ למכור בהמתו לעובד כוכבים ול"ד לסירוס בהמה כמ"ש בא"ע סימן ה' דשם מצוי האיסור בכל יום גבי עובדי כוכבים אבל כאן הוא מילתא דלא שכיחא לא גזרו בו קנס:<br>
<b>עצמו. </b> והש"ך כתב דמשמע מהרמב"ם והרא"ש ושאר פוסקים דאפילו העובד כוכבים עשה להנאת עצמו אסור בדבר של ישראל ע"ש:
