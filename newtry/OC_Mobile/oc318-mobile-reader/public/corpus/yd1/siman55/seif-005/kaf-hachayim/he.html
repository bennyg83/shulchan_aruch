<b>ה) שם. בפרק התחתון בכל מקום שיחתך כשרה.  </b>מעשה בכבש א' שנברא חסר ברגליו האחרונים כל הפרק התחתון הנמכר עם הראש רק חתיכה קטנה היה במקום הפרק הנז' מחובר לשוק וקבוע בו פרסות והיה הכבש הולך כבעל רגלים גמורות יש להכשיר. חנוך בית יהודה ססי' ג"ן. גליון מהרש"א אשר בש"ע. תו"ז סי' פ"ג או' נ"ב. זב"צ או' ט"ל.
