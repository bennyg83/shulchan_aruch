<b>ו) שם. בפרק התחתון בכל מקום שיחתך כשרה.  </b>מפני שיכולה לחיות. וה"מ שנחתך בידי אדם אבל אם באה לפנינו חתוכה ולא נעשה בידי אדם אין לאוכלה כ"א ע"י צלי דחיישינן שמא ע"י נשיכת נחש נחתך ויש בו סכנת ארס הנחש וע"י הצלייה תיבדק כמ"ש לקמן סי' ס' ב"י. לבוש. זב"ת או' ב' ועיין לקמן סי' ס' סעי' ג' ובדברינו לשם בס"ד.
