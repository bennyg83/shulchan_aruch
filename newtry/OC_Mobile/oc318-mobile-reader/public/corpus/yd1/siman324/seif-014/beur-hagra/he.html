<b>אסור כו'. </b>ירושלמי רפ"ג מי שא"י לעשות עיסתו בטהרה כו' הא אם יכול לעשות לא הדא אמרה שאסור לעשות עיסתו קבין וכן בגמ' פ"ג דפסחים <small>(מ"ח ב') </small>מאי דעתיך לחומרא חומרא כו' ואף שאמרו מי שאינו יכול כו' ה"מ לדידהו שהיו יכולין לעשות בטהרה אבל בזה"ז לא דלא לישתכח תורת חלה וכמ"ש בפ"ד שלש ארצות כו' א' לאור כו':
