(שם בהג"ה) <b>התוחב כף חולבת ששמשו בו בכלי ראשון תוך מע"ל דאז נאסר כולו.</b> ונ"ל דאם נשתמש ע"י ערוי שלא בלעה רק כ"ק א"צ לשער רק ס' נגדה. ושוב מצאתי כן להדיא בש"ך סי' צ"ח ס"ק י"א ובאו"ה כלל ל"ז בשם סמ"ק דאף מספק רתיחה צריך ס' לבטלו ואף אם ספק אם נתחב כולו או מקצתו צריך ס' נגד כולו דטכ"ע וספיקא לחומרא:
