<b>ירא. </b> כתב הש"ך ואפי' אין ישראלים בעיר משום דבעובדי כוכבים אחרים מירתתי מעובד כוכבים זה וזה מירתת מאחרים הרא"ש וכתב ב"י ומשמע לי מדברי הפוסקים דאפילו מסר לו המפתח סתם אמרינן לא מסר אלא שמירת המפתח ואצ"ל אחוז מפתח זה עד שאבא עכ"ל:<br>
<b>סדק. </b> ודוקא ביום אבל בלילה לא מהני סדק כדלקמן ס"ס ק"ל. ש"ך:
