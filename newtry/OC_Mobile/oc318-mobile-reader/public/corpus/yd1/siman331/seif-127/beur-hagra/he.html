<b>האביונות כו'. </b>ירושלמי ספ"ד דמעשרות אביונות נותנין עליהן חומרי אילן וחומרי זרעים וליידה מילה שאם היתה שניה נכנסת לשלישית שהוא מפריש ופודהו ונותנו לעני. והראב"ד השיגו דהוא כב"ש בברכות ל"ו והרמב"ם <small>(סבר) </small>שהוא אף לב"ה מדקאמר וליידה מילה. כ"מ. ואין מוכרח משום דאיירי שם לענין מעשר אמר וליידה כו':
