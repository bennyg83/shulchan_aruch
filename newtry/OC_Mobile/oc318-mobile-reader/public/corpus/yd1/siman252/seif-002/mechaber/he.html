<i data-commentator="Beur HaGra" data-order="5"></i><i data-commentator="Be'er HaGolah" data-order="4"></i>המעלים עיניו מפדיון שבויים עובר על לא תאמץ את לבבך ועל לא תקפוץ את ידך ועל לא תעמוד על דם רעך ועל לא ירדנו בפרך לעיניך ובטל מצות פתוח תפתח את ידך לו ומצות וחי אחיך עמך ואהבת לרעך כמוך והצל לקוחים למות והרבה דברים כאלו:
