<b>בזה. </b> והב"ח חולק על המחבר ופסק דאם נמצא ספק מה פטור מכסוי והט"ז חולק עליו והסכים עם המחבר וכ"פ מהרש"ל:<br>
<b>לכסות. </b> וכ' בש"ך דצריך לברך דלא כהב"ח שפוסק לכסות בלא ברכה. וכן שהייה דרסה חלדה הגרמה במיעוט בתרא בסימנין חייב לכסות בברכה <small>(ש"ך)</small> השוחט לאכילת כלבים או לאכילת עובדי כוכבים חייב בכסוי. כנה"ג בשם ש"ג:
