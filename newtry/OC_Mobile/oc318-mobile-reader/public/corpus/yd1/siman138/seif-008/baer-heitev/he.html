<b>ניגוב. </b> כתב הש"ך משמע דביישון א"צ להתיר הקשרים דהיתר הקשרים דבש"ס לא קאי אלא להכשר ניגוב בלבד מיהו דעת הש"ך דאף ביישון צריך להתיר הקשרים:<br>
