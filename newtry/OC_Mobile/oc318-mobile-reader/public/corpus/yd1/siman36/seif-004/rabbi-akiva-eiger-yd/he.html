(סימן ל"ו ט"ז סק"א) <b>מרוח אחת.</b> ולפמ"ש הש"ך סק"ח בטעמא דהאוסרים גם מב' רוחות טריפה:<br>
(ש"ך סק"ט) <b>דמאחר שא"א בקיאין בבדיקה.</b> אינו מובן. הא מה דקיי"ל שם לאסור למעלה מחציה היינו דדנין זה בכלל שיפולי ומדינא לא מהני בדיקה:<br>
(בא"ד בסופו) <b>בבדיקה.</b> ומ"מ באגליד קיי"ל דבקיאים בבדיקה כמבואר בנקה"כ סק"ב:
