<b>אלו המעות שהטמין אביך כו'. </b>פירוש שאינו יודע היכן המעות שהטמין אביו ומראה לו בעל החלומות המעות ואומר לו אלו המעות שהטמין אביך וכן הוא בסנהדרין (דף ל' ע"א) שבא בעל החלום ואמר ליה כך וכך הן במקום פלוני הן של מעשר שני הן זה היה מעשה ואמרו חכמים דברי חלומות לא מעלין ולא מורידין והשתא הוי שפיר רבותא:
