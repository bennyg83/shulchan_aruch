(Siman 305 seif 3) <b>These five sela'im one gives to the kohen in silver, etc., except for real estate.</b> In Sefer Sha'ar HaMelech, Hilchot Ishut, he brought from Tosafot Eruvin (daf 31b) that one may redeem with something detached that was later attached, for it is considered detached for this matter.
