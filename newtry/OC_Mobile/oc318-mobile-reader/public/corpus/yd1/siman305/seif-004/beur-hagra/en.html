<b>He said, etc. </b>Bava Metzia 49a: Rav Pappa said, and he admits, etc. The version of the Geonim: it is reasonable, etc.<br>
However etc. For they did not dispute there except whether it is permitted etc., and as it is written there, can it be? It is obvious, and see Rashi there s.v. because of this etc.
