<i data-commentator="Be'er HaGolah" data-order="11"></i>The order of the Prophets is: Yehoshua, Shoftim, Shmuel, Melachim, Yirmiyahu, Yechezkel, Yeshayahu, and the Twelve Prophets. The order of the Writings is: Ruth, Tehillim, Iyov, Mishlei, Kohelet, Shir HaShirim, Eichah, Daniel, Megillat Esther, Ezra, and Divrei HaYamim.
