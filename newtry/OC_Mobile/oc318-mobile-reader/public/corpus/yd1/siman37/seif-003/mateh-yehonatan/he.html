<b>וה"ה מורסא וכו'.</b> עי' ש"ך סק"ד ונ"ל הא דמורסא כשרה היינו להפוסקים דס"ל דטעמא דשני בועות דסמיכי טריפ' משום דמתחככין אהדדי לכך שני בועות טריפה א"כ מורסא שהוא שוה לבשר הריא' ליכא למיחש למידי משא"כ להמפרשי' הטעם משום דסמיכי וודאי ניקב הריאה אין לחלק בין מורסא לבועא דמנ"מ אם הם שווים:
