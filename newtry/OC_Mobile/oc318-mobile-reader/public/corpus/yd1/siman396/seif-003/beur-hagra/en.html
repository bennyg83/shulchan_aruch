<b>And even if he became an adult, etc.</b> As stated at the beginning of chapter 9 of Pesachim: and likewise a minor who became an adult, etc.; and in Sanhedrin 47b: therefore, since, etc. See the Taz.<br>
<b>A minor, etc.</b> For he is not obligated, as stated on 14b: it follows that mourning, etc.
