<b>יג) שם בהגה. וספק כבוש אסור.  </b>לפי דכבוש אסור מה"ת. או"ה כלל ל' סוף דין א' כנה"ג בהגה"ט או' ג' והשיג על הע"ז סק"ג שחולק וכן השיג עליו הש"ך בנה"כ. פר"ח או' ג' פר"ת או' ג' לה"פ או' ג' בל"י או' ג' כריתי או' ג' מש"ז או' א' ד"ה וכבישה. ער"ה או' ד' חכ"א כלל נ"ח או' ד' בי"צ ח"א או' ב' ערוך השלחן או' ט"ו.
