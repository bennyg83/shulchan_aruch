Moed Katan 15a, from the fact that the Merciful One said to Yechezkel, “bind your glory upon yourself,” implying that for everyone else it is forbidden.<br />
Like Rabbi Yehoshua in the baraita there, 21a.<br />
Tur in the name of his father the Rosh, and so are the words of the Ramban in Torat HaAdam.
