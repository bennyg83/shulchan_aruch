<b>ברגלו. </b> וכתב בש"ך לפי דעת המחבר משמע דגלגל שמסבב ברגלו או בידו מותר לכתחלה כשהוא תלוש אבל מהרש"ל והב"ח פסקו דאסור לכתחלה:<br>
<b>פסולה. </b> והטעם משום דבעינן כח גברא:<br>
<b>שנייה. </b> פי' בשנייה שחט:<br>
