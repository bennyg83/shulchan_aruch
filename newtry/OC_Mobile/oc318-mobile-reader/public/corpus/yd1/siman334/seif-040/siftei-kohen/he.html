<b>ת"ח כו'. </b>בתשובת הרא"ש איתא ת"ח או ש"ץ כו' ונראה דמיירי בנידהו הש"ץ בשליחות ב"ד:<br>
<b>עד שנידהו. </b>ומיירי שנידהו כדין וכן בעט"ז גרס שביזהו רשע עד שנידהו וכן הוא בתשובת הרא"ש משמע דה"פ שביזה את החכם עד שבשביל כך נידהו ואחר שנידהו א"ל הרשע אדרבה וא"כ ודאי דכדין נידהו דהרי מנדין המבזה את החכם כדלקמן רסמ"ג:
