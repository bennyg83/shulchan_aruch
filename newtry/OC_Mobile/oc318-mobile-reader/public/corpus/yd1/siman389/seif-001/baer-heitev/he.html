<b>שעה. </b> כלומר זמן מה וא"צ שעה זמניות וכן משמע בפוסקים וכן נוהגין ולא כמ"ש בלבוש שעה או שתים ואולי גם הוא לאו דוקא קאמר עכ"ל הש"ך וכתב הב"ח דהמכובס במים לבד ולא בנתר וחול אין צריך להלבישו אחר תחלה ופשיטא דשרי לאחר ז' מיד:<br>
<b>להרויח. </b> לאפוקי לטיול. ועיין בא"ח סי' תקל"א:<br>
<b>לגלח. </b> וה"ה כאן לכבס. ש"ך:
