<b>Although they are not, etc.</b> Although a sage releases a vow only when there is a need, as above in siman 228, seif 3, a husband is different. He can annul only until nightfall, and if he does not annul today he will never be able to do so.<br>
<b>And he says to her, 'Take, etc.'</b> See below, seif 38.
