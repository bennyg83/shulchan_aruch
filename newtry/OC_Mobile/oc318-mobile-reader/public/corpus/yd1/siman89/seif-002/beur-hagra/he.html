<b>(ליקוט) וצריך לקנח פיו ולהדיחו. </b>אבל הרשב"א פי' דבא' מהן סגי דאל"כ אמאי שיירו ב"ש וב"ה לאידך וכן אגרא אמאי שייר להדחה (ע"כ):<br>
<b>ואח"כ ידיח. </b>ל"ד אח"כ. ב"י וכ"ה בגמ':<br>
<b>ויש מחמירי' כו'. </b>וכ"מ מדברי הזוהר הנ"ל. ב"י. ואין זה כחולק על הגמ' שהרי הם היו מחמירין על עצמן ג"כ המותר כמש"ש אנא לחא כו'.
