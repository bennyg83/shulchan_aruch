<b>נערה. </b> אבל מותר למסור לו בתו בוגרת אע"פ שמשיאה ואינה עוברת על דעתו שרי הרא"ש:<br>
<b>בתו. </b> אפילו קטנה ונערה וכתב הט"ז אע"פ שדרך האב לתת נדוניא לבתו וזה לקחה בחנם אפ"ה שרי:<br>
<b>בחנם. </b> ואם בעל האבדה אינו רוצה לקבל בחנם תפול ההנאה להקדש. ש"ך:<br>
