<b>כלים. </b> כתב הש"ך דיש פוסקים לברך על טבילת כלי מתכות וכתב הב"ח שכן עיקר ושכן ראה שנהגו ע"פ זקנים והט"ז כתב שא"צ להזכיר מתכות וגדולה מזו מצא בסוף או"ה בתשובה וז"ל אך מהרי"ז רונקי"ל השיב שאין להזכיר כלי רק להטביל סתם <small>(ובדיעבד אם בירך על כלים הרבה על טבילת כלי או על כלי א' על טבילת כלים יצא. פר"ח)</small>:
