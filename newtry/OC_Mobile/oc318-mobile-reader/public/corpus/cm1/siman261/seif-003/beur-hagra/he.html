<b>עומדת בר"ה. </b> גירסתינו ברמב"ם עומדת חוץ לתחום וכשיטתו לפסוק כלישנא בתרא בכ"מ וכמ"ש במ"מ. דגי' עומדת בר"ה אין לו שחר וגם למה השמיט הא דר"י:<br>
<b>רועה בעשבים. </b> בבריי' ל"א א' וכגי' הרי"ף ורא"ש וש"פ ובגמ' הוא ט"ס דלגי' שלנו הא אח"כ שקלא וטריא בגמ' בהא:<br>
<b>וי"א כו'. </b> לחומרא בדאורייתא. הרא"ש:
