<b>(Sema, seif katan 25) And I wrote.</b> Note: Responsa Rashba, siman 563, rules decisively that the principle 'a statement to the Most High is like delivery to an ordinary person' does not apply to property consecrated for the poor. This is cited in Beit Yosef, Bedek HaBayit, Yoreh Deah, siman 258.
