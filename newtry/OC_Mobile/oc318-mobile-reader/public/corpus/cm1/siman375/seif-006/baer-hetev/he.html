<b>שומעין. </b> דבבנין ע"ג קרקע לא שייך כחשא דארעא כמו גבי אילנות בס"ב. סמ"ע:<br>
<b>ודוקא. </b> עיין בתשובת רשד"ם סי' רכ"ז ורמ"א וסי' ש"ל:<br>
