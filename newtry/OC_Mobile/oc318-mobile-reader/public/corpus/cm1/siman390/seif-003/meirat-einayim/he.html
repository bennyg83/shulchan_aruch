<b>מהיפה שבנכסיו. </b> כבר כתבתי פירושו דמשלם המזיק ג"כ מכיסו ולאו דוקא מהשור כדין קרן:<br>
<b>ודבר זה הלכה למשה מסיני </b> פי' אע"פ שהדברים נראין כסותרין זא"ז שיש לו דין רגל לענין פטור בר"ה ולענין חיוב תשלומין מנכסיו יש לו דין קרן שאינו משלם אלא חצי נזק אף ברשות הניזק מ"ה כ' דהלכה למשה מסיני. כן הוא ואין להרהר אחריה:
