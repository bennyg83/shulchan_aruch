<b>וכן אם היתה מהלכת בר"ה כו'. </b> קמ"ל בזה דאע"ג דצרורות דין רגל יש לו ופטור על הזיקו בר"ה מ"מ כיון דהצרורות נתזו משם ברשות הניזק בתר הניזק אזלינן וחייב:<br>
<b>וה"ה לתרנגולים כו'. </b> שכל שאורחא הוא והיזק בא מכחו דין צרורות יש לו:<br>
<b>שהדסו והעלו עפר. </b> פי' ברשות הניזק או ברשות הרבים ונתזו לרשות הניזק והזיקו וכנ"ל:
