<b>נותן לכל. </b> כר"ח שם:<br>
<b>שכל פתח. </b> ר"ל לאורך החצר:<br>
<b>ואפי' כו'. </b> כאן אומר לרוחב:<br>
<b>וי"א. </b> גם הס' ראשונה מודה לזה וראיה לזה בסוכה ג' ואין האחין והשותפין אלמא גם באחין מיתוקם וכה"ג ובשותפין כנ"ל:<br>
<b>אבל כו' ואפי'. </b> עבה"ג וכן ב' אחין א' נטל שדה כו' דוקא משום דעלו אהדדי. הרא"ש:
