<b>בד"א כו'. </b> מהנ"ל ב' אחין ועלו להדדי:<br>
<b>אע"פ שבעוד. </b> כמ"ש בתוספתא וירושלמי הביאם הרא"ש שם:<br>
<b>עתה. </b> כיון דעלו להדדי וע"ש:<br>
