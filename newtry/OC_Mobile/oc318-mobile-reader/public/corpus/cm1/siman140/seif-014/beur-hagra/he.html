<b>החנויות כו'. </b> כמו שדות ובית הבדים כיון שתשמישן אינן אלא ביום ועתוס' שם ד"ה ומודה:<br>
<b>וי"א. </b> כ"כ תוס' שם וראיה לדבריו מדנקט ומודה רב הונא מ' דמ"מ מפורדות בעינן:<br>
<b>ויש מחלקים. </b> דס"ל כתוס' מראיה הנ"ל רק שמפ' שהיה בית דל"ד לשדה כנ"ל וכ"מ שם בתוס' אע"ג כו' דכמו שאר בני אדם הדרים שם כו':
