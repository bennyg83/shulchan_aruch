["<b> מי שהקנה כו' </b> עיין בתשו' מהרא\"ן ששון סימן קי\"ח:"]<br>
["<b> וכן המוכר או הלוקח. </b> עיין בסמ\"ע ס\"ק י\"א פי' סעיף זה והב\"ח מפרשו דהיה בקנין תחלה בסתם ואח\"כ קנו מלוקח שיחזיר לו וכמ\"ש בסעיף זה (בסי' ז') ע\"ש וכ\"כ הכ\"מ:"]<br>
["<b> ואי נתן לו בע\"כ </b> עיין בד\"מ וצריך עיון ועיין בהרב המגיד פ\"ח מגירושין:"]
