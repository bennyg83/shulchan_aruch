["<b> וכן מי שהי' לו חלון מוחזקת כו'. </b> ע' בתשו' מבי\"ט חלק א' בשאלות שניות סי' קכ\"ה דקכ\"ו ובתשובת מהרא\"ן ששון סי' ס\"ח:"]<br>
["<b> בעל החלון נקרא מוחזק כו' </b> לשון הריטב\"א בעל החלון הוא הי' מוחזק ואינו יוצא מחזקתו אע\"פ שנסתר כו' ע' בתשו' ר\"ש כהן ס\"ב סי' קע\"א ובתשו' ר\"י לבית לוי ס\"ב ד\"י:"]
