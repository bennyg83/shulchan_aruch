["<b> דעת הרא\"ש שהפותח חלון כו'. </b> ע' בתשו' מהרי\"ט ס\"ס קל\"ב ובתשו' ר\"ש כהן ס\"ב סי' ס\"ב וסצ\"ח דס\"ו ע\"ב וסי' קל\"ב ובתשו' מהרשד\"ם סי' רמ\"ב ורנ\"ז:"]<br>
["<b> ומיהו כתב הרמב\"ן כו'. </b> עיין בתשו' רא\"ן ששון שהקשה מזה אתשובת ריב\"ש שלא כ\"כ בשם הרמב\"ן וע\"ש סי' פ\"ז ופ\"ח וע\"ש עוד בסי' קצ\"ב:"]
