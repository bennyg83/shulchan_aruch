<small>[ש"ך אות כ]</small> <b>ולפי"ז כשאין להערב.</b> נ"ב לא הבנתי דלהסוברים דביש לו א"י לגבות רק החצי מכל אחד א"כ חל החיוב תביעה על כל א' החצי ואם אין לו לזה גובה כולו מהשני א"כ במחל לאחד כיון דאף אם הי' לו לא הי' יכול לגבות ממנו כיון שמחל לו ממילא א"י לגבות מהשני כיון דנמחל לזה חלקו שוב א"צ השני לשלם עבורו וצ"ע לדינא:
