<small>[שו"ע]</small> <b>חצי שדה.</b> נ"ב בד"מ סי' רמ"ח אות י"א כתב וז"ל כתב הר"ן פ"ד דגיטין בשם הרמב"ן הנותן חצי נכסיו לחבירו אינו נוטל חצי בכל כלי וכלי או בכל שדה ושדה אלא שמין הנכסים ונוטל הכחיש ע"ש ועיין בהר"ן שם שכתב על דבריו לא ידעתי מנין לו זה שהנותן חצי נכסיו לחבירו למה לא יזכה במחצית כל דבר ודבר וכו':
