<small>[הגה]</small> <b>שירא לומר.</b> נ"ב לכאורה נראה דהרא"ש בשו"ת כלל נ"ו ס"ב שכתב דבהראה חוץ לב"ד ואמר ממושכן בידי דאינו נאמן. דחוץ לב"ד ל"ש מגו. והביא ראי' מסוגיא דראה עיי"ש. והוא דינא דהש"ע לעיל סי' קל"ג ס"ג מוכח דלס"ל הך דינא דהכא שהוא פירושו של תוס' בההי' דראה דא"כ אין ראי' לדינו של הרא"ש וצ"ע:
