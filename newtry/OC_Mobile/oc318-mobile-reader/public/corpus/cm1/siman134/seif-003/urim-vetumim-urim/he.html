<b>אע"פ וכו' בעדים וכו' </b> בסמ"ע הקשה איך מסיק המחבר אם טוען לא נתתו לי וגם הרמ"א כתב בהג"ה שירא לומר להד"מ הא בלא"ה לא מצי לטעון שהרי מסרו בעדי' וע"ש מ"ש והש"ך כתב דמיירי שעדי המסירה ג"כ אין מכירין אותו או שהלכו להם ע"ש וכ"כ הב"ח ונכון:<br>
<b>שירא וכו' </b> ומה"ט אפילו מסרו לו בלא עדים ג"כ אין האומן נאמן סמ"ע:
