<b>(סעיף ה)</b> יכול להגבותם ק"ל דלמא ימחול ללוה כמ"ש סי' ס"ו ושמא לא יהיה לו אח"כ לשלם וג"כ א"ל דא"א לו למחול דמשועבד מדר"נ כמ"ש סימן ס"ו דהא כתב רמ"א אפי' יש לו שאר מטלטלין ובכה"ג לא הוי דינא דר' נתן ונרא' דמיירי במעמד שלשתן שאז אינו יכול למחול כמ"ש סי' צ"ו או ביש לו קרקע ואז אם ימחול יגבה קרקעותיו:
