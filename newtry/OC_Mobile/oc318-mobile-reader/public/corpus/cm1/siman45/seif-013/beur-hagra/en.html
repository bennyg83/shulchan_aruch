<b>If it was disqualified.</b> Makkot 6a, "If they came to observe," etc.; see Tosafot there, s.v. "if," and the explanation of Rabbeinu Chaim. Here too, the testimony that they witnessed before the writing of the document is not disqualified. <br><b>Through seeing.</b> Ketubot 21b. <br><b>And beit din.</b> Bava Batra 171a.
