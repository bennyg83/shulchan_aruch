<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i><i data-commentator="Beur HaGra" data-order="8"></i><i data-commentator="Me'irat Einayim" data-order="4"></i><i data-commentator="Ba'er Hetev" data-order="2"></i><i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i>One who finds lost property and does not know its owner announces it in synagogues and study halls. Where people claim that every found object belongs to the king, he need only notify his neighbors and acquaintances.
