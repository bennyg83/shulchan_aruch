<small>[Sema, continuation]</small> <b>That the broker is exempt.</b> Note: If the non-Jew contradicts his account, the broker must swear, under the law governing a shopkeeper relying on his ledger. Rashba, there. See Shach, siman 91, seif katan 3, and Responsa Maggid MeReshit, Choshen Mishpat, siman 1.
