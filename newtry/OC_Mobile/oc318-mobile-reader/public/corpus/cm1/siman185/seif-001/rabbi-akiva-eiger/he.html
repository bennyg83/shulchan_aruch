<small>[ש"ך אות א]</small> <b>אפי' עשאו המקבל שליח.</b> נ"ב לא זכיתי להבין דהא פשוט דהתם כיון דעשאו שליח קבלה מקודם מש"ה במה שאומר תן בשכר שליחות קבלה. וכמ"ש הסמ"ע שם ס"ק כ"ג משא"כ היכי דהנותן אמר תחלה תן ואח"כ אמר להמקבל תהי' אתה שליח שלי לזכות מידך הוי ספק אם בעי החזקת שליחות אצל הנותן או לא ודו"ק:
