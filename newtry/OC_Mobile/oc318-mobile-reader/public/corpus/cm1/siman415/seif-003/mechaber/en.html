<i data-commentator="Me'irat Einayim" data-order="5"></i><i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i><i data-commentator="Ba'er Hetev" data-order="2"></i><i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i><i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i>It is pious conduct for a person to conceal his thorns and every other dangerous object in a place where they cannot cause harm, such as by casting them into a river or burning them.
