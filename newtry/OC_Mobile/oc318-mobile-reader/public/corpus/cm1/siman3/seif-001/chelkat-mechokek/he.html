<b>וי"א דנאמן לקרות בתורה ראשון ולישא את כפיו</b>. הרמ"ך בעל דעה זו לא כתב רק לקרות בתורה ראשון ונתן טעם לדבר דלא אכפת לן אם יקרא בתורה ראשון כלומר דאין בזה צד איסור רק מפני דרכי שלום (כדאיתא במשנה בהנזקין דף נ"ט) אבל נשיאות כפים דאיכא איסור עשה כמבואר בגמרא (כתובות דף כד) בזה אין מקילין אף לדעת הרמ"ך:
