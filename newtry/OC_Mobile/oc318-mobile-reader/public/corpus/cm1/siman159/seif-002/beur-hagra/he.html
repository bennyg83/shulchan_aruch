<b>לפיכך אין. </b> ירושלמי וכ' הרי"מ והא דלא פי' אביי בעשוי לדירה לפי שלא בא כאן לבאר אם יש היזק ראיה שו לא רק לבאר כיצד תיקונו:<br>
<b>וי"א. </b> תוס' שם ד"ה בשני:<br>
<b>ל"ש כו'. </b> גמ' ורצה בזה כלפי' הזה מאי קאמר בס"א אפי' היו כו' ולפי' דוקא רחוקין ולכן כ' ל"ש ר"ל דהרבותא הוא נגד אויר רה"י כמ"ש גמ':
