<i data-commentator="Beur HaGra" data-order="3"></i><i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i><i data-commentator="Ketzot HaChoshen" data-order="1"></i><i data-commentator="Beur HaGra" data-order="4"></i><i data-commentator="Ketzot HaChoshen" data-order="2"></i>A gift to a slave or married woman is acquired by the master or husband. The master acquires both principal and produce. The husband acquires only the produce, while the principal remains hers and becomes fully available to her upon widowhood or divorce, as explained in Even HaEzer siman 85.
