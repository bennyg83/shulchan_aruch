<small>[שו"ע]</small> <b>עד שיודיע לבעלים.</b> נ"ב עיין במלחמות סוף בב"ק והרשב"א בחי' שם שכתב דאף במחזיר לבית בעלים תורת גנב עליו עד שיודיע ממש לבעלים דכיון דהבעלים יחדו לחפץ זה מקומו בבית השומר ואין ברצונם להיות בביתם. משו"ה לא מקרי חזרה לרשות בעלים. ועיין בראב"ד פ"ד מה' גניבה וברה"מ שם ובש"נ פ' המפקיד וצ"ע:
