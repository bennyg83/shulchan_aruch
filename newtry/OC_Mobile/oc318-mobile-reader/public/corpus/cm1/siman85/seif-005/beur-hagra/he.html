<b>אפי' היתומים קטנים כו'. </b> עבה"ג וכן מוכח מעובד' דרבה בר שרשום ב"ב ל"ג א' כי אמינא דאיתלי זוזי כו' יכמ"ש שם בחידושי הרמב"ן בשם הר"י מיגש וכמש"ל סי' ק"י ס"ב ושם כ' אפי' אחרי מות אביהם שם שתפס שלא בעדים ויכול לטעון כו' אבל כאן דתפיסתו בעדים וידוע שהרי ליתומים שטר עליו לכך כ' כאן כיון שתפס בחיי כו':
