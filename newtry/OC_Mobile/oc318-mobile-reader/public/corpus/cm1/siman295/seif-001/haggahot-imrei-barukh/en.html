<b>(Mechaber, seif 2) And that such-and-such occurred, and that it is not in his possession.</b> Note: In Rambam, Hilchot She'eilah U'Pikadon 6:1, the reading before us is corrected to: "and that such-and-such occurred, and behold it is in his possession." See Pnei Moshe at the end of tractate Shevuot.
