<small>[Shulchan Aruch]</small> <b>One who transfers a right to a fetus.</b> Note: At the end of this siman, the Beit Yosef writes in the name of Nimukei Yosef that one can transfer a right to a fetus through the mechanism of "acquire in order to transfer," as stated in Nedarim. See Responsa Maamar Mordechai, siman 9.
