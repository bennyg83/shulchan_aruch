(ליקוט) <b>ואפי' עשאו שליח. </b> עבה"ג ועתוס' שם ט' ב' ד"ה ולימא מר כו' ודייק ר"נ בגמ' שם דהא מציאה כו' ותנן כו' ומתני' עשאו שליח דקא' תנה לי. הרא"ש (ע"כ):<br>
<b>אבל אפוטרופוס כו'. </b> מדאמרי' בגטין נ"ב א' דרשאי לדון לזכות:<br>
<b>דיד בעלים. </b> וכל כה"ג קנה כמ"ש בב"מ יו"ד א' מ"ט הוי תופס כו' שאני פועל כו':
