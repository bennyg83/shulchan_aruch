<i data-commentator="Be'er HaGolah" data-label="ר" data-order="21"></i><i data-commentator="Me'irat Einayim" data-order="17"></i><i data-commentator="Siftei Kohen" data-order="7"></i><i data-commentator="Netivot HaMishpat, Hidushim" data-order="17"></i><i data-commentator="Beur HaGra" data-order="19"></i><i data-commentator="Be'er HaGolah" data-label="ש" data-order="22"></i>If the principal told the agent to sell a field to one person, and the agent sold it to two people, the sale is void because the agent departed from his instructions. <small>Rama: Some say this applies only when he sold to them through two separate deeds.</small>
