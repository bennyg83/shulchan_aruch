<b>ש"ך ב דבי חצירו נמי שייך יאוש של"מ. </b>נ"ב יעוין באס"ו לב"מ דך כ"ג ד"ה משום יאוש בעלים כו' וא"ת וליזכי ביה מריה דמעצרתא דהא חצירו של אדם כו' הריטב"א עכ"ל. הרי דעת של הריטב"א שמריה דמעצרתא הי' יכול לזכות כו' אם היה חצר המשתמרת וצ"ל שסובר שאין התחלות קנית החצר אלא מעת שנתייאש והוה בהתיר' אתי לידי':
