<b>ואם אין לו וכו'. </b> עש"ך סקמ"ה ויש ט"ס וצ"ל אבל אם כפוהו על התשלומין ותיבת ולא ט"ס גם מש"כ בין שני חצאי לבנה ובקיבלו עלייהו או מומח' פטרי אפי' בכה"ג. נראה דט"ס הוא וצ"ל ובקיבלו עלייהו מומח' מיירי וכו' כצ"ל. או דקאי על טעות בדבר משנה דפטור במומחה אפי' לא קיבלו או בקיבלו ואינו מומח' להרי"ף והרמב"ם:
