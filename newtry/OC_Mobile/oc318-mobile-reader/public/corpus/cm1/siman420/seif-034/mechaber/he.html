<i data-commentator="Me'irat Einayim" data-order="41"></i><i data-commentator="Be'er HaGolah" data-label="ח" data-order="78"></i>המבייש את הערום או מי שהוא בבית המרחץ פטור נשבה בו הרוח והגביה בגדיו ונראה ערום ובא אחר והוסיף בהפשטתו חייב בבושת ומ"מ אין בושתו של זה מרובה כמו המבייש את שאינו ערום כלל וכן אם הגביה בגדיו לירד לנהר או שעלה מנהר וביישו חייב ומ"מ אינו כל כך בושת כמו שמבייש המלובש:
