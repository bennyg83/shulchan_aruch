<i data-commentator="Be'er HaGolah" data-label="ש" data-order="24"></i><i data-commentator="Be'er HaGolah" data-label="ת" data-order="25"></i><i data-commentator="Beur HaGra" data-order="16"></i><i data-commentator="Me'irat Einayim" data-order="11"></i><i data-commentator="Ba'er Hetev" data-order="3"></i>If one brings another person into a room, locks the door, and thereby prevents him from working, he pays only compensation for lost time. If the person was already inside the room and another merely locked him in so he could not leave, the loss is indirect and the actor is exempt under human law.
