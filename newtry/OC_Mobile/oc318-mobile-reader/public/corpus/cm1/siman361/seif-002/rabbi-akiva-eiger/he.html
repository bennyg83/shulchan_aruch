<small>[שו"ע]</small> <b>מהראשון או מהשני.</b> נ"ב ראובן ראה שנכנס שמעון לבית לוי וגנב חפץ ובא אותו חפץ ליד ראובן והחזירו לשמעון אין לוי יכול להוציא ממנו בדין כיון ששמעון אמר שבדין נטלו מבית לוי מחמת תביעה שיש לו עליו תשו' הרא"ש כלל סד:<br>עוד שם ראובן גנב ואחר שהגביהו סייעו שמעון להביא הגניבה לבית שמעון פטור ע"ש:
