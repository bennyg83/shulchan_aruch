<small>[ש"ך אות לב]</small> <b>ממון מיד הקבלן.</b> נ"ב כ' הריק"ש סי' קע"ו וז"ל ראובן ושמעון שותפים שקנו מלוי כסף בשותפות ואחר ימים טען ראובן שפרע הכסף ושמעון א"י מפרעון ולוי מכחישו ותובע משמעון דמי כסף ולפחות דמי חציו שהוא חלקו ישבע ראובן שפרע דמי הכסף ויפטור שמעון דאדעת' דהכי מכר הכסף שיפרענו כל הנמצא בחנות מהם עכ"ל:
