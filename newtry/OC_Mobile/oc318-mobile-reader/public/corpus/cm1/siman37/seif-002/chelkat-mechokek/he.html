<b>דאין קדושין תופסין בנפל</b>. והא דאמרי' בירושלמי דבת יום אחד מתקדש' היינו בידוע שכלו לו חדשיו או בשהה שלשים יום אחר הקידושין דאגלאי מילתא למפרע דלאו נפל הוא ונראה דאף בנפל ספק קידושין הוי ואם קידש אחותו ואח"כ קידש בת אחותו שניהם צריכין גט מספק ועיין לקמן סוף סי' מ' דגם בהוכר העובר מקודשת לדעת הרמב"ם:
