<b>למ"ד טובת הנאה וכו' </b> עיין תומים דהעליתי קרובים ודאי דיכולים להעיד בלי פקפוק אבל אם הגזבר גופיה יכול להעיד בזו יש לספק כמ"ש הש"ך דמ"מ הנאה יש לו דאינו ממון. ואם אמרו עדים דהקדיש וצוה שיתן מהצדקה חלק יפה לקרובים ודאי דהוי נוגע בממון ומ"מ מחלקינן דבורם והוי עדות לצדקה ולא לזה הריטב"א ועיין תומים:
