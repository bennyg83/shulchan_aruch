<b>ומעט יין לשתות</b>. ע' בר"ן שתמה על הרי"ף למה השמיט הא דאמרו בגמ' רגילה לשתות ב' כוסות בפני בעלה פוסקין לה שלא בפני בעלה כוס אחד ואם רגילה בפני בעלה בכוס א' אז שלא בפני בעלה אין נותנין לה כל עיקר כי היין מרגיל לתאוה וע"כ כ' הרמב"ם נותנין לה מעט יין ומזה משמע קצת דגם הרמב"ם מיירי באשה האוכלת בפני עצמה:
