<i data-commentator="Netivot HaMishpat, Hidushim" data-order="8"></i><i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i>החליף חמור בפרה וטלה ומשך את הפרה ולא משך את הטלה לא קנה מפני שאין כאן משיכ' גמורה <i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i><i data-commentator="Pithei Teshuva" data-order="2"></i><i data-commentator="Beur HaGra" data-order="13"></i>וי"א דדוקא בכהאי גוונא משום שאין החמור ראוי ליחלק אבל אם אמר פרה וטלה בכור חטים ומשך הפר' ולא משך הטל' <i data-commentator="Netivot HaMishpat, Beurim" data-order="4"></i>קנה בחטי' כנגד דמי הפר' <i data-commentator="Beur HaGra" data-order="14"></i><small>(וי"א דאם ראובן <i data-commentator="Netivot HaMishpat, Hidushim" data-order="9"></i><i data-commentator="Netivot HaMishpat, Beurim" data-order="5"></i>החליף עם שמעון ולוי ונתבטל אצל אחד בטל ג"כ נגד השני) (ת"ה סי' שי"א)</small>:
