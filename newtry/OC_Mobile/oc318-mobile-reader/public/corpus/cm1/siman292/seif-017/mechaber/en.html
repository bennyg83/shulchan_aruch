<i data-commentator="Be'er HaGolah" data-label="ג" data-order="49"></i><i data-commentator="Me'irat Einayim" data-order="39"></i><i data-commentator="Pithei Teshuva" data-order="8"></i>One entrusted with chametz who reaches Pesach must not touch it until the fifth hour on the fourteenth of Nisan. From then onward he goes out and sells it immediately in the market, in order to prevent loss to the owner.
