<b>(ואם עשוי לשכר)</b> פי' דכיון דשקיל שלא ברשות בעלים ה"ל עכ"פ גזלן מ"ה הברירה ביד הבעלים אם לוקח ממנו כדין גזלן דהיינו הפחת או ליקח ממנו כאשר נתרצה הוא בשעת התקיפה אא"כ דנחית בהדיא בתורת גזל אז אינה אלא גזלן לחוד וכ"נ מדברי רבינו ורמב"ם שפי' דמיירי מי שלקחה שלא מדעת אבל רש"י פ' דמיירי שלקחה בע"כ:
