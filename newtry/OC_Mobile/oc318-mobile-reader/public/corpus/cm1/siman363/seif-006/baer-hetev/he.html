<b>שכרו. </b> אפילו בחצר דלא קיימא לאגרא וגברא דלא עביד למיגר כיון דגילה דעתו דלא ניחא ליה ביה ואין אומרים בכה"ג כופין על מדת סדום כך כתב הסמ"ע ועיין בתשובת רשד"ם סי' תמ"ו ותס"ד ובתשובת מהר"א ששון סי' קכ"ט:<br>
<b>אינו. </b> דמסתמא נוח לו שידורו בו דביתא מיתבא יתיב ושאיה יוכת שער כן הוא בש"ס. סמ"ע:
