<small>[Be’er HaGolah, letter tav]</small> <b>See below, siman 306, seif 5.</b> Note: In my opinion, it is clear from the words of the Rashba in his novellae to Bava Kamma 33, s.v. makhur leridya, that he agrees with the Beit Yosef. The opinion of Rabbi Menachem Meiri in the Shitah Mekubetzet there is likewise clear.
