<b>ואעפ"י שהחזירו </b> עיין מ"ש רמ"א בסי' זה ס"ס כ"ט דוקא בהחזיר ע"י כפיית ב"ד או שהוא מוחזק לגנבא:<br>
<b>החולק עם גנב וכו' </b> עיין תומים שהעליתי דין זה בצ"ע ועל כל פנים איירי שהוציא הגזלה מתחת ידו ואעפ"י שהיה בכפי' ב"ד מ"מ הא אין גניבה תחת ידו אבל אם עדיין גניבת ישראל בידו ואין מחזירו פשיטא דהוי רשע דחמס ע"ש:
