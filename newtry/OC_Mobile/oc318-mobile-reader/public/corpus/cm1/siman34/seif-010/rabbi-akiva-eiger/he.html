<small>[שו"ע]</small> <b>גנב וכן גזלן.</b> נ"ב גונב ממון נכרי כ' הרדב"ז סי' רנ"ח דפסול מה"ת ול"נ להכשיר דלא משמע לאינשי דאסור וכן ראוי לדון עכ"ל מהריק"ש. מלשון זה משמע דהרדב"ז ס"ל שפסול לעדות ומהריק"ש חולק עליו. אבל באמת הרדב"ז סי' כ"ח כ' דגניבתן נכרי אסור מדאורייתא ומ"מ יש להכשיר דלאו משמע לאינשי דגניבת נכרי אסור:
