<b>ואפי' מחל. </b> כנ"ל בס"ז: <br> <b> (ליקוט) ואפי' כו' </b> כמש"ש בההוא טבחא ושם ב' מאימתי חזרתן כו' וכמ"ש בסכ"ט (ע"כ): <br> <b> (ליקוט) ואפי' מחל כו' </b> מומר כו'. עסכ"ט כל מי כו' אבל כו' ועש"ך דלא כסמ"ע (ע"כ):<br>
<b>מומר שחזר. </b> מדאמרי' ספ"ז דבכורות כהן שנושא נשים בעבירה פסול כו' נודר ועובד כו':
