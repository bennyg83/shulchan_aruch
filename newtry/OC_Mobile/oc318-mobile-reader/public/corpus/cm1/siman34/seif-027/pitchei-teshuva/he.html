<b> דיין שדן כבר כו'. </b> כן משמע מאשירי כו'. עי' בס' פלפלא חריפתא מהגאון בעל תוי"ט שם אות כ"א שכ' עוד דבר גדול נשמע מדברי הרא"ש שם דשוחד אסור אף בדבר שאינו דין תורה אלא דרך קנס בעלמא כו' וכתבתי זה להורות לנאמנים על הצבור אע"פ שאין דיניהם דין תורה ולא נתקבלו לכך אפ"ה יזהרו מלקבל מתנות על דיניהם עכ"ל:
