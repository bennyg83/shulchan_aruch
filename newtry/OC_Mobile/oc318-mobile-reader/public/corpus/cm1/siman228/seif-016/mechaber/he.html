<i data-commentator="Be'er HaGolah" data-label="ת" data-order="45"></i>התגר נוטל מחמש גרנות ונותן למקום אחד או מחמש גיתות ונותן לתוך חבית אחד שהכל יודעים שלא גדלו כולם בשלו ובחזקת זה קונים ממנו ובלבד שלא יכוין לקנות הרוב ממקום הטוב כדי שיצא עליו קול שהוא קונה הכל ממקום הטוב וגם קונה ממקום הרע ומערבו עמו:
