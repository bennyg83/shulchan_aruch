<b> ואח"כ נמצא שהפקדון. </b> בזה הרשות ביד המפקיד להחזיר דהשומא בטעות הי' אבל אין ביד הנפקד להחזיר:<br>
<b> או שנאבד. </b> בזה שניהם יכולין לחזור דהא לא ידע ממנו שנאבד וגם יש הפרש דבבא ראשונ' אין צריך להחזיר הפירות שאכל דל"ה מחיל' בטעות ובבא שניה מחיל' בטעות הוא וצריך להחזיר הפירות שאכל וע"ב חלוקי דינים:
