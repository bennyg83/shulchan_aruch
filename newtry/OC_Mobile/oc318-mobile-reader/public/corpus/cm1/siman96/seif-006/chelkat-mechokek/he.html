<b>ורימזה קודם מיתתה</b>. בתשובת הרשב"א כתב אם היא מושבעת מפי אחרים בשבועה האלה כל שאינה יכולה לישבע ולענות אמן כזו משביעין אותה ונוטלת וכו' והלכך אפשר לומר דשבועת האלה סגי כל שא"א אלא בהכי א"כ צריך לפרש מ"ש ורימזה קודם מיתתה שלא נטלה כלום היינו שהשביעוה בשבועות האלה וע"ז רימזה ורמיזתה הוי כאלו אמר' אמן:
