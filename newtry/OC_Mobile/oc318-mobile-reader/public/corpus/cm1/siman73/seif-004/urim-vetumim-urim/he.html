<b>אבל אם היתה מלוה בשטר וכו' </b> אם הוא תוך למ"ד יום והמלוה אומר שהתנה עמו שלא יהיה לו זמן הואיל ולא נזכר בשטר וסתם הלואה ל' יום נשבע הלוה ונפטר עד סוף ל' יום ש"ך:<br>
<b>היסת </b> ובש"ך דעתו דבמשכון הואיל ולא לגופו של המשכון קטען צריך לישבע בנק"ח ועיין תומים שכתבתי שיש לדחות דאין דררא דממון ברור כ"כ וצ"ע:
