<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i><i data-commentator="Beur HaGra" data-order="11"></i><i data-commentator="Me'irat Einayim" data-order="8"></i><i data-commentator="Netivot HaMishpat, Beurim" data-order="2"></i><i data-commentator="Beur HaGra" data-order="12"></i><i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i><i data-commentator="Ba'er Hetev" data-order="7"></i><i data-commentator="Pithei Teshuva" data-order="5"></i><i data-commentator="Netivot HaMishpat, Hidushim" data-order="5"></i>A teacher may not hire himself to a householder who already employs another teacher in his home, unless the householder says that he does not wish to retain his present teacher. If, however, one householder has hired a teacher, another householder may hire that same teacher for separate work.
