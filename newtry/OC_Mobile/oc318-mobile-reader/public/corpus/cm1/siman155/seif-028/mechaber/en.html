<i data-commentator="Beur HaGra" data-order="84"></i><i data-commentator="Be'er HaGolah" data-label="ט" data-order="78"></i><i data-commentator="Me'irat Einayim" data-order="66"></i><i data-commentator="Netivot HaMishpat, Hidushim" data-order="51"></i>If Reuven has a fig tree whose crown, meaning the portion of the tree above the ground, extends over Levi's upper story and prevents him from plastering his roof, Levi may cut away the portion that obstructs him.
