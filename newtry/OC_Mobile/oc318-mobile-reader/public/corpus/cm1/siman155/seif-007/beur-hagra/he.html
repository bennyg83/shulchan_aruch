<b> (ליקוט) כדי כו'. </b> דל"ג שם אלא ולא הדר מטעמא קמא ג"כ וכמש"ש י"ח א' ועתוס' שם ד"ה דטירייא כו' (ע"כ):<br>
<b>וכ"ז ברחיים. </b> עתוס' שם ד"ה ושל חמור בו' פיר"ח כו':<br>
<b>צריך כו' ואם לא כו' וכן בשאר כו'. </b> כמ"ש ואם הזיק משלם מה שהזיק ואמרו כדנייד נכתמא אפומא כו' ובגורן שאינו קבוע בכדי שלא יזיק:
