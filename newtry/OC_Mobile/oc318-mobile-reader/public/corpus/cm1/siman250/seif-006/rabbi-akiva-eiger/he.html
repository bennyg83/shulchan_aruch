<small>[ש"ך אות א]</small> <b>לעיל סס"י קכ"ה.</b> נ"ב שם מבואר דדוקא בעמד. אבל בלא עמד א"י לחזור וא"כ ממילא דברי הרשב"א כפשטן דההיא דשכ"מ שהקדישו מיירי שמסר ליד ההקדש וכיון דלא עמד א"י לחזור וצ"ע ומ"ש הש"ך בכוונת הרשב"א שמסרה שהי' המתנה מהיום קשה א"כ בלא מסר ג"כ א"י לחזור כיון דאמר מהיום הוי כמתנת בריא כדלקמן ס"ט:
