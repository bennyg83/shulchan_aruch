<small>[שו"ע]</small> <b>ואם ניצל ועמד.</b> נ"ב ובמפרש בים ויצא בשיירא צריך שישוב אל עירו ואל ארצו או שיקבע דירה במקום ידוע מהריק"ש. וע' תשובת משאת משה סי' ח' כתב בשם תשובת רש"ך דביוצא בשיירא בעי' דוקא שמת בדרך אבל בבא לעיר שיצא לשם ואח"כ מת בטל המתנה גם כ' שם דוקא כשנתן בשעת שיצא לשיירא. אבל לא בנותן איזה ימי' מקודם:
