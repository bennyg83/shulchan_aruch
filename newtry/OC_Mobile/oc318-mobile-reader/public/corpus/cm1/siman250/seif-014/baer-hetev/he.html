<b>לחזור. </b> הטעם דאנן סהדי דלא נתן אלא בסברו שימות בודאי ואם ידע שלא ימות לא היה נותנו כ"כ הסמ"ע ועיין בתשו' ר"מ אלשיך סי' ק"מ ובתשו' ר"י לבית לוי סי' כ"ד:<br>
