<b> דבל' העולם עד ולא עד בכלל </b> צ"ע דבד"מ דחה דין תשובה זו וס"ל דלא אמרינן בשובר עד ולא עד בכלל וכאן פסקו המחבר להלכה ומור"ם לא השיג עליו ועיין בהגד"מ שם כתבתי ישוב אשני תשובות הרא"ש שכ' מור"ם שם דסתרן אהדדי ונרא' שכן הי' דעת המחבר דלא סתרי אהדדי ומשום הכי הביא הב"י שניהן וגם כאן בש"ע שפסקו להלכה ודוק:
