<b>דאקני. </b> ז"ל הסמ"ע מקור דין כתיבת דאקנה יתבאר לקמן סי' ק"ד וקי"ב ע"ש דנתבאר דאנן קי"ל גם בדאקנה שהוא ט"ס אם לא שכתוב שאר האחריות ולא כתוב אחריות דאקנה ע"ש עכ"ל:<br>
<b>ואיחרנוהו. </b> דאז ליכא למיחש דאף אם לוה ואח"כ קנה לא יבא לגבות מזה שקנה ומכר דהמע"ה ומזמן השטר אינו ראי' שהרי כתוב בו שהזמן מאוחר. סמ"ע:
