<b>כתוב באותו יום עצמו </b> עובדא בתשובת הרא"ש היה ראובן הוציא שטר נכתב בה' בניסן ששמעון חייב לו מנה ושמעון הוציא שובר נכתב בה' הנ"ל כתוב בי' שראובן מחל לו כל תביעות ממון שהיו לו עליו עד היום הזה. ופסק הרא"ש אף על גב דלא שכיח דאדם פורע ביומו מכל מקום זימנין דפרע והרי שובר מעיד כראינו שפרע ע"ש ברא"ש וסמ"ע:
