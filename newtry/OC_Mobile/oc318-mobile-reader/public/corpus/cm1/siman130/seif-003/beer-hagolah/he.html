שם ס"ג כ"כ בה"ת בשער ל"ה וכ"כ הרמב"ם בפכ"ו מהל' מלוה ד"ז וכ' ה"ה זה מוסכם מן המפרשי' ז"ל וזו היא פשטא של ברייתא ערב שהיא יוצא ש"ט מתחת ידו אינו גובה (ב"ב דף קע"ד ע"ב) אף ע"פ שהיא מתפרשת ביתומים וסיים הרמב"ם שם שמא נפל השטר מיד המלו' ולא פרע זה כלום וכ"כ הטור ועוד טעמים אחרים<br>
שם וסוף הברייתא שם.
