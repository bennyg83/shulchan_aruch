<small>[שו"ע]</small> <b>חייב בנזקיו.</b> נ"ב וכן לענין תוס' צריך לשלם לו. וזה אף בפחות מזה השיעור כמו בסעיף ה' כ"כ הב"ח ועיין בב"י בשם הרמב"ן שתמה וכי שומר הוא על גופו שיתחייב לו. ואי בשוכר עבד מחבירו אף הוא פטור מפשיעה ואי מדין מזיק הא לאו מכחו אתי' לו נזקו אפי' הטעינו הוא עכ"ל. ועיין שיטה מקובצת בשם הריטב"א:
