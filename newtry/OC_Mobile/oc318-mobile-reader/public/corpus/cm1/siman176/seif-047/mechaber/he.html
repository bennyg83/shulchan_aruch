<i data-commentator="Beur HaGra" data-order="144"></i><i data-commentator="Be'er HaGolah" data-label="ע" data-order="108"></i>ראובן ושמעון <i data-commentator="Netivot HaMishpat, Hidushim" data-order="82"></i>ששר אחד חייב להם ממון ושמעון קבל הערבות בלא ראובן ושמעון הלך תחת אותו שר ואינו רשאי לתבוע חובו וראובן מזהירו לגבות החוב <i data-commentator="Be'er HaGolah" data-label="פ" data-order="109"></i>אין שמעון חייב להקניט השר שלו כדי לגבות חובו של ראובן <i data-commentator="Beur HaGra" data-order="145"></i>אך אם הוא פטור ממס בעבור אותו חוב אומדים כמה מס היה לו ליתן לשנה ויתן לראובן כפי חלק שיש לו באותו חוב:
