<b>לזה. </b> ע"ל סי' ע"ז שנתבאר דין זה וע"ל סי' ל"ו ס"ד:<br>
<b>הודה. </b> פירוש כאילו הודה לחבירו וצריך לשלם גם לחבירו וכן אם הלך לו אחר שפרע לאחד המחצה אותו האחד צריך לחלוק קבלתו עם השני דידו כיד חבירו דמי ומה שקיבל בשביל שניהם קיבל וע"ל סי' ע"ז ס"ו ואפשר דהתם מיירי שנתפשר עם האחד ופשרה שאני. סמ"ע:
