<b>(סעיף י"ח ולא עשה כלום)</b> בב"י כתב על דברי רבינו ול"נ דהיינו נתן לקנות חיטין וקנה שעורים וכו' נראה דלא דמי דגבי חטין ושעירין אין כאן הוכח' שטעם בדין דאפשר שסבר אם ירצה להשתתף בשעורין טוב ואם לא אקח לעצמי משא"כ כאן שהניח חצי המעות בלא עסק אין זה רק שטעה לומר שהחלוק' כדין ודברי הסמ"ע אינו נכון כלל:
