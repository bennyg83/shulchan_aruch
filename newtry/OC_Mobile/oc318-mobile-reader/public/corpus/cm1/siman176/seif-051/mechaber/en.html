<i data-commentator="Beur HaGra" data-order="153"></i><i data-commentator="Be'er HaGolah" data-label="א" data-order="116"></i><i data-commentator="Be'er HaGolah" data-label="ב" data-order="117"></i><i data-commentator="Beur HaGra" data-order="154"></i><i data-commentator="Me'irat Einayim" data-order="92"></i><i data-commentator="Siftei Kohen" data-order="58"></i><i data-commentator="Netivot HaMishpat, Hidushim" data-order="87"></i><i data-commentator="Ba'er Hetev" data-order="86"></i><i data-commentator="Be'er HaGolah" data-label="ג" data-order="118"></i>It is forbidden to enter a partnership with a non-Jew. If one nevertheless did so and the non-Jew became entitled to require an oath from him, he may accept the oath. <small>Rama: See Orach Chaim, siman 156, and Yoreh De'ah, siman 147.</small>
