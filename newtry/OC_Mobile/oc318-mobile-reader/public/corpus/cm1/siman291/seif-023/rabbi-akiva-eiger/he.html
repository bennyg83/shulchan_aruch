<small>[ש"ך אות מו]</small> <b>שהרי כתב ה"ז פשע.</b> נ"ב אין זה דקדוק כ"כ דהרי כתב הרמב"ם והוא לשון הש"ע לעיל ס' כ"א ואצ"ל אם מסרם לאחר הרי זה פושע. והתם ע"כ דפושע דאי"ל. א"כ ה"נ י"ל כן. אולם תמה שכתב הרמב"ם אח"כ אע"פ ששאל אם שכר בבעלים וכו' עיי"ש ובכ"מ מזה יש לדייק דהוי פשיעה גמורה. ועיין בהה"מ ודו"ק:
