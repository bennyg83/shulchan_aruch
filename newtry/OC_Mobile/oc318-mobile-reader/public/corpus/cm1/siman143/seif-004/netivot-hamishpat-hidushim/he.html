<b> רטושים </b> בטור הוסיף ג"כ ולא בנכסי נטושים ונטושים היינו מי שנטש נכסיו בע"כ ע"ש הקרא והשביעית תשמטנה ונטשתה קרי לאפקעתא דמלכא נטישה והיינו שנטש נכסיו מחמת נפשות דוקא דמחמת ממון הוי חזקה ורטוש היינו שהלך מדעתו ואין אני יודעים להיכן הלך וחיישינן שמא הוא במקום שאין השיירות מצויות ולכך לא הוי חזקה:
