<i data-commentator="Be'er HaGolah" data-label="ל" data-order="13"></i><i data-commentator="Beur HaGra" data-order="6"></i><i data-commentator="Me'irat Einayim" data-order="9"></i><i data-commentator="Me'irat Einayim" data-order="10"></i><i data-commentator="Me'irat Einayim" data-order="11"></i><i data-commentator="Be'er HaGolah" data-label="מ" data-order="14"></i><i data-commentator="Ba'er Hetev" data-order="3"></i>It is a Torah commandment to unload with the owner without payment, as with returning lost property. Loading is also a commandment, but one may take payment. Likewise, one who accompanies the animal with its owner for up to a parsah is entitled to payment.
