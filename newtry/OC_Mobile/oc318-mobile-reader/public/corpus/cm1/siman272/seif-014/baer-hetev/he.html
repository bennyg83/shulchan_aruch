<b>קרובה. </b> כן הגירסא בש"ס ובפוסקים ונרא' דר"ל אחת קרובה לנטות וכמעט שתחזור לאחוריה תמצא חברתה מקום לעבור בצדה מש"ה מעבירין ודוחין הקרוב' ולא האחרת ובטור כת' תדחה שאינה קרוב' כו' וכ"כ לפרש"י שפירש קרובה לעיר. שם:<br>
<b>בצדק. </b> ר"ל מדכתיב צדק צדק תרדוף וכתיב בצדק תשפוט ודרשינן אחד לדין ואחד לפשרה. שם:
