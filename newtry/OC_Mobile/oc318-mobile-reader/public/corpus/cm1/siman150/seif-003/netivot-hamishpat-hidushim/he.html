<b> י"א שאין לו בה חזקה לעולם </b> ולא דמי לבן אומן ואריס וגר שנתגייר וכיוצא בהם דיש להם חזקה דבהנך כיון שהחזיק ג"ש אחר שנשתנה שמם ועניינם ה"ל למחות ומדלא מיחה הוי חזקה וע"ב [שם]:<br>
<b> אין לו חזקה </b> בזה כ"ע מודים [ש"ך שם]:<br>
<b> שמשכנה אצלו סתם </b> ומכ"ש כשידוע שעברו ג' שנים אחר שני המשכונא [סמ"ע]:
