<small>[ש"ך אות ג]</small> <b>ומ"ש הקרקע היא בחזקת בעליו הוא לאו דוקא.</b> נ"ב ואנן זכינו לאור הבהיר שט"מ לב"ב הובא שם לשון רבינו יונה. ומבואר שם דמחלק בין קרקע למטלטלי' דבמטלטלי' יכול לעכבם בתורת משכון עד שישלמו לו במגו דהי' מעכבם בטענת לקוח אבל בקרקע דבחזקת בעלים היא אין בה תפיסה בתורת משכון ע"ש:
