He said, “I ask him.” In addition to:<br>
<b>And some say, etc.</b> Rosh cites Masechet Semachot in the first chapter of Makkot, and the Shulchan Aruch rules likewise in Yoreh De'ah 340. The Tosefta's reference to his house of mourning and wedding feast follows Rabbi, contrary to Sema. See siman 340.
