<small>[Shulchan Aruch]</small> <b>The two documents are both deeds of sale.</b> Note: If two sets of witnesses testify orally in a parallel case, where one set testifies that he gave him the field in Nisan and another set later testifies that he gave it to him in Iyar, see Ketzos HaChoshen, siman 30, subparagraph 5.
