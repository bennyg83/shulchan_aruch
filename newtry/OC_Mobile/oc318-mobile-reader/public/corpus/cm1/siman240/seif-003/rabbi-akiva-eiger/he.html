<small>[סמ"ע אות ח]</small> <b>מזמן הא' הן פסולי'.</b> נ"ב וחתימי' בו אותן עדים. והיינו מטעם דמספקא לן אי קיי"ל כרפרם או כר"א ומוקמי' השטר בחזקתו כ"כ הפרישה. ועיין בהר"ן שכתב בשניה' במתנה גם ר"א מודה דאמרי' אודויי אודי לי' דבמתנה ל"ש אחולי. א"כ בכה"ג כל שטרות שלו פסולים אבל בתוספ' כתב דגם במתנה שייך אחולי:
