<i data-commentator="Beur HaGra" data-order="31"></i><i data-commentator="Be'er HaGolah" data-label="ז" data-order="36"></i><i data-commentator="Me'irat Einayim" data-order="35"></i><i data-commentator="Me'irat Einayim" data-order="36"></i><i data-commentator="Siftei Kohen" data-order="8"></i><i data-commentator="Netivot HaMishpat, Hidushim" data-order="25"></i><i data-commentator="Be'er HaGolah" data-label="ח" data-order="37"></i><i data-commentator="Beur HaGra" data-order="32"></i><i data-commentator="Ba'er Hetev" data-order="20"></i>This applies to a guarded courtyard. In an unguarded courtyard, such as one's field or ruin, the owner acquires only when standing beside it and saying, "My field has acquired it for me." <small>Rama: Some disagree, as explained in siman 200.</small>
