<b>והוזמו כו' </b> דווקא הוזמו דגזרת הכתוב הוא הואיל והוא בגופן של עדות דיהיו אחרוני' נאמנים יותר מראשונים אבל הכחשה שאינו בגוף עדות אין לחייב לעדים ממון דיאמרו אמת העדנו דמה חזית דסמכת אהני וכו' וכן אם עדיין לא הוציא ממון בעדותם קנס הוא ואין דנין בזה"ז אבל בשכבר גרמו היזק חייבי' מתורת דין גרמי סמ"ע:
