["<b> לכתוב אחר כו' </b> ואפי' העדים עצמן יכולין לכתוב לו ואין צריך ב\"ד וכמש\"ל סי' מ\"א ס\"ג:"]<br>
["<b> וג' שטרות כו' </b> ומ\"מ אין לאפושי שטרי בחנם דזילי נכסיה כמ\"ש הרא\"ש בתשובה מביאו ב\"י לעיל סי' מ\"א ע\"ש וכתבו הרב בהג\"ה לעיל סי' מ\"א ס\"ג ע\"ש:"]<br>
["<b> ולא מזמן שני כו'. </b> ה\"ה מזמן שני כשכותבין בו אחרנוהו:"]
