["<b> אם תפס וכו'. </b> ע\"ל סי' ר\"ן ס\"ג בהג\"ה וסי' ש\"ן [ש\"ץ] ס\"ב וז' בהג\"ה ועמש\"ל סי' כ\"ה:"]
