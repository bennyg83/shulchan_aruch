<b>תפס. </b> דכיון דטען על שניהן שנגחוהו וגם המזיק מודה בזה אף שאין לו עדים איזה נגח לזה ואיזה לזה מהני תפיסתו לכ"ע וכן הוא בש"ס. סמ"ע:<br>
<b>דבריו. </b> כיון שתפס בעדים. ואם תפס שלא בעדים נוטל כפי דבריו כ"כ הטור ומשמע דהיינו משום דמהימן במיגו אף בקנס וכן משמע בהרא"ש ס"פ המניח וכמ"ש בסי' שצ"ט ס"ג וע"ש. שם:
