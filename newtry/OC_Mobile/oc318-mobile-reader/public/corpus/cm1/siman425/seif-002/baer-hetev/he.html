<b>עולם. </b> הוצרך לכתוב זה של"ת הולד הרי הוא רודף ויצילו את אמו בנפשו קמ"ל כיון שטבע של עולם בכך אין דין רודף עליו ומכל מקום בעודו במעיה מותר לחתכו אע"פ שהוא חי שכל שלא יצא לאויר העולם אין שם נפש עליו והראיה מנגף אשה ויצאו ילדיה ומתו משלם דמי הולדות ואין שם רוצח ומיתה עליו וכמו שכתוב בסי' תכ"ג. שם:
