<b>וע"ל. </b> נראה פשוט דאפילו החולקים שם היינו משום דהתם איירי בשטר הודאה שבא לפני ב"ד כתוב בו נתתי לפלוני דאמרינן שכבר נתנו לו באופן המועיל דהיינו שזיכה לו ע"י אחר וכמ"ש הטור שם ואין אנו מצוים לחקור באיך ובמה נתנה לו משא"כ הכא דמיירי בידוע שהקנה לו אג"ק ומטלטלים אינן נקנין אג"ק אא"כ היו אז ברשותו. סמ"ע:
