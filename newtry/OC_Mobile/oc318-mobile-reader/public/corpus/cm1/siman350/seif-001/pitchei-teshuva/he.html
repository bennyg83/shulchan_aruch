<b> דמי חלבו. </b> עבה"ט עד ובדין טובת הנאה אינה ממין ועיין בפנים בש"ן עד ועוד דהיכן מצינו לרבא דטובת הנאה אינה ממון כו' ובספר דגמ"ר כתב עליו עיין במס' ב"מ דף יא ע"ב מצינו לרבא בהדיא דטובת הנאה אינה ממון (וכ"כ בקצה"ח ע"ש) ועיין ברמב"ם הלכות מעשר שני פי"א הלכה י"א ובמל"מ שם ועיין לעיל סי' ר"ג בש"ך פק"א:
