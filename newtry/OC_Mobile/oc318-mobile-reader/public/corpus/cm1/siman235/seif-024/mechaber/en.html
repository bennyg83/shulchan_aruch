<i data-commentator="Netivot HaMishpat, Beurim" data-order="21"></i><i data-commentator="Beur HaGra" data-order="66"></i><i data-commentator="Be'er HaGolah" data-label="ר" data-order="67"></i><i data-commentator="Me'irat Einayim" data-order="53"></i><i data-commentator="Beur HaGra" data-order="67"></i><i data-commentator="Me'irat Einayim" data-order="54"></i>When a slave buys, sells, gives a gift, or receives a gift, the master has the superior right. If the master wishes to ratify the transaction, it stands; if not, all the slave's acts are void. The master may ratify or void them by words alone and need not perform any acquisition from the slave.
