<b>שאנסוהו להראות כו'. </b> פי' אף שנשא ונתן אח"כ ביד (וכדמסיק) דאז חייב לשלם אפ"ה אינו נקרא רשע כו' א"נ ה"ק ל"מ אם לא אנסוהו אלא להראות והראהו ולא נשא ונתן ביד דאינו נקרא רשע דהרי בכה"ג אפי' בר תשלומין ליכא אלא אפי' אנסוהו להביא והוצרך לישא וליתן באונס אף דבר תשלומין הוא כנ"ל אפ"ה אינו נקרא רשע כו':
