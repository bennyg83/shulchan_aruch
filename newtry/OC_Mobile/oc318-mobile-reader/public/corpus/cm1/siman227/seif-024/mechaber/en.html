<i data-commentator="Beur HaGra" data-order="34"></i><i data-commentator="Be'er HaGolah" data-label="א" data-order="48"></i><i data-commentator="Be'er HaGolah" data-label="ב" data-order="49"></i><i data-commentator="Pithei Teshuva" data-order="17"></i><i data-commentator="Beur HaGra" data-order="35"></i>The rule that one who sells a utensil used personally by him and overcharges the purchaser is not subject to the laws of overcharge applies only where the overcharge is exactly one-sixth. If it exceeds one-sixth, he is governed like any other seller. Some disagree.
