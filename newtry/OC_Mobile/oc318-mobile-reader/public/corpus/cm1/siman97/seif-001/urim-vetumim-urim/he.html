<b>מצות עשה </b> עיין תומים מ"ש טעם למה אין מברכין על מצות מתנות לאביונים והלוואת דלים ע"ש:<br>
<b>והוא מצוה גדולה וכו' </b> כי צדקה כבר נצטרך לשאול ולא מתבייש כלל אבל זה שעדיין לא הגיע לידי כך יותר מצוה בו:<br>
