<small>[Rama]</small> <b>And once he performed meshichah.</b> Note: If he stipulated that the consideration would be a kor of wheat, once he performs meshichah on the item he must give the wheat at the agreed valuation. Nimukei Yosef, chapter 4 of Bava Metzia, page 88, end of side 2. See below, siman 335, seif 4, Rama.
