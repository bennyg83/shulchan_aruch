<b>דשכירות מטלטלין כו'. </b> דכיון דהגוף שלו פי' אם ראובן השכיר דבר מטלטל לשמעון ושמעון נתן לראובן דמי השכירות ועדיין לא משכו לרשותו אין א' יכול לחזור בהשכירות דלא שייך כאן חשש חכמים שראובן לא יציל הטלטול מהדליקה מפני שיאמר לשמעון עליך להציל שהרי אין לשמעון בו אלא תשמיש מעט זמן מה והגוף נשאר על ראובן:
