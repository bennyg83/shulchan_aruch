<b>שתלוה לו מעות</b>. בגוף התשובה קאי המעשה באומר לה הלויני דינר על משכון זה ודמי קצת לאמר בתחלה כנסי סלע זו שאני חייב ליכי אלא שחילק שם בתשובה ביניהם אבל אם אמר הלויני על המשכון סתם ואחר כך נתן לה משכון לשם קדושין אפשר דאין כאן ספק דאפשר דיתן לה משכון אחר לבטחון הלואה ולא ידעתי למה שינה ודילג תיבת זה:
