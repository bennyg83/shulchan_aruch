<b>(סכ"ט אלא בשכן חבירו)</b> ב"י כתב דמשמע מזה דגם דיר' בעינן ולא סגי רגילות במשא ומתן לחוד וסמ"ע כתב אפי' אין דר אצלו קרי לו שכן ששוכן אצלו במשא ומתן ונראין לדברי ב"י דאל"כ הרי זה בכלל של לבו גס בו שמוזכר בתחלת הסעיף אלא ע"כ דכאן אין רגיל כ"כ הרבה אלא קצת ואז מועיל ג"כ בדירה אצלו שעושה ג"כ קירוב הדעת:
