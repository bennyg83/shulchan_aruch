<small>[Shulchan Aruch]</small> <b>He has said nothing.</b> Note: If that person already resides in the donor's house and the donor says that he should reside there for twenty years, Rashdam, siman 323, holds that it is effective. Rashach, part 1, siman 177, disagrees, as does Responsa Mahari Adrabi, siman 135.
