<small>[שו"ע]</small> <b>אחד מהם ת"ח ת"ח קודם.</b> נ"ב אם אמר דרך מתנה נכסי לקרובי י"ל דג"כ ליתן לקרוביו ת"ח אף שיש אחר לו שקרוב לו טפי כ"כ הרמב"ן בחי' בב"י דל"ג. ועיין נ"י פרק מי שמת בשם הריטב"א באומר נכסיי לקרובותי יש בכלל כל הקרובים הפסולים לו לעדות. והובא בב"י לעיל סס"י רמ"ו ועיין קצות החושן שם:
