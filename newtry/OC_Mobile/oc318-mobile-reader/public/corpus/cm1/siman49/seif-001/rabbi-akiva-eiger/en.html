<small>[Shulchan Aruch]</small> <b>Even a woman or a relative is valid.</b> Note: This is so even if they made the statement at the time of the event. So writes the Bach, Even HaEzer, beginning of siman 157. See Responsa HaRanach, part 1, siman 89, and Ezrat Nashim on Even HaEzer, siman 17, seif katan 25, page 12b.
