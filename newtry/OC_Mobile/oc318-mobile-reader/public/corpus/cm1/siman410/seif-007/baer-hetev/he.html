<b>רבים. </b> הרמ"ה כת' דאי חפר מעיקרא לצורך עצמו והדר מימלך למימסריה לרבים לא נפטר החופר עד דטמים ליה וכת' עליו הטור ז"ל ואינו נראה כיון דמסרה עתה לרבים והן צריכין לו מאי נ"מ שחפרו מתחלה לצרכו עכ"ל. שם:<br>
<b>רשות. </b> דגם לצורך רבים אינו רשאי לחפור בר"ה במקום שהוא מכביד לרבים וכדומה לו שמזיק להן. שם:
