<b>פטור. </b> דאיהו גרם ההפסד לנפשו בחפירתו:<br>
<b>מיורשי. </b> ר"ל ל"מ אם הוא חי דצריך לשלם לבעל השור אלא אפילו מת הכורה צריכין בניו היורשים לשלם לבעל השור היזקו ואע"ג דמלוה ע"פ של אביהן אינן נפרעין מיורשיו אחרי מותו שאני הכא כיון דאביהן עכשיו מת בשעה שנפל שם השור בודאי לא פרע עדיין דמי השור. סמ"ע:
