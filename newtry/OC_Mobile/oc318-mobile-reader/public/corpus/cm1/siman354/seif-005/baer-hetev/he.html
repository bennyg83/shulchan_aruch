<b>השברים. </b> אע"ג דבנזקין אמרינן כן כמ"ש הטור והמחבר בסי' שפ"ז התם ה"ט דכתי' והמת יהי' לו וקי"ל כמ"ד לו לניזק אבל בגנב כתי' חיים שנים ישלם וע"ל ס"ס שס"ב. סמ"ע:<br>
<b>ודוקא. </b> עי' בהגהת הש"ך שכת' דדברי הרמ"א קשה להולמן ע"ש מה שביאר בזה:<br>
<b>רצו. </b> עי' בסמ"ע מ"ש בשם הה"מ. ומהרש"ל פ"ק דב"ק סי' כ"ט דחה זה ע"ש וצ"ע. ש"ך:
