<small>[Shulchan Aruch]</small> <b>And not the owners.</b> Note: See Shitah Mekubetzes, Bava Kamma 33, s.v. "VeLeRabbi Akiva," who cites the Meiri that this applies specifically where the owner did not later recover the property. If he later recovered it through beit din, it becomes consecrated. This requires study.
