<b>ואז יהי' מכרה ומתנת' קיים</b>. דעת המ"מ בפ' כ"ג מה"א דקנין בנשואה מהני אף לפירות דלא יהא כח הבעל גדול בנכסי אשתו מכח השותף בחלקו (דהאומר לחבירו אין לי דין ודברים על שדה זו שאם קנו מידו קנה חבירו) אבל דעת הטור דבשותף ל"ש לחלק בין גוף לפירות אבל באשה די שיועיל הקנין אם מכרה ונתנה קיים וע' בכ"מ ובב"ח:
