<b>נתחייב כו'. </b> שם מ"א ופי' דאכל הנשבעין דרבנן קאמר:<br>
<b>אלא הנתבע. </b> לא יהא אלא מלוה ע"פ ושאר טענת בע"פ:<br>
<b>וי"א כו'. </b> שכן פשטא דגמ' תקנת' לתקנת' כו' ונשאר אדינא דאוריית' א"כ בשכיר וחבירו נשבע הנתבע היסת אבל בששטר מקויים דמן הדין נוטל בלא שבועה אלא דתקנת חכמים לישבע כמ"ש בפ' הכותב מ"ט רמו רבנן שבועה עליה כו':
