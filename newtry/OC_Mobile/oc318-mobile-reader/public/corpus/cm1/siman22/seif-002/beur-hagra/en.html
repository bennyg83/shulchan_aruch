<b>(Collected note) But if he accepted, etc.</b> This is stipulating contrary to what is written in the Torah, as stated in Gittin 88b concerning "before them, etc." (End of collected note.)<br>
<b>But if he already, etc.</b> This is because of waiver, as written in Beit Yosef, seif 6: "and I concede that if, etc.".
