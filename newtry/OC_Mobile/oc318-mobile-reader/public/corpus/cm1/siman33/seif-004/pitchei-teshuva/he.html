<b> אע"פ שהניחה לו בנים. </b> ערשב"ם ב"ב קכ"ח ע"א בד"ה ומתה בתו שכתב וכגון שאין לו בנים הימנה וכדתנן בפ' ז"ב. ובגליון הש"ס להג' רע"ק זצ"ל שם תמה דהתם א"ר יהודה כן אבל ת"ק ס"ל דגם ביש לו בנים כשר והכי קיי"ל ע"ש וכבר קדמוהו לתמוה כן בס' כנה"ג סי' זה בהגב"י אות י"ח ובס' בר"י אות ך' וע' בתומים סק"ז מ"ש בזה:
