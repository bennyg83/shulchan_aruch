<b>(ס"ח האיש עם אשתו ראשון כו')</b> נ"ל דה"ק לא תימא כיון דפסול קרובים אתיא מכח לא יומתו אבות בעדות בנים והיינו דווקא בקורבות דתולדה אבל בקרוב דחיתון כשר אלא דעכ"פ פסול איש לאשתו לפי שנהנה מהממון שתזכה היא ולפ"ז הוא כשר לשאר קרובים קמ"ל דגם זה בכלל ראשון בראשון ויש בה פסול קורבה לפיכך אינו מעיד וכו':
