<b>שנעשה. </b> הטעם משום דבפסול קורבה אינו חשוד לזייף אלא גזירת המלך הוא וכיון שחתם נעשה כמי שנחקר' עדותו בב"ד וה"ה בשטר שב' עדיו נעשו אח"כ חתניו או נעשו קרובי' זה לזה וכן הוא בתוס' ופשוט הוא. ש"ך:<br>
<b>העדים. </b> היינו לדעת הרי"ף דס"ל דביוצא מתח"י העדי' לא אמרי' לענין שום דין דה"ל כנחקרה עדותן בב"ד. סמ"ע:
