<b>וי"א דבזמן הזה אין מבטלין קלא</b>. כלו' אף שבזמן הגמ' היו מקומות שמבטלין הקול בזמן הזה חוששין להחמיר דאולי אנחנו מאותן מקומות שאין מבטלין קול אבל הד"מ כתב דמיחש לקול חשש' דרבנן ובשל סופרים הלך אחר המיקל וכן פסק הרא"ש בפסקיו ובתשובה והבי' ראיות לזה ועיין בב"ח מ"ש שהרמב"ם והרמ"ה פליגי בסברות הפוכות:
