<b>אם נראין הדברים לב"ד שהוא כן</b>. כגון שבתחלה יצא הקול שקדשה בזריקה ואז יצא אמתל' שהיה קרוב לו אם נרא' לב"ד לסמוך על אמתל' זו לא הוחזקה מקודשת אבל אם יצא הקול סתם פלוני קידש פלונית משמע בסתם קדושין שלא בזריקה ואם אח"כ יצא אמתלא שהיה בזריקה וקרוב לו אז אין לסמוך על אמתל' זו מאחר שלא יצא קול אמתל' מיד:
