<b>שטרא. </b> כתב הנ"י שטר שכתוב בו מאה וחמשים דינרין גם המאה הוא דינרין ואין אומרים שהם מעות דא"כ אסוכי מסכי להו עכ"ל. סמ"ע:<br>
<b>דנין. </b> היינו דוקא שידוע שידע מזה אבל אם לא ידע מזה אע"פ שנהגו כן ההדיוטות אין דנין אותו כאילו נכתב. ש"ך:<br>
<b>ראוי. </b> ומה"ט יש להכשיר אם כתב לחמותו אמו. סמ"ע:
