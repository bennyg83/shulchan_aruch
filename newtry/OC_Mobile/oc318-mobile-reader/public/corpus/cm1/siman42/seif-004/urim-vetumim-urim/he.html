<b>וי"ח </b> היינו כמ"ש בתומים הואיל וחתמו בפנים גם כן אם כן אין טעם לפוסלו כלל כי בזמן הזה אין קפידא כלל ע"ש והש"ך השיג על רמ"א ואני בררתי באריכות בתומים כי משה ותורתו אמת. ואם העדים לא חתמו רק מאחוריו עיין בתומים שהעליתי אם ליכא למיחש למוקדם כמ"ש שם יש מחלוקת הפוסקים אם להכשירו ועכ"ש מב"ח גבי ע"ש:
