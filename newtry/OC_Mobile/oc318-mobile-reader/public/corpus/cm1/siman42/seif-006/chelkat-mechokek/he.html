<b>והא' מהם קרוב</b>. ולא נפסל השני בצירופו לקרוב (כמבואר בח"ה סי' ל"ו) דמיירי שלא נצטרף בשע' ראיה לדעת הרא"ש דבעי תרתי (כוון בשעת ראיה כדי להעיד ובא לב"ד והעי') או לדעת הרי"ף שנאמן לומר שלא הכיר בקורבתו ומשום חומר' דקידושין חיישינן לכתחל' ועיין בח"מ סי' ל"ו ועיין בתשובת מהר"ם פאד"וה סי' ל"ז מ"ש מזה:
