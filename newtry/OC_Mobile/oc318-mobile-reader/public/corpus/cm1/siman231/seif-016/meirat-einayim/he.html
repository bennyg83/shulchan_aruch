<b>בכתבי הגמטריא כו' </b> כן הוא לשון רמב"ם שם רפ"ח דגניבה וכ' המ"מ לפרשו ז"ל כתבי הגימטרי' הוא חכמת השיעור והתשבור' ועליו אמרו שהחשבון תקופות וגימטריאות הן הן פרפראות לחכמה ור"ל הן פרפראות לחכמת התכונה הקרוי חכמה ובינה עכ"ל:<br>
