<b>(נשרף הבית)</b> כו' הסמ"ע יפה הגיה כאן דחסר וי"א כו' מיהו נ"ל דלענין הלכה דקיימא לן כדיעה ראשונה דדינו כנפל דמ"ש זה מזה והדעה השניי' ס"ל גם בנפל דצריך לתת כל השכר ומפר' מאי דאמר בגמ' אי דאמר בית זה נפל לה אזדא לה היינו שישלם לו כל השכר וכיון דאנן קיל"ן דמנכה לו לפי החשבון הכי נמי בנשרף כנ"ל פשוט:
