<small>[סמ"ע אות ס]</small> <b>פי' מכח מה פוטרין אותו.</b> נ"ב לפמ"ש הב"ח סי' כ"ב דאם אמר איני נשבע שוב אינו יכול להיפוך ולומר דכונתו הי' לשבע שכנגדו א"כ בפשיטו' י"ל משו"ה כתב ונותן להשמיענו דין זה דמיד שפוטרים אותו צריך לשלם וא"צ התובע לשבע אולם הסמ"ע לשיטתו אזיל שחולק לעיל דמצי להפך משו"ה צריך לדחוק כאן ודו"ק:
