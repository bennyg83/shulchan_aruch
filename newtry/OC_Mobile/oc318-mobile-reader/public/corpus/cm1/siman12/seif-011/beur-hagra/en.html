<b>If Reuven.</b> Bava Batra 48a. See Tosafot there, s.v. amar Rava, who distinguish a gift. See also 42a concerning a bill of divorce or gift. This is the meaning of the phrase, 'he has no right in it,' since it resembles a gift. There Shmuel agrees where money was paid, unlike a gift and similar cases.
