<i data-commentator="Be'er HaGolah" data-label="ע" data-order="20"></i>התאוה מביא לידי חמוד והחמוד מביא לידי גזל שאם לא רצו הבעלים למכור אע"פ שהרבה להם בדמים והפציר ברעים יבא לידי גזל שנא' וחמדו בתים וגזלו ואם עמדו הבעלים בפניו להציל ממונם או מנעוהו מלגזול יבא לידי שפיכות דמים צא ולמד ממעשה אחאב ונבות:
