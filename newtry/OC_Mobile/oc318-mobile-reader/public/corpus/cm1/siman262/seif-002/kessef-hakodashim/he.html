סעי' ד <b>(שנפלה משנים)</b> ב' הדרים בבית אחד ואמר אחד שאבד שם ממון ותובע מחברו ועוד אחד שהי' שם אז אין השליש יכול לומר גם אם מצאתי א"צ אני להאמין ושמא חברך אבד והוא אינו תובע ממני שכמו שע"י סימן מוטל להחזיר כן ע"י מה שזה תובע וצועק שאבד לו וזה אינו תובע מוכרע שהתובע אבד ומעין משפט שבין הנשים גבי שהע"ה:
