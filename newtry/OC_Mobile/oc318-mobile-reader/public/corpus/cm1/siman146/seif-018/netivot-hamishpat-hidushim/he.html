<b> דעביד איניש דזבין דיניה. </b> ודוקא אם טען אבל אנן לא טענינין כן עבורו [סמ"ע]:<br>
<b> ומכרה לו שנית נאמן </b> מאחר שעשה מעשה וקנאה ממנו זהו ראיה גמורה שחזר ומכרה לו [סמ"ע].<br>
