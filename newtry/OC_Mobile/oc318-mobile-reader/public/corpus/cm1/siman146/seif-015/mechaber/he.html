<i data-commentator="Be'er HaGolah" data-label="ר" data-order="42"></i><i data-commentator="Beur HaGra" data-order="38"></i>אם עמד המוכר בדין עם המערער קודם שמכרה למחזיק <i data-commentator="Me'irat Einayim" data-order="36"></i><i data-commentator="Netivot HaMishpat, Hidushim" data-order="36"></i>ונפטר ממנו כיון שלא היו לו עדים שהיתה שלו אע"פ שלאחר שמכרה לזה המחזיק ערער עליו המערער והודה לו שהיתה שלו על פי המוכר שאמר לו שהיתה שלו וקנאה הוא ממנו לא הפסיד בזה כיון שכבר יצא זכאי מב"ד המוכר שמכרה לו:
