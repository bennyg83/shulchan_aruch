<b> שהם יאמרו לאחרים. </b> שלא אמר רק שלא יאמרו לו אבל לאחרים לא הזהירם [סמ"ע]:<br>
<b> לא הוי מחאה </b> ואפי' עברו ואמרו לו שמיחה כיון שאמרו לו שאמר להם המערער שלא יצא דבר זה מפיהם הוי חזקה ☜ וע"ב דאפי' לא אמרו לו שאמר להם המערער כך כיון דלא הוי מחאה דמי לשנים שאומרים להמחזיק בשקר שמיחה והוא לא מיחה דמיסתבר דהוי חזקה.
