<b>מסלקין. </b> היינו כשיש ראיה לכל א' משניהן ולזה הג' אין ראי' אף שאומ' דשלו הוא קודם שגבר אחד מהשנים דאמרי' דשל אחד משניהן הוא בודאי כיון דיש להן ראיה ולזה אין לו וגם אפי' אם אין לשום א' ראיה אלא שכל א' משניהם טוען שלי הוא וזה הג' תקף בלא טענת שלי הוא אז ג"כ מוציאין מידו כמ"ש בסי' קל"ט ס"ב ע"ש. סמ"ע:
