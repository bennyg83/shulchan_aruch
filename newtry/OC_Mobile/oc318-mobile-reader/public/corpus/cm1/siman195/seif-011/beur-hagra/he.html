<b>אין קונין כו'. </b> כ"מ בספ"ט דב"ב קנ"ו ב' אר"ל קונין מש"מ כו' ועפ"ז דב"ק ע' ב' וע"ל סי' ר"ח ובתוספתא דב"ב שם בשבת לא יעשה ואם עשה עשוי ועתוס' שם ד"ה רא"ח כו' ובירושלמי פ"ה די"ט והביאו הרי"ף ורא"ש וכולן שעשו בין מזידין כו' וכ' הרי"ף ורא"ש ושמעינן מינה כו' וע"ל ס"ס רל"ה ובב"מ ט' א' אלא מעתה הגביה כו':
