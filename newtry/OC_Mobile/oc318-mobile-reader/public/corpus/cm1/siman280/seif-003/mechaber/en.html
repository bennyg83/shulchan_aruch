<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i><i data-commentator="Beur HaGra" data-order="3"></i><i data-commentator="Me'irat Einayim" data-order="5"></i><i data-commentator="Netivot HaMishpat, Beurim" data-order="2"></i><i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i>If one-sixth of the estate appreciated by itself and Levi then died, an increase ready to be harvested, such as grapes ready for picking, is treated like property newly received from others and is divided. If it was not yet ready for harvest, it belongs to Reuven alone.
