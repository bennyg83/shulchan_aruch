<small>[שו"ע]</small> <b>יחלקו יורשי האב.</b> נ"ב ואם הי' זה שמת בע"ח לאחרי' י"ל דהבע"ח גובה מהחלק שנטלו יורשי האב בטענה כיון דאתם זוכי' מכחו בטענה דאבי אמו מת תחלה. ממילא צריכים אתם לשלם חובותיו ואחר שגבה הבע"ח יש לדון אם יכולים יורשי האב ליטל ממנו ויהי' הדין חוזר חלילה. עיין ספר כתיבה סי' קס"ב אות י"ג:
