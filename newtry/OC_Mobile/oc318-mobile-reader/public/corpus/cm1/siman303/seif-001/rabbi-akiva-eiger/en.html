<small>[Shulchan Aruch]</small> <b>A paid custodian.</b> Note: Whether a communal officer is considered a paid custodian, see above, siman 72, seif 5, and Shach there, subparagraph 34. A synagogue attendant is an unpaid custodian. See Responsa Baei Chayei of Knesset HaGedolah, Choshen Mishpat, part 1, siman 216.
