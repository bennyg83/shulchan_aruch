<b>לפורעו. </b> נ"ל דוקא כשאין להם מגו דפרעתי כגון שהוא תוך זמנו וכה"ג דליכא למימר כיון שהודו סתם חזקה טובה היא שהודו בחוב עצמן דלא אמרינן מגו במקום חזקה דא"כ לא היה צריך הבעה"ת לטעמא דנסכא דרבי אבא גבי עד א' ודו"ק. ש"ך:<br>
