<b>אם הם קרקעות </b> דבמטלטלין לדידן אפילו כתב מא"ק ומכרם ונתנם לא טריף מפני תקנות השוק:<br>
<b>בכל פעם אחזירנה </b> עיין תומים דכתבתי דלא תקשה מן לעיל סימן מ"ב וע"ש אם מחייב להחזיר בחיים או אף יורשים יכולים להחזירו ואם אמר לי מחויב להחזיר לנותן ולא ליורשיו ועכ"פ אסור לקלקל בשדה כדי שיכול להחזירו בעין כמו שקבלו ע"ש:
