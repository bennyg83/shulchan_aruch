<b>ופועלים כו'. </b> כמ"ש בסד"ה:<br>
<b>אע"פ שלא שכרו אדעתא דהכי </b> כצ"ל וכ"ה בסמ"ע והטעם כמ"ש בגמ' משום דשכירות אינה משתלמת אלא לבסוף והרי לא גמרו מלאכתן: <br> <b> (ליקוט) אע"פ שלא שכרו אדעתא דהכי. </b> דמ"מ שכירות אינה משתלמת אלא לבסוף אף כה"ג כמש"ש ע"ג א' א"ל רבא כו' דשכירות כו' אע"ג דלאו אדעתא דהכי אגרי (ע"כ) .
