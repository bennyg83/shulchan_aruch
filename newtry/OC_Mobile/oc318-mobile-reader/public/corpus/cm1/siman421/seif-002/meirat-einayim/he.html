<b>נותן לגדול דמי בשתו של קטן. </b> בסי' ת"ך סל"ז נתבאר דבקטן אין חייבין על בושתו אלא בתנאי שכשמכלימין אותו הוא נכלם ושם ג"כ כתב המחבר דמ"מ אין דומה המבייש הקטן להמבייש הגדול וזה שכ' כאן שאינו נותן לו אלא דמי בשת של קטן שהרי לא נתכוון אלא לבשת כזה ולבושת היתרה לא כוון ובשת שלא בכוונה אין מחייבין עליו:
