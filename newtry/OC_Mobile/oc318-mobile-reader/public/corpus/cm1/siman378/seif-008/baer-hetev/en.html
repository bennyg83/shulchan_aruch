<b>His affairs.</b> From the Rambam's wording it would appear, at first glance, that even one who runs in the course of his business in order to finish before Shabbat is considered to be running with permission. Sema. <small>(See what the Tosafot Yom Tov wrote on this in Bava Kamma, chapter 3, Mishnah 10.)</small>
