<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i><i data-commentator="Beur HaGra" data-order="13"></i><i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i><i data-commentator="Me'irat Einayim" data-order="4"></i><i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i>Even visual intrusion is forbidden when it harms another. Therefore, one may not stand and gaze at another's field while its crop is standing.
