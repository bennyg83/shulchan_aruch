<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i><i data-commentator="Beur HaGra" data-order="10"></i><i data-commentator="Beur HaGra" data-order="11"></i>If one was climbing a ladder and a rung slipped, causing him to fall and damage property, he is liable if the rung was not firmly secured. If it was strong and firmly secured but slipped or became worm-eaten, he is exempt, because this was an act of Heaven. The same applies in similar cases.
