<b>הראשון. </b> ומ"מ אם ירצה הניזק יעשה דין עם השני אלא דקאמר שגם דינו עם הראשון דה"ל פשיעה גביה שמסרו לשני והבעלים י"ל אתה נאמן עלי בשבועה ולא האחר ול"ד לדין שלפני זה דהתם בעל השור ברשות נתנו להשומר גם בדין שאח"ז בנתנו השומר לבנו כו' הוא ברשות דכל המפקיד ע"ד אשתו ובניו הוא מפקיד וע"ל סי' רצ"א. שם:
