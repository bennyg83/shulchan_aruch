<i data-commentator="Be'er HaGolah" data-label="ב" data-order="46"></i>וכן המשוה פני הארץ אם דעתו לתקן הארץ קנה ואם דעתו להשוות מקום שיעמיד בו גורן לא קנה כיצד היה לוקח עפר ממקום גבוה ונותנו למקום הנמוך הרי זה מתקן הארץ ואם אינו מקפיד על זה אלא משליך העפר והצרורות בכל מקום בלא הקפדה הרי זה בחזקה שאינו מתכוין אלא להשוות מקום לדוש בו:
