<small>[Shulchan Aruch]</small> <b>And one of the partners requested.</b> Note: If one partner rented the other’s share from him, he cannot demand "either you buy my share or I will buy yours" until the rental term ends. Rashba, siman 61. See Responsa Tashbetz, part 6, second section, Chut HaMeshulash, siman 9.
