<b>פלוני. </b> דחששו שמא יתן היורש להמלו' את שדה שלו בשומת חובו והשדה שיורש ישאר בידו ויפסידו ואחר שישבח המלו' שדה שקיבל יביא היורש עדים שאותו שדה שלו הוא ובטעות נתנה לו ויוציאו מידו ויתן לו השדה שנתקלקל ויוציאו לעז על הב"ד שלא עיינו בתקנתו של יורש עכ"ל הסמ"ע וע' בתשובת מבי"ט ח"א סי' קכ"ב וסי' רע"ח:
