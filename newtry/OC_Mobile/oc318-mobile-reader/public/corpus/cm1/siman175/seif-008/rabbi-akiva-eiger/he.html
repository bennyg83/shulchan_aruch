<small>[שו"ע]</small> <b>ודוקא משעה.</b> נ"ב כ' מהריק"ש מכרה ללוקח ואח"ז רב נמצא בטל המכר וחזר המוכר וכתב שנית שטר באופן שהמכר קיים להבא כיון שבן המיצר הי' חושב מקודם שהמכר מכר ולא מיחה. אע"פ שמיחה עכשיו בשניים אין שומעין לו כיון שהמוכר מעשה הראשון הוא שהחזיק וניחא לי' דליקו בהמנותי' עיין סי' שע"ד ס"א עכ"ל:
