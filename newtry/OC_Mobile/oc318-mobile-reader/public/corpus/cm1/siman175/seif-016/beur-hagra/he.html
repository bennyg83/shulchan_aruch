<b>מי שעשאו. </b> כתובות צח א' אלמנה וכמש"ל סי' קפה ס"ב:<br>
<b>וכשמכר לאחרים. </b> שם א"ל איזיל ואזבין כו' דוקא דא"ל אבל אם מכרו בעצמו לא דדיבורא עביד אינש דמקרי ואמר אבל מעשה לא כמ"ש בב"ב ל"ב א"ל והא אימלכי בך כו' כמאן כאדמון כו' אפ"ת רבנן כו' ע"ש:<br>
<b>וכן מי שחתם. </b> שם כרבנן דעבד ליה מעשה כנ"ל:
