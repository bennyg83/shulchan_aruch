<b>אם שהה המצרן כו' </b> דהא ידע ומחל מדלא בא לתובעו:<br>
<b>שיגיעו למצרן שלו </b> הוא המוכר שמכר ללוקח שדה זו שהיה בן מצרן שלו שהרי היא סמוכה לשדיהו ומיירי שהיה לזה המצרן ערעור וטענה על אותו שדה שקנה הלוקח וסבר שהדין עמו והוא יקבל דמי המכירה לנפשו ואח"כ יצא הדין או נתברר לו בראייה שאין לו זכות בו ובא לסלק וק"ל:
