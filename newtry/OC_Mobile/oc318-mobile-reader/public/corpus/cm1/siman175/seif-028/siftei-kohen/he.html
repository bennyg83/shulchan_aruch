["<b> מכר לו קרקע מעט כו'. </b> ע' בס' א\"א דף צ\"ב ע\"ב:"]<br>
["<b> רואין אם מכר לו אח\"כ ביוקר כו' </b> פי' דאם לא הבליעו אף שהמתנ' היא כמו זאת שמכר לו הרי הוא מצרן אבל אם הבליע אז דוקא אם היא שוה יוכל המצרן לסלקו אבל אם אינו שוה אף שהבליע לא יהא אלא מכר ואינו יכול לסלקו ודוק (ג\"ז כתב בימי חורפו):"]
