<b>זכה. </b> כת' הסמ"ע דהב"י והכ"מ כתבו בשם העיטור דת"ח מסלק להשכן וכ"כ הגהות וצ"ע למה השמיט בעל הש"ע דעתן <small>(ונרא' לי דעכשיו אין לנו דין ת"ח ומ"מ לכתחלה ימכור לת"ח אפילו בזה"ז)</small> <small>(ט"ז)</small>:<br>
<b>שדר. </b> וכ"כ הרמ"א בסי' רנ"ג סט"ו ע"ש:<br>
<b>שחולק. </b> צ"ע דלא ראיתי מי שחולק ומה שנרשם בצדו רש"י פרק המקבל ליתא. ש"ך:
