<i data-commentator="Be'er HaGolah" data-label="צ" data-order="43"></i><i data-commentator="Be'er HaGolah" data-label="•" data-order="44"></i>If one sees a fire approaching another person's standing crop and covers the crop, thereby causing the owner a loss because the crop is now treated as concealed property for which the fire owner may be exempt, the one who covered it is exempt under human law but liable under the law of Heaven.
