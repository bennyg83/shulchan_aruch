<b>ואפי' התנה כו'. </b> עבה"ג וכמ"ש הרא"ש שם דרבא הוי יחיד לגבייהו ועוד דכולהו שינויי דשנינהו אליביה דחוקי נינהו וכן אוקימתא דאוקים אברם חוזאה כר' ישמעאל דלאו כהלכתא נינהו ע"ש:<br>
<b>ואם כתב כו'. </b> וכמ"ש בפ' הכותב בין נקי נדר כו' אבל מה אמרו כו' אבל באמר בפי' ולא ליורשי מהני נאמנות כפי' הרי"ף שם וערא"ש:
