<b>בר"ה. </b> ר"ל אף דשם רשות המזיק והניזק שוה וה"ל להניזק לשמור ענינו משור המזיק. סמ"ע:<br>
<b>פעמים. </b> ואף שלא הזיקו אלא פעם אחד ואחר ההיזק התרו בבעלים ג"פ הרשות ביד הניזק לשחטן אם לא שמרן ואפי' אם יאמר הקצב שישלם מה שיזיקו בהמותיו לא משגחינן ביה דאין אדם רוצה ליטפל נפשו בתשלומי נזקו וגם ניחא לאדם בשלו. שם:
