<b>שבוע'. </b> ואפי' בסתם נאמנות שכת' לו היינו דלהימני' בלא שבוע' דאי בשבוע' אף בלא נאמנות מלו' נשבע על שטרו ונוטל כמ"ש הט"ו בר"ס ע"א ע"ש. סמ"ע:<br>
<b>המלו'. </b> ול"ד למ"ש הט"ו סי' נ"ט באומר המלו' איני יודע דאינו גוב' דהתם הלו' טוען ברי שפרוע הוא. שם:<br>
<b>נשבע. </b> כשטוען ישבע לי דאל"כ נוטל בלא שבוע' וע"ל סי' נ"ג ונ"ד. ש"ך:
