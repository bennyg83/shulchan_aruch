<b>חולקין. </b> נ"ל דגם בזה מיירי באופן דליכא מגו כמ"ש בסי' קנ"ז ס"ה והיינו שראו האבנים תחת ידו ולא מהני הך סברא דשותפין לא קפדי אלא דלא להוי אידך מוציא מחבירו וכן משמע מפרש"י שם בש"ס. ט"ז):<br>
<b>האבני'. </b> הטור מסיק וכתב ז"ל ואפילו הן ברשות אחד מהן לא חשבינן ליה מוחזק בהן דשותפין לא קפדי אהדדי. סמ"ע:
