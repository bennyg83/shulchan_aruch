<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i><i data-commentator="Beur HaGra" data-order="7"></i>If an ox worth one hundred gored an ox worth twenty and killed it, and the carcass is worth four, the owner of the damaging ox must pay eight. Payment is collected only from the body of the ox that caused the damage, as Scripture states, 'They shall sell the living ox.'
