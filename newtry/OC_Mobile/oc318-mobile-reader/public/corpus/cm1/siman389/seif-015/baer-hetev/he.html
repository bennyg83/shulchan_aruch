<b>ארוך. </b> ומש"ה אין חיובן שוה דבדרכה על עץ ארוך כו' חייב עליו נ"ש ובהתיז אבנים בר"ה אינו חייב אלא ח"נ דהיינו נזק צרורות וכמ"ש הטור והמחבר בסי' שאח"ז. שם:<br>
<b>חייב. </b> ול"ד לדרסה ע"ג כלים ונתגלגל למקום אחר ושבר דקי"ל דבתר מעיקרא אזלינן שאני הכא דהנזק נעשה ברשות הניזק והניזק מעולם שם היה. שם:
