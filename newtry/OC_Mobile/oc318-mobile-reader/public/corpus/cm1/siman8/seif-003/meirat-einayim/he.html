<b> עד שהיו מכבידים </b> ומ"ש הטור והמחבר בסי' י' ס"ג על ועצומים כל הרוגיה זה תלמיד שהגיע להוראה ואינו מורה היינו אחר שהיו מפצירים בם ומכבידים עליהם ואינם שומעים אי נמי התם מיירי שאין אחר כמותו בדור וכמ"ש הטור והמחבר שם והדור צריך לו משא"כ כאן שלא כתב אלא שאין שם כמותו דמשמע הא במקום אחר יש הגונים כמותו:
