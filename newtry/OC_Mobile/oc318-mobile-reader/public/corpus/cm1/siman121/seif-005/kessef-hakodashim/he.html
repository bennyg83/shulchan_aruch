סעי' ח <b>(אם השליח כופר)</b> בקכ"א בחו"מ בשליח אומר לא קבלתי כ"כ והלוה אומר שנתן והמלוה אומר לא קיבל ששייך ש"ה על הלוה אולי אם הלוה אומר שנתן והשליח א"י כמה רק שאומר שלא נשאר בידו והמלוה אומר שלא קיבל רק חצי כיון שהשליח נעשה משואיל"מ אם לא הי' אומר הילך י"ל שאין ש"ה על הלוה ע"י הצטרפות מאמר המלוה וצלע"ע:
