<b>When does this apply, when both, etc. </b> As explained above in siman 91, seif 2. Even according to the gloss there, here it is as though he says, "I owe you a maneh, but I do not know whether I repaid you."<br>
<b>Rather, he places under a ban. </b> This is the rule for a claim made on the basis of uncertainty.
