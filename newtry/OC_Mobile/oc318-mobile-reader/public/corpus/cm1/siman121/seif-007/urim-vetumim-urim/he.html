<b>מפני שהם נוגעים. </b> וזהו הכלל דאף דמשתבע וא"כ תו ליכא נגיעה דהא יש לו מגו דלהד"מ ואי דצריך שבועה הא עכשיו ג"כ משתבע מ"מ גזרת התורה היא כל עד דמשתבע אינו מוכשר לעדות:<br>
