<b>אם התובע מודה </b> דין זה הן מלוה ע"פ הן מלוה בשטר דכיון דמודה נפקע כח השטר ש"ך:<br>
<b>נשבע שליח וכו' </b> הש"ך בס"ק ל"ז הביא בשם מרדכי דראובן ששלח ללוי ונאנס אין שליח צריך לישבע ללוי עד שיבא ראובן דלמא יחזור ראובן לפרוע למלוה ואין כאן שבועה והעלה הש"ך הא במת ראובן צריך לישבע ועיין תומים מ"ש בס"ק יו"ד ע"ש:
