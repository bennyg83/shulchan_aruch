<b>תחת כנפיו כלום </b> רצה לומר מהכלים דאף דראהו נושא איזה דבר אולי הוא עפר או צרורות והסמ"ע הגיה כלום ואין צריך דפי' כך:<br>
<b>ה"ז פטור </b> משום דמילתא דלא רמיה אנפשיה ל"א וכיון דלא נטל אף מהביאה והכנסה אינו זוכר כלל:<br>
<b>לא גזלתי </b> פי' אמת לקחתי אבל שלי הוא דאם יאמר לא נכנסתי הרי זה מכחיש לעד ופשיטא דנשבע להכחישו:
