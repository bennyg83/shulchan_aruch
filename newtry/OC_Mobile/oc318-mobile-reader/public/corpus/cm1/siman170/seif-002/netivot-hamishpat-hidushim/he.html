<b> משקין על הסדר </b> היינו כשאמת המים הולך על פני השדות [סמ"ע]:<br>
<b> כל המתגבר </b> משום דבש"ס איכא פלוגתא דרב אמר תתאי ישתו ברישא ושמואל אמר עילאי ולכן כל דאלים גבר ואפי' האמצעים אם הם מתגברים זכו דלתתאי יכולין לדחות ולומר אימר הלכה כשמואל וממילא יש לנו זכות יותר ממך ולעילאי יכולין לדחות אומר הלכה כרב [סמ"ע]:
