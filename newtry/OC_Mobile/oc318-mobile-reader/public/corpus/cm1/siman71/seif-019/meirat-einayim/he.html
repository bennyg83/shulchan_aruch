<b> אפי' התנה בפי' שיגבה כו'. </b> והטעם דחיישינן לקנוניא:<br>
<b> והוא הדין למלוה מוקדם כו'. </b> פי' צריך לישבע למלוה שהלו' אחריו ג"כ ללוה זה ומשועבדים לו גם כן נכסי הלו' ומבואר בפרק מי שהי' נשוי דיכול המלוה האחרון להשביע למלוה המוקדם לו ובא לטרוף שיעבודו שעדיין חייב לו ושלא בקנוניא בא עליו עם הלוה:
