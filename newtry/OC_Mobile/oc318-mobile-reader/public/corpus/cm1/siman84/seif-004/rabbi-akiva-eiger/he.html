<small>[שו"ע]</small> <b>בד"א בשעבר זמנו.</b> נ"ב וכן ביומא דמשלם זמנא פרישה וע' ב"ח וכתב עוד הפרישה דכשעבר זמנו אפי' אם הלוה טוען שפרע כולו ת"ז אפילו הכי צריך לישבע במגו שהי' יכול לומר פרעתיהו אח"ז ע"ש. אבל בבית שמואל אה"ע סי' צ"ו סק"ח דקדק מדברי תשו' הרי"ף שבבעה"ת שי"ו ח"ב דל"א מגו לחייב שבועה וכ"כ הגד"ת שם:
