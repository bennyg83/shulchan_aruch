<small>[שו"ע]</small> <b>סחורה ידוע.</b> נ"ב בתשו' הגאונים סי' קנ"ב ראובן נתן לשמעון סחורה למכור. ומכרה שמעון ללוי ולא קיבל ממנו המעות והודיע לו שהסחורה של ראובן. ואח"כ לקח שמעון המעות או הסחורה לחזרה מלוי. יכול ראובן לומר אחרי שידעת שהסחורה הוי שלי לא הי' לך ליתן המעות לשמעון והעתיקו בת' מ"ב בסוף הספר בחי' דינים וצ"ע:
