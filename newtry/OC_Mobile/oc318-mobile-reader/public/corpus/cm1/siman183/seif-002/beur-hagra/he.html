<b>והניח מעות חבירו. </b> כנ"ל וז"ש או מטלטלים דל"ת שהחילוק הוא בין כאן להא דס"א בין קרקע למטלטלין:<br>
<b>קנאה כו' יכול. </b> ונאמן ע"ז דמסתמא קנאה לעצמו כמ"ש בקדושין כ"א ב' וס"ד ב' הב"ע דשויתיה שליח מ"ד כו':<br>
<b>ודוקא כו'. </b> שם מ"ה ב' כתיב שארית כו' ומסתמא לקריבה וז"ש רש"י נ"א ב' שם ד"ה דשויתיה. לכל הבא כו':
