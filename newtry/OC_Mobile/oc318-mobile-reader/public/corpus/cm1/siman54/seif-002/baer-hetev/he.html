<b>ואח"כ. </b> הלשון הוא מהופך ופירושו דיפרע חובו ואח"כ ישבע המלו' כו'. וכה"ג אשכחן בסי' ע"ב ריש סי"ח נשבע הלוה כו' ונוטל משכונו ובסימן קל"ג בטור ובסמ"ע ס"ק י"ב וצריך להחזירו אחר שישבע כו' ופירושו שמחזירו ואח"כ נשבע היסת ובר"ס קל"ה נשבע היסת ונוטל ופירוש נוטל ואח"כ נשבע והוא הדין הכא כן נ"ל. עכ"ל הש"ך:
