<b> דין היתום לדין האלמנה. </b> היינו טעמא דהקדימו קרא דכתיב שפטו יתום ריבו אלמנה:<br>
<b> ודין האלמנה קודם לדין ת"ח. </b> כ' הכסף משנה וכ"ש דיתום קודם לתלמיד חכם ואף שבגמרא פרק בתרא דכתובות לא משמע הכי ע' דרישה שם תמצא ישוב דלא קשיא מידי:<br>
<b> ודין האשה קודם לדין האיש. </b> ל' הרמב"ם מפני שבושת האשה מרובה:
