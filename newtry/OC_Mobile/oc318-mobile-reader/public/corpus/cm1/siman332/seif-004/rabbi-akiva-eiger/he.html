<small>[הגה]</small> <b>חפץ בשכרו.</b> נ"ב עיין תשו' מוהרי"ט ח"ב חח"מ סי' כ"ג ודבריו תמוהים כי קושייתו ותירוצו הוא כקושי' הרא"ש ותירוצו אלא שהוסיף מוהרי"ט אח"כ ושמא וכו' דאפי' חיוב אין עליו וכו' כיון דחפץ אין בעין שעבוד אין כאן זה נגד המבואר ברא"ש להדיא שכתב דיכול ליתן לו דמי חפץ ועמ"ש בגליון רס"י קצ"ח:
