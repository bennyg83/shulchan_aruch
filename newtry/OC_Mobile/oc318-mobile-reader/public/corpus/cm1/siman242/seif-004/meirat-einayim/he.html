<b>אם לא ציוה לכתוב בפרהסיא כו' בטור כ' מילתא בטעמא והוא דבכתיבת השטר לא נ"מ דאף אם מצא טופס שטר בשוק שלא נכתב ע"ש מתנה זו יש לו רשות לכתוב בו שם הנותן והמקבל ומחתם עליו עדים והוא כשר וכ"כ הטור והמחבר לעיל סי' מ"ט בשטר הלואה ע"ש:</b><br>
