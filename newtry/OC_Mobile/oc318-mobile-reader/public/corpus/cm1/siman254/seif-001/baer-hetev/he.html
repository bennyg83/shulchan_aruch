<b>בשבת. </b> דבעלמא אסור לעשות ק"ס בשבת משום מקח וממכר וכמ"ש הט"ו בס"ס קצ"ה וס"ס רל"ה ובא"ח סי' של"ט כאן התירו כיון דהק"ס הוא שלא לצורך שהרי דברי שכ"מ ככתובין וכמסורין דמי ועבדינן הכי כדי לפייס דעת השכ"מ. סמ"ע:<br>
<b>וי"א. </b> דס"ל כיון דאין זה אלא גזירת מקח וממכר מדרבנן כל כה"ג לגבי שכ"מ התירו לעשות קנין. שם:
