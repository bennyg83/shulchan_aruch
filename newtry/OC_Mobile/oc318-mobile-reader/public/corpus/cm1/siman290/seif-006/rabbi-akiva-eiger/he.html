<small>[שו"ע]</small> <b>ואין מוכרים שדות.</b> נ"ב דוקא כה"ג שהיא ספק תועלת ליתומים אבל היכי דאיכא ברור תועלת ליתומים מוכרים בלא רשות ב"ד ומכש"כ היכי דיש הפסד בקרקע אם לא ימכרוהו ומ"מ טוב יותר לאפוטרופס להתייעץ עם ב"ד שבעיר שו"ת מהר"י בי רב סי' ח' ועיין בספר הזכות שנדפס בסופו תשו' מוהר"י אבוהב בענין זה:
