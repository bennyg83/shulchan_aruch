<i data-commentator="Siftei Kohen" data-order="17"></i><i data-commentator="Be'er HaGolah" data-label="מ" data-order="42"></i><i data-commentator="Me'irat Einayim" data-order="42"></i><i data-commentator="Siftei Kohen" data-order="18"></i><i data-commentator="Be'er HaGolah" data-label="נ" data-order="43"></i><i data-commentator="Ba'er Hetev" data-order="33"></i>Guardians separate terumah and tithes from the property of orphans in order to feed them, because orphans may not be fed prohibited food. They may not separate produce merely to leave it corrected for later; rather, they sell it while still untithed.
