<b>שיפסד. </b> בדרישה הוכחתי דאפי' אם לא יפסד לגמרי אלא שיפסד בחלוקה מאשר היה כגון טלית גדול דלאחר שיחלקוהו ראוי לעשות ממנו ב' טליתים קטנים אפ"ה ימכרו אותו בשלימותו ויחלקו הדמים עכ"ל הסמ"ע <small>(ובכנה"ג כ' בשם ת"ה סי' של"ו דדוקא אם ההפסד לאחר חלוקה הוא יותר מחומש ומהרש"ך ז"ל בח"ב סי' קכ"ב הקשה עליו ועיין שם)</small>:
