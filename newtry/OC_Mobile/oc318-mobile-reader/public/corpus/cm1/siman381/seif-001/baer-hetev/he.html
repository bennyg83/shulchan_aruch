<b>משונים. </b> ובכה"ג אפילו א' לבדו שיושב עליו הוא חייב דבע"ה מסתמא מקפיד על ישיבתו עליו הואיל והוא משונה. סמ"ע:<br>
<b>סמך. </b> קמ"ל בזה דלא אמרינן כחו לאו כגופו דמי וגרמא בעלמא הוא הואיל וגם זולתו היה נשבר. שם:<br>
<b>חייבין. </b> דהאחרון יכול לומר להם היה לכם לעמוד כשבאתי לישב והרי יש לי רשות לישב עליו כמותכם. שם:
