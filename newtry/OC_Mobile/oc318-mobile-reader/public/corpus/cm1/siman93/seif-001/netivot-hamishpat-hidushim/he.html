<b> בטענת שמא. </b> כיון דטרחי מורי היתירא:<br>
<b> שמינו אותם. </b> אבל מינהו אבי יתומים לא ישבע:<br>
<b> בטענת ספק וע"ב דבטענת ברי אין עליו שבועת המשנה ועע"ב ס"ק א' אימת השותף מחויב לישבע ש"ד כשהיה היזק ואימת א"צ:</b><br>
<b> עד שיחשוד. </b> היינו שיהי' לו איזה הוכחה שיחשוד אותו דבלא"ה אין משביעין אותו:
