<b>בדינין. </b> ונ"א בגופן ור"ל שכתב בערכאות העובדי כוכבים להקנות שטר וקאמר דאם כתבו העובדי כוכבים בלשונם לשון שמשמעותו קנה לך איהו וכו' הוי ליה כאילו כתב לו בלשון הקודש וקונה בו וע"ל סעיף כ"ה מדין עובד כוכבים שמכר שטרו לישראל עכ"ל הסמ"ע ועיין בתשובת מהר"ר בצלאל סי' ל"ו ובתשובת מהרש"ך ס"ב סי' קמ"ו:
