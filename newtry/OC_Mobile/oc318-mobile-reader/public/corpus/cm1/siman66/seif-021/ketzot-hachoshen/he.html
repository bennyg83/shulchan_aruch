<b>אין לוי חשיב נוגע. </b> עיין בתשובת מהרי"ט ח"א סימן ע"ט דמפרש לה דהיינו דווקא כשראו בידו קודם המכירה שטר זה בעדיו והיו חתום בו לוי ועוד ע"א דאז לא חיישי' לחשדא שהי' חשיד כדי שיקנה אותו אח"כ אבל אם לא ראו בידה קודם לכן אם כן ודאי חיישינן דלמא עתה חתם עצמו לוי והוי נוגע גמור ועיין שם ודבריו מוכרחין:
