<b>על פה. </b> הטעם דכל שחתום בעד נחשב כאילו נחקר עדותו בב"ד ואז לא הוי נוגע משא"כ כשמעיד בע"פ דעתה בשעת עדות כבר הוא נוגע בדבר עכ"ל הסמ"ע <small>(ועיין בט"ז מה שמחלק שלא תקשי מדין זה על מ"ש בסכ"ב ע"ש)</small>:<br>
<b>לגבותו. </b> והש"ך כתב דדין זה צ"ע והוכיח מן הפוסקים דעכ"פ בדיעבד אם מכרו לשני העדים יכולים לגבות בו ועיין שם:
