<b>(ס"ט)</b> אפילו הודה במטבע גם בטור כתב כך אבל אין שם מקום לקיימו דהא דבר זה הוא פלוגתא דרש"י ור"ח היא דלפרש"י אפי' הודה בשל כסף הוה ממין הטענ' כמ"ש הטור אחר כך דכל מטבעות אחת הן וא"כ אמאי כתבן כטור כאן. ונלע"ד דאגב ריהטא דרבינו הטור נמשך כאן אחר סידור דבריו ברמזים דשם כתב הפלוגתא ואח"כ האי ואפי' כו':
