<b>או </b> שעד אחד מעיד שגזלו לפי דברי הריב"ש לעיל בסי' ל"ד דאם בע"ד אמר שגזלו וע"א מצטרפים לפוסלו ולא הוה נוגע בעדות דפלגינן דבורו וא"כ צ"ל כאן דלא תקשה הא ה"ל פסול לשבועה ואיך ישבע דמיירי דתובעו עפ"י העד והוא א"י אבל לשיטת רמ"א לעיל דהוא אינו נאמן דה"ל נוגע א"ש טפי דאין נפסל עפ"י ע"א והוא לא מצטרף:
