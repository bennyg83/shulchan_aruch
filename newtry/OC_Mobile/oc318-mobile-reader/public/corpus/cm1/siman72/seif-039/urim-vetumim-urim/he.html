<b>ולא היה המלוה בחצרו </b> דאם הוא עומד הרי החצר משומר על ידו וה"ל כחצר משתמרת ועיין מה ש"ל סימן רס"ח:<br>
<b>אין בדברי לוי כלום </b> שהוא אין יודע אם האמת מה שאומר לו שותפו או לא ואם כן איך יש לו מגו דלהד"ם או החזרתי הא אין רוצה לשקר ושותפו ל"ל מגו דלהד"ם או החזרתי דאין בידו ועיין לקמן מ"ש בזה בדיני מגו סימן פ"ב:
