<small>[שו"ע]</small> <b>המלוה את חבירו על המשכון.</b> נ"ב עיין בט"ז שכתב מדהשמיט דגם במלוה צריך למשכון מצוה קא עביד ונעשה ש"ש מדר"י וכן הרי"ף והרמב"ם השמיטו משמע דס"ל דאליבא דא"מ בודאי להנאתו מכוין אבל בנ"י ובמאור איתא להדי' דהוי ש"ש אף בצריך למשכון ע"ש ודברים כהווייתן כתב ג"כ בס' תפש"מ ע"ש ועיין ש"ך ס"ק י"א ובס"ק ל"ו:
