<b>Reuven, etc., is exempt.</b> See Sema and Shach. Heaven had mercy upon him, as stated in Bava Kamma 116a. <br> <b>(Anthology) Reuven, etc.</b> First, he never performed meshichah, and guardians are not liable until meshichah. Second, even without his loan the item would have burned. See siman 340:1 in the gloss.
