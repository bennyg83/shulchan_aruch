והציל אחד מהם ואפי' אינו יכול להציל (ש"ך) וע"ב:<br>
ואם אמר עיין ביאורים ☜ דכשהשותף כאן בעינן אמירה בפניו דוקא ואם אינו כאן סגי כוונה בלב (ש"ך):<br>
אינן יכולים להציל ואמר לעצמי אני מציל (ש"ך):<br>
נשבע על כך ☜ ע"ב דדוקא במקום דאית ליה מיגו דלהד"ם או החזרתי אבל אי איכא עדים וראה דלית ליה מיגו אינו נאמן בשבועה:
