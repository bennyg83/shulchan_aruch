<b>אע"פ שהוא מכור. </b> פי' לענין זה דיכול הלוקח לחרוש ולעבוד בו וגם אין שום א' מהן יכול לחזור בו כ"ז שלא גבה ממנו הניזק וכן לענין זה קאמר בסמוך בס"ב דמתנתו מתנה:<br>
<b>וכשיתפסנו יקחנו כו'. </b> כ' שיתפסנו משום זמן הזה דאין מגבין דיני קנסות בב"ד ולרבותא כ"כ דאע"ג דאין לו בו דבר עד שיתפסנו אפ"ה מכירתו מכיר' ועפ"ר:
