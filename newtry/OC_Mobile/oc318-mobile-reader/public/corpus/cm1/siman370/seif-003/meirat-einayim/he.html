<b>שהמשחק בקוביא עם העכו"ם אין בו משום גזל </b> אע"ג דגזל עכו"ם אסור היינו גזל דאורייתא ועוד דהעכו"ם לא מחשב זה לגזל אלא דעתו להקנותו למי שכנגדו בכה"ג אלא שבישראל אסרוה מטעם שכתבתי:<br>
<b>אא"כ אין לו אומנות אחרת </b> והטעם כמ"ש דאז אינו יודע כמה טורח יש לאדם בממונו ונקל בעיניו להעיד שקר וכדומה לו להפסיד ממון חבירו:
