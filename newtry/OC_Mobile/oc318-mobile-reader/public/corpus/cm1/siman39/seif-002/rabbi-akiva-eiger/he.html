<small>[שו"ע]</small> <b>וי"א שאינם צריכים.</b> נ"ב זהו דעת הראב"ד וסייעתו דדוקא בכתוב' ושטר מתנה צריך להמלך בו. בב"י כ' דבשו"ת הרא"ש משמע דס"ל כהרמב"ם דבכ"מ צריך לאמלוכי. ותמה על הטור שלא הזכירו. ולענ"ד תמוה יותר דהא עכ"פ לכ"ע בשטר מתנה צריך לאמלוכי והוא סוגי' ארוכה עכ"פ הו"ל להביא דין זה במתנה בסי' רמ"ג. וצ"ע:
