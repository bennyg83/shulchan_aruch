<small>[ש"ך אות טו]</small> <b>ל' הרשב"א והדין נותן כן וכו'.</b> נ"ב תמוה לי דהא קיי"ל כותבי' שובר ויצטרך ליקח שובר מהך חששא גופא. גם בלא"ה אין ראי' דדלמא הדין דאין העדים רשאי' לכתוב עד יכתבו כולם במעמד א' כמו הזמין עשרה וכמו מוכר שדהו בעדים דצריכי' לכתוב כולם מה"ט גופ' דשובר לגבי לקוחות ליכא. וצ"ע:
