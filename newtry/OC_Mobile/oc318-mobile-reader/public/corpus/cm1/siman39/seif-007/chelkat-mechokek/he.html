<b>שאין הבנות הולכות למרחץ</b>. כלו' ומכ"ש בלא מרחץ אינן הולכות כלל בחוץ ומיירי שקידשה ע"י שליח ולא ראה אותה בשעת נתינת הקידושין ע"כ אף מום שבגלוי מבטל הקידושין ועיין במרדכי כתב דבאירוסין יכול להיות שאין מכיר אף במום שבגלוי וגם בדיק' מרחץ אין שייך קודם אירוסין וכל המשנ' מיירי בנשואין עיין שם ובב"ח:
