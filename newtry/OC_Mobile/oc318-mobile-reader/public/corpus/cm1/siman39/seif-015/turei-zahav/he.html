<b>(בא"ד וע' בתשו' הרשב"א סי' אלף וקמ"ט וכו')</b> ע"ש דמבואר דסובר דהלכתא כמר בר"א וע"ל סי' ס"א סעיף י"ז שהעתיק בתשובת הרשב"א דמשמע שם דאינו מצריך אלא דכנפינ' ולא מצריך שישלחו כמו דס"ל למר בר"א צ"ל דהתם איירי שהודה ע"י תביעה ומהני הודאה כמ"ש בשם הנ"י לעיל אבל בשו"ת דאלף וקמ"ט מיירי בהודה מעצמו וק"ל:
