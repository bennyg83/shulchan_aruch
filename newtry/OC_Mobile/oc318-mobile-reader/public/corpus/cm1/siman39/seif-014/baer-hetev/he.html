<b>זכה. </b> כתב הש"ך דצ"ע דהמעיין היטב בבעה"ת שם יראה דמיירי במחייב עצמו לשנים בסתם ולא אמר לעדים כלום ומסרו העדים השטר לאחד מהם וגם בזה נסתפק שם אבל אם החייב בעצמו מסרו לאחד מהם משמע דלא זכה בו אלא זה שנמסר לידו אבל האחר מנין יזכה ואולי גם הטור מיירי דמסרו לזה באופן שיזכה ג"כ לחבירו בחלקו וצ"ע עכ"ל:
