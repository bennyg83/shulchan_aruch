["<b> הוי חזקה כו'. </b> אפי' שמוחזק בו יום א' מטעם מגו וכמ\"ש בסי' ק\"מ וקמ\"ו בכמה דוכתי וכ\"כ הב\"ח וק\"ל וכ\"כ בסמ\"ע ס\"ק ל\"ב ופשוט:"]<br>
["<b> במגו שהי' טוען לא היתה של אביך כו'. </b> ואע\"ג שהי' מעיז שפיר אמרי' מגו בכהאי גוונא כ\"כ התוס' והמרדכי פ' חזקת הבתים וע\"ל סי' צ\"ג מ\"ש על מ\"ש בסמ\"ע ס\"ק ט':"]
