<i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i> We do not roll the Torah <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> scroll in the <i data-commentator="Mishnah Berurah" data-label="יד"></i> presence of the congregation because of the honor <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> the congregation. And if they only have a single Torah scroll and they have to read two topics [that <i data-commentator="Mishnah Berurah" data-label="טו"></i> are in different parts of the <i data-commentator="Mishnah Berurah" data-label="טז"></i> Torah] they may roll,<i data-commentator="Magen Avraham" data-order="7"></i> and we defer the honor of the congregation.':
