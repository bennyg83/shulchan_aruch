(כא) מבחוץ - משום פרסומי ניסא וקמפרש ואזיל כיצד אם הבית וכו':<br />
(כב) ואם יש חצר לפני הבית וכו' - וחצרותיהן היו פתוחות לר"ה:<br />
(כג) שאין לו פתח פתוח לר"ה - וגם אין לו פתח פתוח לחצר אלא פתוחה היא לבית:<br />
(כד) וצריך נר אחר - לעשות היכר לדבר:<br />
(כה) ואם יש מדורה - ויכול להשתמש לפניה ויש הכירה שהנר של מצוה היא:
