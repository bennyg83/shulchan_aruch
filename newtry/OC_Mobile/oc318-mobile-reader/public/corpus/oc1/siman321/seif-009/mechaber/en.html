<i data-commentator="Magen Avraham" data-order="10"></i> <i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="לא"></i> One is permitted to <i data-commentator="Turei Zahav" data-order="8"></i> cut cooked or <i data-commentator="Mishnah Berurah" data-label="לב"></i> roasted meat finely with a knife.<small>Rema: However it is forbidden to cut raw meat finely for chickens,<i data-commentator="Mishnah Berurah" data-label="לג"></i> because since they cannot eat it without being finely cut, it <i data-commentator="Turei Zahav" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="לד"></i> is considered making it a food. [Terumas] <i data-commentator="Magen Avraham" data-order="11"></i>[<i data-commentator="Mishnah Berurah" data-label="לה"></i> HaDeshen] [See further in Siman 324:7]]:</small>
