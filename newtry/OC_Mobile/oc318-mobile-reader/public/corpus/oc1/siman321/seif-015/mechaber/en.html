<i data-commentator="Be'er HaGolah" data-label="ר" data-order="20"></i> Mustard that was kneaded before Shabbos may be <i data-commentator="Mishnah Berurah" data-label="נח"></i> mixed on Shabbos whether with one’s hand or with an <i data-commentator="Turei Zahav" data-order="12"></i> instrument. One may add honey provided that one does not mix it with <i data-commentator="Mishnah Berurah" data-label="נט"></i> force; rather it should be slowly mixed in.
