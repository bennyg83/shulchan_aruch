<i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> One is forbidden to salt four <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i> or five <i data-commentator="Mishnah Berurah" data-label="יד"></i> pieces of radish <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> together because it appears <i data-commentator="Ba'er Hetev" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="טו"></i> as if one is pickling, and pickling is <i data-commentator="Mishnah Berurah" data-label="טז"></i> forbidden because it is similar <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> to cooking. However, one may dip each <i data-commentator="Mishnah Berurah" data-label="יז"></i> individual piece and <i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> eat <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Ba'er Hetev" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="יח"></i> it. One may salt eggs.
