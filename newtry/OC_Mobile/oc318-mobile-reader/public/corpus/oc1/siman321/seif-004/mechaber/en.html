<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> <i data-commentator="Magen Avraham" data-order="6"></i> One opinion writes that one may dip several pieces of radish <i data-commentator="Mishnah Berurah" data-label="יט"></i> individually and place them <i data-commentator="Ba'er Hetev" data-order="8"></i> in front of himself in order <i data-commentator="Turei Zahav" data-order="4"></i> to eat <i data-commentator="Mishnah Berurah" data-label="כ"></i> them immediately in succession.
