<i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> It is prohibited to grind salt in <i data-commentator="Mishnah Berurah" data-label="כו"></i> a wooden grinder but one may <i data-commentator="Mishnah Berurah" data-label="כז"></i> grind <i data-commentator="Mishnah Berurah" data-label="כח"></i> salt with a knife’s handle and a <i data-commentator="Mishnah Berurah" data-label="כט"></i> wooden spoon without concern.<small>Rema: This applies specifically to coarse salt. However, salt that was thin and through cooking turned into lumps may <i data-commentator="Mishnah Berurah" data-label="ל"></i> be cut just as one cuts bread. [Kol Bo]]:</small>
