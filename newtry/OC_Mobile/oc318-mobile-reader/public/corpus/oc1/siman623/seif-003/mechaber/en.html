<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> If it <i data-commentator="Ateret Zekenim" data-label="♦" data-order="2"></i> falls <i data-commentator="Mishnah Berurah" data-label="ד"></i> on Shabbat, he mentions Shabbat <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> in it; but in the confession after the prayer he does not mention Shabbat. This applies to an individual; but the shaliach tzibur, since he said it within his prayer, mentions Shabbat in it. If he did not mention <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ו"></i> it, they do not make him repeat.
