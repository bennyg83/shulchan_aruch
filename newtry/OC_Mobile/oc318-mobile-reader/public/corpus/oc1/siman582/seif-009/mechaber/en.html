<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> Even though during the rest of the year we pray silently, on Rosh Hashanah we have the practice to <i data-commentator="Mishnah Berurah" data-label="כד"></i> pray <i data-commentator="Ba'er Hetev" data-order="8"></i> <i data-commentator="Sha'arei Teshuvah" data-order="8"></i> out loud. There is no concern about getting lost because everybody has a Machzor.<small>Rem&quot;a: It is the practice that everybody says to their fellow &quot;May you <i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Ba'er Hetev" data-order="9"></i> be inscribed for a <i data-commentator="Magen Avraham" data-order="8"></i> <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> good year&quot; (Tur).)</small>:
