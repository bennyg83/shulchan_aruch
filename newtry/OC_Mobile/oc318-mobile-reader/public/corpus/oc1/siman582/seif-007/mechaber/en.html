<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> If (Rosh HaShana) is <i data-commentator="Mishnah Berurah" data-label="יט"></i> during the <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Ba'er Hetev" data-order="5"></i> week, say &quot;A Day of Blasting, a Holy Convocation&quot;. If <i data-commentator="Ba'er Hetev" data-order="6"></i> <i data-commentator="Sha'arei Teshuvah" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="כ"></i> it fell on Shabbos,<i data-commentator="Turei Zahav" data-order="3"></i> say &quot;a Reminder of Blasting&quot;.
