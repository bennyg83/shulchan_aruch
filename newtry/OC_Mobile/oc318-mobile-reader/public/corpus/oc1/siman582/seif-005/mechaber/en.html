<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> If one did not <i data-commentator="Mishnah Berurah" data-label="טו"></i> say &quot;Remember Us&quot; or &quot;Who is <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Ba'er Hetev" data-order="4"></i> like You&quot;, one does not return to it.<small>Rema: Even if one did not uproot their feet yet, rather <i data-commentator="Mishnah Berurah" data-label="טז"></i> that the Blessing was completed (Terumas HaDeshen). So to if one did not <i data-commentator="Mishnah Berurah" data-label="יז"></i> say &quot;And write&quot; and &quot;and in the Book&quot; also the rule is so (Tur))</small>
