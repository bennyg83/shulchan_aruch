<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> Those who throw wheat before grooms must be careful to throw only in a clean place, and <i data-commentator="Mishnah Berurah" data-label="כג"></i> they should also <i data-commentator="Mishnah Berurah" data-label="כד"></i> sweep it up from there so that it will not be trampled upon.
