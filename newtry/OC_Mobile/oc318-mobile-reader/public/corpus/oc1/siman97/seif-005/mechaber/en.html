<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> One who is carrying a load on one's shoulders and the time of praying has arrived: [if it (i.e. the load) is] less than 4 kavs, one may leave it behind one (i.e. let it dangle behind one) and pray. [But if it's] 4 kavs [or <i data-commentator="Mishnah Berurah" data-label="יז"></i> more], one places it on the ground and then prays.
