<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> One should sift <i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> the salt <i data-commentator="Turei Zahav" data-order="3"></i> prior to Pesach [so that] there is not wheat within it, for when the salt becomes wet, a minute amount of the moisture enters the wheat and <i data-commentator="Chok Yaakov" data-order="13"></i> <i data-commentator="Ba'er Hetev" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> it will leaven.
