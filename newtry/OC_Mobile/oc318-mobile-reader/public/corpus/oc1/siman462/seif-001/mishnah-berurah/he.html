(א) מי פירות - כגון יין ושמן וה"ה דבש וחלב ושאר כל המשקין ויתבאר לקמן:<br>
(ב) בלא מים - היינו בלא מים כלל דאם יש בהם מים אפילו כ"ש הרי אלו מחמיצין:<br>
(ג) כלל - אפילו הם מפירות חמוצין אין מחמיצין את העיסה:<br>
(ד) כל היום - ונתפח הבצק דאין זה חימוץ אלא סרחון:<br>
(ה) ידי חובתו - היינו כזית ראשון של שתי הלילות:
