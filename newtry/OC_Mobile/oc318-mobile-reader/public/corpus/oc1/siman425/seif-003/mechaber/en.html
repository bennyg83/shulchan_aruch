<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> Rosh Ḥodesh that falls on Shabbat, we include <i data-commentator="Mishnah Berurah" data-label="יד"></i> in the musaf the fourth blessing for Shabbat and Rosh Ḥodesh, and <i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> conclude it <i data-commentator="Mishnah Berurah" data-label="טו"></i> with &quot;who sanctifies the Sabbath and <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Ba'er Hetev" data-order="5"></i> Israel and the new moons.&quot;
