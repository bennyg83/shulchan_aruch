<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i>4. Regarding an important man, who <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> does not have the habit of tilting the candle on <i data-commentator="Ba'er Hetev" data-order="6"></i> weekdays, it is permitted for him in all instances (to read by candlelight on Shabbat).
