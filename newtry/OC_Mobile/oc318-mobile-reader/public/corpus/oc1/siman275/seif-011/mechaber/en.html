<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i>11. It is forbidden to use the <i data-commentator="Mishnah Berurah" data-label="יט"></i> light of a lamp to check articles that are [very] similar and meticulous scrutiny is required to differentiate between them. It is even forbidden to differentiate between one’s own clothes and those of his wife if they resemble each other.
