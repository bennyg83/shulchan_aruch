<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i>9. One may read the Haggadah from a book when the night of Passover falls on Shabbat because even an unlearned person is [at least somewhat] familiar with a portion of it, and thus only needs to <i data-commentator="Mishnah Berurah" data-label="יז"></i> look into the book from time to time, so he <i data-commentator="Turei Zahav" data-order="8"></i> will not come to say it <i data-commentator="Ba'er Hetev" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="יח"></i> by heart.
