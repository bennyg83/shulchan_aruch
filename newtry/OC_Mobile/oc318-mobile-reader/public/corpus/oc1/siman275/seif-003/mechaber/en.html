<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i>3. If there is someone else with him, even if that person is not reading, and <i data-commentator="Mishnah Berurah" data-label="י"></i> he says to him 'give me your attention so that I will not tilt (the candle) it is permitted. This is also the law if one says <i data-commentator="Mishnah Berurah" data-label="יא"></i> this to his wife.
