<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i>5. Even ten people may not read together by <i data-commentator="Mishnah Berurah" data-label="יג"></i> the light of a <i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i>[large] fire, because they may sit far from each other and since the smoking <i data-commentator="Turei Zahav" data-order="6"></i> stubs of the firebrands are close to them, one can easily and quickly use them to stoke the fire before another person <i data-commentator="Mishnah Berurah" data-label="יד"></i> will notice what <i data-commentator="Ba'er Hetev" data-order="7"></i> he [is doing].
