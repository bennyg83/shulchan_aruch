<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> If one urinated and distracted himself from urinating, then reconsidered and urinated again, one <i data-commentator="Turei Zahav" data-order="2"></i> must <i data-commentator="Magen Avraham" data-order="1"></i> bless <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Sha'arei Teshuvah" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ו"></i> Asher <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> Yatzar twice.
