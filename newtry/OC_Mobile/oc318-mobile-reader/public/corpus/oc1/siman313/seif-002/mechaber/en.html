<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="כ"></i> All door bolts that we said apply when the threshold is high and when they insert it in the door sill it does not pierce the <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="כא"></i> ground; but <i data-commentator="Mishnah Berurah" data-label="כב"></i> if the threshold was diminished such that when inserting the door bolt in the hole it pierces <i data-commentator="Ba'er Hetev" data-order="3"></i> below into the ground, it is boneh <i data-commentator="Magen Avraham" data-order="5"></i> and forbidden to lock with it.
