<i data-commentator="Be'er HaGolah" data-label="ב" data-order="25"></i>7. A broken beam may be supported with <i data-commentator="Ba'er Hetev" data-order="8"></i> a bed frame, which is <i data-commentator="Magen Avraham" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="מט"></i> a Keili, but not to elevate the beam, because that would be Boneh (building), rather to prevent it from <i data-commentator="Be'er HaGolah" data-label="ג" data-order="26"></i> falling further. This is provided that it is loosely placed enabling its removal,<i data-commentator="Turei Zahav" data-order="8"></i> but <i data-commentator="Magen Avraham" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="נ"></i> wedging it in place is forbidden.
