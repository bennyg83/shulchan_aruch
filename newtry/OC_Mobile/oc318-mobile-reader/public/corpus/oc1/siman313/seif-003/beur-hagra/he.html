<b>ס"ג שאין נכנסים.</b> כמ"ש למטה:<br />
<b>אם יש.</b> כאביי:<br />
<b>או.</b> כרבא:<br />
<b>אפי' הם כו'.</b> שם בברייתא:<br />
<b>ובלבד כו'.</b> וכמ"ש בס"ה:<br />
<b>ופתח.</b> הרא"ש אמתני' דנגר וחילק בין כאן לנגר משום דכאן אינו קבוע ועט"ז וז"ש אפי' והוא נגרר. כיון דמדמה לנגר וכ"מ שם ברא"ש שאמר אפי' אין גבוהים כו':
