<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> If the prayer leader wants to bless for themself and read, another must stand next to them; because just <i data-commentator="Ateret Zekenim" data-label="♦" data-order="2"></i> like the Torah was given through <i data-commentator="Mishnah Berurah" data-label="טו"></i> a intermediary, so too we need to practice [reading]<i data-commentator="Mishnah Berurah" data-label="טז"></i> from it by means of an intermediary.
