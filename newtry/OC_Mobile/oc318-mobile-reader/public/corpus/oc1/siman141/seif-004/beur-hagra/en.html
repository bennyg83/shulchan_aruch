<b>Seif 4: If the chazzan, etc.</b> Yerushalmi, Megillah there; see the commentary there. It is cited by the Rif and by Tosafos, Bava Basra 15a, s.v. shemonah, and in the Tosefta there. The Rif and Rosh cite it there, siman 11: “A chazzan who stands to read,” etc.<br />
<b>Just as, etc.</b> Yerushalmi there.
