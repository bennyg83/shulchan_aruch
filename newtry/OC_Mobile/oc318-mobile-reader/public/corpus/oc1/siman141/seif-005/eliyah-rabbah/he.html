[ה] <b>על ידי סרסור וכו'.</b> כתב הלבוש בעל סגן עומד [כביכול] במקום השם יתברך שהרי מצוה לקרותו למי שישר בעיניו והשליח ציבור הוא סרסור במקום משה והעולה הוא המקבלה במקום כל ישראל ובשליחותו עד כאן. ועיין בתשובת נחלת שבעה סימן ל"ח באם בעל סגן הלך ועזב ספר תורה ראוי לענשו אם אדם חטא ספר תורה למה בייש וכו':
