<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> Owners of <i data-commentator="Mishnah Berurah" data-label="יח"></i> chains — e.g. hunters' dogs <i data-commentator="Mishnah Berurah" data-label="יט"></i> and small animals with etzba'ah-like band around neck and fixed ring — insert strap and pull by it — permitted go out with <i data-commentator="Mishnah Berurah" data-label="כ"></i> chain wrapped on neck and <i data-commentator="Mishnah Berurah" data-label="כא"></i> may pull by them.
