<i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> Donkey may go out with mard'at (small warming pad on donkey all day) if tied from erev Shabbat; other animals forbidden; may not go out with saddle even if tied from erev Shabbat.<small>(' <i data-commentator="Mishnah Berurah" data-label="כו"></i>)</small> והוא שתהא קשורה לו מע"ש <i data-commentator="Mishnah Berurah" data-label="כז"></i>ושאר כל הבהמות אסורות <i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="כח"></i>ולא יצא באוכף אע"פ שקשור לו מע"ש:
