<i data-commentator="Be'er HaGolah" data-label="ל" data-order="34"></i> <i data-commentator="Turei Zahav" data-order="9"></i>**15.** The beam must be placed with the intent to permit the <i data-commentator="Mishnah Berurah" data-label="נג"></i> alleyway. But if it was not made for <i data-commentator="Mishnah Berurah" data-label="נד"></i> that purpose, even if one relied on <i data-commentator="Magen Avraham" data-order="15"></i> it before Shabbat, it is invalid.
