<i data-commentator="Be'er HaGolah" data-label="מ" data-order="35"></i>**16.** The beam we mentioned must <i data-commentator="Mishnah Berurah" data-label="נה"></i> have a minimum size. Therefore,<i data-commentator="Be'er HaGolah" data-label="נ" data-order="36"></i> <i data-commentator="Mishnah Berurah" data-label="נו"></i> if it was made from the <i data-commentator="Mishnah Berurah" data-label="נז"></i> wood of an *asherah* it is invalid, since it is destined for burning its measurement is considered nullified (*ketutei mechtat shiureih*).
