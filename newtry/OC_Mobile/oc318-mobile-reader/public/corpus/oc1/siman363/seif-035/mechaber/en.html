<i data-commentator="Be'er HaGolah" data-label="ת" data-order="88"></i>**35.** The post used to reduce the alleyway's width need not be one solid post; reed by reed with gaps of less than three handbreadths suffices, since less than three handbreadths is' <i data-commentator="Mishnah Berurah" data-label="קנא"></i> treated as solid.
