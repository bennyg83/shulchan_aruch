<i data-commentator="Be'er HaGolah" data-label="ת" data-order="88"></i> This pas of which we spoke that one makes thus to reduce the width of the mavo — it need not be one complete pas; rather reed by reed less than three suffices, for less than' <i data-commentator="Mishnah Berurah" data-label="קנא"></i> three is considered complete:
