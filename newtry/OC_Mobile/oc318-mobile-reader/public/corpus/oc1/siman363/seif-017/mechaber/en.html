<i data-commentator="Be'er HaGolah" data-label="ס" data-order="37"></i>**17.** The required width of <i data-commentator="Mishnah Berurah" data-label="נח"></i> the beam is one handbreadth, and its thickness may be any amount, provided it <i data-commentator="Magen Avraham" data-order="16"></i> is strong <i data-commentator="Mishnah Berurah" data-label="נט"></i> enough to hold a half-brick (*arich*), which is three handbreadths. If <i data-commentator="Be'er HaGolah" data-label="ע" data-order="38"></i> it is four handbreadths wide, it need not be strong enough to hold a half-brick.
