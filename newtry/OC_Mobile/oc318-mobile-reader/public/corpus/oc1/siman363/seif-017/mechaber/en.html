<i data-commentator="Be'er HaGolah" data-label="ס" data-order="37"></i> The measure of the korah <i data-commentator="Mishnah Berurah" data-label="נח"></i>— a width of one tefach and a thickness of any amount, only that it <i data-commentator="Magen Avraham" data-order="16"></i> be strong <i data-commentator="Mishnah Berurah" data-label="נט"></i> enough to receive a brick that is half a brick of three tefachim;<i data-commentator="Be'er HaGolah" data-label="ע" data-order="38"></i> and if it is four tefachim wide it need not be strong enough to receive a brick:
