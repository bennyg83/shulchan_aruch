<b>33) There. One handbreadth wide. </b>The same applies to a tzuras hapesach: when a remnant remains, it must be one handbreadth wide. Tosefes Shabbos, end of subsection 10. Shaarei Teshuvah below, on se'if 26, writes concerning these words of Tosefes Shabbos that this is not conclusive. See there.
