<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i>**7.** Even <i data-commentator="Magen Avraham" data-order="6"></i> broken pieces, and pieces of broken pieces, are valid <i data-commentator="Mishnah Berurah" data-label="כה"></i> for a lechi.<small>Therefore,<i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> one may make a lechi <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Sha'arei Teshuvah" data-order="3"></i> from plaster spread on a wall, provided one takes care that <i data-commentator="Mishnah Berurah" data-label="כז"></i> it not be smeared <i data-commentator="Mishnah Berurah" data-label="כח"></i> away to less than three handbreadths from the ground.</small>
