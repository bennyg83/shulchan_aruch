<i data-commentator="Be'er HaGolah" data-label="ש" data-order="43"></i>**20.** If the beam is curved and the <i data-commentator="Mishnah Berurah" data-label="סד"></i> curve bends outside the alleyway, or above twenty handbreadths, or below ten handbreadths: we consider whether, if <i data-commentator="Mishnah Berurah" data-label="סה"></i> the curvature were removed, the gap between the two ends would be less than three handbreadths — if so, it <i data-commentator="Mishnah Berurah" data-label="סו"></i> is valid; if not, invalid.
