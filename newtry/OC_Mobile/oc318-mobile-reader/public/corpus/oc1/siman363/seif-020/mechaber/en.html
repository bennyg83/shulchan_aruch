<i data-commentator="Be'er HaGolah" data-label="ש" data-order="43"></i> If it was bent and its bend inclines <i data-commentator="Mishnah Berurah" data-label="סד"></i> outside the mavo, or above twenty [tefachim], or below ten — we view: whatever if one <i data-commentator="Mishnah Berurah" data-label="סה"></i> removed the bend and there are not three [tefachim] between this and that — it is valid; and if <i data-commentator="Mishnah Berurah" data-label="סו"></i> not — it is invalid:
