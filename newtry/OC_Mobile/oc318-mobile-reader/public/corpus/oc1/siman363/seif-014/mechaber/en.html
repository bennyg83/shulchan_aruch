<i data-commentator="Be'er HaGolah" data-label="י" data-order="32"></i>**14.** There is another valid arrangement for an alleyway open on the fourth side:<i data-commentator="Mishnah Berurah" data-label="מט"></i> a beam (*korah*) placed on <i data-commentator="Mishnah Berurah" data-label="נ"></i> top of the alleyway. It must rest on the alleyway wall. But if two <i data-commentator="Be'er HaGolah" data-label="כ" data-order="33"></i> <i data-commentator="Mishnah Berurah" data-label="נא"></i> pegs were driven outside the alleyway — even right next to it — and the beam was placed on them, it <i data-commentator="Mishnah Berurah" data-label="נב"></i> is invalid.
