<i data-commentator="Be'er HaGolah" data-label="י" data-order="32"></i> There is another qualification for a mavo breached on the fourth side — by a korah <i data-commentator="Mishnah Berurah" data-label="מט"></i> that one places on the head <i data-commentator="Mishnah Berurah" data-label="נ"></i> of the mavo; and it is required that he place it on the wall of the <i data-commentator="Be'er HaGolah" data-label="כ" data-order="33"></i> <i data-commentator="Mishnah Berurah" data-label="נא"></i> mavo; but if he drove two pegs next to the mavo outside, even close to it, and placed the korah on them — it <i data-commentator="Mishnah Berurah" data-label="נב"></i> is invalid:
