<i data-commentator="Be'er HaGolah" data-label="ד" data-order="70"></i>**27.** A <i data-commentator="Mishnah Berurah" data-label="קטז"></i> courtyard whose length exceeds its width has the status of an alleyway and may be permitted with a lechi or beam.<small>Even if no courtyards and houses open into it, since it is not adjacent to a public domain but opens to an alleyway which opens to the public domain.</small>
