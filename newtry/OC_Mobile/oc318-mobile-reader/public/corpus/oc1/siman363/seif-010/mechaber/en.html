<i data-commentator="Be'er HaGolah" data-label="ש" data-order="21"></i> <i data-commentator="Mishnah Berurah" data-label="לד"></i>**10.** If it was placed three handbreadths from the <i data-commentator="Mishnah Berurah" data-label="לה"></i> wall, or raised three handbreadths from the ground, it is invalid. But if <i data-commentator="Be'er HaGolah" data-label="ת" data-order="22"></i> it was raised less than three handbreadths from the ground, even if it is only seven handbreadths and a hairsbreadth high, it <i data-commentator="Mishnah Berurah" data-label="לו"></i> is valid.
