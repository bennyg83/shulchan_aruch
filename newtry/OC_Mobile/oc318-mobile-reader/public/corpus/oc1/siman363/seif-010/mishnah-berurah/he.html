(לד) הרחיק מהכותל שלש - אע"ג דכבר שנאו בס"ו חזר ושנאו לאשמועינן שהוא לעיכובא:<br />
(לה) או שהגביהו מהארץ שלש - היינו אף דאית בלחי עשרה טפחים והטעם דלא עדיפא ממחיצה שנטולה שלשה טפחים מן הארץ דפסולה משום דהוי מחיצה שהגדיים בוקעין תחתיה דלא שמה מחיצה:<br />
(לו) כשר - מטעם לבוד והוי כמלא זה המקום הפנוי:
