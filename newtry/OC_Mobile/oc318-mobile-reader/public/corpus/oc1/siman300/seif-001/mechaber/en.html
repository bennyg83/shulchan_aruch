<b>A person must always arrange his table</b><br> <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> on <i data-commentator="Mishnah Berurah" data-label="א"></i> Motza'ei Shabbat <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Sha'arei Teshuvah" data-order="1"></i> in order to escort <i data-commentator="Mishnah Berurah" data-label="ב"></i> the Shabbat <i data-commentator="Mishnah Berurah" data-label="ג"></i>[out], even if he needs only a k'zayit.
