<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i>3. Those participating in the meal may not partake <i data-commentator="Mishnah Berurah" data-label="ז"></i>[of the bread] until the person breaking bread [first] partakes [of <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> the bread that he cuts]. If, however, two loaves <i data-commentator="Mishnah Berurah" data-label="ח"></i> are placed before each one of them, they may partake of their bread even though he has not yet partaken of his.
