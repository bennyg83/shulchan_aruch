<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> Some say that that which we taught about the sanctity of a house of study is speaking about a public one which is similar to a synagogue, but an individual who establishes a room for Torah study in his <i data-commentator="Mishnah Berurah" data-label="יד"></i> home for his needs, that room doesn't have that much sanctity.
