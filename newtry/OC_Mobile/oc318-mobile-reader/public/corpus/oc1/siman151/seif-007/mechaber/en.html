<i data-commentator="Be'er HaGolah" data-label="ל" data-order="13"></i> One may <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> spit in <i data-commentator="Ba'er Hetev" data-order="9"></i>[the synagogue] as long <i data-commentator="Mishnah Berurah" data-label="כה"></i> as you rub it out with your feet or if there are <i data-commentator="Mishnah Berurah" data-label="כו"></i> reeds there that if you spit into them, it will not be visible.
