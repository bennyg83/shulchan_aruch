<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="יז"></i> For the needs of the synagogue, one may <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="יח"></i> eat and sleep <i data-commentator="Ba'er Hetev" data-order="6"></i> in it.<i data-commentator="Mishnah Berurah" data-label="יט"></i> For this reason, one may sleep in a synagogue the night of Yom Kippur. And even for the needs of another mitzvah; for example, when people gather to make a leap <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="כ"></i> year in <i data-commentator="Ba'er Hetev" data-order="7"></i> the synagogue, it would be permissible to eat there.
