<i data-commentator="Turei Zahav" data-order="10"></i> <i data-commentator="Ba'er Hetev" data-order="21"></i> <i data-commentator="Be'er HaGolah" data-label="ד" data-order="26"></i> Fruit buried in straw or hay <i data-commentator="Mishnah Berurah" data-label="לה"></i> that are muktzeh —<i data-commentator="Mishnah Berurah" data-label="לו"></i> one may poke <i data-commentator="Turei Zahav" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="לז"></i> into them with a needle or thorn and <i data-commentator="Ba'er Hetev" data-order="22"></i> take them, and the hay is shaken off by itself.<small>And if buried in sand and earth <i data-commentator="Mishnah Berurah" data-label="לח"></i>— see above siman 308 seif 38.</small>
