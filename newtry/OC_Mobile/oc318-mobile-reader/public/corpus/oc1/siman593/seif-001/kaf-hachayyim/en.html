<b>1) [Seif 1] The blessings of Rosh Hashanah and Yom Kippur.  </b>This means Yom Kippur of the Yovel year, on which Malchuyos, Zichronos, and Shofaros are also recited. Magen Avraham, s.k. 1; Eliyah Rabbah, os 1. So too is it stated in the Beit Yosef and Bach, and so too wrote the later authorities.
