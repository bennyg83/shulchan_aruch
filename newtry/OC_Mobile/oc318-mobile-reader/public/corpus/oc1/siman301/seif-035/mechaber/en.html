<i data-commentator="Magen Avraham" data-order="48"></i> <i data-commentator="Be'er HaGolah" data-label="ג" data-order="72"></i> <i data-commentator="Mishnah Berurah" data-label="קל"></i> With stiff bolts of cloth it is forbidden to bring them into the public domain or karmelis while wrapped in them as in a garment; if they are not very stiff, it <i data-commentator="Mishnah Berurah" data-label="קלא"></i> is permitted.
