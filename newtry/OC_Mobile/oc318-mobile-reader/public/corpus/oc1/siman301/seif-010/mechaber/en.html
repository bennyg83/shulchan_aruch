<i data-commentator="Be'er HaGolah" data-label="ת" data-order="23"></i> A ring containing a stone, and also one that has letters written on it, is not considered [a ring with] a seal, for <i data-commentator="Mishnah Berurah" data-label="לט"></i> the term <i data-commentator="Mishnah Berurah" data-label="מ"></i>“seal” refers only to engraved <i data-commentator="Magen Avraham" data-order="17"></i> letters <i data-commentator="Ba'er Hetev" data-order="9"></i> or designs.
