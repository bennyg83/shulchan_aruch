<i data-commentator="Be'er HaGolah" data-label="ת" data-order="23"></i> A ring in which a stone is set, and likewise if letters are written on it — is not called having <i data-commentator="Mishnah Berurah" data-label="לט"></i> a seal <i data-commentator="Mishnah Berurah" data-label="מ"></i> unless letters or forms are <i data-commentator="Magen Avraham" data-order="17"></i> engraved <i data-commentator="Ba'er Hetev" data-order="9"></i> on it.
