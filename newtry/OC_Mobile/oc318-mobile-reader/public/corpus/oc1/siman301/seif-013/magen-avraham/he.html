<b>סינר מלפניה ומאחריה</b>. אבל אם הוא מאחריה בלבד וקושרתו ברצועות לפניה אסור [הג"מ פי"ט]:<br />
<b>קושרתו</b>. נקט קושרתו דבלא קשירה לא מתקיים כלל כיון שתלוי לפניה דלא כע"ש דמשוי לטור והרב"י טועה ולא עיין בסי' ש"ג סט"ו:<br />
<b>שלא יכאב</b>. היינו שלא יפול על בשר' ויתייבש עליה ונמצא מצערה [תוספות]:
