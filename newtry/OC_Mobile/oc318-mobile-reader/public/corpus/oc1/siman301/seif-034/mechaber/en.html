<i data-commentator="Be'er HaGolah" data-label="א" data-order="70"></i> A person may go <i data-commentator="Turei Zahav" data-order="24"></i> <i data-commentator="Magen Avraham" data-order="47"></i> out with <i data-commentator="Mishnah Berurah" data-label="קכז"></i> a sudar folded on his shoulders even <i data-commentator="Mishnah Berurah" data-label="קכח"></i> though he did not wrap a thread around his finger; and if the sudar <i data-commentator="Be'er HaGolah" data-label="ב" data-order="71"></i> <i data-commentator="Mishnah Berurah" data-label="קכט"></i> does not cover his head and most of his body, it is forbidden to go out with it unless he ties both its ends together below his shoulders, one with the other.
