<i data-commentator="Turei Zahav" data-order="19"></i> <i data-commentator="Be'er HaGolah" data-label="צ" data-order="65"></i> It is permitted to go out in <i data-commentator="Mishnah Berurah" data-label="קטו"></i> the public domain <i data-commentator="Magen Avraham" data-order="43"></i> with a tallit around the neck.<small>Even though he places the right side on his left shoulder, for such is the way of wearing it, and it is only for adornment and is permitted [Beit Yosef].]:</small>
