<i data-commentator="Turei Zahav" data-order="19"></i> <i data-commentator="Be'er HaGolah" data-label="צ" data-order="65"></i> It is permitted to go out into the public domain with a tallis around one's neck. RAMA: even though the right side <i data-commentator="Mishnah Berurah" data-label="קטו"></i> will lay on the left shoulder, this is the normal <i data-commentator="Magen Avraham" data-order="43"></i> way it is worn, and this is nothing more than beautifying (the mitzvah) and is permitted. [Beis Yosef]<small>]:</small>
