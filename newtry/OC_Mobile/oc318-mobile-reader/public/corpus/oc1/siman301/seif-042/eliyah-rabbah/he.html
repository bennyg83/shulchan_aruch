[מב] <b>מחובר וכו'.</b> דוקא תופר שתי תפירות אבל קשירה אינו מועיל (באר שבע). צריך עיון מה שנא מעגולים ירוקים דמיירי כשמחובר קצת ונראה לי דאותן בטלים טפי לבגד (מגן אברהם), ולי נראה כיון דממשמש מטפחת לקנח אתא לאפסוקא אם לא יהיה מחובר היטב ואתא לאתוי מה שאין כן בעגולים ירוקים דמתירא דילמא יפסיק ואין ממשמש:
