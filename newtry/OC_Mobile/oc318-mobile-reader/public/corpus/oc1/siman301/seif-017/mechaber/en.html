<i data-commentator="Be'er HaGolah" data-label="ל" data-order="35"></i> A lame person who cannot walk without a cane may <i data-commentator="Mishnah Berurah" data-label="סג"></i> walk with it even if it is not tied to him; but if he can walk without it <i data-commentator="Magen Avraham" data-order="27"></i> <i data-commentator="Mishnah Berurah" data-label="סד"></i> and takes it only to support himself, it is forbidden [and a <i data-commentator="Mishnah Berurah" data-label="סה"></i> sick person who rose from his illness <i data-commentator="Turei Zahav" data-order="12"></i> <i data-commentator="Ba'er Hetev" data-order="17"></i> <i data-commentator="Sha'arei Teshuvah" data-order="17"></i>— his law is like a <i data-commentator="Mishnah Berurah" data-label="סו"></i> lame person] [Rokeach].<small>[<i data-commentator="Mishnah Berurah" data-label="סז"></i>]</small>:
