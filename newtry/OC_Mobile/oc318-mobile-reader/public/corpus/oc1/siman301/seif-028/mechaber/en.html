<i data-commentator="Be'er HaGolah" data-label="נ" data-order="60"></i> One who has a wound on his foot and ties a coin on it to protect lest he strike it with his other foot — and it <i data-commentator="Magen Avraham" data-order="41"></i> <i data-commentator="Mishnah Berurah" data-label="קח"></i> also heals —<i data-commentator="Ba'er Hetev" data-order="25"></i> is permitted <i data-commentator="Mishnah Berurah" data-label="קט"></i> to go out with it.
