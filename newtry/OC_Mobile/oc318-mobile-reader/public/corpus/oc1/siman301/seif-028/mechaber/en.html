<i data-commentator="Be'er HaGolah" data-label="נ" data-order="60"></i> Anyone who has a wound on his foot (that is healed by) tying to it a coin may go out [to the public domain] with [the coin bound to his foot on Shabbos]. Since it is a <i data-commentator="Magen Avraham" data-order="41"></i> <i data-commentator="Mishnah Berurah" data-label="קח"></i> healing agent, it is <i data-commentator="Ba'er Hetev" data-order="25"></i> considered as an <i data-commentator="Mishnah Berurah" data-label="קט"></i> ornament (and as a garment) for him.
