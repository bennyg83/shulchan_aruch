<i data-commentator="Be'er HaGolah" data-label="ט" data-order="78"></i> It is permitted to go <i data-commentator="Mishnah Berurah" data-label="קלח"></i> out on Shabbat wearing <i data-commentator="Turei Zahav" data-order="26"></i> <i data-commentator="Mishnah Berurah" data-label="קלט"></i> gloves called guantes; and some are <i data-commentator="Be'er HaGolah" data-label="י" data-order="79"></i> stringent to require that they be sewn <i data-commentator="Magen Avraham" data-order="50"></i> on the eve of Shabbat to the sleeves of his garments, or that <i data-commentator="Mishnah Berurah" data-label="קמ"></i> they be tied to them with a durable knot; and <i data-commentator="Ba'er Hetev" data-order="31"></i> <i data-commentator="Mishnah Berurah" data-label="קמא"></i> it is fitting to heed his words.
