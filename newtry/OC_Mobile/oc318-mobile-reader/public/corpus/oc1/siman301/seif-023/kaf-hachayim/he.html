<b>כג) שם הנה.  </b>ועיין לקמן סי' תרי"ג סעי' ה' ובסעי' ח' בהגה, ור"ל דשם כתב מור"ם ז"ל בהגה דכל מקום שמותר לעבור במים אפי' היה לו דרך שיוכל להקיף ביבשה מותר לעבור דלמעט בהילוך עדיף טפי עכ"ל, אמנם הט"ז והמ"א שם כתבו דיש להחמיר ואין לעבור במים אם אפשר בהליכה ואעפ"י שמרבה בהילוך יעו ש. וכ"פ הר"ז שם או' י"ג:
