<b>של</b> עט״ז משמע מדבריו דבכסף אפי׳ תלוי באמצע חגורה או ברזל ושלשלת כסף נמי תכשיט ושרי ול״ש דלמא מחוי דקשור הוא בחגורה אף למאן דאוסר תכשיט לאיש בס״ט ול״ח דלמא יתיר כל החגורה בשוק להא לא חיישינן אבל ברזל לחוד אם עשוי בזענק״ל דהיינו כעין קרס שרי דבטל לגבי האזור אף אם יש בצד אחד תפתח בו ועמ״א אות י״ח:
