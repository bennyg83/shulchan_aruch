<b> אם צריך לו</b> -  עיין במ"ב די"א דהיינו שירא שלא יגזלוהו ולכאורה לפי מאי דמסקינן לקמן דמותר במקום פסידא להוציא המעות שלא כדרך הוצאה א"כ למה בעי רמ"א כלל הכא מנוקבים אפילו לענין להוציאם בידו מי חמיר איסור מוקצה מהוצאה ע"י שינוי ואולי י"ל דהרמ"א קאי הכא להקל אליבא דכו"ע דשם הלא הוא רק לדעת היש מתירין:
