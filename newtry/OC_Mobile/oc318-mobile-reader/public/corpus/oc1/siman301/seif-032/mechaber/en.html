<i data-commentator="Magen Avraham" data-order="45"></i> <i data-commentator="Be'er HaGolah" data-label="ש" data-order="68"></i> One who goes out with money bound in the cloth he is wearing <i data-commentator="Mishnah Berurah" data-label="קיט"></i> is liable.<small>But <i data-commentator="Turei Zahav" data-order="22"></i> in the house it <i data-commentator="Mishnah Berurah" data-label="קכ"></i> is permitted if he needs them, even if they are not bound — only <i data-commentator="Mishnah Berurah" data-label="קכא"></i> if they are <i data-commentator="Ba'er Hetev" data-order="28"></i> pierced into the garment.</small>
