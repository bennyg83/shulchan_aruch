<i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Be'er HaGolah" data-label="פ" data-order="18"></i> <i data-commentator="Mishnah Berurah" data-label="ל"></i> One may not go out with a machat stuck <i data-commentator="Magen Avraham" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="לא"></i> into his garment, whether <i data-commentator="Magen Avraham" data-order="15"></i> pierced or not <i data-commentator="Mishnah Berurah" data-label="לב"></i> pierced; and if he went out with <i data-commentator="Be'er HaGolah" data-label="צ" data-order="19"></i> a pierced one <i data-commentator="Mishnah Berurah" data-label="לג"></i> he is liable, and with an unpierced one he is exempt; and some <i data-commentator="Be'er HaGolah" data-label="ק" data-order="20"></i> say <i data-commentator="Ba'er Hetev" data-order="8"></i> the opposite.
