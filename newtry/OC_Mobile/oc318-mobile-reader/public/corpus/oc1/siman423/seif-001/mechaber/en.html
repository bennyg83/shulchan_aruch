<b>The order for reading the Torah on Rosh Ḥodesh, with four clauses:</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> One says the full <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> Kaddish etc, and we' <i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> bring out the Torah scroll, and four read from it — no fewer than that and no more than that, and nobody does a concluding reading from the prophets.
