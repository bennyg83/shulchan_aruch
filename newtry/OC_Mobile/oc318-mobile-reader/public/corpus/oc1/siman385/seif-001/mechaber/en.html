<b>דין צדוקי ומומר בעירוב. ובו ד סעיפים:</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> The law of a Sadducee and an apostate in eruv. And it contains 4 seifim. A Sadducee — behold he is like a Jew <i data-commentator="Mishnah Berurah" data-label="ב"></i> and can nullify his domain; but an eruv is not effective since he does not acknowledge [the validity of] eruv.
