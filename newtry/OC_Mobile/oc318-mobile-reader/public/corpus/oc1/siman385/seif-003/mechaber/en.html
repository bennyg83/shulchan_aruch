<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Magen Avraham" data-order="2"></i> A Jew <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> who apostatized to idol worship, or <i data-commentator="Mishnah Berurah" data-label="ד"></i> to desecrate Shabbat publicly — even <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> if he violates only a d'rabbanan prohibition — behold he <i data-commentator="Mishnah Berurah" data-label="ה"></i> is like a gentile. But if he violates only <i data-commentator="Mishnah Berurah" data-label="ו"></i> in private, even a d'oraisa prohibition — behold he is like a Jew and can nullify his domain.
