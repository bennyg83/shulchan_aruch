<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Magen Avraham" data-order="2"></i> A Jew <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> who has apostatized to idolatry,<i data-commentator="Mishnah Berurah" data-label="ד"></i> or who desecrates the Sabbath publicly <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i>— even if he violates only a rabbinic prohibition —<i data-commentator="Mishnah Berurah" data-label="ה"></i> is like a non-Jew. But if he violates <i data-commentator="Mishnah Berurah" data-label="ו"></i> only in private, even a Torah prohibition, he is like a Jew and can nullify his domain.
