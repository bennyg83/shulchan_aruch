<b>The Laws of the Lulav on the First Day of Yom Tov. Containing</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i>9 paragraph: By Torah law, the mitzvah of lulav only applies on the <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> first day outside <i data-commentator="Ba'er Hetev" data-order="1"></i> of the Temple, but the Sages decreed that one should do it everywhere for all seven days.
