<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="ל"></i> After one finished the eighteen blessings [of the Amidah], [but] before [one said] &quot;Elokai, netzor&quot;, one may answer Kedusha, Kaddish, and Barchu. [And see below in Siman 122].<small>[]:</small>
