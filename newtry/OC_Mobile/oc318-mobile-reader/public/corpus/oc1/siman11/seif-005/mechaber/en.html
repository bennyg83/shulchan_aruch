<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> One does not make &lt;i&gt;tzitzis&lt;/i&gt; from wool caught on thorns when sheep lie among them, nor from threads pulled from an animal, nor from weaver’s remnant left at <i data-commentator="Mishnah Berurah" data-label="כו"></i> the end of the garment — the reason <i data-commentator="Turei Zahav" data-order="4"></i> is <i data-commentator="Magen Avraham" data-order="9"></i> degrading a <i data-commentator="Ba'er Hetev" data-order="6"></i> mitzvah.
