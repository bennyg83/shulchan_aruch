<b>“Two-thirds <i>anaf</i>.”</b> Gemara says beauty of <i>tekheles</i> — third <i>gdil</i> two-thirds <i>anaf</i> — obvious not <i>meakev bedieved</i>.<br>
<br>
<b>“And in the second nine.”</b> In Arizal’s kavanos written second [space] eight — explained there per kabbalah — fit to heed his tradition.
