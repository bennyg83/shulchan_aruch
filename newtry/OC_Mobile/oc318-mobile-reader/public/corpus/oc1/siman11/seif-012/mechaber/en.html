<i data-commentator="Be'er HaGolah" data-label="א" data-order="23"></i> The number of &lt;i&gt;tzitzis&lt;/i&gt; strands in each corner — four <i data-commentator="Turei Zahav" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="נח"></i> doubled, which are eight; if <i data-commentator="Mishnah Berurah" data-label="נט"></i> one added [beyond eight] it is invalid <i data-commentator="Mishnah Berurah" data-label="ס"></i>— cut <i data-commentator="Turei Zahav" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="סא"></i> the tips of the four long strands, insert them into <i data-commentator="Magen Avraham" data-order="18"></i> <i data-commentator="Ba'er Hetev" data-order="19"></i> the corner and fold them — then there will be eight.':
