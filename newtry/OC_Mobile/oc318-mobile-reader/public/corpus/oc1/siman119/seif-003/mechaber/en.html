<i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i> If one skipped [something] or erred in one of the middle blessings, one only needs to go back to the beginning of the blessing in which one <i data-commentator="Mishnah Berurah" data-label="יד"></i> made the mistake in or skipped [something]; and from that point onwards, one goes back in the order <i data-commentator="Turei Zahav" data-order="3"></i>[of the rest <i data-commentator="Mishnah Berurah" data-label="טו"></i> of <i data-commentator="Ba'er Hetev" data-order="6"></i> <i data-commentator="Sha'arei Teshuvah" data-order="6"></i> the Amidah].
