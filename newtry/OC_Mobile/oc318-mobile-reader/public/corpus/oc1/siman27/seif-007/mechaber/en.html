<i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> Even though a man has <i data-commentator="Magen Avraham" data-order="11"></i> a wound in the place where the tefillin rests, he [still] puts on tefillin because there <i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> is space on the arm to place two [boxes] of tefillin , because from the middle of the bone that's close to the armpit until <i data-commentator="Mishnah Berurah" data-label="כט"></i> the elbow, [that entire area] is the place to put on tefillin .
