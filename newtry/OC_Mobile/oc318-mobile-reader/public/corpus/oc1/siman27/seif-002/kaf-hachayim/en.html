<b>(2) There — between the cubit and armpit.</b> We learn from "it shall be for you a sign and not for others" — outsiders should not see; one's way is to expose until the cubit and from there it is "for you" not others (Levush; Taz s"k 2; Shitilei Zeitim 3; see Chaki Chaim drosh 3 on donning tefillin).
