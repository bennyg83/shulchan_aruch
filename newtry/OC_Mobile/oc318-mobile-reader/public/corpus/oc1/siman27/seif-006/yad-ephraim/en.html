<b>Magen Avraham s.k. 8</b> — arm tefillin this way: on rags with garment over — else "not for others" fails; do not say head-only berachah suffices bedi'eved when Mechaber holds one berachah for donning alone; even arm this way with no berachah — do not bless lest chatzitzah disqualifies (some hold).
