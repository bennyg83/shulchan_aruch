<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> The correct custom is to affix the ma'abarta , [the part] that the strap passes through it (that sticks out in the back of the tefillin), so that it rests on the side [of the arm toward] the shoulder, and <i data-commentator="Mishnah Berurah" data-label="יב"></i> the box [should be toward] to the side of the hand.
