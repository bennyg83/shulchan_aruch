<b>ג' כריכות</b>. ב' בפרק התחתון וא' בפרק העליון (כוונת ושל"ה) והעולם נהגו בדרכים אחרים ואין להם עיקר בגמ' ובפוסקים:<br>
<b>שבעה</b>. ובכוונות כתוב לעשות ז' כריכות וכ"כ של"ה:<br>
<b>התיתורא</b>. רק יהא תלוי כעין של ראש (ד"מ מהרי"ל) ומ"מ בשעת הנחה יניח הרצועה עליה שלא תזוז ממקומה עד שיניח ש"ר ואח"כ יסירנה ויכרוך (ע"ה):
