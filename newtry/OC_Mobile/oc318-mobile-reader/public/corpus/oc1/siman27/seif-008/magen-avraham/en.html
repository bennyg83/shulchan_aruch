<b>Three wrappings.</b> Two lower knuckle, one upper (kavanah Shelah); world practices otherwise — no Gemara/poskim source.<br>
<br>
<b>Seven.</b> Kavanot — seven wrappings; so Shelah.<br>
<br>
<b>Titura.</b> Hang like head (Maharil); when donning place strap on it lest shift until head donned, then remove and wrap (Eliyahu Rabbah).
