[ה] <b>הכובע הדק וכו'.</b> והב"ח אוסר בשעת קריאת שמע ותפילה אלא יהא בלא חציצה כלל. בספר מקור חיים כתב טוב להורות לבני ישראל להבטיח אותם אל יחושו לענין זה, כי מי שמניח תפילין בכוונה נכונה בלי ספק לא יאונה לצדיק וכו' עד כאן. ובשל יד משמע בב"ח וט"ז דלכולי עלמא אסור, אבל במטה משה מתיר להניח על סמרטוטין:
