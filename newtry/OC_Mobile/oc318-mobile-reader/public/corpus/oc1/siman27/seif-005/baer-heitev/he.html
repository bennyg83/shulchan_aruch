<b>דק. </b> ועל כובע עבה אסור. ואם יש לו מכה ביד אסור להניחם על הבגד משום לך לאות ולא לאחרים לאות אבל מותר להניחו על החלוק אם לא סגי בלא"ה דהא לבוש בגד אחר עליו. מ"א:<br>
<b>של יד. </b> וה"ה אם מניח של יד בדרך זה שלא יברך על ש"י אלא על של ראש מ"א. וכתב הב"ח מ"מ בשעת ק"ש ותפלה יראה שיהא זולת חציצה ע"ש:
