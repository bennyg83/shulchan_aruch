<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i>5. It seems to me that our practice during the rest of the year to eulogize and mention <i data-commentator="Mishnah Berurah" data-label="ח"></i> the soul of the dead is <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> not included <i data-commentator="Ba'er Hetev" data-order="2"></i> in this prohibition, it is permitted within the <i data-commentator="Mishnah Berurah" data-label="י"></i> thirty days prior to the holiday.
