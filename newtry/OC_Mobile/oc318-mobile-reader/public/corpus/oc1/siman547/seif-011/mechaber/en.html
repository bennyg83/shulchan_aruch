<i data-commentator="Be'er HaGolah" data-label="ת" data-order="22"></i>11. We do not dig crypts or build graves on Chol Hamoed so that they can <i data-commentator="Mishnah Berurah" data-label="כד"></i> be ready for somebody who will die. However, we may adjust one. If <i data-commentator="Be'er HaGolah" data-label="א" data-order="23"></i> it is too long, we shorten it, or lengthen it, or widen it.
