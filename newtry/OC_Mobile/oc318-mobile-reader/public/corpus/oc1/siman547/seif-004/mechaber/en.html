4.<i data-commentator="Turei Zahav" data-order="2"></i> If somebody hears <i data-commentator="Ba'er Hetev" data-order="1"></i> of a death within thirty days of a festival, it seems <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="ז"></i> to me that is permissible to eulogize, even if this report comes from far away.
