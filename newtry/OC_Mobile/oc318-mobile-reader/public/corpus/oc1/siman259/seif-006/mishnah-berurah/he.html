(טז) להטמין באבנים - היינו אפילו אם יחדן לכך מכבר דלית בהן משום מוקצה:<br />
(יז) משום דהוי וכו' - היינו דסידור האבנים דהוי כמו דופן הוי בכלל בנין עראי ואסור מדרבנן ביו"ט:<br />
(יח) ויש מתירים - ס"ל דמשום כבוד שבת לא גזרו ואם אפשר להטמין בענין אחר אסור לכו"ע ועיין בא"ר שכתב שהמנהג כהיש מתירים וכ"כ הגר"ז:
