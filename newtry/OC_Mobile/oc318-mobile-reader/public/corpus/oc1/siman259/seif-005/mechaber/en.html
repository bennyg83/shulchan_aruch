<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> One who insulates and covers (a pot) with something that <i data-commentator="Ba'er Hetev" data-order="5"></i> is not removable, if the muktzeh of the pot is exposed, one removes it and returns it, and if not we do not remove it.
