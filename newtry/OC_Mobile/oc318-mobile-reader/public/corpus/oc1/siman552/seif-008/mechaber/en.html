<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="יט"></i>8. One should be <i data-commentator="Magen Avraham" data-order="9"></i> cautious not to <i data-commentator="Ba'er Hetev" data-order="9"></i> sit in a group of three at the Parting Meal in order that they will not become obligated in a Zimun; rather, each one sits alone and blesses (i.e. Birkat Hamazon) alone.
