<b>(12) To add</b> the juice of unripe grapes or vinegar to the cooked dish that one eats at the seudah ha'mafsekes is certainly permitted. Zera Avraham in his responsa on Orach Chayyim siman 79. The Machberes os 3 cited his words and wrote that this is obvious. Zechor L'Avraham ibid. Sha'arei Teshuvah.
