(א) לא יאכל וכו' - כדי להרבות אבל ולזכור חורבן הבית ויצטער עליו:<br />
(ב) שאוכלה אחר חצות - עיין לקמן בס"ט:<br />
(ג) בשר וכו' - היינו מדינא דש"ס דאלו מצד מנהגא אסור מר"ח וכדלעיל בסימן תקנ"א:<br />
(ד) ממעט - היינו בסעודה מפסקת שאם רגיל לשתות בסעודה ד' כוסות ישתה ג' כוסות. ואין לשתות שכר ואם הוא אדם חלש שרי:
