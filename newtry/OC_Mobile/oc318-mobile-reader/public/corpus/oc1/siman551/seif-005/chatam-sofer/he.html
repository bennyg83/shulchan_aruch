<small>שם</small> במחבר סעיף ב' עיין דגול מרבבה שם. נ"ב נראה לי בשבת שאשתו הולכת לבהכנ"ס עדיף מאב קודם חתונת בנו דבעל חיוב משא"כ האב הגם שהחתן קודם לבעל האשה לענין חיוב עיין מג"א סי' רפ"ב ואין הבעל דומה לחתן לפני החתונה כשמזמרין אותו מכל מקום גם לאב החתן אינו דומה ועדיף טובא כמובן כנ"ל. [מהגאון כ"ס]:
