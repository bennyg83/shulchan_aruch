<i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ח"></i> On the water in which <i data-commentator="Mishnah Berurah" data-label="ט"></i> vegetables <i data-commentator="Ba'er Hetev" data-order="4"></i> were cooked <i data-commentator="Mishnah Berurah" data-label="י"></i> one blesses the same blessing that <i data-commentator="Mishnah Berurah" data-label="יא"></i> one blesses on the vegetables themselves, even if <i data-commentator="Mishnah Berurah" data-label="יב"></i> there is only the taste of the vegetable in them. And this is when they cooked them without meat; but <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> if they cooked <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Sha'arei Teshuvah" data-order="5"></i> <i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i> them with meat one blesses on it shehakol.
