<b>לארץ</b>. ונ"ל דמותר לישב על השק דאינו אלא מנהג לישב ע"ג קרקע עבי"ד ססי' שפ"ז:<br />
<b>אחר שיצאו מבה"כ</b>. דהולכים על הקברות והוי עד חצות דאז רשאי לישב על הספסל וכ"ה במנהגים:<br />
<b>נר א'</b>. ומהרי"ל כתב להדליק עוד נר א' שאם יכב' נר החזן ידליק ממנו משמע שהקהל לא יאמרו איכ' וקינות רק ישמעו מהש"ץ:
