<i data-commentator="Be'er HaGolah" data-label="ס" data-order="17"></i> <i data-commentator="Turei Zahav" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="לט"></i> We are accustomed <i data-commentator="Magen Avraham" data-order="14"></i> not to slaughter animals, or prepare for any needs of a <i data-commentator="Mishnah Berurah" data-label="מ"></i> meal, until <i data-commentator="Ba'er Hetev" data-order="16"></i> after chatzot.<small>Rema: and we go to <i data-commentator="Magen Avraham" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="מא"></i> visit <i data-commentator="Ba'er Hetev" data-order="17"></i> graves directly after synagogue [Beit Yosef in the name of Tosafot] and if it happens that someone dies on Tisha b'Av,<i data-commentator="Mishnah Berurah" data-label="מב"></i> we do not say &quot;Righteous is the Judge&quot; {Tashbe&quot;tz])</small>:
