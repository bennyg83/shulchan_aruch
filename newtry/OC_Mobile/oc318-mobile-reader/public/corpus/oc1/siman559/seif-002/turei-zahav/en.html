<b>They pray Maariv.</b> And they say Kaddish with Tiskabel; but after Eicha until midway after leaving the synagogue, Kaddish without Tiskabel; so is written in the Minhagim.<br />
<b>One does not say VeYehi Noam.</b> Because it was instituted regarding the erection of the Mishkan, and now it is destroyed.
