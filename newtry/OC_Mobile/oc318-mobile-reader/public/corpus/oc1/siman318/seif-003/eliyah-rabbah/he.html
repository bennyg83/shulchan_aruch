[ג] <b>[לבוש] ולפי מה שכתבתי מותר וכו'.</b> ואם היה יום טוב אסור דאין שבת מכין ליום טוב (מהרי"ו ב'). אם נתערב אותו דבר בהיתר בשבת הוי דבר שיש לו מתירין לאחרים ולא בטילי, ולפי מה שכתבתי בטל ומותר גם לו (מגן אברהם), ועיין בספרי ליו"ד סוף סימן ק"ב ובס"ק י"א שם כתבתי לתרץ שלא יהיה דברי לבוש דהתם סותרים להכא:
