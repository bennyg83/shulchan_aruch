<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i>7. There are commentators that permit placing a vessel that has something hot inside it on an insulated pot even if the bottom <i data-commentator="Turei Zahav" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="נה"></i> vessel is on the fire. And <i data-commentator="Mishnah Berurah" data-label="נו"></i> there are commentators who say that if the bottom pot is on the fire, it is <i data-commentator="Magen Avraham" data-order="24"></i> forbidden [to <i data-commentator="Ba'er Hetev" data-order="21"></i> do so].
