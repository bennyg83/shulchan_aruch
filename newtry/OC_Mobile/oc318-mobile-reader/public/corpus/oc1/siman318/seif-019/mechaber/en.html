<i data-commentator="Be'er HaGolah" data-label="י" data-order="32"></i>19. It is forbidden to baste a roast <i data-commentator="Turei Zahav" data-order="24"></i> with oil <i data-commentator="Magen Avraham" data-order="45"></i> <i data-commentator="Mishnah Berurah" data-label="קיח"></i> or <i data-commentator="Ba'er Hetev" data-order="42"></i> garlic while near a fire, even if it was roasted before Shabbos, because the garlic and oil will cook.
