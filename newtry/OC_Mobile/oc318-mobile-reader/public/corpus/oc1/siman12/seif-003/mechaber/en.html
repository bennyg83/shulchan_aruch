<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> Kedei aniva for Rashi is measured from the anaf [free-hanging threads]; for Ri even if the entire anaf was cut and only from the gdil [knot windings] enough remains to tie, it is valid; the world’s custom follows Rashi, and where impossible <i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Ba'er Hetev" data-order="6"></i> <i data-commentator="Sha'arei Teshuvah" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i> one may rely on Ri.
