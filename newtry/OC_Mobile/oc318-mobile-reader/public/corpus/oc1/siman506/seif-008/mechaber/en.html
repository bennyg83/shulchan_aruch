<i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="מ"></i> It is forbidden to make chametz on Yom Tov except <i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> with an alteration, because it <i data-commentator="Mishnah Berurah" data-label="מא"></i> was possible to make it while it was still day [before Yom Tov].
