<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> One who separates challah on Yom <i data-commentator="Turei Zahav" data-order="8"></i> <i data-commentator="Magen Avraham" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="כח"></i> Tov and <i data-commentator="Ba'er Hetev" data-order="9"></i> it is <i data-commentator="Ba'er Hetev" data-order="10"></i> <i data-commentator="Sha'arei Teshuvah" data-order="10"></i> <i data-commentator="Magen Avraham" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="כט"></i> impure he should not bake it nor burn it, for <i data-commentator="Mishnah Berurah" data-label="ל"></i> we do not burn sacred items on Yom Tov. Rather, he <i data-commentator="Mishnah Berurah" data-label="לא"></i> should set it aside until evening and burn it.
