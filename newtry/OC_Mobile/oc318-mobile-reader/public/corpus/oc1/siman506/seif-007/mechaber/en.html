<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> <i data-commentator="Magen Avraham" data-order="16"></i> If a person <i data-commentator="Mishnah Berurah" data-label="לה"></i> has much fine bread,<i data-commentator="Mishnah Berurah" data-label="לו"></i> he may not <i data-commentator="Mishnah Berurah" data-label="לז"></i> bake other <i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> bread unless he has household <i data-commentator="Mishnah Berurah" data-label="לח"></i> members whom he regularly feeds coarse bread.<i data-commentator="Mishnah Berurah" data-label="לט"></i> But if he has much coarse bread, he may bake fine bread.
