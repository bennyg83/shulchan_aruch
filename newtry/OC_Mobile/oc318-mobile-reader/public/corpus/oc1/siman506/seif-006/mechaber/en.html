<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i>&quot;If one had flour or dough in partnership with a non-Jew, it is <i data-commentator="Magen Avraham" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="לג"></i> forbidden to <i data-commentator="Ba'er Hetev" data-order="11"></i> bake it on <i data-commentator="Mishnah Berurah" data-label="לד"></i> Yom Tov; rather, he should divide it and bake his own [portion].&quot;
