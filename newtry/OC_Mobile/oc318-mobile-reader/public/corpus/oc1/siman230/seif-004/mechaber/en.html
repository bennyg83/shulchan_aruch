<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> One who <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="ו"></i> goes to let blood says 'May it be Your will, Heaven my Heaven, that this action be for me healing, for You heal freely.' After letting blood he says 'Blessed...<i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Be'er HaGolah" data-label="•" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="ז"></i> is the healer of the sick.'
