<i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> The one <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Ba'er Hetev" data-order="4"></i> who enters the bath says YHRAM, O God, that you bring me into peace and bring me out into peace, and save me from this light, and like it in the future, the one who comes out in peace says, I thank you before you, O God, that you saved me from this light:
