<i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> One who enters <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Ba'er Hetev" data-order="4"></i> a bathhouse says 'May it be Your will, Heaven my Heaven, that You bring me in in peace and bring me out in peace, and save me from this fire and the like in the future.' When he comes out in peace he says 'I give thanks before You, Heaven my Heaven, that You saved me from this fire.'
