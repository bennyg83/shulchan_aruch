<i data-commentator="Ateret Zekenim" data-label="♦" data-order="5"></i> When he finishes the portion of the Olah he should <i data-commentator="Magen Avraham" data-order="11"></i> say “May it be Your will that this be considered and accepted as if I had brought an Olah”; and so he says after the portions of Minchah <i data-commentator="Eshel Avraham" data-label="ג" data-order="3"></i> and Shelamim,<i data-commentator="Turei Zahav" data-order="7"></i> because they <i data-commentator="Mishnah Berurah" data-label="יח"></i> come as <i data-commentator="Ba'er Hetev" data-order="13"></i> <i data-commentator="Sha'arei Teshuvah" data-order="13"></i> voluntary offerings.
