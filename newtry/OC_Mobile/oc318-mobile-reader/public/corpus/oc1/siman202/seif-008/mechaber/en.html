<i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Be'er HaGolah" data-label="פ" data-order="18"></i> One blesses <i data-commentator="Mishnah Berurah" data-label="מה"></i>&quot;Blessed is the One through Whose Word everything <i data-commentator="Mishnah Berurah" data-label="מו"></i> was created&quot;<i data-commentator="Ba'er Hetev" data-order="16"></i> on flowing date honey;<i data-commentator="Be'er HaGolah" data-label="צ" data-order="19"></i> <i data-commentator="Mishnah Berurah" data-label="מז"></i> and, similarly, one blesses &quot;Blessed is the One through Whose Word everything was created&quot; with all liquids that come out from fruits, aside <i data-commentator="Magen Avraham" data-order="19"></i> from olives and grapes.
