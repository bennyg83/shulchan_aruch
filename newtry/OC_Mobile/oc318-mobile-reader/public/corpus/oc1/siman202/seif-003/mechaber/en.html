<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> Fruit pits — if they are <i data-commentator="Mishnah Berurah" data-label="כג"></i> sweet one blesses borei peri haEtz <i data-commentator="Ba'er Hetev" data-order="6"></i> <i data-commentator="Sha'arei Teshuvah" data-order="6"></i> on them; if they are bitter <i data-commentator="Mishnah Berurah" data-label="כד"></i> one does not bless on them at all;<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> and if one sweetens them by <i data-commentator="Mishnah Berurah" data-label="כה"></i> fire one blesses shehakol <i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Ba'er Hetev" data-order="7"></i> <i data-commentator="Sha'arei Teshuvah" data-order="7"></i> on them.
