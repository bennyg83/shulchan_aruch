<b>(ס"ק טו) י"מ פת כו'</b> מ"מ מין דגן כו' כצ"ל. כמ"ש סי' ר"ח סעיף ב' וסעיף ג' כצ"ל:<br>
<b>ואם אינו אוכל העיסה רק הפירות כו'</b> וכמ"ש סי' קע"ז דאוכל פירות תוך הסעודה בלי פת צריכים ברכה לפניהם ואם אוכל העיסה לבדה בלי פירות כ' ט"ז דמברך בורא מ"מ דאזלי' בתר שעת אפיה דבשע' אפיה היה ממול' עם פירות וה"ה פת הבא בכסני':
