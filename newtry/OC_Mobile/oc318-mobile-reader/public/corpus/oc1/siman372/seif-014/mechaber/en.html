<i data-commentator="Be'er HaGolah" data-label="מ" data-order="35"></i> If a ladder is' <i data-commentator="Mishnah Berurah" data-label="קז"></i> not four wide and one carved the' <i data-commentator="Mishnah Berurah" data-label="קח"></i> wall <i data-commentator="Mishnah Berurah" data-label="קט"></i> beside <i data-commentator="Magen Avraham" data-order="23"></i> it to complete four, it suffices to carve ten high. If no ladder but one carved rungs into <i data-commentator="Mishnah Berurah" data-label="קי"></i> the wall, one <i data-commentator="Mishnah Berurah" data-label="קיא"></i> must carve the entire <i data-commentator="Mishnah Berurah" data-label="קיב"></i> height; this helps for both use and joint eruv.
