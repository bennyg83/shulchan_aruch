<i data-commentator="Be'er HaGolah" data-label="נ" data-order="36"></i> <i data-commentator="Magen Avraham" data-order="24"></i> If there is a tree beside the wall used as <i data-commentator="Mishnah Berurah" data-label="קיג"></i> a ladder, they may join. But if an Asherah tree was used, they may not join, since it is forbidden to climb (as it is prohibited for benefit).<i data-commentator="Be'er HaGolah" data-label="ס" data-order="37"></i> The Rosh writes the opposite:<i data-commentator="Magen Avraham" data-order="25"></i> <i data-commentator="Mishnah Berurah" data-label="קיד"></i> a regular tree does not <i data-commentator="Mishnah Berurah" data-label="קטו"></i> help, but an Asherah does if <i data-commentator="Magen Avraham" data-order="26"></i> <i data-commentator="Ba'er Hetev" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="קטז"></i> dry.
