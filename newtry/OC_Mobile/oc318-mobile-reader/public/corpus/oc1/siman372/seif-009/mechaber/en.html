<i data-commentator="Be'er HaGolah" data-label="ה" data-order="27"></i> <i data-commentator="Mishnah Berurah" data-label="עט"></i> If one built a platform at the base of the wall to reduce its height: if four long along <i data-commentator="Be'er HaGolah" data-label="ו" data-order="28"></i> <i data-commentator="Mishnah Berurah" data-label="פ"></i> the wall and' <i data-commentator="Mishnah Berurah" data-label="פא"></i> four projecting outward, it permits use of <i data-commentator="Mishnah Berurah" data-label="פב"></i> the entire wall but does not count as a doorway <i data-commentator="Mishnah Berurah" data-label="פג"></i> unless it reaches the top. If not four by four, it does not help even <i data-commentator="Mishnah Berurah" data-label="פד"></i> opposite it.
