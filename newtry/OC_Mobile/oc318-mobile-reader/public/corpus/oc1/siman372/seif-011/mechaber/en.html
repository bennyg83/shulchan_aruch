<i data-commentator="Be'er HaGolah" data-label="ח" data-order="30"></i> <i data-commentator="Mishnah Berurah" data-label="פח"></i> If one built a platform upon a platform — if <i data-commentator="Mishnah Berurah" data-label="פט"></i> the lower has four by four, or the lower does not have four by four but the upper has four' <i data-commentator="Mishnah Berurah" data-label="צ"></i> by four and there are not three tefachim <i data-commentator="Be'er HaGolah" data-label="ט" data-order="31"></i> between this and that —<i data-commentator="Mishnah Berurah" data-label="צא"></i> it helps to permit use upon it, but it does not help to be an <i data-commentator="Mishnah Berurah" data-label="צב"></i> opening to join together:
