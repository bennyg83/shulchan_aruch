<i data-commentator="Be'er HaGolah" data-label="ח" data-order="30"></i> <i data-commentator="Mishnah Berurah" data-label="פח"></i> If one built platform upon platform:<i data-commentator="Mishnah Berurah" data-label="פט"></i> if the lower is four by four, or even if not' <i data-commentator="Mishnah Berurah" data-label="צ"></i> but the upper is <i data-commentator="Be'er HaGolah" data-label="ט" data-order="31"></i> four by four <i data-commentator="Mishnah Berurah" data-label="צא"></i> and within three handbreadths, it permits use but not <i data-commentator="Mishnah Berurah" data-label="צב"></i> joint eruv.
