<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> A karpaf larger than two se’ah that was not enclosed for dwelling has the <i data-commentator="Mishnah Berurah" data-label="יז"></i> status of a karmelit, and it <i data-commentator="Mishnah Berurah" data-label="יח"></i> is forbidden to carry from it to another karpaf—bringing in or taking out—except <i data-commentator="Mishnah Berurah" data-label="יט"></i> for four cubits total (two cubits in each).
