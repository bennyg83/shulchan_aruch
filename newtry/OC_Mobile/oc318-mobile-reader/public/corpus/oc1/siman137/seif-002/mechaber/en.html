<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> Each person does not read less than 3 verses.<i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> Two read 3 each, and one reads 4, and' <i data-commentator="Magen Avraham" data-order="1"></i> whichever one of them' <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> it is who reads 4, behold' <i data-commentator="Turei Zahav" data-order="2"></i> this one <i data-commentator="Ba'er Hetev" data-order="1"></i> is praiseworthy.
