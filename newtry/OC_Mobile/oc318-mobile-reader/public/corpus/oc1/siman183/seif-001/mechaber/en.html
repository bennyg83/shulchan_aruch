<b>How one who blesses should conduct himself with the cup of birkat hamazon. In it</b><br> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> are 12 seifim. The <i data-commentator="Mishnah Berurah" data-label="א"></i> cup of blessing requires rinsing on the inside and washing on <i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> the outside. If it is clean and <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ב"></i> has no <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Sha'arei Teshuvah" data-order="1"></i> cup remnants,<i data-commentator="Mishnah Berurah" data-label="ג"></i> he need not.
