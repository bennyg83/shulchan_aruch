[ו] <b>[לבוש] בלא יו"ד וכו'.</b> תימא לי על הלבוש דבאמת כתב ידכם בלא יו"ד בתפילין סימן קל"ד. ונראה לי דדריש ליה הש"ס מהנקודת שנקוד היו"ד בשב"א ודל"ת בציר"י, ואי היה משמע חדא ידא היה הנקודה היו"ד בסגו"ל והדל"ת בשב"א, והטעם כדי להראות חביבות קבלת הכוס ואחר כך יחזיק ביד אחת כדי שלא יהא נראה כמשאוי עליו:
