<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="לז"></i>6. If one is eating in the Sukkah and it starts raining and he goes into his house and then the rain stops, he is not obligated to return to the <i data-commentator="Mishnah Berurah" data-label="לח"></i> sukkah until he finishes his meal.
