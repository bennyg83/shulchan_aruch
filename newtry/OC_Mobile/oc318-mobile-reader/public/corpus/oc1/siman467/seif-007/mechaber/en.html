<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="כא"></i> A Jew who has pits full of wheat and is concerned there may be split kernels at the bottom and sides <i data-commentator="Chok Yaakov" data-order="15"></i> of the pit from the moisture of the pit and the earth — mere nullification suffices.<small>((See above Siman 436, section 1.)')</small>:
