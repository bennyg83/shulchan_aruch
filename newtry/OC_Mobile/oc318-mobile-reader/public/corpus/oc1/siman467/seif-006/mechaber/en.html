<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> Wheat kernels among which some split ones are <i data-commentator="Mishnah Berurah" data-label="יט"></i> found — those that are not <i data-commentator="Mishnah Berurah" data-label="כ"></i> split are permitted, since it is common for the top and <i data-commentator="Chok Yaakov" data-order="14"></i> bottom of a stack to become leavened and split during rain while the water does not touch the middle at all.
