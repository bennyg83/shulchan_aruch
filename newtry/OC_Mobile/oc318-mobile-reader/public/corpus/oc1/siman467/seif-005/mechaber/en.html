<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> Grain still attached to <i data-commentator="Mishnah Berurah" data-label="יז"></i> the ground that dried out completely and no longer needs moisture is considered as if resting in a barrel, and becomes <i data-commentator="Mishnah Berurah" data-label="יח"></i> leavened if rain falls on it.
