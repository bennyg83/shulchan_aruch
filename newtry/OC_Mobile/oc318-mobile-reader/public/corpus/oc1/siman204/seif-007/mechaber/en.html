<i data-commentator="Be'er HaGolah" data-label="כ" data-order="12"></i> One who drinks water <i data-commentator="Mishnah Berurah" data-label="מ"></i> for his thirst — blesses shehakol and afterward birkat <i data-commentator="Ba'er Hetev" data-order="12"></i> <i data-commentator="Sha'arei Teshuvah" data-order="12"></i> haMazon (borei <i data-commentator="Be'er HaGolah" data-label="ל" data-order="13"></i> nefashot rabot).<i data-commentator="Mishnah Berurah" data-label="מא"></i> But if a piece of <i data-commentator="Mishnah Berurah" data-label="מב"></i> meat choked him and he drinks water to remove <i data-commentator="Magen Avraham" data-order="18"></i> the obstruction — he does not bless neither <i data-commentator="Ba'er Hetev" data-order="13"></i> before nor after.
