<i data-commentator="Be'er HaGolah" data-label="ש" data-order="21"></i> Il ne doit pas <i data-commentator="Mishnah Berurah" data-label="לד"></i> avoir de relations au début de la nuit ni à la <i data-commentator="Magen Avraham" data-order="20"></i> fin, afin que le bruit des gens ne soit pas entendu et qu'il ne vienne pas à penser à une autre femme. Il est préférable de le faire au milieu de la nuit.
