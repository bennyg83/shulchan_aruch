<i data-commentator="Be'er HaGolah" data-label="כ" data-order="33"></i> <i data-commentator="Mishnah Berurah" data-label="מט"></i> Un hôte est interdit d'avoir des relations conjugales,<i data-commentator="Magen Avraham" data-order="27"></i> <i data-commentator="Be'er HaGolah" data-label="ל" data-order="34"></i> <i data-commentator="Mishnah Berurah" data-label="נ"></i>à moins que l'on lui attribue une maison séparée <i data-commentator="Mishnah Berurah" data-label="נא"></i> pour lui et sa femme, et ce, à condition qu'il ne dorme <i data-commentator="Magen Avraham" data-order="28"></i> <i data-commentator="Mishnah Berurah" data-label="נב"></i> pas dans le talit du <i data-commentator="Ba'er Hetev" data-order="22"></i> propriétaire de la maison.
