<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="כג"></i> If he baked in an oven of a Jew on Shabbat against his will and <i data-commentator="Mishnah Berurah" data-label="כד"></i> give him bread as rent of the oven, it is forbidden to benefit from it.
