<i data-commentator="Turei Zahav" data-order="7"></i> <i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> The blessing of the wine during <i data-commentator="Mishnah Berurah" data-label="לה"></i> Kiddush exempts wine <i data-commentator="Mishnah Berurah" data-label="לו"></i>(from a blessing) during <i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> the meal. We do not require a <i data-commentator="Mishnah Berurah" data-label="לז"></i> blessing after it because Birkat Hamazon exempts it, whether it is over a cup or not.<small> <i data-commentator="Mishnah Berurah" data-label="לח"></i>((And see above Siman 174 Seif 6).')</small>:
