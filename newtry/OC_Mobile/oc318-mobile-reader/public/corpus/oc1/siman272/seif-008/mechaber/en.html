<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> We say Kiddush <i data-commentator="Mishnah Berurah" data-label="יט"></i> over cooked wine and over wine that has honey <i data-commentator="Mishnah Berurah" data-label="כ"></i> in it. There are <i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> those who <i data-commentator="Mishnah Berurah" data-label="כא"></i> so we do not say Kiddush over them.<small>The custom is to <i data-commentator="Mishnah Berurah" data-label="כב"></i> make Kiddush over them even if one has other wine, but <i data-commentator="Mishnah Berurah" data-label="כג"></i> it is not as good as the cooked wine or wine with honey. (Agur).</small>
