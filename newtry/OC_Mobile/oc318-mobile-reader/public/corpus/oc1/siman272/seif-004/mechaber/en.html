<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> Kiddush may be <i data-commentator="Mishnah Berurah" data-label="י"></i> recited over white wine, but the Ramban disqualifies it, even after the fact. But we <i data-commentator="Mishnah Berurah" data-label="יא"></i> may recite havdalah on it. The custom of the world <i data-commentator="Mishnah Berurah" data-label="יב"></i> is like the first opinion.
