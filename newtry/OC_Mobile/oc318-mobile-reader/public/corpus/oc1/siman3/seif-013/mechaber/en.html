<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> One should not urinate from <i data-commentator="Turei Zahav" data-order="12"></i> a <i data-commentator="Magen Avraham" data-order="13"></i> standing position lest it sprinkle <i data-commentator="Mishnah Berurah" data-label="כג"></i> down upon his <i data-commentator="Mishnah Berurah" data-label="כד"></i> legs, if he is not on a high place, or relieving himself upon loose earth<small> ((meaning, soil that is not virgin, but rather like plowed earth).</small>
