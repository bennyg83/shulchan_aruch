<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> One should be modest in the privy and should not expose himself <i data-commentator="Mishnah Berurah" data-label="ב"></i> until he sits.<small>{Rama: Two <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> men should not <i data-commentator="Ba'er Hetev" data-order="1"></i> go together. Also, he should not <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Sha'arei Teshuvah" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> speak there, and he should close the door behind him for the sake of modesty (Or Zarua).}.</small>
