<b>“In a field.”</b> The same applies if he relieves indoors behind a wall: he may relieve even if his companion hears him sneeze—<i>Eliyahu Rabbah</i>.<br />
<b>“His uncovering.”</b> [The restriction applies only if the other could see his exposure;] even if he only hears his sneeze [but cannot see him, it is permitted].
