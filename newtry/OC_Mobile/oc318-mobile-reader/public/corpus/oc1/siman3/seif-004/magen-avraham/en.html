<b>“Two <i>tefachim</i> [before him].”</b> Because when he strains for the “large” [movement] he may come to the “small” [urination], he needs two handbreadths in front on account of urine splashing a distance—[<i>Sifrei</i>] on <i>Parashat Ki Teitzei</i> teaches that one may not defecate standing.
