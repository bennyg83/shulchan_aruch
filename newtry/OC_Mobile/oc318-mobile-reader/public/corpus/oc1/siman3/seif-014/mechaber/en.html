<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> He should take care not to grasp his organ to urinate unless <i data-commentator="Ba'er Hetev" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> from the <i data-commentator="Mishnah Berurah" data-label="כו"></i> corona downward, lest he emit semen in <i data-commentator="Turei Zahav" data-order="13"></i> <i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i> vain—unless he is <i data-commentator="Mishnah Berurah" data-label="כז"></i> married.<i data-commentator="Magen Avraham" data-order="14"></i> <i data-commentator="Eshel Avraham" data-label="א" data-order="2"></i> It is <i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> a conduct of piety to be careful even <i data-commentator="Ba'er Hetev" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="כח"></i> if married.
