<b>ולמטה. </b> ואפי' אם האבר בקישוי מותר לאחוז מעטרה ולמטה כ"מ מתוס' ריש פרק כל היד ד"ה אוחז וכו' מדלא תירצו דהתם מיירי שהוא בקישוי דהא נזדעזע אבריו קתני. ע"ת:<br>
<b>הנשוי. </b> וט"ז כתב דמדינא אסור ע"ש ואם אין אשתו עמו או שהיא נדה לא מקרי נשוי לענין זה עיין ט"ז מ"א ועיין בא"ע סי' כ"ג ס"ק ד' מש"ש:
