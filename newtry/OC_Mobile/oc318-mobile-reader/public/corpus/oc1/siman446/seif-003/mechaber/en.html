<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> If the roof of a non-Jew was adjacent to the roof of a Jew, and chametz rolled from the non-Jew's roof onto the Jew's roof, one may <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> push it <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Chok Yaakov" data-order="7"></i> away with <i data-commentator="Eshel Avraham" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> a stick. But if it is Shabbat or Yom Tov, one covers it with a vessel <i data-commentator="Turei Zahav" data-order="6"></i> <i data-commentator="Chok Yaakov" data-order="8"></i><small> <i data-commentator="Mishnah Berurah" data-label="יא"></i>((because it is <i data-commentator="Ba'er Hetev" data-order="5"></i> forbidden to move it <i data-commentator="Chok Yaakov" data-order="9"></i> on Yom Tov and Shabbat).)</small>:
