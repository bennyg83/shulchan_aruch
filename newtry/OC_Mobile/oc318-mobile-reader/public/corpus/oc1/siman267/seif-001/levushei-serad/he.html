<small>מ"א סק"א</small> וצ"ע דבגמרא בר"פ תפלת השחר בעי למפשט מכל אמוראי דמצלי של שבת בע"ש ש"מ דהלכה כר"י דסבירא ליה תפלת המנחה עד פלג המנחה ומשם ואילך זמן ת"ע. וקאמר אדרבא מדרב הונא ורבנן לא הוי מצלי עד אורתא ש"מ הלכה כרבנן דתה"מ עד הערב ומסיק כיון דלא אתמר הלכתא לא כמר ולא כמר דעביד כמר עביד וכו':
