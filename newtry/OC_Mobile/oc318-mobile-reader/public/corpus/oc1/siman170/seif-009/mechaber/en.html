<i data-commentator="Be'er HaGolah" data-label="כ" data-order="12"></i> One should not eat garlic or onion from its head, but rather from the top, and if he <i data-commentator="Magen Avraham" data-order="14"></i> <i data-commentator="Ba'er Hetev" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="כג"></i> ate [from the head] he is a glutton. Gloss: And <i data-commentator="Mishnah Berurah" data-label="כד"></i> one should not eat in a gluttonous manner, and should not hold the food in one hand and tear from it with the other hand. [Tur]<small> <i data-commentator="Mishnah Berurah" data-label="כה"></i>]:</small>
