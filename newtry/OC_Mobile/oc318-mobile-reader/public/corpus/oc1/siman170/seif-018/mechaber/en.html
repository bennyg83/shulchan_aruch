<i data-commentator="Be'er HaGolah" data-label="ר" data-order="21"></i> One who enters a meal <i data-commentator="Magen Avraham" data-order="22"></i> <i data-commentator="Turei Zahav" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="לט"></i> should not take his portion and give it to the server, lest some mishap occur at the meal. Rather, he should take it, set it aside, and afterwards give it to him.
