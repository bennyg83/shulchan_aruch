<i data-commentator="Be'er HaGolah" data-label="נ" data-order="15"></i> When two are sitting at the table,<i data-commentator="Magen Avraham" data-order="17"></i> <i data-commentator="Turei Zahav" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="כח"></i> the greater one extends his <i data-commentator="Ba'er Hetev" data-order="11"></i> hand first, and one who extends his hand before someone greater than him is a glutton.
