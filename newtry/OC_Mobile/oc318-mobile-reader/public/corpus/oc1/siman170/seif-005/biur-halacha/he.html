<b> הנכנס לבית כל מה שיאמר לו בעל הבית יעשה</b> -  בקצת נוסחאות בש"ס פסחים (דף פז.) איתא חוץ מצא ועיין בב"ח שפירש כל שירות שיאמר לו בעה"ב שיעשה בתוך ביתו יעשה חוץ מצא כלומר אם יאמר לו שישרת אותו ביציאה חוץ לבית כגון לשלחו לשוק אין צריך לשרתו בכך כי אין זה כבודו לילך לשווקים והעתיקו המ"א וע"ש עוד ביאור:
