<i data-commentator="Be'er HaGolah" data-label="ד" data-order="5"></i> Two [people dining together] wait <i data-commentator="Mishnah Berurah" data-label="יב"></i> for each other at the bowl — when one removes his hand from <i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Sha'arei Teshuvah" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i> the bowl to drink, his companion stops eating until he finishes drinking. But if there are three, the [other] two do not stop for the one [who drinks].
