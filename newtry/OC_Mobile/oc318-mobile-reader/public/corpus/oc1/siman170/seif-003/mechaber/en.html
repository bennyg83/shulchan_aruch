<i data-commentator="Be'er HaGolah" data-label="ה" data-order="6"></i> Each of the diners leaves a corner [of food] in the bowl, which is food <i data-commentator="Magen Avraham" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="יד"></i> for the <i data-commentator="Ba'er Hetev" data-order="5"></i> servant. But <i data-commentator="Mishnah Berurah" data-label="טו"></i> when the servant pours <i data-commentator="Magen Avraham" data-order="9"></i> from the serving pot into the bowl, it is not the practice to leave anything in the pot for his needs.
