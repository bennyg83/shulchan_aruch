<i data-commentator="Magen Avraham" data-order="23"></i> <i data-commentator="Be'er HaGolah" data-label="ש" data-order="22"></i> Guests who enter the home of a host <i data-commentator="Mishnah Berurah" data-label="מ"></i> may not take food from before themselves and give it <i data-commentator="Mishnah Berurah" data-label="מא"></i> to <i data-commentator="Ba'er Hetev" data-order="15"></i> the host's son or servant, unless they have received permission from the host.
