<i data-commentator="Be'er HaGolah" data-label="ת" data-order="23"></i> The discerning people of Jerusalem would not <i data-commentator="Mishnah Berurah" data-label="מב"></i> recline at a meal unless they knew <i data-commentator="Ateret Zekenim" data-label="♦" data-order="6"></i> who was reclining with them, because <i data-commentator="Ba'er Hetev" data-order="16"></i> it is disgraceful for a Torah scholar to sit beside an am ha'aretz (unlearned person) at a meal.
