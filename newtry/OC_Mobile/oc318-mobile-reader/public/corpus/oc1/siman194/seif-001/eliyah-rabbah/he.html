[א] <b>שכח אחד וכו'.</b> איידי דרישא נקט שכח והוא הדין הזיד ובירך, ב"ח. ויש להסתפק בשנים שאכלו והשלישי שתה רביעית ואחר כך שכח אחד ובירך אם רשאי השלישי שאכל לזמן על אותן שנים או כיון דרק אחד חייב בזימון לא, וכן מסתבר. עוד נראה לי דבעשרה אם שכחו שלושה ובירכו מברך נברך לאלהינו כדלקמן סימן קצ"ז באכל ירק:
