<b> מותר לשפשף הכלים בכל דבר</b> -  עיין במ"ב דמותר בנתר ומלח וכ"ש דמותר לשפשף במורסן עיין בתוספתא פ"ד דביצה והובאה בב"י דמורסן קיל מנתר וחול וכיון דאנן קי"ל דחופפין כלים אפילו בנתר וחול כ"ש דבמורסן שרי. ואך בתנאי שיהיה המורסן מגובל מע"ש או שיקח אותם בידים רטובות וכדלקמן בסימן שכ"ו ס"י ובמגן אברהם שם:
