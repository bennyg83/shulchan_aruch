<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> <i data-commentator="Magen Avraham" data-order="1"></i> This Teruah that is said in the Torah,<i data-commentator="Mishnah Berurah" data-label="ה"></i> it is doubtful to us if it is the wail that we call Teruah or if it is what we call Shevarim or if they are <i data-commentator="Turei Zahav" data-order="1"></i> both of them together. Therefore,<i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> in order to remove any doubt, one needs to blow TSR&quot;T three times, TS&quot;T three <i data-commentator="Mishnah Berurah" data-label="ו"></i> times and TR&quot;T three times.
