<b>דין ישראל ועכו"ם שיש להם שותפות. ובו ז סעיפים:</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> The Laws Pertaining <i data-commentator="Ba'er Hetev" data-order="1"></i> to [Chametz Owned by] a Jew and a Non-Jew <i data-commentator="Mishnah Berurah" data-label="א"></i> in Partnership, 7 Seifim If <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Chok Yaakov" data-order="1"></i> an Jew borrowed <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> a loaf of bread from their fellow Jew before Passover, they must repay it after Passover.<i data-commentator="Mishnah Berurah" data-label="ב"></i> Failing to do so would be considered theft.
