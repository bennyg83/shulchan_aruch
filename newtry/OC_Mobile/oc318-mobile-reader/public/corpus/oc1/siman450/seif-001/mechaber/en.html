<b>דין ישראל ועכו"ם שיש להם שותפות. ובו ז סעיפים:</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> The law of <i data-commentator="Ba'er Hetev" data-order="1"></i> a Jew and a non-Jew who have a partnership.<i data-commentator="Mishnah Berurah" data-label="א"></i> Contains 7 seifim. A Jew <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Chok Yaakov" data-order="1"></i> who borrowed a <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> loaf from his fellow Jew before Pesach must repay it after Pesach; and there is a matter <i data-commentator="Mishnah Berurah" data-label="ב"></i> of theft if he does not repay it.
