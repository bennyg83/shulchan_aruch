<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> If a Jew and a non-Jew jointly own an oven, the Jew should say <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> to the non-Jew before Passover, &quot;You take your portion of the Passover [baked goods],<i data-commentator="Chok Yaakov" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ו"></i> and I will take <i data-commentator="Ba'er Hetev" data-order="3"></i> mine afterwards.&quot;
