<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> A Jew and a non-Jew who have an oven in partnership <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i>— he tells the non-Jew before Pesach: take yours for Pesach,<i data-commentator="Chok Yaakov" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ו"></i> and I will take <i data-commentator="Ba'er Hetev" data-order="3"></i> mine afterwards.
