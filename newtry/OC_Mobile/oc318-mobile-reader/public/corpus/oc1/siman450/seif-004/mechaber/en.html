<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> If a Jew had an oven, and <i data-commentator="Mishnah Berurah" data-label="ז"></i> a non-Jew baked leavened bread in it during <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Chok Yaakov" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="ח"></i> Passover, even accepting payment for <i data-commentator="Ba'er Hetev" data-order="4"></i> its use is prohibited,<i data-commentator="Chok Yaakov" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> as it would involve benefiting from something prohibited. However, if the payment <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> has already been received, it <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> is permissible <i data-commentator="Ba'er Hetev" data-order="5"></i> to benefit from it.
