<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> A Jew who had an oven and <i data-commentator="Mishnah Berurah" data-label="ז"></i> a non-Jew baked chametz in it on Pesach <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Chok Yaakov" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="ח"></i>— even money is forbidden <i data-commentator="Ba'er Hetev" data-order="4"></i> to receive as his <i data-commentator="Chok Yaakov" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> wage, for it would be profiting from issurei hana'ah; and if he <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> already received the money, it <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> is permitted <i data-commentator="Ba'er Hetev" data-order="5"></i> to benefit from it.
