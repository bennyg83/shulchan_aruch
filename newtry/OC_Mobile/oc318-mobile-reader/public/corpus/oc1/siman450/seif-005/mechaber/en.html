<i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> There are those who permit <i data-commentator="Mishnah Berurah" data-label="יא"></i> renting his oven to a non-Jew on condition <i data-commentator="Chok Yaakov" data-order="7"></i> that he bake matzah in it;<i data-commentator="Ba'er Hetev" data-order="6"></i> and if he <i data-commentator="Chok Yaakov" data-order="8"></i> bakes chametz in it, one <i data-commentator="Magen Avraham" data-order="5"></i> is not concerned about it.<small>And likewise it is permitted to rent him <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Chok Yaakov" data-order="9"></i> a <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Ba'er Hetev" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> house to dwell in, even though he may later bring chametz into it. (Agur))</small>
