<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> A Jew who receives from a non-Jew interest-loaves every week — he should <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> tell him before Pesach to give him during the week of Pesach <i data-commentator="Chok Yaakov" data-order="2"></i> flour or money; and <i data-commentator="Chok Yaakov" data-order="3"></i> since he stipulated thus with him, even though after Pesach he gives him <i data-commentator="Mishnah Berurah" data-label="ד"></i> chametz loaves in place of the flour and money, it is permitted.
