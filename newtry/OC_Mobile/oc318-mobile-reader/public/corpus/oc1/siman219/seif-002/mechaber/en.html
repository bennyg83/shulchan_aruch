<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> What does he bless? &quot;Blessed are You, Lord <i data-commentator="Mishnah Berurah" data-label="ד"></i> our God, King of the universe, who bestows goodness upon the undeserving, who has bestowed all goodness <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> upon me.&quot; And those who hear respond: &quot;May He <i data-commentator="Ba'er Hetev" data-order="3"></i> who has bestowed all goodness upon you continue to bestow all goodness upon you forever.&quot;
