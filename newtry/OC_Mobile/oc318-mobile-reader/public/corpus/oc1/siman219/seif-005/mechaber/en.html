<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> If one person blessed HaGomel for himself and intended to include his fellow, and his fellow heard and intended to fulfill his obligation — he has fulfilled it even without answering Amen.<small>((Since the one blessing is also obligated, the other fulfills his obligation without answering Amen.) (Tur).</small>
