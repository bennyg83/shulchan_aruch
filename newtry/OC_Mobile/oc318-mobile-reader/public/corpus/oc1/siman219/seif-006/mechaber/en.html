<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="יט"></i> If one delayed, he may still fulfill it by blessing whenever he wishes — but <i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="2"></i> it is proper not to delay <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Ba'er Hetev" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="כ"></i> more than three days.
