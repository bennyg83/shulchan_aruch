<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> A person washes his hands in the morning and recites the blessing on netilat yadayim, and should be careful to wash only up to the knuckles of his fingers.<small>(He must not intend enjoyment of washing, only to remove the evil spirit from the hands (Hagahot Maimoniyyot).)</small>:
