<b>One may say Shema by heart. And in it one section:</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> Even though we have <i data-commentator="Mishnah Berurah" data-label="א"></i> established that matters written <i data-commentator="Mishnah Berurah" data-label="ב"></i>[in the Torah], you <i data-commentator="Mishnah Berurah" data-label="ג"></i> may not recite them by heart—any matter that <i data-commentator="Mishnah Berurah" data-label="ד"></i> is habitual <i data-commentator="Magen Avraham" data-order="1"></i> and <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Sha'arei Teshuvah" data-order="1"></i> fluent <i data-commentator="Mishnah Berurah" data-label="ה"></i> in everyone's mouth, such as Shema <i data-commentator="Mishnah Berurah" data-label="ו"></i> and Birkat Kohanim and parashat HaTamid and the <i data-commentator="Mishnah Berurah" data-label="ז"></i> like—is permitted.
