<b>בתור' צדקה. </b> זה דעת הרר"י ונראה טעמו דמצות צדקם היא ודאי וספק אם יטול ידיו ואין ספק מוצי' מידי ודאי צדקה והקשה ב"י הא ליתן לשמש נמי מצוה היא ואפ"ה אין ליתן לו אא"כ יודע שנטל ידיו ונ"ל דהשמש נכנע תחתיו ולא ירע לבבו אם יזהירנו תחלה על הנטילה משא"כ באחר שמתוך כך יקצוף ולא ירצה לקבל ויתבטל מצות צדקה:
