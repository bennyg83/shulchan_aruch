<b>One must distance oneself from foul water; and it contains one</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Sha'arei Teshuvah" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> section. Foul water,<i data-commentator="Mishnah Berurah" data-label="ב"></i> or steeping water in which flax or hemp is soaked—one must distance from them <i data-commentator="Mishnah Berurah" data-label="ג"></i> as from excrement.
