<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> If it had <i data-commentator="Mishnah Berurah" data-label="יג"></i> a hole and it was sealed — if it is below the lees, it is forbidden to open it, for since it is below and all the weight of the wine is upon it, it requires proper <i data-commentator="Mishnah Berurah" data-label="יד"></i> sealing and it is considered like opening anew; above the lees it is <i data-commentator="Mishnah Berurah" data-label="טו"></i> permitted to open it.
