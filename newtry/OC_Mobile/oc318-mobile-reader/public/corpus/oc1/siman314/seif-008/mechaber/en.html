<i data-commentator="Magen Avraham" data-order="12"></i> <i data-commentator="Be'er HaGolah" data-label="ב" data-order="25"></i> <i data-commentator="Mishnah Berurah" data-label="לח"></i>8. The rope tying the lids of baskets <i data-commentator="Mishnah Berurah" data-label="לט"></i> filled with dates and figs may be untied, unraveled or cut even using a knife. Even the <i data-commentator="Be'er HaGolah" data-label="ג" data-order="26"></i> basket itself may <i data-commentator="Ba'er Hetev" data-order="7"></i> be slashed because it is comparable <i data-commentator="Magen Avraham" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="מ"></i> to cracking open nuts or almonds in order to retrieve the food within.
