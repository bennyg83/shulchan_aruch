<i data-commentator="Magen Avraham" data-order="12"></i> <i data-commentator="Be'er HaGolah" data-label="ב" data-order="25"></i> <i data-commentator="Mishnah Berurah" data-label="לח"></i> Bundles of dates and dried figs — if the <i data-commentator="Mishnah Berurah" data-label="לט"></i> cover is tied with rope, he may untie and break the chain of rope and cut even with a knife,<i data-commentator="Be'er HaGolah" data-label="ג" data-order="26"></i> and even the <i data-commentator="Ba'er Hetev" data-order="7"></i> body of the bundles themselves, for all <i data-commentator="Magen Avraham" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="מ"></i> this is like breaking walnuts or almonds in order to take the food in them.
