<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> A faucet in a barrel and a person cannot remove it — he may take another faucet and strike with that faucet in order to drink wine on Shabbat:<small>provided that the first faucet is not against the lees, as stated in seif 2 (Beit Yosef in the name of Shevilei Leket):.</small>
