<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> It is permitted to carry spices and <i data-commentator="Mishnah Berurah" data-label="יב"></i> a pestle to a mortar, or a mortar to them, even <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i> through a public domain, even though it would have been possible to bring them before Yom Tov.
