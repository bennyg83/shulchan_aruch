<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> If he has a mentally incompetent person and a minor with him, he should give it to the mentally incompetent person, because the minor will come <i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> to wisdom/understanding. A deaf-mute and a minor - he can <i data-commentator="Mishnah Berurah" data-label="יג"></i> give it to whomever he wants.
