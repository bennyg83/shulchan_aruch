<b>(ס"ק יב) נוטל כו'</b> יותר מט"ו סאין כו' דאסור לפנותה כלל כו' דבסי' של"ג מבואר דלצורך בה"מ או אורחים שרי לפנות אוצר שאינו מוקצה שיעור ט"ו סאין אבל שלא לצורך הנ"ל אפי' הובא יין על העגלה וצריך ליין לשבת אסור להוריד החביות מעגלה אלא ימשך היין מן החביות על העגלה. והכא אפי' יותר מט"ו סאין מותר מפני צער ב"ח:
