<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> If he has a donkey with him, and a deaf-mute, a mentally incompetent person and a minor, he should place it on the donkey and he should not give it <i data-commentator="Mishnah Berurah" data-label="יא"></i> to any of these (people).
