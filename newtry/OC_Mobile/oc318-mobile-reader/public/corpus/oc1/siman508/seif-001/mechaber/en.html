<b>Things forbidden on Yom Tov for preparing roasted food. Containing 2 paragraph):</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> We do not heat <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> stones to roast or bake upon them, because <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ב"></i> this <i data-commentator="Ba'er Hetev" data-order="2"></i> hardens them.<i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> We do not break earthenware, and we do not cut paper to roast upon them. And <i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> we do not split <i data-commentator="Mishnah Berurah" data-label="ד"></i> a <i data-commentator="Ba'er Hetev" data-order="3"></i> reed to make it like a spit for roasting.
