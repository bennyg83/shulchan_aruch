<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i>2. The charity <i data-commentator="Mishnah Berurah" data-label="ד"></i> collectors may collect from the yards on <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> a holiday, but they should not make announcements as are made during the week. Rather, they should collect quietly, put it in their bag, and distribute it to each neighborhood individually.
