<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> As long as the <i data-commentator="Mishnah Berurah" data-label="ח"></i> clouds have not dispersed, one blessing suffices [for subsequent lightning/thunder]. [However,] if the clouds dispersed between one lightning flash and the next, or between one thunderclap and the next, one must recite the blessing again.
