<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> As long as the <i data-commentator="Mishnah Berurah" data-label="ח"></i> clouds have not dispersed, one is exempt with one blessing. If they dispersed between one lightning and another, or between one thunder and another, one must return and bless again.
