<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> If one was sitting <i data-commentator="Mishnah Berurah" data-label="ט"></i> in a restroom and heard the sound of thunder or saw lighting: if it <i data-commentator="Mishnah Berurah" data-label="י"></i> is possible to leave <i data-commentator="Mishnah Berurah" data-label="יא"></i> within toch kedei dibbur [the amount <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Magen Avraham" data-order="2"></i> of time it takes to greet one's <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> teacher, about two seconds], they should leave, otherwise not.
