<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> If one was sitting <i data-commentator="Mishnah Berurah" data-label="ט"></i> in the restroom and heard the sound of thunder or saw lightning <i data-commentator="Mishnah Berurah" data-label="י"></i>— if he <i data-commentator="Mishnah Berurah" data-label="יא"></i> can leave and bless within <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Magen Avraham" data-order="2"></i> toch kedei dibbur he should leave,<i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> and if not he should not leave.
