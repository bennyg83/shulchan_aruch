<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i>4. [The laws describing] the order of priority [when a person] does not have the means to buy wine for both Kiddush and <i data-commentator="Mishnah Berurah" data-label="כה"></i> Havdalah - he should buy it for havdalah, for kiddush can be made over bread.
