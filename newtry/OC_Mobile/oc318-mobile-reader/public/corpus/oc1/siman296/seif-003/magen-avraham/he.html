<b>שמותר לו לאכול</b>. וכתב הרא"ש פ' ע"פ דדי לו בהבדל' שבתפיל' בתשו' מהר"מ ד"ק כתב שיאמר המבדיל בלא כוס מ"ד אב"ה ועססי' רצ"ט:<br />
<b>לא יאכל</b>. ואפי' במ"ש לי"ט [הרי"ף] ועמ"ש ססי' רע"ד:<br />
