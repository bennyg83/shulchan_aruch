<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> It is forbidden to open a <i data-commentator="Mishnah Berurah" data-label="ט"></i> door opposite a fire <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> that it is near the door; even if <i data-commentator="Mishnah Berurah" data-label="י"></i> only a calm wind <i data-commentator="Turei Zahav" data-order="4"></i> is blowing. However, it is permitted to shut it if it was <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יא"></i> open opposite the fire, and is not considered Mechabeh (Extinguishing).
