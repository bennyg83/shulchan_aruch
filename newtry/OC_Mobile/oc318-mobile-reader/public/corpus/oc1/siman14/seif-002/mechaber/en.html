<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> If a Jew tied tzitzis on a garment <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ו"></i> without intention: if no other <i data-commentator="Magen Avraham" data-order="4"></i> tzitzis are available to validate it, one may rely on the Rambam <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Sha'arei Teshuvah" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ז"></i> who validates —<i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> but one <i data-commentator="Turei Zahav" data-order="3"></i> does <i data-commentator="Mishnah Berurah" data-label="ח"></i> not bless on it.
