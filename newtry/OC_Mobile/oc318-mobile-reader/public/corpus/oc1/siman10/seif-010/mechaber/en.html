<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> A turban is exempt even of western lands whose two ends are thrown on their shoulders and body; even though one covers most of his head with it, it is exempt, since <i data-commentator="Mishnah Berurah" data-label="לב"></i> its essence is to cover the head — “your garment” the Merciful One spoke <i data-commentator="Ba'er Hetev" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="לג"></i> of, not a head covering.
