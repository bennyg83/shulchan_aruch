<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> Garments open at the sides below with four corners downward and sealed above — if the majority is sealed it is exempt;<i data-commentator="Magen Avraham" data-order="10"></i> if the <i data-commentator="Ba'er Hetev" data-order="8"></i> majority is <i data-commentator="Mishnah Berurah" data-label="כד"></i> open it is <i data-commentator="Mishnah Berurah" data-label="כה"></i> obligated; if half sealed <i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> and half open we rule stringently and it is obligated in tzitzis, and <i data-commentator="Eshel Avraham" data-label="ב" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> one does <i data-commentator="Ba'er Hetev" data-order="9"></i> not go <i data-commentator="Magen Avraham" data-order="11"></i> out in it on <i data-commentator="Ba'er Hetev" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="כז"></i> Shabbat.
