<b>Laws of <i>tzitzis</i> on Shabbat — it contains three clauses.</b><br>Four <i>tzitzis</i> obstruct one another: whenever it does not have all four it is not properly “made <i>tzitzis</i>,” and one who goes out in it to the public domain on Shabbat is liable for a sin-offering (see below siman 301 s. 38).
