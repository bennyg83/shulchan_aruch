<i data-commentator="Be'er HaGolah" data-label="ה" data-order="27"></i> If one <i data-commentator="Mishnah Berurah" data-label="עא"></i> drank wine <i data-commentator="Mishnah Berurah" data-label="עב"></i> and water, one need not bless <i data-commentator="Ba'er Hetev" data-order="20"></i> borei nefashot on the <i data-commentator="Magen Avraham" data-order="24"></i> <i data-commentator="Mishnah Berurah" data-label="עג"></i> water, since the wine blessing exempts it — just as in the first blessing wine exempts all kinds <i data-commentator="Ba'er Hetev" data-order="21"></i> of beverages.
