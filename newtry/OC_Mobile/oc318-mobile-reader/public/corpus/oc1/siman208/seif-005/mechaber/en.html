<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> Flour,<i data-commentator="Mishnah Berurah" data-label="יט"></i> even of wheat —<i data-commentator="Mishnah Berurah" data-label="כ"></i> one blesses on it shehakol and afterward borei nefashot —<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> whether it was <i data-commentator="Mishnah Berurah" data-label="כא"></i> ground very fine, whether it was ground somewhat and still has taste of wheat, whether flour of roasted grain.
