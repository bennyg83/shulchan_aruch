<i data-commentator="Be'er HaGolah" data-label="ז" data-order="29"></i> It is <i data-commentator="Mishnah Berurah" data-label="לט"></i> forbidden to clean out the feeding trough before a fattened ox —<i data-commentator="Be'er HaGolah" data-label="ח" data-order="30"></i> even a trough that is a vessel — by a decree on account of one <i data-commentator="Mishnah Berurah" data-label="מ"></i> that is in the ground, lest one come to <i data-commentator="Be'er HaGolah" data-label="ט" data-order="31"></i> level out holes. It is <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Ba'er Hetev" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="מא"></i> likewise forbidden to push the straw before it to the sides.
