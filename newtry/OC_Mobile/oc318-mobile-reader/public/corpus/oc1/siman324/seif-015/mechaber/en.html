<i data-commentator="Be'er HaGolah" data-label="ז" data-order="29"></i> Forbidden to <i data-commentator="Mishnah Berurah" data-label="לט"></i> scrape out the feeding trough before a fattened ox — even <i data-commentator="Be'er HaGolah" data-label="ח" data-order="30"></i> a trough of a wooden vessel, by a decree on account of one <i data-commentator="Mishnah Berurah" data-label="מ"></i> of the ground, lest he come to level <i data-commentator="Be'er HaGolah" data-label="ט" data-order="31"></i> holes; and likewise forbidden <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Ba'er Hetev" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="מא"></i> to push aside the straw before it to the sides.
