<i data-commentator="Be'er HaGolah" data-label="ש" data-order="21"></i> One does not place water or food <i data-commentator="Mishnah Berurah" data-label="כט"></i> before bees, nor before dovecote doves and attic doves, nor before <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Be'er HaGolah" data-label="ת" data-order="22"></i> <i data-commentator="Mishnah Berurah" data-label="ל"></i> a pig;<i data-commentator="Ba'er Hetev" data-order="7"></i> but <i data-commentator="Be'er HaGolah" data-label="א" data-order="23"></i> one places before geese and chickens and house doves, and likewise before <i data-commentator="Be'er HaGolah" data-label="ב" data-order="24"></i> a <i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="לא"></i> dog <i data-commentator="Ba'er Hetev" data-order="8"></i> whose sustenance is upon you.
