<b>הימנית</b> עט״ז ועיין הגמי״י פ״ה מה״ת ר״ו משמע כב״י וכ״מ וכ״כ הר״מ ז״ל ועומד כעבד קמיה מריה באימה ויראה ופחד יע״ש. ובטור סימן צ״א פירש בצערא כו׳ הביאו בצ״ע ס״ו והמחבר השמיטו דאזיל לשיטתיה ופסק כר״מ ז״ל והר״ב לא הגיה כאן דסובר מסברא הוא והלשון שהעתיק המחבר דברי הר״מ אין מבואר ההיפוך לכן שתיק ליה:
