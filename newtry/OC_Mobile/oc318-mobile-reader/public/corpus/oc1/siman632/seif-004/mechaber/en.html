<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> <i data-commentator="Magen Avraham" data-order="5"></i>4. If there are 2 tefachim of invalid s'chach and 2 other tefachim of invalid s'chach, and an open space less than three interrupts between them,<i data-commentator="Mishnah Berurah" data-label="יט"></i> there is reason to doubt if two tefachim of the <i data-commentator="Mishnah Berurah" data-label="כ"></i> invalid s'chach join together to invalidate the sukkah.
