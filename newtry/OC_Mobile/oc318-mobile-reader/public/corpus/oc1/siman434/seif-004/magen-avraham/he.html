<b>שלוחו</b>. פי' שצוהו לבטל אכל כשצוהו לבדוק אין יכול לבטל ובד"מ כתוב בשם מהרי"ל שצריך שיעמוד אצלו וכמ"ש סוף סי' תרע"ו וב"ח פסק דאין לבטל ע"י שליח:<br>
