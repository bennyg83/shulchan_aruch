<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> On miracle of <i data-commentator="Mishnah Berurah" data-label="כ"></i> one's teacher one must bless as on father's miracle.<small>There are those who <i data-commentator="Mishnah Berurah" data-label="כא"></i> say <i data-commentator="Magen Avraham" data-order="8"></i> similarly if <i data-commentator="Ba'er Hetev" data-order="7"></i> one sees the person for whom the miracle was done <i data-commentator="Mishnah Berurah" data-label="כב"></i> he blesses on him as on the place where the miracle was done. (Abudraham).</small>
