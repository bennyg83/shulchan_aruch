<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> On a miracle done <i data-commentator="Mishnah Berurah" data-label="כ"></i> for one's teacher, he must bless as he would for his father's miracle.<small>Rem&quot;a: There are those <i data-commentator="Mishnah Berurah" data-label="כא"></i> who <i data-commentator="Magen Avraham" data-order="8"></i> say that,<i data-commentator="Ba'er Hetev" data-order="7"></i> similarly, if one sees the person for whom a miracle was <i data-commentator="Mishnah Berurah" data-label="כב"></i> performed, he should bless just as he would at the place where the miracle was performed.</small>
