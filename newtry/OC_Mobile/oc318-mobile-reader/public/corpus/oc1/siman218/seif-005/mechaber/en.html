<i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> Someone for whom many miracles were done, when he comes to one of the places that a <i data-commentator="Magen Avraham" data-order="7"></i> miracle was done, he <i data-commentator="Mishnah Berurah" data-label="יח"></i> should mention <i data-commentator="Ba'er Hetev" data-order="6"></i> all the places,<i data-commentator="Mishnah Berurah" data-label="יט"></i> and include them in one blessing.
