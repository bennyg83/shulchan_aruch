<i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> One for whom many miracles were done — when he reaches one of the places where a miracle <i data-commentator="Magen Avraham" data-order="7"></i> was done for him <i data-commentator="Mishnah Berurah" data-label="יח"></i> he must <i data-commentator="Ba'er Hetev" data-order="6"></i> mention all other <i data-commentator="Mishnah Berurah" data-label="יט"></i> places and include them in one blessing.
