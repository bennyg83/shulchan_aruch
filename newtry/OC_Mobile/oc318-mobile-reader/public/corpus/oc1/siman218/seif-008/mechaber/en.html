<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> One who witnesses <i data-commentator="Magen Avraham" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> Lot's wife pronounces two blessings:<i data-commentator="Mishnah Berurah" data-label="כז"></i> upon her, he says: &quot;Blessed are you, oh G-d, King of the Universe, the True Judge&quot;, and upon <i data-commentator="Turei Zahav" data-order="2"></i> Lot, he says &quot;Blessed are you, oh G-d, King of <i data-commentator="Mishnah Berurah" data-label="כח"></i> the Universe, He who remembers the righteous&quot;.
