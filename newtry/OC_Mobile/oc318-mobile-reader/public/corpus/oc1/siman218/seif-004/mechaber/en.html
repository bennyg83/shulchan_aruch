<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> One who sees a place <i data-commentator="Mishnah Berurah" data-label="יד"></i> where a miracle happened to a single person does not <i data-commentator="Mishnah Berurah" data-label="טו"></i> make a blessing; but if it was to himself,<i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Sha'arei Teshuvah" data-order="4"></i> he blesses, &quot;who made a miracle <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> for me <i data-commentator="Magen Avraham" data-order="6"></i> in this place.&quot;<i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Sha'arei Teshuvah" data-order="5"></i> And all of his descendants also bless, &quot;who <i data-commentator="Mishnah Berurah" data-label="יז"></i> made a miracle to my father in this place.&quot;...
