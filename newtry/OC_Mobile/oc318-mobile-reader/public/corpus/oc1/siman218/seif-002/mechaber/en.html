<i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> On a miracle done for part of Israel — as long as it was not done for all Israel or their majority, even if done <i data-commentator="Magen Avraham" data-order="3"></i> for part <i data-commentator="Ba'er Hetev" data-order="2"></i> of tribes —<i data-commentator="Mishnah Berurah" data-label="י"></i> one does not bless on it.
