<i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> On a miracle which was done for part of Israel: as long as it was not done for all of Israel, or the majority, even if it was done for <i data-commentator="Magen Avraham" data-order="3"></i> a minority <i data-commentator="Ba'er Hetev" data-order="2"></i> of tribes, we <i data-commentator="Mishnah Berurah" data-label="י"></i> do not make the blessing on it.
