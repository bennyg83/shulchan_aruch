<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> Some say that on Rosh Hashanah <i data-commentator="Magen Avraham" data-order="4"></i> and Yom <i data-commentator="Ba'er Hetev" data-order="5"></i> Kippur it is permitted to let one's voice be heard <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="יא"></i> in one's prayer, even in public.<small>Gloss: And this is what <i data-commentator="Turei Zahav" data-order="3"></i> we practice; however, people <i data-commentator="Ateret Zekenim" data-label="♦" data-order="3"></i> must be careful not to raise <i data-commentator="Mishnah Berurah" data-label="יב"></i> their voice <i data-commentator="Ba'er Hetev" data-order="6"></i> <i data-commentator="Sha'arei Teshuvah" data-order="6"></i> too much (D'rashot Mahari&quot;v [Ya-akov Weil]).</small>
