<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i>(5) Some say that on Rosh Hashana <i data-commentator="Magen Avraham" data-order="4"></i> and Yom Kippur <i data-commentator="Ba'er Hetev" data-order="5"></i> it is permitted to make one's voice heard in prayer, (11)<i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="יא"></i> even when praying with the congregation.<small>And so is the <i data-commentator="Turei Zahav" data-order="3"></i> practice; however, they <i data-commentator="Ateret Zekenim" data-label="♦" data-order="3"></i> must take care not to <i data-commentator="Mishnah Berurah" data-label="יב"></i> raise their <i data-commentator="Ba'er Hetev" data-order="6"></i> <i data-commentator="Sha'arei Teshuvah" data-order="6"></i> voices (12) excessively (D'rashos Mahariv).</small>
