<b>And they increase on it some joy.</b> And it is written in the Kavanos that a certain great person was accustomed to say Nachem every day, and they said it also on Lag BaOmer, and he was punished.<br />
<b>Baal bris.</b> He is the sandak; and the same law applies to the mohel; see siman 555, se'if 1.
