<b>(סעיף כ"ג)  </b>בשעה שהכהני' מברכים העם לא יביטו וכו' ולא יסתכלו בהם. נ"ב ע' במג"א ס"ק ל"ח מ"ש דלשון להסתכל משמע ביותר ועיין בסמ"ע בחו"מ סי' קנ"ד ס"ק י"ד מ"ש להיפוך ועיין בחידושי לש"ס במס' ע"ז דף כ' ע"א במה דפריך שם ולאסתכולי מי שרי משם דברי המג"א תמוהים ביותר דלפי דבריו לא פריך הש"ס מידי וצ"ע ודו"ק:
