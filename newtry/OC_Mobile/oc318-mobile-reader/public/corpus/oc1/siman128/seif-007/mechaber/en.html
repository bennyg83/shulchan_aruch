<i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> If the Kohen washed [the Kohen's] hands in the morning and blessed [the blessing <i data-commentator="Magen Avraham" data-order="9"></i> of] &quot;Al N'tilat Yadayim&quot;, [the Kohen]<i data-commentator="Mishnah Berurah" data-label="כד"></i> should not go back to <i data-commentator="Ba'er Hetev" data-order="10"></i> bless [again] when washing [that Kohen's own] hands for the Raising of the Hands [i.e. the Priestly Blessing].
