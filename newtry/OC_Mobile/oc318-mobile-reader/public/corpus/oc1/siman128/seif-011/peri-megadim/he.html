<b>דרך</b> ימין עט״ז בסימן תרצ״ אות י״ג ומ״א כ״א ותרע״ו אות וי״ו ולבוש שם. ומ״א שם בתרנ״א איטר אזלינן בתר ימין דעלמא ואני מסופק דאפשר בלולב וכדומה שכולן מקיפין דרך ימין צריך הוא ג״כ לעשות כן משא״כ בכהנים וכדומה שאין ניכר שמשנה מהעולם ומכל מקום שאר כהנים עושין כו׳ ע״כ גם בכהנים אזלינן בתר ימין דעלמא:
