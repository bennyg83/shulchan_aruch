(נד) ואומרים רבון - ובר"ה ויו"כ שמאריכין בניגוני היום תאמצנו וכו' לא יתחילו לומר רבון עד לבסוף כדי שיסיימו עם הקהל כאחד:<br />
(נה) מה שהבטחתנו - שתסכים על ברכתנו וכדכתיב ואני אברכם:<br />
(נו) ושיענו הציבור אמן - ומסתברא דגם הכהנים צריכין לענות אמן על ברכת הש"ץ. יאמרו אדיר במרום ויכונו לסיים כאחד עם הש"ץ:
