<b>(ס"ק לז) לאחיהם כו'</b> א"כ בגרים נמי נימא הכי דהא נשים טף וגרים מחד קרא נפקי' ודין זה בגרים לא שמענו אי ליכא רק גרים שלא יברכו להם הכהנים:<br />
