<i data-commentator="Magen Avraham" data-order="54"></i> <i data-commentator="Ba'er Hetev" data-order="63"></i> <i data-commentator="Be'er HaGolah" data-label="נ" data-order="58"></i> <i data-commentator="Mishnah Berurah" data-label="קלד"></i> An apostate [that converted] to idol worship may not lift his hands [to perform the <i data-commentator="Be'er HaGolah" data-label="ס" data-order="59"></i> <i data-commentator="Mishnah Berurah" data-label="קלה"></i> blessing]. And there are some who say that if he has <i data-commentator="Mishnah Berurah" data-label="קלו"></i> repented, he may lift his hands (and this is primary ruling). If he was forced [to convert to idol worship], then according to all, he may lift his hands.
