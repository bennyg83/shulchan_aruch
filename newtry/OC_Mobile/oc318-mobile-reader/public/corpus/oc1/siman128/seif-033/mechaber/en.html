<i data-commentator="Be'er HaGolah" data-label="ז" data-order="51"></i> One <i data-commentator="Mishnah Berurah" data-label="קיט"></i> who does not know how to enunciate letters - for example, he who pronounces <i data-commentator="Turei Zahav" data-order="30"></i> <i data-commentator="Magen Avraham" data-order="46"></i> <i data-commentator="Mishnah Berurah" data-label="קכ"></i> alephs as ayins <i data-commentator="Ba'er Hetev" data-order="54"></i> and ayins as <i data-commentator="Magen Avraham" data-order="47"></i> alephs, or similar examples,<i data-commentator="Ba'er Hetev" data-order="55"></i> he should not life his hands [to perform the priestly blessing].
