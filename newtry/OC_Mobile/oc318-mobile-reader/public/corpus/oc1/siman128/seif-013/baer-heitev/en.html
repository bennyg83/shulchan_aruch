<b>Yevarechecha.</b> Regarding a lone kohen, whom the chazzan does not call, all agree that the chazzan prompts him with Yevarechecha. Maharam Mintz, siman 12.<br />
<b>First.</b> See Peri Chadash. One should protest against a chazzan who prompts from memory; he must prompt from a siddur. Peri Chadash.
