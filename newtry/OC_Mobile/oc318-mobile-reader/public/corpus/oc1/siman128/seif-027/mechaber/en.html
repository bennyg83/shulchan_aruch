<i data-commentator="Be'er HaGolah" data-label="ת" data-order="44"></i> <i data-commentator="Mishnah Berurah" data-label="קד"></i> A Kohen is not permitted to add anything on his own accord in addition to the three verses of Birkat Kohanim; and if he does add,<i data-commentator="Mishnah Berurah" data-label="קה"></i> he violates [the commandment of] do not add [to the Torah].
