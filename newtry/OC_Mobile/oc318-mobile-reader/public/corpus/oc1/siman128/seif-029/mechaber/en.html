<i data-commentator="Be'er HaGolah" data-label="ב" data-order="46"></i> A Kohen who <i data-commentator="Magen Avraham" data-order="41"></i> did not yet pray and [arrived and] found the congregation praying [e.g., the Amidah] may raise his hands [to perform Birkat Kohanim], and <i data-commentator="Mishnah Berurah" data-label="קז"></i> the [fact that he did not yet recite his own] prayer does not preclude <i data-commentator="Ba'er Hetev" data-order="48"></i> him [from performing Birkat Kohanim].
