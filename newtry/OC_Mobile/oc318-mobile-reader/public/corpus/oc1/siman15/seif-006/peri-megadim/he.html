<b>למטה</b> מג׳ דשם מקום ציצית פירשתיו לעיל והכין הוא ודאי לרב יהודה מנחות מ״א ב׳ ג׳ בתוך ג׳ משולשת ד׳ וכפר״ת לעיל: <b>והנה</b> ירא שמים יוצא ידי כולם כי יש בכאן ב׳ פירושים והב״ח ג״כ מחמיר שלא לתפור חתיכה עד שיסיר כל הציצית ממנו וגם לא יהיה שום תפירה מחדש תוך ג״א הן באורך ורוחב וכדכתיבנא לעיל. ועמ״א:
