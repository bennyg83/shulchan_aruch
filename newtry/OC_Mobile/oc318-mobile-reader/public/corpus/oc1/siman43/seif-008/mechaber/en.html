<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> If he forgot tefillin on his head and relieved himself in them, he places his hand over <i data-commentator="Magen Avraham" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> them until he <i data-commentator="Turei Zahav" data-order="8"></i> finishes the <i data-commentator="Ba'er Hetev" data-order="12"></i> first discharge; then he exits, removes them, and returns and re-enters.
