<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> If one forgot [that he was wearing] תפילין on his head and he defecated, he should place his hand over <i data-commentator="Magen Avraham" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> them until he finishes <i data-commentator="Turei Zahav" data-order="8"></i> his first <i data-commentator="Ba'er Hetev" data-order="12"></i> discharge and then exit and remove them, and then return and re-enter [the bathroom].
