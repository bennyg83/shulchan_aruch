<i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="יד"></i> A temporary bathroom is, for <i data-commentator="Ba'er Hetev" data-order="7"></i> example, when one goes to urinate — something for which a person does not ordinarily go to a bathroom — and this time that place becomes a <i data-commentator="Mishnah Berurah" data-label="טו"></i> bathroom for the first time.
