<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> If they (ie. his תפילין) are in [his clothing by] his chest and <i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="יז"></i> his <i data-commentator="Magen Avraham" data-order="8"></i> belt is tied, or [they are wrapped] in a cloth in his hand... it is permitted, whether he <i data-commentator="Ba'er Hetev" data-order="8"></i> is urinating or defecating.
