<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Sha'arei Teshuvah" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="יט"></i> Jews dwelling alone in a courtyard in a non-Jewish walled city,<i data-commentator="Mishnah Berurah" data-label="כ"></i> when other Jews pass through on Shabbat and lodge in a different courtyard,<i data-commentator="Mishnah Berurah" data-label="כא"></i> do not prohibit them, for a <i data-commentator="Mishnah Berurah" data-label="כב"></i> guest does not prohibit. They are permitted to carry throughout <i data-commentator="Mishnah Berurah" data-label="כג"></i> the entire city. (See <i data-commentator="Mishnah Berurah" data-label="כד"></i> later Siman 370)<small>(.</small>
