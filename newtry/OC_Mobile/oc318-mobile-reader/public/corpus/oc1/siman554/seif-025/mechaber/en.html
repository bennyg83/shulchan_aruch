<i data-commentator="Be'er HaGolah" data-label="נ" data-order="36"></i> <i data-commentator="Mishnah Berurah" data-label="נא"></i> All that eat and drink on Tisha B'av, will not see the joy of Jerusalem. And all that mourn on Jerusalem, will merit and see it in her <i data-commentator="Be'er HaGolah" data-label="ס" data-order="37"></i> joy. And that eat meat and drink at the Parting Meal, on him the verse says (Ezekiel 32:27). {Rama: their iniquities are <i data-commentator="Turei Zahav" data-order="11"></i> <i data-commentator="Magen Avraham" data-order="28"></i> on their bones}
