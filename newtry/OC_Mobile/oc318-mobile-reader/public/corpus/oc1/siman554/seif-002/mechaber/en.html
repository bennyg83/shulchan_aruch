<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> It is permitted to learn the exegesis <i data-commentator="Mishnah Berurah" data-label="ג"></i> of Eichah <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Magen Avraham" data-order="4"></i> and Perek Ein Megalchin <i data-commentator="Mishnah Berurah" data-label="ד"></i>(third and final perek of Moed Katan). Likewise, one may learn the <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> interpretations of Eichah and Iyov.
