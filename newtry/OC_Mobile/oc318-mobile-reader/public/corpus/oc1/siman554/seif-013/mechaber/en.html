<i data-commentator="Be'er HaGolah" data-label="ש" data-order="21"></i> One who is <i data-commentator="Magen Avraham" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> going to guard his fruits, can cross in water until his neck and he has no concern. But on the return, it is forbidden.
