<b>And it is proper.</b> See below, siman 615, that it is forbidden to touch one's wife as though she were a niddah, and perhaps the same applies on Tisha B'Av; Darkei Moshe. Nevertheless by day one may be lenient; Magen Avraham.<br />
<b>We say to a nazir.</b> Go around, go around, and do not approach the vineyard.
