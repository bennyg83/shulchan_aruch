<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="כא"></i> A person who pours (the water) on his hands in the morning (for the ritual hand-washing) needs to to be careful that he not pour on his hand except to the end of the joints of the fingers.
