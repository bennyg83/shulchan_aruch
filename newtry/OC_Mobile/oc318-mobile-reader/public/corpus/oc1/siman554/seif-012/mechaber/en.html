<i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> One who is going to visit <i data-commentator="Magen Avraham" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="כג"></i> his teacher, father, or one who is bigger (in Torah knowledge) than him, or for a Mitzvah need, can cross in water until his neck and he has no concern. And same <i data-commentator="Be'er HaGolah" data-label="ר" data-order="20"></i> <i data-commentator="Turei Zahav" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> on <i data-commentator="Magen Avraham" data-order="13"></i> the return, it is allowed.
