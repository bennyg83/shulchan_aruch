<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> A deaf person,<i data-commentator="Mishnah Berurah" data-label="ב"></i> an imbecile and a minor are <i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> exempt. And even if the deaf person is able to speak,<i data-commentator="Mishnah Berurah" data-label="ג"></i> the fact that he cannot hear means he has no obligation.<small>However,<i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> a <i data-commentator="Ba'er Hetev" data-order="1"></i> dumb person is able to enable others to fulfil their obligation (Beit Yosef).)</small>:
