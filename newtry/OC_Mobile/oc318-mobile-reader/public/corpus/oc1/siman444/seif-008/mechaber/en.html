<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> <i data-commentator="Turei Zahav" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="לד"></i> If he had dough in his house <i data-commentator="Mishnah Berurah" data-label="לה"></i> and is occupied elsewhere and fears it may become chametz — he nullifies it in his heart before it becomes chametz;<i data-commentator="Mishnah Berurah" data-label="לו"></i> but if it already became <i data-commentator="Mishnah Berurah" data-label="לז"></i> chametz, nullification does not help if it is after the time of its prohibition.
