<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> <i data-commentator="Turei Zahav" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="לד"></i> If he had dough in his house <i data-commentator="Mishnah Berurah" data-label="לה"></i> and he is occupied elsewhere, and he fears that it may become leaven, he should nullify it in his heart before it becomes <i data-commentator="Mishnah Berurah" data-label="לו"></i> leaven; but if it already became <i data-commentator="Mishnah Berurah" data-label="לז"></i> leaven, nullification is not effective if this is after the time when it is prohibited.
