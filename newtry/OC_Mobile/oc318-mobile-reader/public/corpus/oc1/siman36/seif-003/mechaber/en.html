<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Magen Avraham" data-order="3"></i> One must add <i data-commentator="Mishnah Berurah" data-label="יב"></i> the appropriate tags [lines <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Sha'arei Teshuvah" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i> ending with round dots] upon the letters that make the acronym <i data-commentator="Mishnah Berurah" data-label="יד"></i> SHATNEZ GETZ [Shin, Ayin, Tet, Nun, Zayin, Gimmel, Tzadi]. And the scribes customarily tagged <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i>(other letters [as well]. If the scribe did not tag even SHATNEZ GETZ, he did <i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Sha'arei Teshuvah" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="טו"></i> not void the tefillin.
