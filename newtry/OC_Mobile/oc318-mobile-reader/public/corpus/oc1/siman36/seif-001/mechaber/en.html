<b>One must be precise in writing</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> the letters <i data-commentator="Mishnah Berurah" data-label="א"></i> so that no letter's form <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Sha'arei Teshuvah" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ב"></i> changes and no letter resembles <i data-commentator="Mishnah Berurah" data-label="ג"></i> another.'. <small>And lekhatchila one should write <i data-commentator="Mishnah Berurah" data-label="ד"></i> in ketivah temah as in Tur and other poskim, known among scribes; however if he changed <i data-commentator="Mishnah Berurah" data-label="ה"></i> the writing style he did not invalidate.</small>
