<b>ס"ד אם קיבל.</b> דכל תענית שלא שקעה כו' כמ"ש בתענית י"ב ובסתם קבלה צריך להשלים:<br />
<b>אם לא.</b> כפי' הרא"ש בעירובין שם דמתענין ומשלימין ר"ל אם ירצה וכן כ' תוס' שם ד"ה והלכתא כו':<br />
<b>וי"א דלא.</b> עתוס' דע"ז ל"ד א' ד"ה מתענין כו' ומיהו כו' ועמ"א:<br />
<b>ואם הוא.</b> דאפי' בשבת שרי שבת י"א א':
