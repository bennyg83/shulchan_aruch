<i data-commentator="Be'er HaGolah" data-label="ב" data-order="24"></i> If it is found to be <i data-commentator="Magen Avraham" data-order="19"></i> <i data-commentator="Mishnah Berurah" data-label="נא"></i> a tereifah, it is forbidden <i data-commentator="Mishnah Berurah" data-label="נב"></i> to handle it, but <i data-commentator="Ba'er Hetev" data-order="8"></i> one may sell it to a non-Jew in the same manner as selling to a Jew was permitted — without weighing it and without mentioning a specific sum of money. If he does not trust him, he may take a pledge from him.
