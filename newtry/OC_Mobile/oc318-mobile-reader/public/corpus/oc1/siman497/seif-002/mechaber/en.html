<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> Fish, fowl, and animals that are muktzeh —<i data-commentator="Mishnah Berurah" data-label="ה"></i> one may not water them on Yom <i data-commentator="Ateret Zekenim" data-label="♦" data-order="2"></i> Tov and may not <i data-commentator="Ba'er Hetev" data-order="2"></i> place food before them, lest <i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ו"></i> one come to take from them. And anything that is forbidden to eat or use because it is muktzeh is forbidden to handle.
