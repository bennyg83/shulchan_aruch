<i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i> <i data-commentator="Turei Zahav" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="לו"></i> If one designated two <i data-commentator="Magen Avraham" data-order="14"></i> and found three, or designated black ones and white ones in nests <i data-commentator="Mishnah Berurah" data-label="לז"></i> separated by a partition and found the <i data-commentator="Magen Avraham" data-order="15"></i> black ones in <i data-commentator="Mishnah Berurah" data-label="לח"></i> place of the white ones and the white ones in place of the black ones — they <i data-commentator="Mishnah Berurah" data-label="לט"></i> are forbidden unless he recognizes them.
