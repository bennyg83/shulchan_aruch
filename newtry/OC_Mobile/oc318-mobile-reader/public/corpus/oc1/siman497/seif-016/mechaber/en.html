<i data-commentator="Ateret Zekenim" data-label="♦" data-order="7"></i> <i data-commentator="Be'er HaGolah" data-label="א" data-order="23"></i> One who slaughters an animal on Yom Tov — it is better that he not inspect it <i data-commentator="Mishnah Berurah" data-label="מט"></i> until after he skins it, because if it is found to be <i data-commentator="Mishnah Berurah" data-label="נ"></i> a tereifah he will not be <i data-commentator="Magen Avraham" data-order="18"></i> permitted to skin it.
