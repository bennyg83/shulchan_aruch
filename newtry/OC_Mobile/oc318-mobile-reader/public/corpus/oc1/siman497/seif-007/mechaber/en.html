All other animals and fowl <i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> <i data-commentator="Magen Avraham" data-order="9"></i> that require trapping — meaning <i data-commentator="Ateret Zekenim" data-label="♦" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="יט"></i> one would have to say &quot;bring a trap and we will catch it&quot; — it is forbidden to trap them or to place food before them. Whatever does <i data-commentator="Mishnah Berurah" data-label="כ"></i> not require trapping, one may trap and place food before them.
