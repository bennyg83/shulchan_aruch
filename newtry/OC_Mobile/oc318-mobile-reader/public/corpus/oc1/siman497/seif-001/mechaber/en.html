<b>Laws of preparation on Yom Tov. 17 sections: One</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Turei Zahav" data-order="1"></i> may not trap fish <i data-commentator="Mishnah Berurah" data-label="א"></i> from fish pools.<small>Rema:<i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ב"></i> Even in a place where they do not require trapping, since the pool is very wide <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> and the <i data-commentator="Ba'er Hetev" data-order="1"></i> fish slip away in all directions. (HaMagid ch. 2))</small>
