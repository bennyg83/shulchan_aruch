<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> Women and slaves, even though they are exempt from the Recitation of the Shema, are obligated in [the Amidah] prayer, because <i data-commentator="Mishnah Berurah" data-label="ד"></i> it is <i data-commentator="Magen Avraham" data-order="2"></i> a <i data-commentator="Turei Zahav" data-order="2"></i> positive mitzvah <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Sha'arei Teshuvah" data-order="1"></i> that is not limited by time. And children that have reached [the age] for education,<i data-commentator="Magen Avraham" data-order="3"></i> we are obligated <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> to educate them.
