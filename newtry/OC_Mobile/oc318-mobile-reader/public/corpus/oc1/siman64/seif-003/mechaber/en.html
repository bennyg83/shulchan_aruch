<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> One who erred in-between sections, in that he knows that he completed a section, but does not <i data-commentator="Mishnah Berurah" data-label="ח"></i> know if it was the first (&quot;v'ahavta&quot;) or the second [section] (&quot;v'haya im shamoah&quot;), he returns to [the end of] the first section and then begins &quot;If you will listen...&quot;.
