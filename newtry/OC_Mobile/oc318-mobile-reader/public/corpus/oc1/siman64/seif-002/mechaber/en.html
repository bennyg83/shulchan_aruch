<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> One who read a <i data-commentator="Mishnah Berurah" data-label="ד"></i> section and <i data-commentator="Ba'er Hetev" data-order="1"></i> erred <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> in it: if he knows where he erred, for example, he read the whole section but <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> skipped one verse in the middle, he returns to the beginning of that verse <i data-commentator="Mishnah Berurah" data-label="ו"></i> and finishes the section. But <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> if one does not know where one erred, he <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Turei Zahav" data-order="1"></i> returns to <i data-commentator="Mishnah Berurah" data-label="ז"></i> the beginning <i data-commentator="Ba'er Hetev" data-order="3"></i> of the section.
