If one puts mud in front of the original wall <i data-commentator="Mishnah Berurah" data-label="נג"></i> in order to lessen the area of the enclosed space and the <i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> mud is thick enough such that if the wall is removed, it can stand on its own, the <i data-commentator="Mishnah Berurah" data-label="נד"></i> lessening is effective. If this is not <i data-commentator="Mishnah Berurah" data-label="נה"></i> true, there is no lessening.
