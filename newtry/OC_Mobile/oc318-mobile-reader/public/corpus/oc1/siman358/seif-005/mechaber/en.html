<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> If one builds <i data-commentator="Mishnah Berurah" data-label="מה"></i> a column in order to legally reduce the area and the <i data-commentator="Mishnah Berurah" data-label="מו"></i> column is three tefachim wide,<i data-commentator="Mishnah Berurah" data-label="מז"></i> the area is effectively lessened.
