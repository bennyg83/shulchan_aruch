<i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> If one builds a <i data-commentator="Mishnah Berurah" data-label="מח"></i> wall for ten [amot]<i data-commentator="Mishnah Berurah" data-label="מט"></i> in front of the original wall in order to nullify it <i data-commentator="Mishnah Berurah" data-label="נ"></i> as if it did not exist and <i data-commentator="Magen Avraham" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="נא"></i> therefore the area is enclosed for dwelling by the second wall, and the the new wall is three tefachim from <i data-commentator="Mishnah Berurah" data-label="נב"></i> the old one, this is permitted.
