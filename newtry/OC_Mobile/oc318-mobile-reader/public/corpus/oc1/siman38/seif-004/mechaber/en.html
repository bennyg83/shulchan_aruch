<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> One who wears tefillin must be <i data-commentator="Mishnah Berurah" data-label="יד"></i> careful of <i data-commentator="Magen Avraham" data-order="4"></i> lustful thoughts about a <i data-commentator="Ba'er Hetev" data-order="3"></i> woman.<small>If he cannot do so without such thoughts, it is better <i data-commentator="Mishnah Berurah" data-label="טו"></i> not to wear them. [Kol Bo; Orach Chaim]]:</small>
