<i data-commentator="Be'er HaGolah" data-label="ח" data-order="9"></i> <i data-commentator="Sha'arei Teshuvah" data-order="6"></i> There are those that protest that which we are accustomed to conclude the verse of Shofaros with the verse &quot;And on your joyous occasions&quot; (Bamidar 10:10) due to that it does not mention a Shofar, rather a trumpet (Chatzoros).' <i data-commentator="Be'er HaGolah" data-label="ט" data-order="10"></i> Yet the <i data-commentator="Be'er HaGolah" data-label="י" data-order="11"></i> Rosh and the Ran write to maintain the custom.
