<i data-commentator="Be'er HaGolah" data-label="ו" data-order="7"></i> We do not say a verse in the Kingship nor the Remembrance nor the Shofaros of the punishments of Israel. And we do <i data-commentator="Be'er HaGolah" data-label="ז" data-order="8"></i> not say verse of rememberance of an individual.
