[ב] <b>[לבוש] אשמנו וכו'.</b> דברנו דופי לשון גנאי, ור"י קמחא פירש דו הוא שנים, כמו שנאמר דו פרצופין ורצה לומר שתי פיות מדבר, אחד בפניו ואחד שלא בפניו. ולא שוה לנו כלומר ולא עלתה בידינו הצלחה באתו מרד, אבודרהם. ויכה באגרוף על החזה, כתבי האר"י ז"ל. ובמדרש קהלת שיכה על הלב לומר אתה גרמת לי. (מגן אברהם):
