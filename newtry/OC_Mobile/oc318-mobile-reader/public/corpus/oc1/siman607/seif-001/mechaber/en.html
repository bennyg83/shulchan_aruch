<b>The order of the confession at Minchah on Erev Yom Kippur. It contains six se'ifim.</b><br>One must confess at Minchah before the meal of separation [seudah hamafsekes]. {Rama: And an individual says it after he has finished his prayer; and the chazzan says it on Yom Kippur within the prayer (Tur).}
