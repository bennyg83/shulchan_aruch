<b>(ס"ק א) קודם כו'</b> שמא יארע כו' זו היא גירסת הרי"ף:<br />
<b>וכתב הרמב"ם פ"ב מהלכות תשובה וז"ל ומצות ווידוי יה"כ כו'</b> קודם שיאכל שמא יחנק בסעודתו קודם שהתוודה עכ"ל. וכ' הלח"מ שמפרש כן דברי הש"ס שמא יארע כו' ועיין ב"ח. אבל גירסתינו ביומא ד' פ"ז ע"ב שמא תטרוף דעתו בסעודה. ופירש"י מחמת שכרות וכ"כ הר"ן:
