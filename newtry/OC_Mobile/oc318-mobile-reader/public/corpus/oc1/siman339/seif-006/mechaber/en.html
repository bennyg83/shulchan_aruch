<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="לג"></i> It is <i data-commentator="Magen Avraham" data-order="12"></i> <i data-commentator="Ba'er Hetev" data-order="7"></i> forbidden for a person to float something in water away or <i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> towards him. Therefore, it is forbidden <i data-commentator="Mishnah Berurah" data-label="לד"></i> to divide woodchips in the water in order to make the water cleaner.
