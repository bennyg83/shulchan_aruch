<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> <i data-commentator="Magen Avraham" data-order="13"></i> <i data-commentator="Ba'er Hetev" data-order="8"></i> <i data-commentator="Sha'arei Teshuvah" data-order="8"></i> If a boat is sitting on the sand underwater <i data-commentator="Mishnah Berurah" data-label="לה"></i> and is not floating <i data-commentator="Eshel Avraham" data-label="ב" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="לו"></i> at all, one is <i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> <i data-commentator="Magen Avraham" data-order="14"></i> permitted to <i data-commentator="Ba'er Hetev" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="לז"></i> enter it. If it is attached like boats in a harbor, even though it floats, one is permitted to enter it.<i data-commentator="Be'er HaGolah" data-label="•" data-order="17"></i>
