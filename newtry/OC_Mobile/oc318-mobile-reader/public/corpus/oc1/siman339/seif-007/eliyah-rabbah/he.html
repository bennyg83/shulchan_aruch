[ז] <b>קשורה וכו'.</b> וצריך שיהא קשר בראשו האחד בספינה ובשני ביבשה (בנימין זאב). אחד היה לו חוב גדול אצל כותי ונודע שהוא חולה אסור להשכיר לו ספינה קטנה ללכת אצלו דלא ברי היזיקא דשמא לא ימות או יצוה לפרוע (ר"י לוי ל"ב), ומגן אברהם כתב דאפילו ברי היזיקא אסור דהא אפילו לדבר מצוה אסור בסימן תקי"ג סעיף ו':
