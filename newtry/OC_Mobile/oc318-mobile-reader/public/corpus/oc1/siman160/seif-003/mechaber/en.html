<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> Water that is in front of the blacksmith is pusul even if it hasn't changed in appearance, because it's known that work was done with it, that is, that he cooled the metal with it. And <i data-commentator="Mishnah Berurah" data-label="יט"></i> that which is in front of the barber is pusul if it's appearance changed and kosher if not.
