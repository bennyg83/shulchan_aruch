<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> The reason for the invalidity of the hot waters of Tiberias <i data-commentator="Mishnah Berurah" data-label="לו"></i> for washing is because they are are bitter and are not fitting for <i data-commentator="Mishnah Berurah" data-label="לז"></i> the drinking <i data-commentator="Ateret Zekenim" data-label="♦" data-order="3"></i> of the dog. But if hot gushing water will be found that are fitting for the drinking of the dog, the hands are washed from them.
