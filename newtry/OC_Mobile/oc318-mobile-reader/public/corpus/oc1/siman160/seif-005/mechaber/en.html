<i data-commentator="Turei Zahav" data-order="6"></i> <i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> Work only invalidates water that has been drawn, whether it is in vessels or it is in the ground.<i data-commentator="Mishnah Berurah" data-label="כד"></i> But not with water <i data-commentator="Mishnah Berurah" data-label="כה"></i> of a mikvah or a spring as long as it is still connected.
