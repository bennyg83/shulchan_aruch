<i data-commentator="Be'er HaGolah" data-label="ש" data-order="22"></i> <i data-commentator="Mishnah Berurah" data-label="סח"></i> All objects' <i data-commentator="Turei Zahav" data-order="17"></i> handles require the same <i data-commentator="Eshel Avraham" data-label="יג" data-order="13"></i> scouring as the objects.<small>Rema: However, if one did not scour the handles,<i data-commentator="Magen Avraham" data-order="24"></i> <i data-commentator="Chok Yaakov" data-order="40"></i> <i data-commentator="Mishnah Berurah" data-label="סט"></i> it is not <i data-commentator="Ba'er Hetev" data-order="29"></i> <i data-commentator="Mishnah Berurah" data-label="ע"></i> forbidden after the fact, and even a priori,<i data-commentator="Mishnah Berurah" data-label="עא"></i> it is permissible <i data-commentator="Magen Avraham" data-order="25"></i> to scour the handles by pouring [hot water] on them (Long Issur vHeiter Principle 58).)</small>:
