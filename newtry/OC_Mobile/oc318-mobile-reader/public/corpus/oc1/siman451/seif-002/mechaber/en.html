<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> If a kuvia, which is a object made <i data-commentator="Chok Yaakov" data-order="12"></i> <i data-commentator="Ba'er Hetev" data-order="8"></i> of bricks and dirt, and one bakes on fries in it, or also a small oven called a pidlya, are refired from <i data-commentator="Mishnah Berurah" data-label="יז"></i> the outside, it is forbidden to bake in it on Passover, because the hametz inside is not removed. If it <i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Chok Yaakov" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="יח"></i> is filled with coals on the <i data-commentator="Ba'er Hetev" data-order="9"></i> inside, it is <i data-commentator="Eshel Avraham" data-label="ג" data-order="3"></i> permitted.
