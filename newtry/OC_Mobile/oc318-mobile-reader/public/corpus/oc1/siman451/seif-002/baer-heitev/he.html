<b>מלבנים. </b> עיין מ"א דלבנים הנשרפין בכבשן כעין שלנו יש להם כל דין כלי חרס. וכת' הח"י אלא דלא חייס עלייהו כ"כ ואפש' דמהני להו הסקה אפי' תוך תנורים שלנו לדעתי. אבל לבנים שנתייבשו בחמה יש להם דין כלי אדמה. <small>(וכלי גללים ואבנים ככלי חרס בשם הטור ואנן לא ק"ל הכי)</small>. ע"ש:<br />
