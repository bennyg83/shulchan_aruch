<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="3"></i> Dough found in cracks of a kneading <i data-commentator="Mishnah Berurah" data-label="ל"></i> trough: if there is an olive-sized amount (kezayit) in one place,<i data-commentator="Turei Zahav" data-order="5"></i> one must remove it; if <i data-commentator="Mishnah Berurah" data-label="לא"></i> not, then if it was placed there to strengthen the trough or to seal a <i data-commentator="Eshel Avraham" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="לב"></i> hole, it is nullified by <i data-commentator="Magen Avraham" data-order="10"></i> <i data-commentator="Chok Yaakov" data-order="17"></i> <i data-commentator="Mishnah Berurah" data-label="לג"></i> its smallness; otherwise, it must be removed.
