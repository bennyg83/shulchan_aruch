<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="3"></i> Dough in the cracks of a kneading trough <i data-commentator="Mishnah Berurah" data-label="ל"></i>— if there is a kezayit in one place he is obligated to <i data-commentator="Turei Zahav" data-order="5"></i> destroy it; if not, if it <i data-commentator="Mishnah Berurah" data-label="לא"></i> was placed to strengthen broken pieces of the trough or to seal a hole in it, it is <i data-commentator="Eshel Avraham" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="לב"></i> nullified in its minority; and <i data-commentator="Magen Avraham" data-order="10"></i> <i data-commentator="Chok Yaakov" data-order="17"></i> <i data-commentator="Mishnah Berurah" data-label="לג"></i> if not he is obligated to destroy it.
