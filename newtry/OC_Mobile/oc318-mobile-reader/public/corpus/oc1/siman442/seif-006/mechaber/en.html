<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> It is customary to scrape walls and chairs that chametz touched, and they have <i data-commentator="Mishnah Berurah" data-label="כח"></i> basis to rely on; and if there is chametz in a crack that one cannot pick out after it, he should <i data-commentator="Mishnah Berurah" data-label="כט"></i> plaster a little clay over it.
