<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> It is customary to scrape the walls and chairs that came into contact with <i data-commentator="Mishnah Berurah" data-label="כח"></i>ḥametz, and there is basis for this practice; if there is ḥametz in a crack that one cannot reach, one should plaster <i data-commentator="Mishnah Berurah" data-label="כט"></i> a bit of clay over it.
