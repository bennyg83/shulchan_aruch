<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> If one makes kiddush in one house over a dish eaten <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> there, and afterwards goes to eat <i data-commentator="Mishnah Berurah" data-label="י"></i> in another place, must return and say kiddush in the place where he wants to eat.
