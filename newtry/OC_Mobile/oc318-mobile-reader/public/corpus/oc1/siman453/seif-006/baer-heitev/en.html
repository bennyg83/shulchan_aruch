<b>This year.</b> The same law applies if he put flour in them even once, even Pesach flour: if he wishes to launder them, he must open the stitches, as written above in siman 451 s.k. 31.<br />
<b>And they launder them.</b> The Taz wrote that it is good to buy new ones; see there, and see Chok Yaakov.
