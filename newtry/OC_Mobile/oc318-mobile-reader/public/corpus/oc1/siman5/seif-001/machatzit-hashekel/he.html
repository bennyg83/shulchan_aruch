<b>ס"ק א ביו"ד כו'.</b> וצ"ל בפת"ח ר"ל תחת האלף ועל הדל"ת חולם א"צ לפרש ובקמ"ץ תחת הנו"ן אבל לא חיר"ק דמשמע ח"ו שהוא אדון לו לבדו משא"כ בקמ"ץ משמעו אדון לכל ובתשובת ר"מ מלובלין סי' פ"ג. אך בספר א"ר כ' שגם מהר"ם סוף ימיו חזר בו והודה שיהי' נקר' האל"ף בקטף פת"ח. אך לא יאריך לנוע הרבה השו"א ולא הפת"ח:
