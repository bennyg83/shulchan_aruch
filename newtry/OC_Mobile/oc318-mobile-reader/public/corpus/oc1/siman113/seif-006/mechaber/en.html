<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> When one bows, one should bow <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Sha'arei Teshuvah" data-order="5"></i> quickly and all at once. When one straightens up, one straightens gently, [with] one's head [up] first and then afterwards, one's body, so that it not be burdensome for oneself.
