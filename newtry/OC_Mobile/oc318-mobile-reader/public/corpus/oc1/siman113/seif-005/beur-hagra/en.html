<b>Seif 5: He should not remain bent, etc.</b> Yerushalmi, cited by Tosafos at the end of the first chapter there.<br />
<b>Until, etc.</b> Hagahos Ashri, chapter 4, s.v. one who bows.<br />
<b>And if he is, etc.</b> Gemara, Berachos 28b, ‘when he is,’ and so forth, in accordance with Rashi's explanation.
