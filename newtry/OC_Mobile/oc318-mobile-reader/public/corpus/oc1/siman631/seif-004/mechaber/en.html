<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="3"></i> If the s’chach is a very light covering with much empty space, but no one place has three handbreadths of empty space [the sukkah] is valid, [provided] the overall shaded part [of its floor] exceeds its sunlit area; i.e., there is more s’chach than open space.
