<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> According to our practice it is permitted to cook in new pots on Yom Tov.<small>Some forbid it <i data-commentator="Ba'er Hetev" data-order="5"></i>(Rosh and Tur) and this is) <i data-commentator="Magen Avraham" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> the custom, except in a <i data-commentator="Magen Avraham" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> pressing situation.<i data-commentator="Ba'er Hetev" data-order="6"></i> Therefore the custom is that when one buys new pots for Pesach <i data-commentator="Ba'er Hetev" data-order="7"></i> one cooks in them before Yom Tov. (own opinion))</small>
