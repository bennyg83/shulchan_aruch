<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> <i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Magen Avraham" data-order="11"></i> One may not use a piece of split wood to prop up a pot <i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="כא"></i> or a door.<small>Rema: But it is permitted <i data-commentator="Magen Avraham" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="כב"></i> to roast with it. (Rif) All) <i data-commentator="Magen Avraham" data-order="13"></i> the more so it is permitted to kindle with it together with <i data-commentator="Mishnah Berurah" data-label="כג"></i> other wood, even though it is not suitable for kindling on its own. (Ran))</small>
