<i data-commentator="Be'er HaGolah" data-label="ה" data-order="27"></i> One who had <i data-commentator="Mishnah Berurah" data-label="מח"></i> blood let from the shoulders and did not wash his hands is in danger for seven days. One who shaved and did not wash his hands is in danger for three days. One who trimmed his nails and did not wash his hands is in danger for one day. One does not know from what the danger comes.
