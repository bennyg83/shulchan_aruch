<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> If he shook his hands into a vessel of water, it counts as netilas <i data-commentator="Turei Zahav" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> yadayim <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Ba'er Hetev" data-order="10"></i> for Kerias Shema <i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> and prayer, but not <i data-commentator="Ba'er Hetev" data-order="11"></i> for removing the ruach <i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> ra upon them. If <i data-commentator="Magen Avraham" data-order="10"></i> he rinsed his hands <i data-commentator="Ba'er Hetev" data-order="12"></i> in three alternating pourings, there is a doubt whether it suffices to remove the ruach ra upon them.
