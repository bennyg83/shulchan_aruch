<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> If he shook his hands into a vessel of water, it counts as washing <i data-commentator="Turei Zahav" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> for <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Ba'er Hetev" data-order="10"></i>&lt;i&gt;Kerias Shema&lt;/i&gt; and <i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> prayer, but not for <i data-commentator="Ba'er Hetev" data-order="11"></i> removing the evil spirit <i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> upon them. If he <i data-commentator="Magen Avraham" data-order="10"></i> rinsed his hands in <i data-commentator="Ba'er Hetev" data-order="12"></i> three alternating pourings, there is a doubt whether it suffices to remove the evil spirit upon them.
