<b>יג) יש  </b>מדקדקין שלא תקבל יד הימנית את הכלי מיד השמאלית בשום פעם אלא יד השמאלית אחר שתשפוך על הימנית תניח את הכלי בארץ ואז הימנית תקחהו מן הארץ ותשפוך על השמאלית אבל הימנית בכל פעם היא תתן את הכלי לשמאלית כדי שתשפוך בו עליה להראות הכנעה לשמאלית כנגד הימנית שהיא כאדון הגוזר על עבדו לשמשו. בן א"ח שם:
