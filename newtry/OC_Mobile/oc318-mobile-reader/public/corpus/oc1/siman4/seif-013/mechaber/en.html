<i data-commentator="Turei Zahav" data-order="9"></i> <i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i> If he <i data-commentator="Ba'er Hetev" data-order="13"></i> <i data-commentator="Sha'arei Teshuvah" data-order="13"></i> was awake <i data-commentator="Mishnah Berurah" data-label="כז"></i> all night, there is a doubt whether he must perform netilas yadayim in the morning <i data-commentator="Mishnah Berurah" data-label="כח"></i> for prayer <i data-commentator="Magen Avraham" data-order="11"></i> and to remove ruach ra from his hands.<small>He <i data-commentator="Mishnah Berurah" data-label="כט"></i>(washes without <i data-commentator="Magen Avraham" data-order="12"></i> <i data-commentator="Ba'er Hetev" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="ל"></i> a blessing (Rosh, klal 4; Rashba, siman 191).</small>
