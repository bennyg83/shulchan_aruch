<i data-commentator="Be'er HaGolah" data-label="כ" data-order="33"></i> They instituted hand-washing only for &lt;i&gt;Kerias Shema&lt;/i&gt; and prayer; but the morning blessings one may recite before washing —<i data-commentator="Magen Avraham" data-order="26"></i> <i data-commentator="Mishnah Berurah" data-label="נט"></i> unless one slept naked <i data-commentator="Be'er HaGolah" data-label="ל" data-order="34"></i> on his bed, in which case <i data-commentator="Magen Avraham" data-order="27"></i> <i data-commentator="Ba'er Hetev" data-order="30"></i> <i data-commentator="Sha'arei Teshuvah" data-order="30"></i> <i data-commentator="Mishnah Berurah" data-label="ס"></i> it is forbidden to mention the Name until one <i data-commentator="Magen Avraham" data-order="28"></i> <i data-commentator="Mishnah Berurah" data-label="סא"></i> cleans them [his hands].
