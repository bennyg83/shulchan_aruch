<i data-commentator="Be'er HaGolah" data-label="כ" data-order="33"></i> They instituted netilas yadayim only for Kerias Shema and prayer; but the morning blessings one may recite before netilas <i data-commentator="Magen Avraham" data-order="26"></i> <i data-commentator="Mishnah Berurah" data-label="נט"></i> yadayim—unless he slept <i data-commentator="Be'er HaGolah" data-label="ל" data-order="34"></i> naked on his bed, in which <i data-commentator="Magen Avraham" data-order="27"></i> <i data-commentator="Ba'er Hetev" data-order="30"></i> <i data-commentator="Sha'arei Teshuvah" data-order="30"></i> <i data-commentator="Mishnah Berurah" data-label="ס"></i> case it is forbidden to mention the Name until <i data-commentator="Magen Avraham" data-order="28"></i> <i data-commentator="Mishnah Berurah" data-label="סא"></i> he cleans them.
