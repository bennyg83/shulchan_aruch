<i data-commentator="Mishnah Berurah" data-label="נה"></i> <i data-commentator="Be'er HaGolah" data-label="ח" data-order="30"></i> If he has no <i data-commentator="Mishnah Berurah" data-label="נו"></i> water he wipes his <i data-commentator="Ba'er Hetev" data-order="28"></i> <i data-commentator="Sha'arei Teshuvah" data-order="28"></i> hands on <i data-commentator="Magen Avraham" data-order="24"></i> a <i data-commentator="Mishnah Berurah" data-label="נז"></i> pebble or on earth or on anything that <i data-commentator="Be'er HaGolah" data-label="ט" data-order="31"></i> cleans, and <i data-commentator="Magen Avraham" data-order="25"></i> recites <i data-commentator="Ba'er Hetev" data-order="29"></i> <i data-commentator="Sha'arei Teshuvah" data-order="29"></i> <i data-commentator="Mishnah Berurah" data-label="נח"></i> the blessing on cleanliness of hands; it suffices for <i data-commentator="Be'er HaGolah" data-label="י" data-order="32"></i> prayer but not for removing the evil spirit upon them.
