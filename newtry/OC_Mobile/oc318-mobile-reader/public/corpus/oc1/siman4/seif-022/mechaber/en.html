<i data-commentator="Mishnah Berurah" data-label="נה"></i> <i data-commentator="Be'er HaGolah" data-label="ח" data-order="30"></i> If he has no water <i data-commentator="Mishnah Berurah" data-label="נו"></i> he wipes his hands <i data-commentator="Ba'er Hetev" data-order="28"></i> <i data-commentator="Sha'arei Teshuvah" data-order="28"></i> on a <i data-commentator="Magen Avraham" data-order="24"></i> pebble <i data-commentator="Mishnah Berurah" data-label="נז"></i> or on earth or on anything that cleans,<i data-commentator="Be'er HaGolah" data-label="ט" data-order="31"></i> and recites <i data-commentator="Magen Avraham" data-order="25"></i> the <i data-commentator="Ba'er Hetev" data-order="29"></i> <i data-commentator="Sha'arei Teshuvah" data-order="29"></i> <i data-commentator="Mishnah Berurah" data-label="נח"></i> blessing on cleanliness of the hands; it suffices for <i data-commentator="Be'er HaGolah" data-label="י" data-order="32"></i> prayer but not for removing the ruach ra upon them.
