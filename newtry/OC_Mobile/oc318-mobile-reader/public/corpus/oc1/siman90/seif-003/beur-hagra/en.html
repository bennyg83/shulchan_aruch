<b>Seif 3, he should pray.</b> As stated there, it is a mitzvah to pray in a humble place. See there, where the proof is from the verse, 'Out of the depths I called You.'<br />
<b>And he should not stand.</b> This is from Berachos, chapter Ein Omdin, that one should not stand on a chair, stool, or high place and pray.
