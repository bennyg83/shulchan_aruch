<i data-commentator="Magen Avraham" data-order="33"></i> <i data-commentator="Be'er HaGolah" data-label="נ" data-order="36"></i> <i data-commentator="Mishnah Berurah" data-label="נט"></i> One should establish a <i data-commentator="Ba'er Hetev" data-order="25"></i> place for one's prayer and not change it unless there is a need. And <i data-commentator="Be'er HaGolah" data-label="ס" data-order="37"></i> it is not enough to establish a synagogue for oneself in which to pray, rather one must also have an established place <i data-commentator="Magen Avraham" data-order="34"></i> <i data-commentator="Mishnah Berurah" data-label="ס"></i> within the <i data-commentator="Ba'er Hetev" data-order="26"></i> established synagogue.
