<i data-commentator="Be'er HaGolah" data-label="י" data-order="32"></i> One who travels and reaches a city and wishes to spend <i data-commentator="Mishnah Berurah" data-label="מט"></i> the night there - if there <i data-commentator="Mishnah Berurah" data-label="נ"></i> is a place within 4 mil ahead of him where they pray with 10 [men], one needs' <i data-commentator="Magen Avraham" data-order="30"></i> to go <i data-commentator="Ba'er Hetev" data-order="24"></i> <i data-commentator="Mishnah Berurah" data-label="נא"></i> there. And behind him,<i data-commentator="Mishnah Berurah" data-label="נב"></i> he needs to go back up to a distance of 1 mil, in order to pray in with 10.':
