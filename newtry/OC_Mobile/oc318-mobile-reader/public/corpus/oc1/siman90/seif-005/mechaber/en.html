<i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> One should not pray <i data-commentator="Mishnah Berurah" data-label="יא"></i> in a breached place, like <i data-commentator="Mishnah Berurah" data-label="יב"></i> in <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Sha'arei Teshuvah" data-order="3"></i> a field, for when one is in <i data-commentator="Turei Zahav" data-order="2"></i> a private place, the fear of the king falls upon him and his heart breaks [in prayer].
