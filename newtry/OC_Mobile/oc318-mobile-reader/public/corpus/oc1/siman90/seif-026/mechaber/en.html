<i data-commentator="Be'er HaGolah" data-label="ו" data-order="50"></i> Any place in which we may not recite the Recitation of the Sh'ma, we may not pray [i.e. recite the Amidah] there. And just as we distance from feces, urine, a putrid smell, a corpse, and from the sight of nakedness for the Recitation of the Sh'ma,<i data-commentator="Mishnah Berurah" data-label="פב"></i> so too we distance for prayer.
