<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> It is necessary to open doorways <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ח"></i> or windows facing Jerusalem,<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> so as to pray opposite them. And it is <i data-commentator="Ateret Zekenim" data-label="♦" data-order="3"></i> preferable for <i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> a synagogue to <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> have twelve windows.
