<b>See Yoreh Deah.</b> See Taz. The Rama directed the reader to Yoreh Deah. There he wrote, 'All of this is permitted,' which implies that it is permitted even when one is in front of his teacher, unlike what Beit Yosef wrote here. See Shach there, seif katan 30, and Magen Avraham here, seif katan 38.
