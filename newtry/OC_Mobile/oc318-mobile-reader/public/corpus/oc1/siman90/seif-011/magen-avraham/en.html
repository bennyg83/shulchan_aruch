<b>One who has a synagogue.</b> If there are two synagogues, it is a mitzvah to go to the farther one, for there is reward for the steps. Bava Metzia 107.<br />
<b>He is called a bad neighbor.</b> For it is written, 'So said Hashem concerning all My evil neighbors, etc.: Behold, I will uproot them from their land.'
