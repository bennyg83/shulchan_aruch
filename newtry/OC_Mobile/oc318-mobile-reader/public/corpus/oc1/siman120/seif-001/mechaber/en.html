<b>That it is proper to say &quot;Retzei&quot; in every prayer. Containing one seif: We</b><br> <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> say &quot;Retzei&quot; in all the prayers; and this is not like those who have the custom not to say it <i data-commentator="Mishnah Berurah" data-label="א"></i> in Minchah.
