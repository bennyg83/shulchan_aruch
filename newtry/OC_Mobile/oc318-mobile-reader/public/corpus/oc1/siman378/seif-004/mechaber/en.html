<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> If one individual dwells in the inner and one in the <i data-commentator="Mishnah Berurah" data-label="יח"></i> outer, or two in the outer and they <i data-commentator="Mishnah Berurah" data-label="יט"></i> joined — the individual in the inner does not forbid the outer.<small>And likewise <i data-commentator="Mishnah Berurah" data-label="כ"></i> many who are like one individual need not join as explained above siman 370 (Maggid chapter 4).</small>
