<i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i>1. When the first night of Sukkot falls <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> on Shabbos,<i data-commentator="Ba'er Hetev" data-order="1"></i> one recites the one blessing that summarizes the seven blessings of Shemoneh Esreh, and ends it with <i data-commentator="Mishnah Berurah" data-label="ב"></i> Shabbos only.
