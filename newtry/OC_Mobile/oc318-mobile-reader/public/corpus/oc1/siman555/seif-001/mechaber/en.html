<b>The laws of tefillin and tzitzit on Tisha b'Av, contains 2 paragraphs:</b><br> <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> We are <i data-commentator="Magen Avraham" data-order="1"></i> accustomed not to <i data-commentator="Ba'er Hetev" data-order="1"></i> put on tefillin or a tallit on Tisha b'Av in the morning, but rather to put on a small tallit under <i data-commentator="Mishnah Berurah" data-label="ב"></i> clothes, and not <i data-commentator="Mishnah Berurah" data-label="ג"></i> make a blessing. And during mincha we <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Sha'arei Teshuvah" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> put on tzitzit <i data-commentator="Mishnah Berurah" data-label="ה"></i> and tefillin and bless them.
