<i data-commentator="Magen Avraham" data-order="3"></i><i data-commentator="Be'er HaGolah" data-label="10" data-order="10"></i>Great is the punishment of one who neglects the mitzvah of tzitzis. Concerning him it is said, “To grasp the corners of the earth, etc.” <i data-commentator="Ba'er Hetev" data-order="4"></i><i data-commentator="Sha'arei Teshuvah" data-order="4"></i><i data-commentator="Be'er HaGolah" data-label="20" data-order="11"></i><i data-commentator="Mishnah Berurah" data-label="9"></i>One who is careful with the mitzvah of tzitzis merits to behold the countenance of the Shechinah.
