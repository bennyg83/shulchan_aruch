<i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> Great is the punishment for one who neglects the mitzvah of tzitzis; regarding him it is said, &quot;to take hold of the corners of the earth&quot;' <i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Sha'arei Teshuvah" data-order="4"></i> <i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i>(Job 38:13). One who is careful in the mitzvah of tzitzis merits to see the Divine Presence.
