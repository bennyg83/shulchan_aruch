<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> It is <i data-commentator="Magen Avraham" data-order="1"></i> a mitzvah to hold the <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> tzitzis in one's left hand opposite one's heart while reciting Kriyas Shema — an allusion to &quot;And these words shall be… upon' <i data-commentator="Mishnah Berurah" data-label="ה"></i> your heart.&quot;
