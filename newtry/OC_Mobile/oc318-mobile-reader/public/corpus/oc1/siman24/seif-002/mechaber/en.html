<i data-commentator="Be'er HaGolah" data-label="4" data-order="4"></i>It is a mitzvah <i data-commentator="Magen Avraham" data-order="1"></i>to hold the tzitzis <i data-commentator="Ba'er Hetev" data-order="1"></i><i data-commentator="Mishnah Berurah" data-label="4"></i>in the left hand opposite the heart during Krias Shema. A hint to this is the verse, “And these words, etc.,” <i data-commentator="Mishnah Berurah" data-label="5"></i>“shall be upon your heart.”
