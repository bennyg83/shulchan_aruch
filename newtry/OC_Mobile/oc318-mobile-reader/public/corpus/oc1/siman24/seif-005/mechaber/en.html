<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> When looking at the tzitzis, one looks at the two tzitzis before him that have ten knots total — an allusion to the havayos <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ח"></i>(the Tetragrammaton with <i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> its vowelizations); they also have sixteen strings and ten knots totaling twenty-six, the gematria of the Divine Name.
