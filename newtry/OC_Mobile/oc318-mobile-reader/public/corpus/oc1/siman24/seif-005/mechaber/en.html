<i data-commentator="Be'er HaGolah" data-label="8" data-order="8"></i>When looking at the tzitzis, one should look at the two tzitzis in front of him, which contain ten knots, hinting <i data-commentator="Magen Avraham" data-order="2"></i><i data-commentator="Ba'er Hetev" data-order="3"></i><i data-commentator="Mishnah Berurah" data-label="8"></i>to the Divine Names. <i data-commentator="Be'er HaGolah" data-label="9" data-order="9"></i>They also contain sixteen strings, and together with the ten knots they total twenty-six, the numerical value of the Divine Name.
