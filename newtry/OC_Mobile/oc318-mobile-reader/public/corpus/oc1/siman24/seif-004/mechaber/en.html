<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> Some have the custom to look at the tzitzis when they reach &quot;and you shall see them,&quot;<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> and to place them <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Sha'arei Teshuvah" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ז"></i> on the eyes — a fine custom and love of the mitzvah.<small>Some also kiss the tzitzis when looking at them; all this is love of the mitzvah (Beit Yosef).]:</small>
