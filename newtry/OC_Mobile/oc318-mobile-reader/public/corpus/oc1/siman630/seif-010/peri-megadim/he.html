<b>רק</b> עט״ז ומחיצה שתי או ערב בשבת מהני והי׳ די כאן בב׳ חבלים אלא שי״ל בסוכה בעינן קצת דירה ומ״ש בש״ע גבוה מהגג היינו הסכך שלה דאמרינן לבוד למעלה ומטה כל שיש במחיצה ד״ט ושני משהויין ועמ״א ואי״ה אבאר עוד. בריש הסי׳ ובאות י״ז בסוכה בעינן ב׳ שלימות דעריבן וג׳ טפח דוקא לא קנים פחות מג״ט ובשתי לא מהני
