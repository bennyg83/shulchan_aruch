<i data-commentator="Be'er HaGolah" data-label="ט" data-order="32"></i> To read a letter sent to him if he does not know what is written in it —<i data-commentator="Magen Avraham" data-order="19"></i> <i data-commentator="Mishnah Berurah" data-label="נד"></i> permitted; and he should not read it with his mouth but examine it; and if it was brought for him from outside the techum —<i data-commentator="Mishnah Berurah" data-label="נה"></i> better to be careful <i data-commentator="Magen Avraham" data-order="20"></i> <i data-commentator="Turei Zahav" data-order="12"></i> <i data-commentator="Ba'er Hetev" data-order="17"></i> <i data-commentator="Sha'arei Teshuvah" data-order="17"></i> <i data-commentator="Mishnah Berurah" data-label="נו"></i> not to touch it.
