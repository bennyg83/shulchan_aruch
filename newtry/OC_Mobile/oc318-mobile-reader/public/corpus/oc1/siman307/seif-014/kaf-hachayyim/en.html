<b>14) There: Nor tell a non-Jew to hire, etc.</b> It is forbidden even to tell him on Shabbos to hire workers after Shabbos. Chayei Adam, klal 62, paragraph 1. It is obvious that one may not tell a non-Jew to perform labor for him the next day. Responsa Radbaz, siman 684; Birkei Yosef, paragraph 4.
