<i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> It is prohibited to give money to a Gentile <i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> before Shabbos for him to make a <i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i> purchase on Shabbos but one may say to him “purchase it for yourself and if necessary I will buy it from you after Shabbos.”
