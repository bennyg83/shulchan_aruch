<i data-commentator="Be'er HaGolah" data-label="י" data-order="33"></i> A wall or curtain with drawings of unusual animals or portrayals of people exhibiting a certain event, such as David and Goliath, and beneath it is a legend depicting it’s character, it is prohibited <i data-commentator="Magen Avraham" data-order="21"></i> to read on <i data-commentator="Mishnah Berurah" data-label="נז"></i> Shabbos.
