<i data-commentator="Be'er HaGolah" data-label="י" data-order="33"></i> A wall or curtain on which there are forms of strange animals or portraits of people of deeds — such as wars of David and Goliath — and they write &quot;this is the form of so-and-so&quot; and &quot;this is the portrait of so-and-so&quot;<i data-commentator="Magen Avraham" data-order="21"></i>— forbidden to read <i data-commentator="Mishnah Berurah" data-label="נז"></i> on Shabbat.
