<i data-commentator="Be'er HaGolah" data-label="ל" data-order="35"></i> Forbidden to study on Shabbat and Yom Tov except words of Torah; and even books of wisdom are forbidden;<i data-commentator="Be'er HaGolah" data-label="מ" data-order="36"></i> <i data-commentator="Mishnah Berurah" data-label="סה"></i> and some permit; and <i data-commentator="Ateret Zekenim" data-label="♦" data-order="5"></i> according to their reasoning <i data-commentator="Mishnah Berurah" data-label="סו"></i> permitted to look <i data-commentator="Magen Avraham" data-order="25"></i> <i data-commentator="Ba'er Hetev" data-order="20"></i> at an astrolabe on Shabbat<small>[and likewise to turn and move it, as below siman 308}.]:</small>
