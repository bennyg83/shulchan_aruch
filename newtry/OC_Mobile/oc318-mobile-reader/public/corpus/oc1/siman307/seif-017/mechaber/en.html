<i data-commentator="Be'er HaGolah" data-label="ל" data-order="35"></i> Anything other than Torah may not be learned on Shabbos and Yom Tov, and even books on humanities are prohibited; yet <i data-commentator="Be'er HaGolah" data-label="מ" data-order="36"></i> <i data-commentator="Mishnah Berurah" data-label="סה"></i> there are those that <i data-commentator="Ateret Zekenim" data-label="♦" data-order="5"></i> permit it. According to <i data-commentator="Mishnah Berurah" data-label="סו"></i> their opinion one may <i data-commentator="Magen Avraham" data-order="25"></i> <i data-commentator="Ba'er Hetev" data-order="20"></i> study the astrolabe on Shabbos<small>[(and also handle it, as written in Siman 308:50).]:</small>
