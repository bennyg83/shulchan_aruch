<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> One may not calculate one’s expenses, even ones from the past. For example, to say I spent such and such an amount on something. However <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> this is only when one must still pay the workers,<i data-commentator="Ba'er Hetev" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> but if one has already paid them it <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="כז"></i> is permitted.
