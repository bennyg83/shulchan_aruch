<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> A paste that is spread on <i data-commentator="Ba'er Hetev" data-order="4"></i> thin crackers — those crackers are <i data-commentator="Turei Zahav" data-order="8"></i> considered as a <i data-commentator="Mishnah Berurah" data-label="יב"></i> mere vehicle (tefilla) for the paste, since it is known that <i data-commentator="Magen Avraham" data-order="5"></i> one does not intend to eat <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i> them as <i data-commentator="Ba'er Hetev" data-order="5"></i> bread.
