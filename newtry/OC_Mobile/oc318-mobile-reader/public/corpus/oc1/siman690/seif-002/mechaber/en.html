<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Turei Zahav" data-order="2"></i> Even only two, or even ten people, can read (the Megillah) together <i data-commentator="Magen Avraham" data-order="3"></i> and they can fulfill the <i data-commentator="Mishnah Berurah" data-label="ד"></i> obligation and the obligation of the people listening to them.
