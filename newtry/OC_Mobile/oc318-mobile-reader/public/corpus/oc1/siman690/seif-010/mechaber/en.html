<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> One who knows a foreign language, and knows the Assyrian language, he does not <i data-commentator="Magen Avraham" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="לג"></i> fulfill his obligation with that language. And there <i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i> <i data-commentator="Mishnah Berurah" data-label="לד"></i> are those who say one does [fulfill one's obligation].<small>Rema: And if the writing is <i data-commentator="Mishnah Berurah" data-label="לה"></i> in two languages, he who understands <i data-commentator="Magen Avraham" data-order="11"></i> it fulfills his <i data-commentator="Ba'er Hetev" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="לו"></i> obligation. [Beis Yosef]]</small>:
