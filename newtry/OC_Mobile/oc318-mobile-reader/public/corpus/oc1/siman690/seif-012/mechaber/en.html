<i data-commentator="Be'er HaGolah" data-label="ר" data-order="20"></i> <i data-commentator="Turei Zahav" data-order="8"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="לט"></i> If one is <i data-commentator="Magen Avraham" data-order="14"></i> reading and dozes off, given that he didn't completely fall asleep, he has fulfilled his obligation. However <i data-commentator="Mishnah Berurah" data-label="מ"></i> if he <i data-commentator="Be'er HaGolah" data-label="ש" data-order="21"></i> <i data-commentator="Mishnah Berurah" data-label="מא"></i> heard it [from someone else] while <i data-commentator="Ba'er Hetev" data-order="10"></i> dozing off he has not fulfilled his obligation.
