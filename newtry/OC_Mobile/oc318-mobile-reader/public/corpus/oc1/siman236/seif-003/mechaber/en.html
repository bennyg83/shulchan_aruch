<i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> If he found the congregation that already recited Shema <i data-commentator="Mishnah Berurah" data-label="יא"></i> and they wish to stand in prayer <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i>— he should pray with them, and afterward recite <i data-commentator="Ba'er Hetev" data-order="4"></i> Shema with its blessings.
