<i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> If when he arrived the community had already recited Shema <i data-commentator="Mishnah Berurah" data-label="יא"></i> and was standing to pray the Amidah, he <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> should pray the Amidah with them and subsequently recite <i data-commentator="Ba'er Hetev" data-order="4"></i> Shema with its blessings.
