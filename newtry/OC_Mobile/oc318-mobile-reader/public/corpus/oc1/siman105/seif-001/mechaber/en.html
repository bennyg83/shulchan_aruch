<b>The Law Of One Who Prays Two [Amidah] Prayers. Containing 1 Se'if:</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> One who prays <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> two <i data-commentator="Ba'er Hetev" data-order="1"></i>[Amidah] prayers, one after the other, must wait <i data-commentator="Mishnah Berurah" data-label="ב"></i> between one and <i data-commentator="Mishnah Berurah" data-label="ג"></i> the other [for the <i data-commentator="Mishnah Berurah" data-label="ד"></i> time it takes] to <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Ba'er Hetev" data-order="2"></i> walk 4 amot, so that one's understanding may be settled, [in order] to pray with the language of supplication.
