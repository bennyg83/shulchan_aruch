<i data-commentator="Magen Avraham" data-order="17"></i> <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> If the shliach tzibur erred and ended the parashah with the sixth and said <i data-commentator="Mishnah Berurah" data-label="לג"></i> Kaddish, one need not read another after him;<i data-commentator="Mishnah Berurah" data-label="לד"></i> rather he reads with the maftir what he read with the sixth, for we rule the maftir counts in the minyan of seven:
