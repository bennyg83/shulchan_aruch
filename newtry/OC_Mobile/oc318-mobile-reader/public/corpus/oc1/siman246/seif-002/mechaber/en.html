<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> It is forbidden to <i data-commentator="Mishnah Berurah" data-label="ו"></i> lend any tool to a non-Jew <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="ז"></i> on Shabbat, even Friday if it’s close to nightfall. All so that he doesn’t wait to take out <i data-commentator="Magen Avraham" data-order="5"></i> from the opening of the lender’s house <i data-commentator="Mishnah Berurah" data-label="ח"></i> before nightfall because those <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> who see will think that the Jew commanded <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> him to <i data-commentator="Ba'er Hetev" data-order="2"></i> take it out.
