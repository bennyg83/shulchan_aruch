<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> A Jew that rents out oxen to a non-Jew to plow with them: many permit it if <i data-commentator="Mishnah Berurah" data-label="כ"></i> the non-Jew accepted responsibility in case the animal dies, is stolen, etc. and some say that since the non-Jew cannot sell it, if he wants he can say the animal belongs <i data-commentator="Ba'er Hetev" data-order="9"></i> <i data-commentator="Sha'arei Teshuvah" data-order="9"></i> to a Jew.<small> <i data-commentator="Mishnah Berurah" data-label="כא"></i>[[See below in this Siman]]:</small>
