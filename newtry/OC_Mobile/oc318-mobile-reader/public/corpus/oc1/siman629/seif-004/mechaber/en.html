<i data-commentator="Be'er HaGolah" data-label="ז" data-order="8"></i> Flax that <i data-commentator="Ateret Zekenim" data-label="♦" data-order="3"></i> was not <i data-commentator="Mishnah Berurah" data-label="יא"></i> ground or crushed is valid, because it is just a tree. However, if it <i data-commentator="Turei Zahav" data-order="6"></i> was ground <i data-commentator="Ateret Zekenim" data-label="♦" data-order="4"></i> or crush, it <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> is invalid.
