<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> If one recited Keriat Shema and entered the synagogue and found the congregation reciting Keriat Shema, it is good that he recite all of Keriat Shema with them and receive reward like one who reads the Torah.<small>But he is obligated only for the first verse, as explained (Beit Yosef).]:</small>
