Someone defending his fruits or seeds from an animal or bird should not clap his hands <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> together, nor should he slap his hands on his thighs, nor should he dance <i data-commentator="Mishnah Berurah" data-label="טז"></i> to chase the animals away. This is a rabbinic decree lest he pick up dirt <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="יז"></i> and throw it at them.
