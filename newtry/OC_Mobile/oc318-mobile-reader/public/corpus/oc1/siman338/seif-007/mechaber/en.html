<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> If someone has <i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> fruit on his roof and sees that rain is coming, he <i data-commentator="Magen Avraham" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> is forbidden to let them down on Shabbat through a trap door in the <i data-commentator="Magen Avraham" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> roof. However,<i data-commentator="Ba'er Hetev" data-order="7"></i> he is permitted <i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> to cover them. Even <i data-commentator="Mishnah Berurah" data-label="כז"></i> bricks that are muktzah <i data-commentator="Mishnah Berurah" data-label="כח"></i> are permitted to be covered from the drippings.
