<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> The main intention is in the <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> first verse; therefore if one recited and did not focus one's heart during the first verse, one did not <i data-commentator="Mishnah Berurah" data-label="יג"></i> fulfill one's obligation, and must go <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יד"></i> back and recite <i data-commentator="Ba'er Hetev" data-order="5"></i> it again. And <i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> even in the view of those who hold that mitzvot do not require intention <i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="טו"></i>— agrees here.
