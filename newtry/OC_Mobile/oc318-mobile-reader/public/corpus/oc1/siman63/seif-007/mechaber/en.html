<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> If one is busy with work and wants to recite the Recitation of the Sh'ma, he must cease from his work <i data-commentator="Mishnah Berurah" data-label="יט"></i> until he recites the first paragraph so that it does not appear like he's reading it casually.
