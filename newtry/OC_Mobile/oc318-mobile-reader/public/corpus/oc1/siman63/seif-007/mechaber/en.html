<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> If one is busy with work and wants to recite Keriat Shema, one must cease from one's work <i data-commentator="Mishnah Berurah" data-label="יט"></i> until one recites the first paragraph, so that it not appear like reading casually.
