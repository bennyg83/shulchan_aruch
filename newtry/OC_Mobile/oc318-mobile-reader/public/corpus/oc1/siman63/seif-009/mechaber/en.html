<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> A porter — even though his load <i data-commentator="Mishnah Berurah" data-label="כ"></i> is on his shoulders — may recite Keriat Shema; but he may not begin at the time when he loads up, nor at the time when he unloads, because his heart is not settled.
