<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> A porter, despite that his load is on <i data-commentator="Mishnah Berurah" data-label="כ"></i> his shoulders, may recite the Recitation of the Sh'ma, but may not begin [it] at the time that he loads [it] and not at the time that he puts [it] down because his heart/mind is not settled.
