<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> All blessings, if one is uncertain whether he has recited them or not, he does not recite them again neither at the beginning nor at the <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> end, except for the Birket haMazon, because it is <i data-commentator="Ba'er Hetev" data-order="6"></i> <i data-commentator="Sha'arei Teshuvah" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יא"></i> a Torah obligation.
