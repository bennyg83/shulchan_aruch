<i data-commentator="Be'er HaGolah" data-label="ד" data-order="26"></i> If <i data-commentator="Mishnah Berurah" data-label="מה"></i> the open space exceeds the standing space,<i data-commentator="Be'er HaGolah" data-label="ה" data-order="27"></i> it is forbidden, unless each individual gap <i data-commentator="Mishnah Berurah" data-label="מו"></i> is less <i data-commentator="Mishnah Berurah" data-label="מז"></i> than three handbreadths.
