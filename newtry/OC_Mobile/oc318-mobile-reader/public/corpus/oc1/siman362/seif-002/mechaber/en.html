<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="יא"></i> A mound that is five handbreadths high, and one completed it to ten <i data-commentator="Mishnah Berurah" data-label="יב"></i> by making a partition five handbreadths high on top of it —<i data-commentator="Mishnah Berurah" data-label="יג"></i> it is considered a valid <i data-commentator="Mishnah Berurah" data-label="יד"></i> partition for carrying <i data-commentator="Mishnah Berurah" data-label="טו"></i> and for all purposes.
