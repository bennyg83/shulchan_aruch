<i data-commentator="Be'er HaGolah" data-label="ו" data-order="28"></i> <i data-commentator="Mishnah Berurah" data-label="מח"></i> If the open space equals the <i data-commentator="Magen Avraham" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="מט"></i> standing space, it <i data-commentator="Mishnah Berurah" data-label="נ"></i> is permitted, whether <i data-commentator="Be'er HaGolah" data-label="ז" data-order="29"></i> in vertical <i data-commentator="Mishnah Berurah" data-label="נא"></i> or horizontal elements, provided no single opening is more than ten <i data-commentator="Mishnah Berurah" data-label="נב"></i> cubits. Up to ten cubits is permitted because it is like a doorway.
