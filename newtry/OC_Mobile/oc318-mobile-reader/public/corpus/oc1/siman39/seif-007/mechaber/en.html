<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="2"></i> We do not purchase מזוזות, תפילין, or [Torah] scrolls from a gentile for much more than their actual monetary value <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="יז"></i> in order to <i data-commentator="Magen Avraham" data-order="10"></i> not habituate them from stealing <i data-commentator="Ba'er Hetev" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="יח"></i> and robbing [sacred Jewish ritual objects in order to sell them for large sums of money].
