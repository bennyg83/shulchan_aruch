<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> Tefillin that were presumed valid <i data-commentator="Magen Avraham" data-order="14"></i> need never be checked.<i data-commentator="Ba'er Hetev" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> If he <i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> wears them only <i data-commentator="Turei Zahav" data-order="6"></i> occasionally,<i data-commentator="Magen Avraham" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="כז"></i> they require checking twice in seven years.<small>And if he has no one to check them and re-sew them, he should <i data-commentator="Mishnah Berurah" data-label="כח"></i> wear them without checking <i data-commentator="Ba'er Hetev" data-order="11"></i>(Beit Yosef in the name of Orchot Chayyim):.</small>
