<b>ס"ג גר כו'. </b>עמ"א שרש"א הקשה מש"ש והא דתניא קורין כו' הא אוקימנא בגר כו' דעביד לשמה והני תלתא ברייתות דפליגי בגוי מיירי ותי' במ"ב דמ"ש לוקחין ספרים כו' בגוי ממש איירי ומעשה דרשב"ג בגר ומייתי ראיה מיניה דלא דרשינן וקשרתם וכתבתם וז"ש תוס' בד"ה והא כו' ר"ל והא דתניא קורין ת"ק דרשב"ג דאמר לוקחין כו':
