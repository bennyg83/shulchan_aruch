<b>ס"ד יולדת כו'. </b>ספי"ח דשבת וע"ל סי' ש"ל ס"ד וצ"ע:<br />
<b>אם אמרה צריכה כו'. </b>אבל הר"ן כ' דאפי' בסתמא וכמ"ש הרי"ף בפי"ח דשבת וש"פ:<br />
<b>וימים אלו כו'. </b>כגי' בפ' הדר לימרו ליה לעו"ג ליחם אגב אימיה. וע' תוס' בגיטין שם דלא כ"כ בפשיטות וברא"ש פ"ז דב"ק סט"ו כ' בהדיא להיפך ואע"ג שי"ל דלדברי בה"ע כ"כ הלשון לא משמע כן:
