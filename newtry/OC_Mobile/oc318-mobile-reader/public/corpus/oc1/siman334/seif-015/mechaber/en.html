<i data-commentator="Be'er HaGolah" data-label="ט" data-order="31"></i> We save the bag of the book along with the book, or the bag of the tefillin along <i data-commentator="Mishnah Berurah" data-label="מג"></i> with the tefillin, even if they also <i data-commentator="Be'er HaGolah" data-label="י" data-order="32"></i> contain money. This is also true of other holy scriptures.
