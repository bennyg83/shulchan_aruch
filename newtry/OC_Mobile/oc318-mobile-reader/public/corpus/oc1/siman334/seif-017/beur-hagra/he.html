<b>סי"ז או מן.</b> כשיטתם דכל הפסד שוה לדליקה: ודוקא לרה"י. מדאמרינן מצילין תיק כו' דוקא משום ספרים וכ"ש לסברא אחרונה בסט"ז: אפי' לחצר כו' ולמבוי כו'. דבן בתירא מתיר אף במפולש וע"כ בשלא נשתתפו ורבנן ל"פ אלא במפולש ואע"ג שבגמרא אמרו ועוד לרבנן כו' עתוס' שם ד"ה ועוד וכ"ה בירושלמי שם בשלא עירבו אנן קיימינן:
