<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> We save food <i data-commentator="Mishnah Berurah" data-label="יג"></i> from a fire on Yom Kippur for Shabbat, but <i data-commentator="Turei Zahav" data-order="4"></i> not from a <i data-commentator="Magen Avraham" data-order="6"></i> fire on <i data-commentator="Ba'er Hetev" data-order="6"></i> Shabbat for Yom Kippur or a Festival, nor do we save food from <i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> a fire on Shabbat for the next Shabbat.<i data-commentator="Magen Avraham" data-order="7"></i> However, we save one meal's worth of food from a fire on <i data-commentator="Mishnah Berurah" data-label="יד"></i> Yom Kippur for after Yom Kippur.
