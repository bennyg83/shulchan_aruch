<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> He may wear as much as possible, take it out of <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="יח"></i> the house, and undress, return, dress, remove,<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="יט"></i> undress. There is one who says that he can only do this once.
