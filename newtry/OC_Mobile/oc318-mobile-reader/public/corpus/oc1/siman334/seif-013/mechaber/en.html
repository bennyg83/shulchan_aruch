<i data-commentator="Be'er HaGolah" data-label="ו" data-order="28"></i> There is one who says that the Book <i data-commentator="Turei Zahav" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="לח"></i> of Esther, because it has no names of God, if it is <i data-commentator="Mishnah Berurah" data-label="לט"></i> not written <i data-commentator="Magen Avraham" data-order="18"></i> <i data-commentator="Ba'er Hetev" data-order="13"></i> <i data-commentator="Sha'arei Teshuvah" data-order="13"></i> in Assyrian script on skin with dye, it has no holiness and is not saved from a fire.
