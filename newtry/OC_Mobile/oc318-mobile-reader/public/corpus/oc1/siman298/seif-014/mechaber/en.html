<i data-commentator="Be'er HaGolah" data-label="ש" data-order="21"></i> <i data-commentator="Mishnah Berurah" data-label="לה"></i>14. If [a group of] people lingered [in their studies] in the study hall (on Shabbat night) and a flame was brought to them,<i data-commentator="Turei Zahav" data-order="10"></i> <i data-commentator="Magen Avraham" data-order="18"></i> <i data-commentator="Mishnah Berurah" data-label="לו"></i> one person should make the blessing for them all.
