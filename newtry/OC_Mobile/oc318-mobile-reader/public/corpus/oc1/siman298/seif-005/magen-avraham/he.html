<b>אין מברכין</b>. ואפי' בדיעבד לא יצא כמ"ש סימן רצ"ז סס"ב:<br>
<b>לחיה ולחולה</b>. אם אין בהם סכנה דוקא ע"י עכו"ם ואם יש בו סכנה אפי' ע"י ישראל:<br>
<b>אור של ע"א</b>. דוקא כשהשלהבת קשורה בגחלת של ע"א אבל אם ישראל הדליק נר מנר של ע"א שרי דשלהבת אין בו ממש יש"ש סוף ביצה וכ"ה בב"י בשם הרא"ש ועבי"ד רסי' קמ"ב:
