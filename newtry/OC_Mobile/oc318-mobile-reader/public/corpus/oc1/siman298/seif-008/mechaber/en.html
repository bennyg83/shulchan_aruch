<i data-commentator="Turei Zahav" data-order="8"></i> <i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i>8. When a flame is produced from wood or stones on <i data-commentator="Magen Avraham" data-order="14"></i> <i data-commentator="Ba'er Hetev" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> Shabbat night, a blessing may be recited on it. However, on Motzei Yom Kippur this is not allowed.
