<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i>9. When coals are flaming to the extent that if one would put a sliver of wood between them, it would catch fire, a blessing may be recited over [the coals], as long as they were kindled with the intent <i data-commentator="Mishnah Berurah" data-label="כז"></i> of providing light.
