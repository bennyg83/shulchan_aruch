<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i>4. (Even though one can see the light), he should not recite a blessing over it unless <i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> he is close enough to it so that he can derive benefit from <i data-commentator="Mishnah Berurah" data-label="יג"></i> it to the degree that he could use its light to differentiate between the coins of one country and the coins of another country.
