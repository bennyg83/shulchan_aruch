<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> Before he goes to the house of study, he may eat the bread of the morning,<i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Magen Avraham" data-order="3"></i> if <i data-commentator="Ba'er Hetev" data-order="2"></i> he is accustomed to doing so. And it is good <i data-commentator="Mishnah Berurah" data-label="יא"></i> for him to accustom himself to it.
