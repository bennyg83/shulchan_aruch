<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="יד"></i> To cut stones or to fix roofs, even in the house of the non-Jew, is forbidden since the work is for the <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="טו"></i> need of something connected to the ground.<i data-commentator="Mishnah Berurah" data-label="טז"></i> And if he did so, you should not sink the house.<small>RAMA:<i data-commentator="Mishnah Berurah" data-label="יז"></i> Some say that if the Jew’s ownership isn’t publicized, then <i data-commentator="Mishnah Berurah" data-label="יח"></i> it’s permissible.[Kol Bo]]:</small>
