<i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i>1. If a child <i data-commentator="Mishnah Berurah" data-label="ב"></i> knows how to shake the <i data-commentator="Magen Avraham" data-order="1"></i> lulav properly, his <i data-commentator="Mishnah Berurah" data-label="ג"></i> father is <i data-commentator="Turei Zahav" data-order="1"></i> obligated to <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Sha'arei Teshuvah" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> buy him a lulav in order to educate him about the mitzvahs.
