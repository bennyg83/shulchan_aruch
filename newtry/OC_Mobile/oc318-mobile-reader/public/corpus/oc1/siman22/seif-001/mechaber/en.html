<b>Containing 1 se'if: One</b><br> <i data-commentator="Mishnah Berurah" data-label="א"></i> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> who buys a <i data-commentator="Turei Zahav" data-order="1"></i> tallis and makes tzitzis on it blesses Shehecheyanu, for <i data-commentator="Mishnah Berurah" data-label="ב"></i> it is no <i data-commentator="Magen Avraham" data-order="1"></i> less than <i data-commentator="Ba'er Hetev" data-order="1"></i> new vessels.<small>If one did not bless at the time <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> of <i data-commentator="Mishnah Berurah" data-label="ג"></i> making,<i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Sha'arei Teshuvah" data-order="2"></i> one blesses at the first wrapping (Maimonides and Nimukei Yosef).]:</small>
