<i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i>9. One who <i data-commentator="Mishnah Berurah" data-label="ל"></i> desires to partake of a meal immediately after Havdalah should be careful not to bring bread to the table before he recites Havdalah. If it was brought, he must spread a cloth and cover it because it is earlier <i data-commentator="Turei Zahav" data-order="8"></i> in the verse, and he <i data-commentator="Magen Avraham" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="לא"></i> must advance [the bread] first if he didn't cover it.
