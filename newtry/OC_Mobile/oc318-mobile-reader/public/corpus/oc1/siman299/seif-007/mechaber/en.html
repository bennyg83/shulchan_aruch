<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> One who makes Havdalah <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> on <i data-commentator="Ba'er Hetev" data-order="8"></i> wine at his table — even if he made Havdalah before washing hands, he discharges the wine in the meal; and <i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> some say he discharges <i data-commentator="Mishnah Berurah" data-label="כה"></i> only if he washed hands before Havdalah.<small>And <i data-commentator="Turei Zahav" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> if he <i data-commentator="Ba'er Hetev" data-order="9"></i> made <i data-commentator="Magen Avraham" data-order="10"></i> Havdalah first he must afterward bless me'ein shalosh (Tosafot and Mordekhai).]:</small>
