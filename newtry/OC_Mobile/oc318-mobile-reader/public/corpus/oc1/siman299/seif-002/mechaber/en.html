<i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ז"></i>2.<i data-commentator="Ba'er Hetev" data-order="3"></i> If one was drinking, and said 'let us go <i data-commentator="Magen Avraham" data-order="5"></i> and make havdalah', then changed his mind and drank before havdalah,<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> one need not go back and bless again. And <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> there is one who disagrees <i data-commentator="Mishnah Berurah" data-label="ח"></i> on this.
