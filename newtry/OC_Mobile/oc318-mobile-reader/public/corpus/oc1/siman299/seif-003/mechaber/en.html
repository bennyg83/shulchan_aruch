<i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i>3. When a person makes an interruption when drinking <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> in order to recite Havdalah, he does not have to say Boreh Pri HaGafen over the <i data-commentator="Ba'er Hetev" data-order="4"></i> havdalah cup. And there <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> are those who say he must.
