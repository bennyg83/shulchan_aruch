4. When a person was eating and it got dark, and we said that he does not <i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> have to interrupt his meal,<i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="יא"></i> he finishes his meal and <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> says Birkat HaMazon over the cup and afterwards says <i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i> havdalah over it. If he has two <i data-commentator="Mishnah Berurah" data-label="יד"></i> cups, he says Birkat HaMazon over one and havdalah over the other.
