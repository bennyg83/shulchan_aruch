<b>(ס"ק ד) י"א דעד שלא כו'</b> כתב בספר א"ר מצאתי כתוב דבמקום שעמדה מצה בתנור והוציאוה. או דחפוה ברחת למקום אחר אין ליתן שם לתנור לאותו מקום מצה אחרת. שכבר נצטנן אותו מקום ע"י מצה ראשונה. ותחמיץ השניה טרם שתאפה. ואייתי ראיה מחומץ שחלטו פעם א' אין לחלוט בו שנית שכבר הוחלש כח החומץ. וכמ"ש בי"ד ס"ס ס"ז:
