<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> One who ate an olive-bulk of matza while they were overcome by a <i data-commentator="Mishnah Berurah" data-label="לח"></i> period of insanity and then <i data-commentator="Turei Zahav" data-order="10"></i> later became healed is obligated to eat it after <i data-commentator="Chok Yaakov" data-order="20"></i> being healed, since that act of eating occurred <i data-commentator="Mishnah Berurah" data-label="לט"></i> at a <i data-commentator="Chok Yaakov" data-order="21"></i> time when they were exempt from all commandments.':
