<i data-commentator="Be'er HaGolah" data-label="ה" data-order="6"></i>3. There are those that say that there is a decree to fast <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> on every Monday and Thursday regarding the destruction <i data-commentator="Ba'er Hetev" data-order="9"></i> <i data-commentator="Sha'arei Teshuvah" data-order="9"></i> of the Beis HaMikdash and on the Torah that was burned, and on <i data-commentator="Ba'er Hetev" data-order="10"></i> the desecration of the Name, and in the future, Hashem will change these (days) into joy and happiness.
