<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> On <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Sha'arei Teshuvah" data-order="5"></i> Jewish kings one says: Blessed are You, Heaven our Heaven, King of the universe, Who apportioned of His glory to those who fear Him. And <i data-commentator="Mishnah Berurah" data-label="יא"></i> on kings of the nations of the world — gentiles — one <i data-commentator="Mishnah Berurah" data-label="יב"></i> says: Blessed… Who gave of His glory to flesh and blood.
