<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> <i data-commentator="Mishnah Berurah" data-label="טו"></i> One who sees <i data-commentator="Magen Avraham" data-order="9"></i> houses of gentiles in their settlement says: The house of the proud, Heaven will uproot. When they are in ruin he says: O Heaven of vengeances, Heaven.':
