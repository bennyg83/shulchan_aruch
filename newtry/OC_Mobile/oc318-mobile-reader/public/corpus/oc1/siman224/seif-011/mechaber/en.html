<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> <i data-commentator="Mishnah Berurah" data-label="טו"></i> Celui qui voit les <i data-commentator="Magen Avraham" data-order="9"></i> maisons des non-Juifs habitées dit : Bet geïm yissakh Hachem. (La maison des orgueilleux, Hachem la déracinera.) Et quand elles sont en ruine, il dit : El nekamot Hachem. (Dieu des vengeances est Hachem.)':
