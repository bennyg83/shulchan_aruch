<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> One who sees Jewish scholars says: Blessed are You, Heaven our Heaven, King of the universe, Who <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> apportioned of <i data-commentator="Magen Avraham" data-order="4"></i> His wisdom to <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Sha'arei Teshuvah" data-order="3"></i> those who fear Him.
