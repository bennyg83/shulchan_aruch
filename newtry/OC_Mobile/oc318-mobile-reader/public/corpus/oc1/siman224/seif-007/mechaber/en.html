<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> One who sees scholars of the nations of the world from among gentiles <i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> who are wise <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> in worldly wisdom says: Blessed are <i data-commentator="Ba'er Hetev" data-order="4"></i> You, Heaven our Heaven, King of the universe, Who gave of His wisdom to flesh and blood.
