<i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> One who sees <i data-commentator="Magen Avraham" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="יד"></i> houses of Israel in their <i data-commentator="Ba'er Hetev" data-order="7"></i> settlement — such as <i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> in the settlement of the Second Temple — says: Blessed are You, Heaven our Heaven, King of the universe, Who establishes the boundary of the widow. One who sees them in ruin says: Blessed is the True Judge.
