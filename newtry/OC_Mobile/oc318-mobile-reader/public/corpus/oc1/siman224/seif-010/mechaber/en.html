<i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> Celui qui voit <i data-commentator="Magen Avraham" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="יד"></i> des maisons d’Israël habitées <i data-commentator="Ba'er Hetev" data-order="7"></i>(comme à l’époque du <i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> Second Temple) dit : Baroukh ata Adonaï Eloheïnou melekh ha'olam matsil gevoul almana. (…qui protège les limites de la veuve.) Celui qui les voit en ruine dit : Baroukh dayan haémèt. (Béni soit le Juge de vérité.)
