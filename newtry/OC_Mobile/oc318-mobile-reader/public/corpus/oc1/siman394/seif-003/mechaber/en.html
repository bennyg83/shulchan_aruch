<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> If one <i data-commentator="Mishnah Berurah" data-label="ז"></i> placed the eruv in a tower <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ח"></i> and locked it, and <i data-commentator="Mishnah Berurah" data-label="ט"></i> the key was lost before nightfall, if it is impossible to remove the <i data-commentator="Turei Zahav" data-order="3"></i> eruv unless one performs a <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Sha'arei Teshuvah" data-order="1"></i> <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> complete forbidden labor during twilight, this is equivalent to the eruv being lost, and it is not valid, since it is impossible to <i data-commentator="Mishnah Berurah" data-label="יא"></i> eat it.
