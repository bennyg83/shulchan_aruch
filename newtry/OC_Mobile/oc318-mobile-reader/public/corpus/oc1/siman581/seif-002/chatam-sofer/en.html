<b>But within twelve months.</b> (There in the Magen Avraham, s.k. 4.) Note: see Noda BiYehuda, first edition, siman 32, and in the sefer Kerem Shlomo in the name of the Responsa Olas Shmuel, that the same law applies to the one who sounds [the shofar] as to prayer [from the Gaon, author of Kerem Shlomo].
