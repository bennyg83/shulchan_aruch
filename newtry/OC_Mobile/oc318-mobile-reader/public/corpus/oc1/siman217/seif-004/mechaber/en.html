<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> Perfumes of <i data-commentator="Mishnah Berurah" data-label="טז"></i> ervah,<i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Sha'arei Teshuvah" data-order="5"></i> such as a <i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> box of perfumes hanging on <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="יז"></i> her neck <i data-commentator="Ba'er Hetev" data-order="6"></i> <i data-commentator="Sha'arei Teshuvah" data-order="6"></i> or held in her hand or in her mouth — one does not bless on them, for it is forbidden to smell <i data-commentator="Magen Avraham" data-order="6"></i> them lest he come to a footstep of kissing or physical closeness.
