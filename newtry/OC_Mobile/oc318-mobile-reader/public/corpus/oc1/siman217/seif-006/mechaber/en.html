<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="כ"></i> Lors d’une fête d’idolâtres, on ne bénit pas leurs parfums, car leur fête <i data-commentator="Mishnah Berurah" data-label="כא"></i> est généralement destinée aux idolâtres.
