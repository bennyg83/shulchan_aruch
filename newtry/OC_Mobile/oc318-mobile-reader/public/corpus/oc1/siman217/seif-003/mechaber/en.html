<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> Mugmar with which they perfume vessels — one <i data-commentator="Mishnah Berurah" data-label="יג"></i> does not bless on it,<i data-commentator="Mishnah Berurah" data-label="יד"></i> for the mugmar itself was not made for smell but only to give smell to vessels. And <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> likewise <i data-commentator="Ba'er Hetev" data-order="4"></i> one who smells vessels that were perfumed does not bless, for there is no <i data-commentator="Mishnah Berurah" data-label="טו"></i> substance but smell without substance.
