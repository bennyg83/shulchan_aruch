<i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> One who was walking outside the city and smelled a good fragrance — if <i data-commentator="Mishnah Berurah" data-label="כב"></i> the majority of the city are idolaters <i data-commentator="Magen Avraham" data-order="7"></i> he does not bless;<i data-commentator="Mishnah Berurah" data-label="כג"></i> and if the majority are Israel <i data-commentator="Ba'er Hetev" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> he blesses.
