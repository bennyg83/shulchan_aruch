<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> In a place with no minyan, if one [person] knows it and the rest do not, one can fulfill [the obligation] for them all. If they all know,<i data-commentator="Magen Avraham" data-order="10"></i> everyone reads <i data-commentator="Ba'er Hetev" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="טו"></i> to himself.
