<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="2"></i> If they passed excrement before <i data-commentator="Mishnah Berurah" data-label="ז"></i> him, it <i data-commentator="Turei Zahav" data-order="2"></i> is forbidden <i data-commentator="Magen Avraham" data-order="2"></i> to recite <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ח"></i> facing it. And a pig's mouth is considered like passing excrement; even if it emerges from the river, washing does not help for it, for it is <i data-commentator="Mishnah Berurah" data-label="ט"></i> like a chamber pot of excrement.
