<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> Excrement in a depression—one places <i data-commentator="Mishnah Berurah" data-label="ד"></i> his shoe over it and recites, for it is considered covered;<i data-commentator="Magen Avraham" data-order="1"></i> and since no foul odor reaches him, it is permitted. And this <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> is provided his shoe does <i data-commentator="Mishnah Berurah" data-label="ו"></i> not touch it.
