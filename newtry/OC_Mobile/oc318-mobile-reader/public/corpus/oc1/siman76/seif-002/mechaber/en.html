<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> If there is excrement in a hole, one <i data-commentator="Mishnah Berurah" data-label="ד"></i> may place their shoe over it and recite [Sh'ma] for it is considered to be covered,<i data-commentator="Magen Avraham" data-order="1"></i> and since there is no bad smell that reaches him, it is permitted. And this is as <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> long as his shoe does not touch <i data-commentator="Mishnah Berurah" data-label="ו"></i> it (ie. the excrement).
