<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> If a little <i data-commentator="Mishnah Berurah" data-label="כ"></i> excrement was before him, he may nullify it with saliva—he spits on it and may recite facing it—provided the <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="כא"></i> saliva is <i data-commentator="Ba'er Hetev" data-order="8"></i> <i data-commentator="Sha'arei Teshuvah" data-order="8"></i> thick.<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> And nullification is only effective temporarily; but if he did not recite immediately and the saliva liquefied and was absorbed into it, it was not nullified.
