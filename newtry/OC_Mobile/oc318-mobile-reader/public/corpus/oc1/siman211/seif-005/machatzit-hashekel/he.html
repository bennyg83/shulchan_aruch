<b>(ס"ק ה) כל כו'</b> ולהרמב"ם כו' אף שדין זה הם דברי הש"ס כתבו דלא קשה מיניה לרמב"ם די"ל דהאי מימרא כל הקודם בפסוק כו' אזלא לר"י דס"ל מין ז' עדיף. והרמב"ם פסק כרבנן דלא אזלינן בתר מין ז' אלא בתר החביב אבל בש"ע ל"ל כן דהא בסעיף ב' הביא דעת הרמב"ם. ובסעיף ד' הביא מימרא דכל הקודם כו' ומשמע דהרמב"ם מודה לזה.
