Seif 1 — faithful etc. Thus is the text of Rif and Rambam and Tur, unlike Tosafos there; and thus is our text, except that it writes 'and faithful' and it is a scribal error.<br>
<br>
Excessively. Tur and Radbaz — for one must see in order to bless, and the language of gazing implies great examination.
