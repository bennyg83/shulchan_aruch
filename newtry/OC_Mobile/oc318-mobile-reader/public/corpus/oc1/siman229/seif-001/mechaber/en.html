<b>Blessing on the rainbow and the sun at its tekufah. It contains 2 seifim: One</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> who sees the rainbow <i data-commentator="Mishnah Berurah" data-label="ב"></i> says Blessed are You, Heaven our Heaven, King of the universe, Who <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Sha'arei Teshuvah" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> remembers the <i data-commentator="Mishnah Berurah" data-label="ד"></i> covenant, faithful to His covenant and fulfills His word;<i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> and it <i data-commentator="Ba'er Hetev" data-order="2"></i> is forbidden to gaze at it excessively.
