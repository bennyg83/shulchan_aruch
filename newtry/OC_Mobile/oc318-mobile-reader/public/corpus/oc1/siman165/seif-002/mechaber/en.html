<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> If many people are at a meal, the most important <i data-commentator="Mishnah Berurah" data-label="ד"></i> one should wash first. And the Rosh was careful <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> to wash last in order that he should not have a pause, and <i data-commentator="Mishnah Berurah" data-label="ו"></i> he should not speak [between <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ז"></i> washing and <i data-commentator="Ba'er Hetev" data-order="3"></i> eating bread].
