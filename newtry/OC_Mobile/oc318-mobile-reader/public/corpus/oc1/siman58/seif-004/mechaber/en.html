<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> If one recited it from <i data-commentator="Mishnah Berurah" data-label="יח"></i> daybreak even though one was not unavoidably prevented, one has <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="יט"></i> fulfilled <i data-commentator="Ba'er Hetev" data-order="6"></i> ex post facto.<small>And if one recited it without blessings, one returns to recite it in its time with blessings—see below siman 60 (Beit Yosef siman 46).</small>
