(כ) החמה - ומקצת אנשים ישנים באותו הזמן לכן בשעת הדחק קרינן ביה ג"כ ובשכבך אבל בלא"ה אפילו בדיעבד לא יצא:<br />
(כא) לא יקרא - ויש חולקין בזה עיין א"ר ובביאור הגר"א:<br />
(כב) שנית - אפילו אחר שיגיע הזמן דשיכיר את חבירו ברחוק ד"א:<br />
(כג) ולעשותה יום - אלא ימתין אולי יזדמן לו לקרותה בזמנה כהלכתה:
