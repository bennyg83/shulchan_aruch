<b>The Order of Kiddush, 3 Seifim: 1. The</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> order of Kiddush: wine,<i data-commentator="Mishnah Berurah" data-label="א"></i> kiddush, and sukkah, and then followed <i data-commentator="Mishnah Berurah" data-label="ב"></i> by time, since <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> time goes on the sanctification of the day and on the mitzvah of sukkah.
