<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="ז"></i> If a willow dried out,<i data-commentator="Mishnah Berurah" data-label="ח"></i> had <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Sha'arei Teshuvah" data-order="2"></i> most of its <i data-commentator="Mishnah Berurah" data-label="ט"></i> leaves fall <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> off or <i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> had <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Sha'arei Teshuvah" data-order="3"></i> its top severed, it is invalid. If it only partially dried out or had some of its leaves fall <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="יא"></i> off, it <i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> is valid. The <i data-commentator="Mishnah Berurah" data-label="יב"></i> Ramba&quot;m validates one with a severed top.
