<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> One does not bless on every river, but only on the four rivers written in Scripture — like the <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> Chidekel and Peras — and <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> this is when he saw them <i data-commentator="Mishnah Berurah" data-label="ה"></i> in a place <i data-commentator="Magen Avraham" data-order="4"></i> where their course was <i data-commentator="Ba'er Hetev" data-order="3"></i> not changed <i data-commentator="Mishnah Berurah" data-label="ו"></i> by man.
