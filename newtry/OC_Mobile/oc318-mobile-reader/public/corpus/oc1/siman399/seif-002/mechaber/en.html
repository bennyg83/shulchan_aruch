<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> If there <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> is a river in front of him, he measures fifty cubits until its end, and then goes back behind it by twenty-five cubits so that the span will be a complete fifty cubits <i data-commentator="Mishnah Berurah" data-label="ד"></i> until the river.
