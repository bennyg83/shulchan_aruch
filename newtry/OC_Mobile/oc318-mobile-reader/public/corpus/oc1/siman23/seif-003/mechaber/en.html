<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> One who enters within four cubits of a <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> corpse or <i data-commentator="Mishnah Berurah" data-label="ה"></i> of a grave <i data-commentator="Mishnah Berurah" data-label="ו"></i>— his law is like one who enters a cemetery.
