<i data-commentator="Mishnah Berurah" data-label="ז"></i> In a <i data-commentator="Magen Avraham" data-order="2"></i> place where they are accustomed to remove tzitzis from the deceased's tallis <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> at home — if the pallbearers wear tzitzis, there is reason to be concerned <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ח"></i> about lo'eig lerash.
