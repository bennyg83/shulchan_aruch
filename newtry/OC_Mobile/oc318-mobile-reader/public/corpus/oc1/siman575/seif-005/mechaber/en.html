<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i>5. Pregnant women and nursing mothers fast, but <i data-commentator="Mishnah Berurah" data-label="טו"></i> not during the first <i data-commentator="Mishnah Berurah" data-label="טז"></i> three and <i data-commentator="Magen Avraham" data-order="5"></i> last seven months [of pregnancy]. However, they should only eat enough to sustain the fetus,' <i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i>(and it is forbidden for them to take on additional stringencies and fasting) (Responsa Teshuvot Shaul, Siman 498).<small>(<i data-commentator="Mishnah Berurah" data-label="יז"></i>)</small>:
