<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Sha'arei Teshuvah" data-order="2"></i>2. When the first day of the month of Kislev arrives and no rain has fallen, the court decrees three communal fasts: on Monday, Thursday, and Monday. The entire community enters the synagogues, prays, cries out,<i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> and entreats, following the customary practice during all fasts.':
