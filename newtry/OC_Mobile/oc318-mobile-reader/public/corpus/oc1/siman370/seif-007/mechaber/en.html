<i data-commentator="Be'er HaGolah" data-label="ר" data-order="20"></i> Ten houses one inside the other, all passing through one another and exiting through the outermost to the courtyard <i data-commentator="Turei Zahav" data-order="9"></i> <i data-commentator="Magen Avraham" data-order="11"></i>— only the two innermost <i data-commentator="Mishnah Berurah" data-label="נא"></i> need contribute to the eruv, and the rest are exempt <i data-commentator="Mishnah Berurah" data-label="נב"></i> since they are all considered a gatehouse.
