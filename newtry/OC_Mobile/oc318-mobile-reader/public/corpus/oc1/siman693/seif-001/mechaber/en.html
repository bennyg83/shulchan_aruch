<b>Order of Prayer on Purim. Containing 4 paragraphs:</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> After you read the megillah at Maariv say <i data-commentator="Ba'er Hetev" data-order="1"></i> Ve'atah kadosh and if it falls on Motzi <i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> Shabbos <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Sha'arei Teshuvah" data-order="2"></i> say Vayehi Noam prior to Ve'atah Kadosh.<small>Rema:<i data-commentator="Mishnah Berurah" data-label="ב"></i> and say <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="•" data-order="3"></i> Vayitain Licha and say the the <i data-commentator="Mishnah Berurah" data-label="ג"></i> Megillah and afterwards Havdalah. (Minahgim))</small>:
