<i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> One who <i data-commentator="Mishnah Berurah" data-label="כה"></i> is thirsty and one who is hungry - behold they are in the category of the ill. If one has the ability to focus one's mind, one should <i data-commentator="Magen Avraham" data-order="13"></i> pray. If not, if one wishes, one should not pray until <i data-commentator="Ba'er Hetev" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> eating or drinking.
