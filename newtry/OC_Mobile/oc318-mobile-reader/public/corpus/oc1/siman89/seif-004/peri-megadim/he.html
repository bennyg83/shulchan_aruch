<b>צריך</b> עט״ז עיין ב״י ולבוש אסמכתא דגאיך ולא תאכלו על הדם ומה שצריך להפסק כשיגיע עמוד השחר אע״ג לחפציו שרי קודם האיר כמ״ש באות ג׳ י״ל דאה״נ קאמר כאן תרתי גאיך ונמי לאו דרבנן תאכלו משא״כ חפציו שלום מע״ה קודם האיר אע״ג דאסמכוה אקרא במ״ה נחשב הוא ליכא לא״ו דרבנן מלא תאכלו כו׳ נ״ל. ועיין מ״ש באות ג׳:
