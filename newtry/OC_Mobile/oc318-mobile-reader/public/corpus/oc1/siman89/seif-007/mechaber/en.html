<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> It is permitted <i data-commentator="Mishnah Berurah" data-label="לו"></i> to get a hair cut and to enter the bathhouse close to the time of Shacharit since they (ie. the Sages) only decreed [to not do those things] close to the time of Mincha since it is <i data-commentator="Mishnah Berurah" data-label="לז"></i> common [for people to do those things in the afternoon].
