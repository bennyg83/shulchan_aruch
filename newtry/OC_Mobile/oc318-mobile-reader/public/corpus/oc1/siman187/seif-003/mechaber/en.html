<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ו"></i> If one did not <i data-commentator="Mishnah Berurah" data-label="ז"></i> mention covenant and Torah in <i data-commentator="Ba'er Hetev" data-order="2"></i> the blessing of the land, or even missed only one <i data-commentator="Mishnah Berurah" data-label="ח"></i> of them, we return them.<small>Rem&quot;a:<i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Sha'arei Teshuvah" data-order="3"></i> and women and slaves do not mention covenant and Torah, for <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> women are not members of the covenant, and slaves are not members of the Torah. (Kol Bo)]:</small>
