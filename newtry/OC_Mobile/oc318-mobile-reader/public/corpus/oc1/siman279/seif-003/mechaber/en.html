<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> It is still forbidden to carry a candle by placing some bread <i data-commentator="Magen Avraham" data-order="4"></i> that is <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> permitted to be moved on the lamp <i data-commentator="Mishnah Berurah" data-label="י"></i> while it is still day [on <i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> Friday]. There are those who permit to carry it <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Sha'arei Teshuvah" data-order="4"></i> on Shabbat via carrying bread and one should not rely on this.
