<b>The Laws Governing Carrying a Lamp on Shabbat. Containing 7 paragraphs:</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> It <i data-commentator="Turei Zahav" data-order="1"></i> is forbidden to move a candle that <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> was lit that <i data-commentator="Magen Avraham" data-order="1"></i> Shabbos even <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Sha'arei Teshuvah" data-order="1"></i> after it <i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> has <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ב"></i> gone out. The leftover oil in a candle that was lit on that Shabbos <i data-commentator="Mishnah Berurah" data-label="ג"></i> is forbidden to move or use that Shabbos as well.
