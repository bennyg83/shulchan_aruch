<b>גרועות. </b> אבל מחיצות גמורות מותר אפי' יותר מסאתים דהוקפו לדירה שהרי הקיפום לדור בהם בשבת. רש"י:<br />
<b>שתי. </b> כגון שנטע קנים פחות פחות מג'. ערב כגון שהקיף ג' חבלים פחות פחות מג' והחבלים יותר על טפח:<br />
<b>שנים. </b> ר"ל דאין נותנים לשניהם אלא סאתים ועיין ט"ז:<br />
<b>סאין. </b> והט"ז כתב דבכל גווני אם ישתייר בית סאתים אסורים ע"ש:
