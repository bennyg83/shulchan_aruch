<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> <i data-commentator="Magen Avraham" data-order="10"></i> One may use the space beneath the beam <i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> and opposite the lechi.<i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> This applies when it opens to a <i data-commentator="Be'er HaGolah" data-label="ר" data-order="20"></i> <i data-commentator="Turei Zahav" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> public domain. But when it opens to a <i data-commentator="Mishnah Berurah" data-label="כז"></i> karmelit, it is forbidden both beneath the beam and opposite the lechi, because it combines with the karmelit beside it — like finds like and is stirred.
