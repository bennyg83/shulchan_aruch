<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ו"></i> An alleyway breached <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ז"></i> on its side not toward its end —<i data-commentator="Mishnah Berurah" data-label="ח"></i> the maximum is ten handbreadths, even if nothing remains <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> of <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> the <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Sha'arei Teshuvah" data-order="2"></i> wall at the base.<small> <i data-commentator="Mishnah Berurah" data-label="י"></i>((But if many people pass through it, even a breach <i data-commentator="Mishnah Berurah" data-label="יא"></i> of only four handbreadths must be rectified there.).</small>
