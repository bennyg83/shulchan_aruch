<i data-commentator="Be'er HaGolah" data-label="א" data-order="23"></i> Women sitting at the entrance of an alleyway with their jugs in hand — one does not protest <i data-commentator="Magen Avraham" data-order="12"></i> against them,<i data-commentator="Mishnah Berurah" data-label="ל"></i> since this is a rabbinic matter and it is better they sin unknowingly than deliberately.
