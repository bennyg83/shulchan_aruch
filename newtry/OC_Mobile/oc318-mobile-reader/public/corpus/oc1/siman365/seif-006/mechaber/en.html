<i data-commentator="Be'er HaGolah" data-label="א" data-order="23"></i> Women sitting at the entrance of an alleyway with their jugs in their hands — one does not <i data-commentator="Magen Avraham" data-order="12"></i> protest against <i data-commentator="Mishnah Berurah" data-label="ל"></i> them, since this is a d'rabbanan matter and it is better they be unwitting than deliberate.
