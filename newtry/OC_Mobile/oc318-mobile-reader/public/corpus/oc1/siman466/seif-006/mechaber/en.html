<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> Flour that has been spilled all day long does not <i data-commentator="Mishnah Berurah" data-label="כט"></i> come to be leavened, and it is <i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> that the <i data-commentator="Mishnah Berurah" data-label="ל"></i> spilled is tored without interruption, and <i data-commentator="Chok Yaakov" data-order="17"></i> we will bake <i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="לא"></i> it immediately when it <i data-commentator="Eshel Avraham" data-label="ב" data-order="4"></i> stops, and if <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="לב"></i> it is supplied, if the leaked is tored, or not, it <i data-commentator="Mishnah Berurah" data-label="לג"></i> is forbidden:
