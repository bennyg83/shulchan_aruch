<i data-commentator="Be'er HaGolah" data-label="ו" data-order="7"></i>4. All these rendings are <i data-commentator="Mishnah Berurah" data-label="יב"></i> with his hand and standing. And he rends all the clothes he has <i data-commentator="Magen Avraham" data-order="4"></i> on until <i data-commentator="Mishnah Berurah" data-label="יג"></i> it reveals his heart. And <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="יד"></i> he does not (properly) connect these rendings forever <i data-commentator="Be'er HaGolah" data-label="ז" data-order="8"></i> but it is <i data-commentator="Mishnah Berurah" data-label="טו"></i> permissible to baste (loose stitching), to hem, to gather, or to <i data-commentator="Mishnah Berurah" data-label="טז"></i> sew like chain-stitches.
