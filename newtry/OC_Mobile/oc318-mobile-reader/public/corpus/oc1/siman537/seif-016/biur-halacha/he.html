<b> לבצרו</b> -  עיין במ"ב ועיין בלבוש דדעתו דוקא בענינינו שאין יכול להשתמש ע"י עכו"מ מחמת איסור ניסוך הא בעלמא ישתמש ע"י עכו"מ. והנה לדידיה בכל דבר האבד אסור לשכור לזה ישראלים שיש להם לאכול אם לא שאין לו עכו"מ ותמה הא"ר דמנין לו זה ועכשיו מצאתי לו חבר הוא הריטב"א בחידושיו בפ"ב דף י"ב במעשה דרב חמא עיי"ש:
