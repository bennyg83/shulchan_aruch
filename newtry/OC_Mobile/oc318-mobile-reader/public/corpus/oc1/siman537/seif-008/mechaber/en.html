<i data-commentator="Be'er HaGolah" data-label="ס" data-order="16"></i>8. It is forbiden to open something up <i data-commentator="Mishnah Berurah" data-label="כט"></i> so that water can flow into a field and irrigate it. If one does this to gather fish to <i data-commentator="Magen Avraham" data-order="8"></i> <i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ל"></i> eat them on the holiday, like by <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="לא"></i> opening something above for the water [and fish] to enter and below <i data-commentator="Mishnah Berurah" data-label="לב"></i> something to let [the water out], it is permitted.
