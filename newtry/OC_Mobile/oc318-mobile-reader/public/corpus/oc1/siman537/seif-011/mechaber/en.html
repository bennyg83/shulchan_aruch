<i data-commentator="Be'er HaGolah" data-label="צ" data-order="19"></i>11. It is forbidden to trim branches of a tree to fix <i data-commentator="Turei Zahav" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="לד"></i>[the tree]. If it is obvious that he does it for the branches in order to feed them to his animals and not to fix [the tree], like if he cuts only from one side, it is permitted.
