<i data-commentator="Be'er HaGolah" data-label="ל" data-order="13"></i> <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="כא"></i>6. If a <i data-commentator="Mishnah Berurah" data-label="כב"></i> channel has broken, one may repair it. If it <i data-commentator="Magen Avraham" data-order="5"></i> was one <i data-commentator="Mishnah Berurah" data-label="כג"></i> tefach deep, he can dig it out <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> to <i data-commentator="Ba'er Hetev" data-order="3"></i> six [tefachim]. If it was two tefachim deep, he can dig it <i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> out to seven.
