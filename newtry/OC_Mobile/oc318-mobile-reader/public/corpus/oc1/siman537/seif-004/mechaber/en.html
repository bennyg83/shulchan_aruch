<i data-commentator="Be'er HaGolah" data-label="י" data-order="11"></i>4. If one <i data-commentator="Mishnah Berurah" data-label="יד"></i> wants to eat vegetables on a holiday,<i data-commentator="Magen Avraham" data-order="3"></i> he can <i data-commentator="Mishnah Berurah" data-label="טו"></i> draw water to irrigate them so that they will grow and be fit [for eating] on the holiday. If he does not want to eat them on the holiday and <i data-commentator="Mishnah Berurah" data-label="טז"></i> does such <i data-commentator="Turei Zahav" data-order="3"></i> to make them nicer, it is forbidden.
