<i data-commentator="Be'er HaGolah" data-label="מ" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i>7. Water can be drawn from tree to tree as <i data-commentator="Mishnah Berurah" data-label="כז"></i> long as the whole field is not watered thereby.<i data-commentator="Be'er HaGolah" data-label="נ" data-order="15"></i> If the field is moist, it is permitted to water <i data-commentator="Mishnah Berurah" data-label="כח"></i> all of it.
