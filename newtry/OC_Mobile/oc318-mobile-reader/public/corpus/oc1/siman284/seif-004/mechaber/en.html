<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> A minor may recite the haftarah.<small>If one who did not know how <i data-commentator="Mishnah Berurah" data-label="ז"></i> to do the haftarah was called to the maftir <i data-commentator="Magen Avraham" data-order="3"></i> aliyah, another person can say the <i data-commentator="Mishnah Berurah" data-label="ח"></i> haftarah. However, initially it is forbidden to do this.</small>
