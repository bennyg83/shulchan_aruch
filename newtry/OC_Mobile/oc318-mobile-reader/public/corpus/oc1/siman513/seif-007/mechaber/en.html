<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> One who slaughters a hen and finds <i data-commentator="Mishnah Berurah" data-label="לג"></i> fully formed eggs inside —<i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="לד"></i> they are permitted,<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> <i data-commentator="Turei Zahav" data-order="10"></i> <i data-commentator="Magen Avraham" data-order="14"></i> even on Yom <i data-commentator="Mishnah Berurah" data-label="לה"></i> Tov that follows Shabbat.
