<i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i>11. When straining wine through a <i data-commentator="Mishnah Berurah" data-label="מה"></i> garment one must take care not to form an indentation in the cloth to collect the wine, because there must be <i data-commentator="Mishnah Berurah" data-label="מו"></i> a deviation <i data-commentator="Ba'er Hetev" data-order="15"></i> <i data-commentator="Sha'arei Teshuvah" data-order="15"></i> from a weekday.
