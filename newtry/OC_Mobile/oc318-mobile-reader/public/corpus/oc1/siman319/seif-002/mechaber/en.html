<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i>2. One who <i data-commentator="Mishnah Berurah" data-label="ט"></i> sorts food from waste by hand for later use, even for later on that day, is as <i data-commentator="Mishnah Berurah" data-label="י"></i> if one is sorting for storage, and <i data-commentator="Mishnah Berurah" data-label="יא"></i> is chayav.
