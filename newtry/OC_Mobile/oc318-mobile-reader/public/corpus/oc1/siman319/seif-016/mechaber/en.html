<i data-commentator="Be'er HaGolah" data-label="ב" data-order="24"></i>16. Water with worms may be drunk through a <i data-commentator="Turei Zahav" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="נט"></i> cloth on <i data-commentator="Ba'er Hetev" data-order="19"></i> Shabbos because <i data-commentator="Mishnah Berurah" data-label="ס"></i> Borer and Meshamer only apply when <i data-commentator="Mishnah Berurah" data-label="סא"></i> separating prior to eating or drinking, but while actually drinking it is permitted to block the refuse from entering one’s mouth because it is not similar to the Melacha <i data-commentator="Magen Avraham" data-order="17"></i> at all.
