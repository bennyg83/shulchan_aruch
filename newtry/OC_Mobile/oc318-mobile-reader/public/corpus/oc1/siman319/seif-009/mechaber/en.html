<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="לא"></i>9. It is forbidden to put dregs inside a <i data-commentator="Mishnah Berurah" data-label="לב"></i> strainer even when the strainer was hanging <i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> in place before Shabbos; but if the dregs were put inside before Shabbos it is permitted to pour water over them <i data-commentator="Mishnah Berurah" data-label="לג"></i> until the water becomes clear.
