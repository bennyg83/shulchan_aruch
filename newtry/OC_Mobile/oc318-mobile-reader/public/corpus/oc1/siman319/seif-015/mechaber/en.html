<i data-commentator="Be'er HaGolah" data-label="א" data-order="23"></i>15. A <i data-commentator="Mishnah Berurah" data-label="נז"></i> strainer that has mustard placed inside it to strain may have an egg put <i data-commentator="Turei Zahav" data-order="12"></i> inside even though the yolk falls through with the mustard and the albumen <i data-commentator="Magen Avraham" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="נח"></i> remains in <i data-commentator="Ba'er Hetev" data-order="18"></i> the strainer.
