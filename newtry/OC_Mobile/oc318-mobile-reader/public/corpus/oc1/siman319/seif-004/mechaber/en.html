<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> <i data-commentator="Magen Avraham" data-order="7"></i>4. One who separates waste from food <i data-commentator="Ba'er Hetev" data-order="7"></i> even with one hand is liable. RAMA: Even if there is more food (than waste) and it is more arduous to remove the' <i data-commentator="Mishnah Berurah" data-label="יז"></i> food, nevertheless one must not remove the waste even if eating is imminent. (Beis Yosef).<small> <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="יח"></i>.</small>
