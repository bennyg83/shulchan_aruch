<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> <i data-commentator="Magen Avraham" data-order="7"></i> One who <i data-commentator="Ba'er Hetev" data-order="7"></i> selects refuse from food, even by' <i data-commentator="Mishnah Berurah" data-label="יז"></i> hand — liable once:<small>And <i data-commentator="Turei Zahav" data-order="3"></i> even if the food is greater <i data-commentator="Mishnah Berurah" data-label="יח"></i> in quantity and there is more effort in selecting the food — nevertheless he may not select the refuse, even for immediate eating (Beit Yosef):.</small>
