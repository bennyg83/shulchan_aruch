<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> <i data-commentator="Turei Zahav" data-order="4"></i> If a Jew deposited his chametz with another Jew or with a non-Jew,<i data-commentator="Chok Yaakov" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="יט"></i> even if the guardian accepted liability, both the depositor <i data-commentator="Mishnah Berurah" data-label="כ"></i> and the guardian <i data-commentator="Ba'er Hetev" data-order="8"></i> <i data-commentator="Sha'arei Teshuvah" data-order="8"></i> <i data-commentator="Be'er HaGolah" data-label="•" data-order="9"></i> transgress <i data-commentator="Eshel Avraham" data-label="ה" data-order="5"></i> regarding it.
