<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> If a non-Jew enters a Jew's house with his chametz in hand,<i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Chok Yaakov" data-order="12"></i> the Jew is not required to remove him. Even though the Jew sees the non-Jew's chametz, there <i data-commentator="Mishnah Berurah" data-label="טז"></i> is no issue; however, it <i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> is forbidden to <i data-commentator="Mishnah Berurah" data-label="יז"></i> have it brought onto the <i data-commentator="Chok Yaakov" data-order="13"></i> table <i data-commentator="Ba'er Hetev" data-order="7"></i> with him,<i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="יח"></i> even with a separating <i data-commentator="Eshel Avraham" data-label="ד" data-order="4"></i> cloth.
