<small>Seif 1.</small> 'For we ascend in sanctity.' This reason appears in Likkutei Maharil. Nimukei Yosef writes that tzitzit precede tefillin because tzitzit are equivalent to all the mitzvot, and also because they are more frequent, applying even on Shabbos and Yom Tov. See Responsa Shaagat Aryeh, siman 28.
