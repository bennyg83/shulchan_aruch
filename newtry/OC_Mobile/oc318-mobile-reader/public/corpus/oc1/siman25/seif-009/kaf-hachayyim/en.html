<b>9) There: So that he does not pass over the mitzvah.</b> The prohibition against passing over mitzvos is rabbinic. Radbaz 2:589; Yad Malachi 3:3. He did not mention that Tosafos disagree with him. Ayin Zocher, maareches alef, siman 17, cited in Pischei Olam 3. See Tosafos, Megillah 6b, s.v. Mistaber.
