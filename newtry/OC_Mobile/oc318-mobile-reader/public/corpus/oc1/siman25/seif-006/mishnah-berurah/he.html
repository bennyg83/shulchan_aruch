(כב) פגע וכו' - דוקא פגע אבל אם הניח ש"ר תחלה או שמצא הש"י שנשמט ממקומו אין להסיר הש"ר דמאי דהוה הוה וימהר להניח ש"י על מקומו ויש חולקין ועיין בביאור הלכה:<br />
(כג) להעביר - כיון דכתיב בקרא מפורש דיד קודם דמתחלה וקשרתם והדר ולטוטפות לפיכך אין משגיחין על העברת המצוה משא"כ לעיל בס"א גבי ציצית ותפלין:
