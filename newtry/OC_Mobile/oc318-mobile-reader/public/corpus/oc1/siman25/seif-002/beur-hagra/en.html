<b>Se'if 2 — Who walks, etc.</b> Zohar ch. 3, 265a.<br>
<br>
<b>And there he shall wrap, etc.</b> Meaning: need not wrap in tallit gadol before tefillin (se'if 1 above); also before going to synagogue — all go out with tallit katan; if he wants tallit gadol first, as in hagahah and world custom — Taz s"k 2.
