<i data-commentator="Be'er HaGolah" data-label="ט" data-order="10"></i> They make a bonfire <i data-commentator="Mishnah Berurah" data-label="כ"></i> for a woman in childbirth for all thirty days,<i data-commentator="Magen Avraham" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="כא"></i> even in the season of Tammuz <i data-commentator="Ba'er Hetev" data-order="9"></i>(and whether others are permitted to warm themselves opposite the bonfire — see above siman 276).<small>(.</small>
