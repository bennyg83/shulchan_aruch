<i data-commentator="Be'er HaGolah" data-label="ו" data-order="7"></i> <i data-commentator="Turei Zahav" data-order="2"></i>3. She <i data-commentator="Eshel Avraham" data-label="ב" data-order="2"></i> is considered in childbirth regarding desecration of Shabbat if she is <i data-commentator="Turei Zahav" data-order="3"></i> sitting on the &quot;crisis chair,&quot; or if <i data-commentator="Turei Zahav" data-order="4"></i> blood is flowing, or if her friends must lift her by her arms because she cannot walk. If one of these <i data-commentator="Ba'er Hetev" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> signs appears, we desecrate the Shabbat for her.
