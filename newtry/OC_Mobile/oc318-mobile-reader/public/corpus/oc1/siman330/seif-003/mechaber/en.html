<i data-commentator="Be'er HaGolah" data-label="ו" data-order="7"></i> <i data-commentator="Turei Zahav" data-order="2"></i> She is <i data-commentator="Eshel Avraham" data-label="ב" data-order="2"></i> called a woman in childbirth to desecrate Shabbat for her from when she <i data-commentator="Turei Zahav" data-order="3"></i> sits on the birth-stool, or from when the <i data-commentator="Turei Zahav" data-order="4"></i> blood drips and flows down, or from when her friends carry her in their arms because she has no strength to walk — once one <i data-commentator="Ba'er Hetev" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> of these is seen, they desecrate Shabbat for her.
