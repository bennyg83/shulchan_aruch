<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> One must <i data-commentator="Mishnah Berurah" data-label="ה"></i> make heard to his ears what he articulates with his mouth; and if he did not make it heard to his ears —<i data-commentator="Mishnah Berurah" data-label="ו"></i> he fulfilled, provided that he articulates with his lips.
