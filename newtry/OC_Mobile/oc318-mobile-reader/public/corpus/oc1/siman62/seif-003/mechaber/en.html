<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i>[When reading the <i data-commentator="Mishnah Berurah" data-label="ה"></i> Shema,] one must hear with their ears what comes out of their mouth, but if one did not hear it, they [still] fulfilled their obligation as long as they <i data-commentator="Mishnah Berurah" data-label="ו"></i> brought it out of their lips (i.e. articulated it with their mouth).
