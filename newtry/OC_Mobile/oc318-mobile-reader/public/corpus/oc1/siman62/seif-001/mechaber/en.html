<b>One who was not precise in the recitation of Keriat Shema or did not make it heard to his ears. It contains five se'ifim.</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> Even though it is a mitzvah to be precise with its letters, if one read and <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> was not precise with them —<i data-commentator="Mishnah Berurah" data-label="ב"></i> one fulfilled.
