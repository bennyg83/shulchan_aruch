<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> One may read [the Sh'ma]<i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> in any <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Sha'arei Teshuvah" data-order="1"></i> language, and <i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> they should be careful to avoid word mispronunciations in that language, and one should be precise in it just as in Hebrew [lit. &quot;the Holy tongue&quot;].
