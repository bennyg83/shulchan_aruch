<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יח"></i> One should not place the two pairs <i data-commentator="Ba'er Hetev" data-order="7"></i> <i data-commentator="Sha'arei Teshuvah" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="יט"></i> in one pouch, for one of them is <i data-commentator="Mishnah Berurah" data-label="כ"></i> profane and it is forbidden to place it in a tefillin pouch; rather he should make two <i data-commentator="Ateret Zekenim" data-label="♦" data-order="4"></i> pouches and a sign on each pouch so that he not place that of one in that of the other.
