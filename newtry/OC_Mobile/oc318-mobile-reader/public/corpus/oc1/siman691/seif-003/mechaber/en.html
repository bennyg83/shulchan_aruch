<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i>[The section with the names of] the ten sons of Haman should be written like a song, but not like the other songs where there is blank space next to <i data-commentator="Mishnah Berurah" data-label="יז"></i> the writing. Instead, one leaves blank space between each word.<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> If he did not do this, it is invalid.
