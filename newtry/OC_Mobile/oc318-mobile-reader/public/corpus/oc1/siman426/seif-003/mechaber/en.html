<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> Until when do we bless regarding it? Until the 16th day from <i data-commentator="Magen Avraham" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="יז"></i> the day <i data-commentator="Ba'er Hetev" data-order="9"></i> <i data-commentator="Sha'arei Teshuvah" data-order="9"></i> of the molad,<i data-commentator="Mishnah Berurah" data-label="יח"></i> not including the 16th itself.<small>(One should not sanctify <i data-commentator="Mishnah Berurah" data-label="יט"></i> except until half of 29 days, 12 hours, and 793 chalakim from the molad (Teshuvot Maharil))</small>:
