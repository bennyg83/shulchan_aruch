<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> Until when do we bless on it? Until the 16th day from the <i data-commentator="Magen Avraham" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="יז"></i> day of <i data-commentator="Ba'er Hetev" data-order="9"></i> <i data-commentator="Sha'arei Teshuvah" data-order="9"></i> the molad —<i data-commentator="Mishnah Berurah" data-label="יח"></i> the 16th is not included.<small>(And one may not <i data-commentator="Mishnah Berurah" data-label="יט"></i> sanctify except until half of 29 days, 12 hours, and 793 chalakim from the molad (Teshuvot Maharil))</small>:
