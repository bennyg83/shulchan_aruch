<b>The practice in the count of the lines [marked on the parchment to</b><br> <i data-commentator="Mishnah Berurah" data-label="א"></i> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Magen Avraham" data-order="1"></i> guide the <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ב"></i> scribe] is to write on the hand tefillin parchment seven lines for each parasha. For the head tefillin [the practice]' <i data-commentator="Ateret Zekenim" data-label="♦" data-order="2"></i> is to mark four lines. If one diverged from this <i data-commentator="Mishnah Berurah" data-label="ג"></i> practice he did not invalidate the tefillin.
