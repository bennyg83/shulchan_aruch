<b>Contains 1 seif. Rosh</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> Chodesh is permitted for melacha. And the women who <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ב"></i> have the custom not to do melacha on it — it <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> is <i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> a good custom.<small>And if the custom is to do some melachot and not do some of them,<i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> we follow the <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Sha'arei Teshuvah" data-order="3"></i> custom. (Beit Yosef))</small>
