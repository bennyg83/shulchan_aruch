<b>הבור או הדות</b>. והיינו שהוא בבנין תחת הקרקע כגון מרתף ונ"ל דאם רובו בנוי למעלה מן הקרקע אף ע"פ שמקצתו תוך הקרקע שרי:<br>
<b>חבית</b>. אפי' העומד בתוכו לא יצא (ר"ן):<br>
<b>יצא</b>. ואם הוציא ראשו קודם לשופר לא יצא לכן צריך שיוציא השופר תחלה דאז יצא אבל א"ל שצריך שיוציא השופר והאזנים כא' דא"א לצמצם:
