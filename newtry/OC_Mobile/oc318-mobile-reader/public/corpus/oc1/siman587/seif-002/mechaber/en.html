<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> If one begins sounding the shofar in the pit <i data-commentator="Mishnah Berurah" data-label="ט"></i> and then ascends out of the pit and finishes the sounding, they fulfill their obligation, as everything that was heard, inside and out, was the sound of the shofar.<small>The <i data-commentator="Mishnah Berurah" data-label="י"></i> same applies to those who were in the <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Ba'er Hetev" data-order="3"></i> pit at the beginning of the sounding (Gemara).)</small>
