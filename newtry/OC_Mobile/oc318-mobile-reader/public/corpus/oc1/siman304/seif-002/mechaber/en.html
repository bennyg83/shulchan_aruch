<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> And where the slave is permitted to do melacha for himself <i data-commentator="Mishnah Berurah" data-label="כא"></i>— if the master told him he should do for himself and feed himself on Shabbat <i data-commentator="Mishnah Berurah" data-label="כב"></i> day — since he stipulated with <i data-commentator="Mishnah Berurah" data-label="כג"></i> him from the outset, he does for his sustenance needs, provided discreetly so there is no concern of onlookers.
