<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i>2. We <i data-commentator="Mishnah Berurah" data-label="ב"></i> do not scrape a scab off an animal, nor do we lubricate it with oil. This <i data-commentator="Mishnah Berurah" data-label="ג"></i> is referring to when the sore is <i data-commentator="Mishnah Berurah" data-label="ד"></i> healed, in which case [scraping it off] will only be to pleasure the animal. However, when the sore is new and there is pain, it is permitted [to remove the scab].
