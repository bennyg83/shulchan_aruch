<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Turei Zahav" data-order="3"></i>4. If it has an <i data-commentator="Mishnah Berurah" data-label="ז"></i> attack of congestion,<i data-commentator="Magen Avraham" data-order="2"></i> it is permitted to place it in water so <i data-commentator="Ba'er Hetev" data-order="3"></i> that it will cool <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="ח"></i> down. However, if there is a chance that if we do not let blood,<i data-commentator="Mishnah Berurah" data-label="ט"></i> the animal <i data-commentator="Magen Avraham" data-order="3"></i> will die, it is permissible to tell a non-Jew to let blood.
