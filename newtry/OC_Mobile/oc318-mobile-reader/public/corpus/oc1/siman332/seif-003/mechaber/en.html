<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i>3. If an animal ate too many horse-beans and it is in pain, it <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> is permitted to have it run around the <i data-commentator="Mishnah Berurah" data-label="ו"></i> yard so it becomes exhausted and is healed.
