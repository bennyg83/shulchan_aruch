<b>קודם</b> עט״ז ועמ״א אות ט׳ ויבואר בזה אי״ה הפירוש בט״ז ומ״א. וכל הסימן לענין תענית נ״מ לענין אי יוצא ידי נדרו ולענין תפלת עננו לומר ביום צום תעניתנו כו׳ אבל לענין שחייב לקיים נדרו עט״ז אות ט״ו והיינו אף שאכל חצי יום ואח״כ קיבל עליו להתענות עד הלילה עכ״פ צריך להשלים נדרו ועמ״א ט׳ ואי״ה שם יבואר עוד:
