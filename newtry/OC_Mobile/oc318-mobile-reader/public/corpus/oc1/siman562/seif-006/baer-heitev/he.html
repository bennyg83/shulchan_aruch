<b>קבלה. </b> וחייב להתענות. ומ"מ דוקא כשקבל בלבו להתענות. אבל אם היה רק בדעתו להתענות לא מיקרי קבלה. בית חדש מגן אברהם:<br />
<b>המנחה. </b> והב"ח כתב דשרי לקבלו כל זמן שהוא יום וכ"כ המ"א אבל קודם מנחה לא מהני. ט"ז ע"ש:<br />
<b>תפלה. </b> ומ"מ גם בשעת התפלה כשמגיע לש"ת יהרהר בלבו שמקבל התענית. ב"ח מ"א:
