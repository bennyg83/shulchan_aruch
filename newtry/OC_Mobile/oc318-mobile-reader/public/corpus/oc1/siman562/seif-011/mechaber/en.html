If one accepted upon oneself a <i data-commentator="Mishnah Berurah" data-label="מח"></i> fast until midday, and ate after this, or ate until midday and then accepted a fast from that moment onwards, it <i data-commentator="Be'er HaGolah" data-label="ר" data-order="20"></i> is not called a fast to pray Aneinu, but is <i data-commentator="Be'er HaGolah" data-label="ש" data-order="21"></i> called a fast for the purpose of <i data-commentator="Turei Zahav" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="מט"></i> one needing <i data-commentator="Ba'er Hetev" data-order="14"></i> to complete one's vow.
