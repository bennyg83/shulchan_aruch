<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> One should be careful not to throw seeds <i data-commentator="Mishnah Berurah" data-label="לא"></i> in a place where rain falls,<i data-commentator="Mishnah Berurah" data-label="לב"></i> for they will eventually <i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> grow. If he throws to chickens — he should throw only the amount they will eat in one day <i data-commentator="Mishnah Berurah" data-label="לג"></i> or two days. If it is in a place of human foot traffic — permitted, for they will not grow.
