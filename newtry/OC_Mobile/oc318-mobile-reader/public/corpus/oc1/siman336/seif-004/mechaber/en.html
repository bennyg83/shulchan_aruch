<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> One should be careful to not throw seeds <i data-commentator="Mishnah Berurah" data-label="לא"></i> in a place where it rains,<i data-commentator="Mishnah Berurah" data-label="לב"></i> as they will eventually grow.<i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> If one throws seeds to chickens, he should only through the amount that they will eat in one or two <i data-commentator="Mishnah Berurah" data-label="לג"></i> days. If he is in a place where people walk a lot, it is permitted, because the seeds will not grow.
