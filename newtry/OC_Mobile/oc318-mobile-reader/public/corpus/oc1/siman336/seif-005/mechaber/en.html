<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> Grass that grew on the lip of a <i data-commentator="Mishnah Berurah" data-label="לד"></i> vessel from the vessel's moisture — considered attached to the ground, and one <i data-commentator="Magen Avraham" data-order="8"></i> who detaches them <i data-commentator="Mishnah Berurah" data-label="לה"></i> is liable.
