<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> Vegetation that grows on the spout of the pitcher from the <i data-commentator="Mishnah Berurah" data-label="לד"></i> moistness of the pitcher is considered as if it were attached to the ground, and he <i data-commentator="Magen Avraham" data-order="8"></i> who picks it off <i data-commentator="Mishnah Berurah" data-label="לה"></i> is liable.
