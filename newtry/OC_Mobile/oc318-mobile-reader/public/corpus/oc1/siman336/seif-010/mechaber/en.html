<i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> It is permissible to <i data-commentator="Magen Avraham" data-order="10"></i> <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> <i data-commentator="Turei Zahav" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="מח"></i> smell myrtle <i data-commentator="Ba'er Hetev" data-order="9"></i> that is in the ground, but it is forbidden to smell a citron or an apple or any other edible thing when it is connected to the tree/ground, lest <i data-commentator="Magen Avraham" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="מט"></i> one be tempted to eat it.
