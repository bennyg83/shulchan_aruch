<i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> Attached hadar —<i data-commentator="Magen Avraham" data-order="10"></i> <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> <i data-commentator="Turei Zahav" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="מח"></i> permitted <i data-commentator="Ba'er Hetev" data-order="9"></i> to smell it. But an etrog, an apple, and anything fit for food — forbidden to smell while attached, lest <i data-commentator="Magen Avraham" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="מט"></i> he detach it to eat.
