<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> If vegetation is inserted into dirt while it is still day on Friday <i data-commentator="Mishnah Berurah" data-label="לו"></i> so that it will be wet, it is permitted to grab the <i data-commentator="Mishnah Berurah" data-label="לז"></i> leaves and' <i data-commentator="Mishnah Berurah" data-label="לח"></i> pull it out, as long <i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="לט"></i> as it has not taken root. It also must be the case that he didn't want it to take <i data-commentator="Mishnah Berurah" data-label="מ"></i> root. However, if he intended to plant it, this is forbidden.':
