<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> Grass that one stuck in earth before Shabbat so <i data-commentator="Mishnah Berurah" data-label="לו"></i> they would be moist — permitted to grasp <i data-commentator="Mishnah Berurah" data-label="לז"></i> by the' <i data-commentator="Mishnah Berurah" data-label="לח"></i> leaves and remove <i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="לט"></i> them, provided they have not rooted; and also he must not want them to <i data-commentator="Mishnah Berurah" data-label="מ"></i> root. But if he intended planting — forbidden.':
