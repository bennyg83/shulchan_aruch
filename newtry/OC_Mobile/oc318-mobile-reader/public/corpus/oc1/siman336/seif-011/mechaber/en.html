<i data-commentator="Be'er HaGolah" data-label="ר" data-order="20"></i> <i data-commentator="Mishnah Berurah" data-label="נ"></i> One who soaks wheat, barley, and the like in water — this is a <i data-commentator="Mishnah Berurah" data-label="נא"></i> derivative of sowing and he <i data-commentator="Magen Avraham" data-order="12"></i> is liable <i data-commentator="Ba'er Hetev" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="נב"></i> for any amount:<small>And permitted to <i data-commentator="Mishnah Berurah" data-label="נג"></i> place tree <i data-commentator="Magen Avraham" data-order="13"></i> <i data-commentator="Ba'er Hetev" data-order="11"></i> branches in water on Shabbat, provided they do not have blossoms and roses that open from the moisture of the water (Maharil;<i data-commentator="Mishnah Berurah" data-label="נד"></i> and see below siman 654).</small>
