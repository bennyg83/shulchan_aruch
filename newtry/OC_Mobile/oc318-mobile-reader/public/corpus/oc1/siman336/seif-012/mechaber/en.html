<i data-commentator="Be'er HaGolah" data-label="ש" data-order="21"></i> If there are figs that have <i data-commentator="Mishnah Berurah" data-label="נה"></i> dried out on the <i data-commentator="Mishnah Berurah" data-label="נו"></i> tree or other fruit that have dried out on the tree, one <i data-commentator="Magen Avraham" data-order="14"></i> <i data-commentator="Ba'er Hetev" data-order="12"></i> who picks them on Shabbat is liable <i data-commentator="Mishnah Berurah" data-label="נז"></i> even though they are treated as if they are <i data-commentator="Mishnah Berurah" data-label="נח"></i> uprooted for matters of impurity.
