<i data-commentator="Be'er HaGolah" data-label="ש" data-order="21"></i> Figs that dried on their <i data-commentator="Mishnah Berurah" data-label="נה"></i> branches, and likewise <i data-commentator="Mishnah Berurah" data-label="נו"></i> a tree whose fruit dried on it — one <i data-commentator="Magen Avraham" data-order="14"></i> <i data-commentator="Ba'er Hetev" data-order="12"></i> who detaches from them on <i data-commentator="Mishnah Berurah" data-label="נז"></i> Shabbat is liable, even though they are like <i data-commentator="Mishnah Berurah" data-label="נח"></i> uprooted for purposes of impurity.
