<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> The Maftir may not <i data-commentator="Mishnah Berurah" data-label="כב"></i> start reading <i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> until they finish <i data-commentator="Mishnah Berurah" data-label="כג"></i> rolling the Torah so that the one rolling shouldn't be preoccupied and will be able to <i data-commentator="Ba'er Hetev" data-order="7"></i> hear the Haftarah.
