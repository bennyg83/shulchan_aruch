<i data-commentator="Magen Avraham" data-order="17"></i> <i data-commentator="Ba'er Hetev" data-order="10"></i> <i data-commentator="Be'er HaGolah" data-label="ת" data-order="22"></i> <i data-commentator="Mishnah Berurah" data-label="מ"></i> It is forbidden to tell a gentile to go outside the techum on Shabbat after the relatives of the deceased so they will come to eulogize him; but a sick person for whom the world is harsh upon him and he says to send for his relatives —<i data-commentator="Magen Avraham" data-order="18"></i> <i data-commentator="Mishnah Berurah" data-label="מא"></i> certainly it <i data-commentator="Ba'er Hetev" data-order="11"></i> is permitted.
