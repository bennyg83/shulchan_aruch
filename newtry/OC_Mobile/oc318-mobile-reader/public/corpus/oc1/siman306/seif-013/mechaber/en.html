<i data-commentator="Magen Avraham" data-order="25"></i> <i data-commentator="Be'er HaGolah" data-label="ד" data-order="26"></i> <i data-commentator="Mishnah Berurah" data-label="נג"></i> To announce on Shabbat about <i data-commentator="Ba'er Hetev" data-order="17"></i> land being sold that whoever has a claim on it should come and state it, or <i data-commentator="Magen Avraham" data-order="26"></i> <i data-commentator="Mishnah Berurah" data-label="נד"></i> else he will lose his claim — is forbidden.<small>And <i data-commentator="Turei Zahav" data-order="4"></i> likewise it is <i data-commentator="Magen Avraham" data-order="27"></i> <i data-commentator="Ba'er Hetev" data-order="18"></i> <i data-commentator="Sha'arei Teshuvah" data-order="18"></i> <i data-commentator="Mishnah Berurah" data-label="נה"></i> forbidden to announce wine on Shabbat,<i data-commentator="Ateret Zekenim" data-label="♦" data-order="5"></i> for it is like buying and selling (Maharil).</small>
