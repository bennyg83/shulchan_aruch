<i data-commentator="Ba'er Hetev" data-order="9"></i> <i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i>7. One may measure for <i data-commentator="Ateret Zekenim" data-label="♦" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="לד"></i> a Mitzvah such as <i data-commentator="Magen Avraham" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="לה"></i> calculating whether a Mikvah has forty Se’ah, and to measure the belt of an ill person and chant over it, as is the women’s custom, because it <i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> is measuring for <i data-commentator="Mishnah Berurah" data-label="לו"></i> a Mitzvah.
