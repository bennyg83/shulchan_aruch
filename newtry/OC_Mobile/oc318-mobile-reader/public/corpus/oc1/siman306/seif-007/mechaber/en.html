<i data-commentator="Ba'er Hetev" data-order="9"></i> <i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i> It is permitted to measure on <i data-commentator="Ateret Zekenim" data-label="♦" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="לד"></i> Shabbat a measurement of a <i data-commentator="Magen Avraham" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="לה"></i> mitzvah, such as to measure whether there are forty se'ah in a mikveh, and to measure the belt of one who is ill and to whisper over him as women are accustomed — for <i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> it is a measurement <i data-commentator="Mishnah Berurah" data-label="לו"></i> of a mitzvah.
