<i data-commentator="Ateret Zekenim" data-label="♦" data-order="3"></i> <i data-commentator="Be'er HaGolah" data-label="ר" data-order="20"></i> <i data-commentator="Mishnah Berurah" data-label="לז"></i> Reflection on one's business affairs is permitted; nevertheless, because of oneg Shabbat it is a <i data-commentator="Mishnah Berurah" data-label="לח"></i> mitzvah not to think of them at all, and <i data-commentator="Be'er HaGolah" data-label="ש" data-order="21"></i> <i data-commentator="Mishnah Berurah" data-label="לט"></i> it should be in his eyes as if all his work is done.
