<b>The rains.</b> For then rain is a sign of a curse.<br>
<br>
<b>Dew.</b> That is to say, one who says "Who makes the wind blow and Who makes dew descend" — they do not make him go back; and see siman 117 seif 4; and regarding petition, namely "and give dew and rain" — dew does not avail unless he said rain. See there.
