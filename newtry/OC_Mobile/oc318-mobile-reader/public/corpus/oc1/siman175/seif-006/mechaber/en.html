<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> Wine from two barrels, both of the same type — if within forty days of the harvest it was placed in two <i data-commentator="Mishnah Berurah" data-label="טז"></i> separate vessels, they are considered two different types and one recites HaTov veHaMeitiv over it. If they were divided after forty days, one does not recite it, since it is all of one type..
