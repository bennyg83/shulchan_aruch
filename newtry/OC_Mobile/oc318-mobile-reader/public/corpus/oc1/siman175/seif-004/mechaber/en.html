<i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="3"></i> <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> One should only recite HaTov veHaMeitiv if there is someone else with him, as the <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="טו"></i> blessing implies — good for <i data-commentator="Magen Avraham" data-order="5"></i> him and benefiting his fellow — and the same <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> applies if his wife and children are with him; but if he is alone, he should not recite <i data-commentator="Ba'er Hetev" data-order="6"></i> it.
