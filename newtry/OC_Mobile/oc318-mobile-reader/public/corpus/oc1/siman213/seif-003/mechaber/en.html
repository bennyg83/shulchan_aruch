<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> One does not fulfill his obligation <i data-commentator="Mishnah Berurah" data-label="יח"></i> through hearing the blessing even if he answers amen, unless he <i data-commentator="Mishnah Berurah" data-label="יט"></i> heard from beginning to end <i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> and intended to fulfill his obligation through it,<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> and the blesser also intended to fulfill his obligation for him.
