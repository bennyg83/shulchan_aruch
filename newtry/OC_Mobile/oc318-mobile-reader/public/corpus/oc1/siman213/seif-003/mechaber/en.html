<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> One does not fulfill their obligation by <i data-commentator="Mishnah Berurah" data-label="יח"></i> hearing the blessing, even if they answer Amen, unless they heard it from <i data-commentator="Mishnah Berurah" data-label="יט"></i> the beginning to the end and <i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> intended to fulfill their obligation through it, and the one <i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> who recited the blessing also intended to fulfill their obligation on their behalf.
