<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> One who is blessing <i data-commentator="Mishnah Berurah" data-label="יד"></i> covers others, unless one is eating or drinking with them, and then they will <i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="טו"></i> depart their obligation with their <i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Sha'arei Teshuvah" data-order="4"></i> listening when they are <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> intending to be covered by that blessing,<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="יז"></i> even if they hadn't answered &quot;amen&quot;.
