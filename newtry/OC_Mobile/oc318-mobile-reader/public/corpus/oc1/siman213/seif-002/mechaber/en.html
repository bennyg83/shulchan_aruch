<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> The one blessing <i data-commentator="Mishnah Berurah" data-label="יד"></i> does not exempt others unless he eats and drinks with them;<i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="טו"></i> then they fulfill through <i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Sha'arei Teshuvah" data-order="4"></i> hearing when they <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> intend toward him, even if <i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="יז"></i> they do not answer amen.
