<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="מז"></i>9. If one <i data-commentator="Turei Zahav" data-order="13"></i> heard a new insight,<i data-commentator="Mishnah Berurah" data-label="מח"></i> it is permitted to write it in order that he not forget. Similarly, if one saw a new <i data-commentator="Magen Avraham" data-order="26"></i> book, it is permitted to copy if one would not find it to copy after the Festival.
