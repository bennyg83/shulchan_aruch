<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i>8. One that was asked from him a question and the deliverer does not want to wait until after the Festival, it is permitted to write <i data-commentator="Mishnah Berurah" data-label="מה"></i>(a response). Similarly, it is <i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> permitted <i data-commentator="Mishnah Berurah" data-label="מו"></i> to copy <i data-commentator="Ba'er Hetev" data-order="14"></i>(the response) because it is considered a matter of loss (Davar HaAvid)
