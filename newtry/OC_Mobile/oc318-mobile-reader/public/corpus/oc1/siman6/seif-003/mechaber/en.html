<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="2"></i> The blessing Elohai Neshamah does not open with “Blessed” because it is a <i data-commentator="Magen Avraham" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> blessing <i data-commentator="Ba'er Hetev" data-order="7"></i> <i data-commentator="Sha'arei Teshuvah" data-order="7"></i> of thanks, and blessings of thanks do not open with “Blessed,” as we find with the blessing for rain.
