<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> Even if they find him <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> trampled and he can only live a few hours, they check his nose, and if they feel no life, he is <i data-commentator="Mishnah Berurah" data-label="י"></i> for sure dead. [They must do this] whether they <i data-commentator="Mishnah Berurah" data-label="יא"></i> uncover his nose or his legs first.
