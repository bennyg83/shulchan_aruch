<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> One who sees a boat with Jews that is endangered at sea or in a flowing river, or an individual being chased by <i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> idolaters, it is a commandment to desecrate <i data-commentator="Mishnah Berurah" data-label="יח"></i> Shabbat to <i data-commentator="Ba'er Hetev" data-order="5"></i> save them. (And see above at the end of chapter 306 regarding whether one desecrates Shabbat <i data-commentator="Mishnah Berurah" data-label="יט"></i> if someone <i data-commentator="Ba'er Hetev" data-order="6"></i> wants to rape him.)<small>[]:</small>
