<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> There is one who says that in our times, even if they come for money, we desecrate the Shabbat, because if we do not <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> allow them to plunder the money, they will kill, and so it becomes a case of saving life. (In any event, everything is according to the situation(Piskei Mahara'i Chapter 156).)<small>[<i data-commentator="Mishnah Berurah" data-label="יז"></i>.</small>
