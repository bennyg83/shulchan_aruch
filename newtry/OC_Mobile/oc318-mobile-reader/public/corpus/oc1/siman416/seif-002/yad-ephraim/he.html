<b>שם ס"ק ג'</b> פי' שרוצה לילך. הוא תמוה וע' בא"ר ואפשר שצריך לציין על אם רצה לערב ברגליו שרש"י פי' שנאכל עירובו שעירב יום ראשון והט"ז מצייר בכה"ג שעתה רוצה לערב ברוח אחר ואם כן א"א אלא בפת שהניח אתמול לרוח אחרת דלגבי רוח זה הוי כפת חדש ולזה קאמר דאם רוצה לערב ברגליו הוי עירוב אף שבראשון עירב בפת:
