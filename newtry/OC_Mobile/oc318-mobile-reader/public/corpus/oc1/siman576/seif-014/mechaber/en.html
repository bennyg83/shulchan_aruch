<i data-commentator="Be'er HaGolah" data-label="כ" data-order="33"></i>14. On these fasts for afflictions, neither pregnant women nor nursing women, nor children fast. It is' <i data-commentator="Magen Avraham" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="לב"></i> permissible <i data-commentator="Ba'er Hetev" data-order="5"></i> to eat the night before even when fasting the next day. This does <i data-commentator="Mishnah Berurah" data-label="לג"></i> not apply to fasts for rain.
