<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> There is [an opinion] that says that since the kindling accomplishes the mitzvah, one needs to put the proper measure of oil in the light before the kindling, but if he recited the benediction and kindled and afterward added oil up to the proper measure <i data-commentator="Mishnah Berurah" data-label="ח"></i> he has not fulfilled his obligation.
