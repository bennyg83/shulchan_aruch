<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> There are those who say that if one does a mitzvah, he should put oil in the candle to the extent of the lesson before lighting it, but if he blesses and lights it, and then adds oil to the extent of the lesson,<i data-commentator="Mishnah Berurah" data-label="ח"></i> he has not neglected his duty:
