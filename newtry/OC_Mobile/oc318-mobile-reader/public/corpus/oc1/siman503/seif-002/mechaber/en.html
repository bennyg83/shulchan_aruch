<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Magen Avraham" data-order="4"></i> A baker may fill an entire barrel <i data-commentator="Mishnah Berurah" data-label="יד"></i> of water even though he <i data-commentator="Mishnah Berurah" data-label="טו"></i> only needs one jug.<small>Rema: But he must place everything near the fire at once — it is <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> forbidden to <i data-commentator="Ba'er Hetev" data-order="4"></i> add more once the barrel is already near the fire, as that is unnecessary extra effort. (HaMagid ch. 1))</small>:
