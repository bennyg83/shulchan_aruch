<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> If one dedicated seven etrogs for the seven days, one for each day, each one can be used for the obligation and <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ז"></i> then eaten the next day. On its day it is forbidden because it is muktzeh for the whole day.
