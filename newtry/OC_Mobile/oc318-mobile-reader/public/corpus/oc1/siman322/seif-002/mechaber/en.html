<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> When Shabbat falls after Yom Tov or it falls before [Shabbat]<i data-commentator="Magen Avraham" data-order="2"></i> it is forbidden [to touch it on the second day, whether <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> it be Shabbat or Yom Tov].
