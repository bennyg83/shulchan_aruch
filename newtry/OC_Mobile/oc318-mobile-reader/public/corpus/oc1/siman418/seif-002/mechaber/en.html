<i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> One does not decree fasts for the congregation on Rosh Chodesh, on Chanukah, or on Purim. If <i data-commentator="Mishnah Berurah" data-label="ד"></i> they already began — i.e. they decreed to fast such-and-such days and they began them before Rosh Chodesh <i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i>— even one day they do not interrupt, and they <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> fast and complete.
