<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> On the second day, we sing in Parshat <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> Kul <i data-commentator="Ba'er Hetev" data-order="4"></i> Bakur until the end of the Sidra and read a mattir like yesterday and a mattir in Habakkuk from the the <i data-commentator="Magen Avraham" data-order="2"></i> Master in his holy temple until the conductor in my music:
