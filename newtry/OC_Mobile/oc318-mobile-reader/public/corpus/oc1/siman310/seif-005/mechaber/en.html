<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> Dried figs and raisins that are <i data-commentator="Mishnah Berurah" data-label="יח"></i> fit and that are not fit — there are people who eat them and there are those who do not eat them; if he designated them, they leave the category of muktzeh; if <i data-commentator="Turei Zahav" data-order="4"></i> not —<i data-commentator="Ba'er Hetev" data-order="4"></i> not; but if they are not fit and he designated <i data-commentator="Mishnah Berurah" data-label="יט"></i> them — designation is nothing.
