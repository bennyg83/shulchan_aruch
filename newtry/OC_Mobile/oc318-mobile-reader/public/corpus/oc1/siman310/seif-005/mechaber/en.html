<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i>5. Figs and raisins which are <i data-commentator="Mishnah Berurah" data-label="יח"></i> semi-edible, where some people would eat them while others would not, if they were prepared they are no longer Muktze, and if they were not they remain Muktze. If <i data-commentator="Turei Zahav" data-order="4"></i> however, they <i data-commentator="Ba'er Hetev" data-order="4"></i> are inedible and one prepared them, one’s preparation <i data-commentator="Mishnah Berurah" data-label="יט"></i> is null and void.
