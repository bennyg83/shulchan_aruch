<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> Dried figs and raisins that were muktzeh, and when bein hashemashos arrived they had already dried and were fit for eating — even though the owners <i data-commentator="Mishnah Berurah" data-label="יז"></i> did not know at that hour that they had dried, and afterward it became known to them that at bein hashemashos they were already dry — permitted.
