<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i>4. Figs and raisins that had been put aside, but had already dried before Bein Hashemashos and are fit to eat, even though the <i data-commentator="Mishnah Berurah" data-label="יז"></i> owners did not know at the time that they were dry, and subsequently they discovered that by Bein Hashemashos they were dry, they are permitted.
