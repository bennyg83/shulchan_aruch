<b>Laws of muktzeh on Shabbat. And in it 9 seifim: A</b><br> <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> tree in which fish are hung — even though it is repulsive — it is permitted to <i data-commentator="Turei Zahav" data-order="1"></i> move it, for we rule regarding muktzeh because of repulsiveness like R' Shimon who permits.
