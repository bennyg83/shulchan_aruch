<b>1. The Laws of Muktze on Shabbos, containing 9 Seifim</b><br> <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> The stick used for hanging fish, even though it is extremely foul, is not Muktze, because <i data-commentator="Turei Zahav" data-order="1"></i> we rule in accordance with R’ Shimon who holds that Muktze machmas mi’us is permitted.
