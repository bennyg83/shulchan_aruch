<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i>6. One may not place a Keili beneath an item which may not be handled because one causes the Keili to become Muktze which is an issur of <i data-commentator="Mishnah Berurah" data-label="כ"></i> Bittul keli meheichano. Nevertheless, one is permitted to <i data-commentator="Mishnah Berurah" data-label="כא"></i> cover it with a Keili as long as <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> one does <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="כב"></i> not touch it.
