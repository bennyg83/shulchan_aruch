<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> Anything forbidden to move is forbidden to place a utensil under it so that it falls into it, because he forbids the utensil in moving and one nullifies <i data-commentator="Mishnah Berurah" data-label="כ"></i> the utensil from its place; but it is <i data-commentator="Mishnah Berurah" data-label="כא"></i> permitted to cover it with a utensil, provided <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> he does <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="כב"></i> not touch it.
