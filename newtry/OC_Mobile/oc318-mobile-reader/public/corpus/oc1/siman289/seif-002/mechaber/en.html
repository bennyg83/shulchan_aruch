<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="ח"></i> In a place where wine is not <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Turei Zahav" data-order="1"></i> readily available, liquor and other drinks, except for water, are considered <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> significant (Chamar Medinah), and one may recite kiddush over <i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> them. If one does not have even liquor and other drinks,<i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> one may eat <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Sha'arei Teshuvah" data-order="3"></i> without kiddush.
