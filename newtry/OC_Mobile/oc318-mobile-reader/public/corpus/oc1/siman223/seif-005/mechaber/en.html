<i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> If he acquired vessels used by both himself <i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="יט"></i> and <i data-commentator="Ba'er Hetev" data-order="14"></i> his household, he recites HaTov veHaMeitiv. If they were given <i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> to him as a <i data-commentator="Mishnah Berurah" data-label="כ"></i> gift he recites HaTov veHaMeitiv, since it is a benefit both to him <i data-commentator="Magen Avraham" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כא"></i> and <i data-commentator="Ba'er Hetev" data-order="15"></i> to the giver.
