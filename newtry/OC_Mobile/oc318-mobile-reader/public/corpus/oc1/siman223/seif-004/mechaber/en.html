<i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יז"></i> At the <i data-commentator="Ba'er Hetev" data-order="12"></i> time of acquisition he should recite the blessing even though he has not yet used them, since the blessing is recited on account of the joy in one's heart at the acquisition. When he <i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> wears <i data-commentator="Ba'er Hetev" data-order="13"></i> <i data-commentator="Sha'arei Teshuvah" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="יח"></i> them he recites Malbish Arumim.
