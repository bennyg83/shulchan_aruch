<i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="2"></i> <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ח"></i> If one's father died,<i data-commentator="Ba'er Hetev" data-order="6"></i> he recites Dayan HaEmet. If the father <i data-commentator="Ba'er Hetev" data-order="7"></i> left money that he inherits and he has <i data-commentator="Mishnah Berurah" data-label="ט"></i> no brothers, he also recites Shehecheyanu. If he <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> has brothers, in place of Shehecheyanu <i data-commentator="Ba'er Hetev" data-order="8"></i> he recites HaTov veHaMeitiv.<small>Rema: One only recites HaTov veHaMeitiv when others share in the benefit. (Tur).</small>
