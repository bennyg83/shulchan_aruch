<i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> Feces of roosters that go <i data-commentator="Mishnah Berurah" data-label="כז"></i> in the house—their law is like feces of domesticated animal, wild beast, and bird;<i data-commentator="Mishnah Berurah" data-label="כח"></i> but their coop has putrefaction, and its law is like human feces.
