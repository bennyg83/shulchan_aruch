<i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> Excrement of roosters that go in <i data-commentator="Mishnah Berurah" data-label="כז"></i> the house, their ruling is like excrement of a domesticated animal, a wild beast, and bird, but <i data-commentator="Mishnah Berurah" data-label="כח"></i> their coop has a stench, and its ruling it like the excrement of a human.
