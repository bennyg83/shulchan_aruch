<i data-commentator="Be'er HaGolah" data-label="נ" data-order="15"></i> <i data-commentator="Magen Avraham" data-order="17"></i> One may not open a clay lamp — meaning while it is still soft like a potter's clay vessel — by pressing it with one's hand to make a hollow in it, since one would be <i data-commentator="Mishnah Berurah" data-label="לז"></i> making a vessel.
