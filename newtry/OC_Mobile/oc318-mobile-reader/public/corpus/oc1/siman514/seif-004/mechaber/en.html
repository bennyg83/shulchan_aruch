<i data-commentator="Be'er HaGolah" data-label="ז" data-order="8"></i> A lamp that went out and one wishes to relight <i data-commentator="Mishnah Berurah" data-label="כז"></i> it that same <i data-commentator="Magen Avraham" data-order="11"></i> day —<i data-commentator="Ba'er Hetev" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="כח"></i> one may trim the top of the wick so that it will be easy to light.<small>Leftover <i data-commentator="Turei Zahav" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="כט"></i> oil and wicks are permitted even on Yom Tov that follows Shabbat, or the two days of Rosh Hashanah. (Beit Yosef in the name of most authorities))</small>:
