<b>In the manner.</b> See Taz. The Beis Yosef brought this in the name of Baal HaItur, and it is an explicit verse in Yechezkel 24:17, ‘do not cover your upper lip.’ This is not so with tzitzis, for covering the body alone is called wrapping, and that is the primary wrapping. See Magen Avraham, letter 2.
