<i data-commentator="Ateret Zekenim" data-label="♦" data-order="2"></i> <i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> The order of wrapping <i data-commentator="Turei Zahav" data-order="2"></i> is as people cover themselves in their garments while working — sometimes covering the head, sometimes with head uncovered — and it <i data-commentator="Mishnah Berurah" data-label="ג"></i> is proper that <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Sha'arei Teshuvah" data-order="3"></i> he cover his head with <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> the tallis.
