<i data-commentator="Be'er HaGolah" data-label="א" data-order="23"></i> If one covered oneself with a garment that is obligated in tzitzis and did not tie tzitzis on it,<i data-commentator="Turei Zahav" data-order="18"></i> one has <i data-commentator="Ba'er Hetev" data-order="20"></i> <i data-commentator="Mishnah Berurah" data-label="מד"></i> nullified the mitzvah of tzitzis.
