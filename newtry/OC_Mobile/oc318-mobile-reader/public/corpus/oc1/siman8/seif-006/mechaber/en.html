<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> For a tallis katan one may bless lehisatef even though one is not wrapping but <i data-commentator="Turei Zahav" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> only wearing it.. <small>{Rama: Some say one blesses al mitzvas <i data-commentator="Turei Zahav" data-order="7"></i> <i data-commentator="Ba'er Hetev" data-order="7"></i> <i data-commentator="Sha'arei Teshuvah" data-order="7"></i> tzitzis , and such is the practice — one <i data-commentator="Mishnah Berurah" data-label="יז"></i> should not change (Kol Bo siman 22; Noda B'Yehudah, Hilchos Kerias Shema 86b).}.</small>
