<b>Binah</b> — see Ba'er Heitev. And see in Shulchan Tzelach regarding the formula of the blessing: the Tur wrote they are 17 words, and similarly Kol Bo; and in Rambam's formula 18; and he wrote in Sefer HaKavanos in the name of Maharash Vital to read chokhmah, binah, da'at, and haskal — see there.
