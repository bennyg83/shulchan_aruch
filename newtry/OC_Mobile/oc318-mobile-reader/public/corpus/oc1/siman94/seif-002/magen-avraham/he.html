<b>אם מתפלל</b>. פי' במקום שמנהגם כך או שיושב על החמור:<br />
<b>ואנו שמחזירין</b>. ולכן קובעין ההיכל במזרח ואפי' קבעו ההיכל בצד אחר יתפלל למזרח (כ"ה בשם ר"ש הקאן):<br />
<b>כנגד זריחת</b>. עיין בלבוש הציור להעמיד כותל מזרחי נגד קרן מזרחית דרומית של העולם:<br />
<b>יצדד פניו</b>. ורש"י פי' איפכא דיצדד פניו לצפון או לדרום ועיקר עמידתו למזרח:
