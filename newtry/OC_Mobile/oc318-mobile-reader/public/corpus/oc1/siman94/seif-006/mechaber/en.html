<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="כ"></i> One who is sick [may]<i data-commentator="Ateret Zekenim" data-label="♦" data-order="4"></i> pray even lying down on one's side, as long as he is able to concentrate<small> ((And if it is not possible from him to <i data-commentator="Mishnah Berurah" data-label="כא"></i> pray, nevertheless, one should meditate in one's heart, as it says &quot;Ponder [it] on your bed&quot; [(Psalms 4:5)] (Beit Yosef in the name of Orchot Chaim and Pesikta).</small>
