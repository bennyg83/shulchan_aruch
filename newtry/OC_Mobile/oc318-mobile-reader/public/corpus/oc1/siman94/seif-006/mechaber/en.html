<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="כ"></i> One who is <i data-commentator="Ateret Zekenim" data-label="♦" data-order="4"></i> sick may pray even lying on one's side, provided one can concentrate.<small> ((And if unable to pray, nevertheless one meditates <i data-commentator="Mishnah Berurah" data-label="כא"></i> in one's heart, as it says &quot;Speak in your hearts upon your beds&quot; (Psalms 4:5) (Beit Yosef in the name of Orchot Chaim and Pesikta).).</small>
