(א) (s.k. 3) He left nine, etc. — when tied together all are one body; when separate, only the one.<br>
<br>
(ב) (s.k. 3) Tied together — then all nine or all ten must be checked.<br>
<br>
(ג) (s.k. 3) If not tied — only the one loaf.<br>
<br>
(ד) (s.k. 3) After the one — the missing or added loaf specifically.
