<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> If one vowed to visit the graves of righteous people in some location, and he was delayed for a long time and later it happened that he was hired to go <i data-commentator="Magen Avraham" data-order="21"></i> <i data-commentator="Mishnah Berurah" data-label="מז"></i> there,<i data-commentator="Ba'er Hetev" data-order="20"></i> <i data-commentator="Sha'arei Teshuvah" data-order="20"></i> that trip counts.
