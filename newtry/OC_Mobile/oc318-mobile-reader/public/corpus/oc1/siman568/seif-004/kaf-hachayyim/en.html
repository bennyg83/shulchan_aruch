<b>4) One who vowed to fast every Monday and Thursday for a year</b> may not have the vow annulled until the first Monday arrives. Radbaz, volume 1, siman 277; Machazik Berachah, paragraph 6; Shaarei Teshuvah there. See Yoreh Deah, siman 228, se'if 17, and our discussion above in siman 417, paragraph 25.
