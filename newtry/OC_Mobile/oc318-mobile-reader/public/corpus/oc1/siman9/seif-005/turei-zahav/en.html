<b>“From the dye of the <i>tallis</i>.”</b> Beit Yosef cited Tosafos “for this is My glory and I adorn Myself” [<i>Shevuos</i>].<br>
<br>
<b>“Even in dyed garments.”</b> Nevertheless it is fit to be careful to make specifically four corners or a <i>tallis katan</i> white so one fulfills all opinions when making the <i>tzitzis</i> white.
