<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> If there were many [leaves] from <i data-commentator="Mishnah Berurah" data-label="טז"></i> one node and they fell off leaving only <i data-commentator="Ba'er Hetev" data-order="9"></i> three in one node,<i data-commentator="Turei Zahav" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="יז"></i> it is kosher, even if the majority fell off, like if there were seven and four fell off.
