<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> If most of its leaves <i data-commentator="Turei Zahav" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="כא"></i> dried out, but <i data-commentator="Mishnah Berurah" data-label="כב"></i> there remains on each of the three branches a stem with three non-dry leaves,<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="כג"></i> it is valid. Some say that if among the three on one stem two dried out and there is only one non-dry <i data-commentator="Mishnah Berurah" data-label="כד"></i> leaf,<i data-commentator="Mishnah Berurah" data-label="כה"></i> it is valid, provided that <i data-commentator="Mishnah Berurah" data-label="כו"></i> the leaf is above the other two.
