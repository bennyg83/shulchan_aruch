<b>The Laws of the Hadas (Myrtle), 11 Seifim: If</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Turei Zahav" data-order="1"></i> the myrtle's <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> head is severed, it is <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ב"></i> valid. If <i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> <i data-commentator="Sha'arei Teshuvah" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> most of its leaves fell off but three remain <i data-commentator="Turei Zahav" data-order="2"></i> on one <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> stem, it is valid.
