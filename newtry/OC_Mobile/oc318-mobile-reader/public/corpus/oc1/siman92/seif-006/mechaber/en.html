<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="כז"></i> One who is standing in' <i data-commentator="Mishnah Berurah" data-label="כח"></i> prayer [i.e. the Amidah] and recalls that he touched a dirty place, it suffices for cleansing [to use] dirt or rocks or rub his hands on a wall.
