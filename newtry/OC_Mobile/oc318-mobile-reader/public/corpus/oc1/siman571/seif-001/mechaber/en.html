<b>Who are called sinners to fast. And it has 3 seifim: One who sits in</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> fasting — if he can endure the fast he is called kadosh, and' <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> if not — such <i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> as one who is not healthy and strong — he is <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ב"></i> called a <i data-commentator="Ba'er Hetev" data-order="1"></i> choteh (sinner).
