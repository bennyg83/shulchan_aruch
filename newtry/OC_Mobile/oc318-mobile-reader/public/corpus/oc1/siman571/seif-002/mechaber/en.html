<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> A Torah scholar <i data-commentator="Mishnah Berurah" data-label="ד"></i> is not permitted to sit in fasting, for it diminishes work of Heaven; rather <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> only when the congregation fasts, that he not separate himself from them; and teachers of <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> <i data-commentator="Magen Avraham" data-order="3"></i> children — their <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Sha'arei Teshuvah" data-order="3"></i> law is like' <i data-commentator="Mishnah Berurah" data-label="ה"></i> a Torah scholar.
