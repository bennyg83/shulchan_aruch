<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> From the Torah one is liable only <i data-commentator="Mishnah Berurah" data-label="יא"></i> for passing four amot in reshut ha-rabbim, and the Sages forbade passing four amot in karmelit and in the sea <i data-commentator="Mishnah Berurah" data-label="יב"></i> and in a valley — these are <i data-commentator="Mishnah Berurah" data-label="יג"></i> two types of karmelit — and it is permitted to move objects from one to the other within four amot:
