<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> One is made liable by the Torah only <i data-commentator="Mishnah Berurah" data-label="יא"></i> for moving an object four amot in the public domain, but the Sages forbade moving an object four amot in <i data-commentator="Mishnah Berurah" data-label="יב"></i> the karmelit. The sea and the valley <i data-commentator="Mishnah Berurah" data-label="יג"></i> are two types of karmelit, and one is permitted to carry between them if it is less than four amot.
