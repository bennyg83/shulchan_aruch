<b>(s.k. 5) One may not, etc.</b> And it is not actual selecting, etc.: for the Gemara itself used this language, "it appears like selecting," and therefore Tosafos inferred that it is not actual selecting.<br />
<b>From yesterday, etc.</b> See seif 4 in Magen Avraham, s.k. 9; there a proof for this law is explained.
