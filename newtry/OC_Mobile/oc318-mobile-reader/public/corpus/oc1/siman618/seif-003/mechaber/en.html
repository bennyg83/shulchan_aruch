<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> If the sick person and one doctor with him say that he (the sick person) does not need (food), and another doctor says <i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> he does need (food), or if the sick person <i data-commentator="Mishnah Berurah" data-label="י"></i> says nothing and one doctor says he needs (food) and two say he does not need (the nourishment), we do not feed him.
