<b>Laws of bran on Passover. Containing 3 seifim: One</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> may not soak <i data-commentator="Mishnah Berurah" data-label="ב"></i> bran for chickens under any <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Chok Yaakov" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> circumstances, nor may <i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Chok Yaakov" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> one <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Sha'arei Teshuvah" data-order="2"></i> scald it.<small>And when giving them barley or wheat to <i data-commentator="Chok Yaakov" data-order="3"></i> eat, one should be careful <i data-commentator="Mishnah Berurah" data-label="ה"></i> not to throw them <i data-commentator="Chok Yaakov" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ו"></i> in a <i data-commentator="Ba'er Hetev" data-order="3"></i> wet place where they might become chametzed. (Mahariv))</small>
