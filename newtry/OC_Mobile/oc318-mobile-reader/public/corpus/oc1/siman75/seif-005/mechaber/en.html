<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> If there is <i data-commentator="Mishnah Berurah" data-label="כה"></i>&quot;nakedness&quot; behind a [glass] lamp and one sees it through the [glass] walls [of the lamp],<i data-commentator="Mishnah Berurah" data-label="כו"></i> it is forbidden to recite [Sh'ma] in front of it, as is written, &quot;...let Him not find anything unseemly among you&quot; (Deut. 23:15) and here, it is seen.
