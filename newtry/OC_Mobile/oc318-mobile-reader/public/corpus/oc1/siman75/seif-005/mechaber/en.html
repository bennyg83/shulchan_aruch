<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> If there is <i data-commentator="Mishnah Berurah" data-label="כה"></i> ervah behind a glass lamp and one sees it through its walls, it is forbidden <i data-commentator="Mishnah Berurah" data-label="כו"></i> to recite [Shema] opposite it, as it is written, &quot;and He shall not see among you a matter of nakedness&quot; (Deut. 23:15), and here it is visible.
