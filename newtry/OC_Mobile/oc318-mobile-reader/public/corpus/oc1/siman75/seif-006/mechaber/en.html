<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> If there <i data-commentator="Mishnah Berurah" data-label="כז"></i> was ervah opposite him, and <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="כח"></i> he turned his face away <i data-commentator="Ba'er Hetev" data-order="11"></i> <i data-commentator="Sha'arei Teshuvah" data-order="11"></i> from it,<i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="כט"></i> or closed his eyes, or it is at night, or he is blind, it is permitted to recite [Shema], for <i data-commentator="Mishnah Berurah" data-label="ל"></i> the Omnipresent conditioned it on seeing, and behold this is not seeing.
