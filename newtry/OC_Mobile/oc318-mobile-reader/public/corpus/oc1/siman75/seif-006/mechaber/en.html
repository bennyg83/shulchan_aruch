<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> If there <i data-commentator="Mishnah Berurah" data-label="כז"></i> was &quot;nakedness&quot; if front of <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="כח"></i> someone, and they turned their face <i data-commentator="Ba'er Hetev" data-order="11"></i> <i data-commentator="Sha'arei Teshuvah" data-order="11"></i> from it,<i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="כט"></i> or closed their eyes, or it is at night [and they could not see it], or one is blind, it is permitted to recite <i data-commentator="Mishnah Berurah" data-label="ל"></i>[Sh'ma] for the Merciful One conditions it on seeing, and behold this is not seeing.
