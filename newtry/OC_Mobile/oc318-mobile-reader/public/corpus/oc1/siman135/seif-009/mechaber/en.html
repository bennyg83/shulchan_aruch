<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> Similarly, two Levi'im should not <i data-commentator="Eshel Avraham" data-label="א" data-order="3"></i> be called up, one after the other, so that [people] should not say <i data-commentator="Magen Avraham" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="ל"></i> that one of them is invalid.
