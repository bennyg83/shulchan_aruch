<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> If there was a Kohen and a Levi in the synagogue and the Kohen read [an aliyah], and [then] thinking <i data-commentator="Turei Zahav" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> that there is no Levi there and started blessing the Torah <i data-commentator="Ba'er Hetev" data-order="13"></i> blessing a <i data-commentator="Magen Avraham" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="כז"></i> second time, we do not stop <i data-commentator="Ba'er Hetev" data-order="14"></i>[the Kohen].
