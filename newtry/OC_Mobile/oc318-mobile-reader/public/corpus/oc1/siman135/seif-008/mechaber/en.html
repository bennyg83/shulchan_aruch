<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> If there is no Levi in the synagogue, the Kohen that was called first blesses a second time and reads in place of <i data-commentator="Mishnah Berurah" data-label="כח"></i> a Levi, but not a different Kohen, so that [people] shouldn't say <i data-commentator="Magen Avraham" data-order="12"></i> <i data-commentator="Turei Zahav" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כט"></i> that the first one <i data-commentator="Ba'er Hetev" data-order="15"></i> was invalid.
