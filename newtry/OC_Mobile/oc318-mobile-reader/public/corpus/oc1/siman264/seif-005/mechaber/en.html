<i data-commentator="Magen Avraham" data-order="11"></i> <i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="כ"></i> Molten fat <i data-commentator="Ba'er Hetev" data-order="7"></i> and fish <i data-commentator="Mishnah Berurah" data-label="כא"></i> entrails -- we do not ignite with them. And if one adds to them a bit of one of the oils we ignite with -- it <i data-commentator="Mishnah Berurah" data-label="כב"></i> is permitted to ignite with them.
