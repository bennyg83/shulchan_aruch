<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Magen Avraham" data-order="6"></i> The <i data-commentator="Mishnah Berurah" data-label="יב"></i> shaliach tzibbur must be <i data-commentator="Ba'er Hetev" data-order="6"></i> <i data-commentator="Sha'arei Teshuvah" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i> fit. Who is fit? One empty of transgressions, and <i data-commentator="Mishnah Berurah" data-label="יד"></i> no bad reputation <i data-commentator="Mishnah Berurah" data-label="טו"></i> went out about him—even in his <i data-commentator="Magen Avraham" data-order="7"></i> youth;' <i data-commentator="Ba'er Hetev" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> who is humble and acceptable to the people; who <i data-commentator="Mishnah Berurah" data-label="יז"></i> has <i data-commentator="Ateret Zekenim" data-label="♦" data-order="2"></i> a pleasant melody and whose voice is <i data-commentator="Mishnah Berurah" data-label="יח"></i> sweet; and who is accustomed to reading Torah, Prophets, and Writings.
