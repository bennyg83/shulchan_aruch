<i data-commentator="Be'er HaGolah" data-label="ו" data-order="28"></i> A congregation that needs to hire a Rabbi and prayer-leader but doesn't have money for both... If he is a brilliant rabbi, great in Torah, and an expert in halachic ruling, he is given' <i data-commentator="Mishnah Berurah" data-label="עא"></i> precedence,<i data-commentator="Ba'er Hetev" data-order="29"></i> and if <i data-commentator="Mishnah Berurah" data-label="עב"></i> not, the prayer-leader is given precedence.
