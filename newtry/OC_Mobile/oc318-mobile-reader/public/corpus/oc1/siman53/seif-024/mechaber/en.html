<i data-commentator="Be'er HaGolah" data-label="ו" data-order="28"></i> A congregation that must hire a rabbi and shaliach tzibbur and lacks enough for both—if he is a distinguished rabbi, great in Torah and expert in ruling, he takes' <i data-commentator="Mishnah Berurah" data-label="עא"></i> precedence;<i data-commentator="Ba'er Hetev" data-order="29"></i> if not,<i data-commentator="Mishnah Berurah" data-label="עב"></i> the shaliach tzibbur takes precedence.
