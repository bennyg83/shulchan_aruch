<i data-commentator="Be'er HaGolah" data-label="ב" data-order="24"></i> If one wishes to pray on <i data-commentator="Magen Avraham" data-order="23"></i> <i data-commentator="Mishnah Berurah" data-label="נט"></i> behalf of <i data-commentator="Ba'er Hetev" data-order="24"></i> his father and another wishes to pray on behalf <i data-commentator="Turei Zahav" data-order="12"></i> <i data-commentator="Magen Avraham" data-order="24"></i> of <i data-commentator="Mishnah Berurah" data-label="ס"></i> another—the one <i data-commentator="Ba'er Hetev" data-order="25"></i> the congregation wishes to pray,<i data-commentator="Mishnah Berurah" data-label="סא"></i> he prays.
