<i data-commentator="Turei Zahav" data-order="13"></i> <i data-commentator="Be'er HaGolah" data-label="ד" data-order="26"></i> A shaliach tzibbur <i data-commentator="Magen Avraham" data-order="25"></i> <i data-commentator="Mishnah Berurah" data-label="סג"></i> for pay <i data-commentator="Ba'er Hetev" data-order="26"></i> is preferable to one who volunteers.<small>A person should not <i data-commentator="Mishnah Berurah" data-label="סד"></i> pray without <i data-commentator="Magen Avraham" data-order="26"></i> <i data-commentator="Mishnah Berurah" data-label="סה"></i> the congregation's <i data-commentator="Ba'er Hetev" data-order="27"></i> will; and whoever prays by force and in the manner <i data-commentator="Mishnah Berurah" data-label="סו"></i> of violence—they do not answer amen after his blessings [Binyamin Zeev siman 163; Agudah, chapter &quot;Keitzad Mevarchin&quot;].]:</small>
