<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> If a sukkah <i data-commentator="Mishnah Berurah" data-label="י"></i> is constructed upon <i data-commentator="Mishnah Berurah" data-label="יא"></i> a wagon or upon <i data-commentator="Mishnah Berurah" data-label="יב"></i> a boat, if it cannot withstand ordinary land winds it is invalid. However, if it can withstand ordinary land winds -<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i> even if it cannot withstand ordinary sea winds - it <i data-commentator="Magen Avraham" data-order="4"></i> is <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="יד"></i> valid.
