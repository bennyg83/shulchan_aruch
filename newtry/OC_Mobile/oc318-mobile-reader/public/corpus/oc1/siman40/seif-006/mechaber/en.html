<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> If one forgot and had marital intercourse while wearing their תפילין, he should not touch the boxes or the straps <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="יד"></i> until he washes <i data-commentator="Ba'er Hetev" data-order="9"></i> his hands since the hands are [always] involved [in touching things] and perhaps they touched unclean places [on the body].
