<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> If he forgot and had marital relations on his bed while wearing tefillin, he should not touch <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="יד"></i> the batim or <i data-commentator="Ba'er Hetev" data-order="9"></i> the strap until he washes his hands, because hands are busy and perhaps they touched unclean places.
