<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> One who enters for a fixed <i data-commentator="Mishnah Berurah" data-label="יז"></i> meal removes them and places <i data-commentator="Mishnah Berurah" data-label="יח"></i> them on the table until time of blessing, and returns and <i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="יט"></i> dons them; but for <i data-commentator="Mishnah Berurah" data-label="כ"></i> casual eating he need not remove them.
