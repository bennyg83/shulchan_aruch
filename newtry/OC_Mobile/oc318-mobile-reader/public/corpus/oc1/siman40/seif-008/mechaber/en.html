<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> One who eats a full meal, takes <i data-commentator="Mishnah Berurah" data-label="יז"></i> off his תפילין and leaves them <i data-commentator="Mishnah Berurah" data-label="יח"></i> on the table until Birkas Hamazon, and then puts them on again. But for <i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="יט"></i> a non meal eating (ie.<i data-commentator="Mishnah Berurah" data-label="כ"></i> a snack) he need not take off the תפילין.
