<b>דין איך לנהוג בקדושת התפילין. ובו ח סעיפים:</b><br> <i data-commentator="Mishnah Berurah" data-label="א"></i> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Magen Avraham" data-order="1"></i>&lt;b&gt;The law of how to conduct oneself <i data-commentator="Ba'er Hetev" data-order="1"></i> regarding holiness of tefillin. And <i data-commentator="Mishnah Berurah" data-label="ב"></i> it contains eight seifim:&lt;/b&gt; It is forbidden to hang tefillin, whether by the batim or by the straps; but it is permitted to hang <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Sha'arei Teshuvah" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> them in their pouch.
