<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> A minor is obligated d'rabbanan in order to educate him;<i data-commentator="Mishnah Berurah" data-label="ה"></i> and that which a son blesses for his <i data-commentator="Mishnah Berurah" data-label="ו"></i> father is when the father <i data-commentator="Magen Avraham" data-order="3"></i> did <i data-commentator="Ba'er Hetev" data-order="2"></i> not eat <i data-commentator="Mishnah Berurah" data-label="ז"></i> to satiation, for his obligation is only d'rabbanan.
