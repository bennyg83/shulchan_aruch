<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i>7. Those who accompany the <i data-commentator="Magen Avraham" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="לז"></i> dead are forbidden <i data-commentator="Ba'er Hetev" data-order="13"></i> to ride on an animal, even on the second day <i data-commentator="Mishnah Berurah" data-label="לח"></i> of a holiday. this applies even to the mourners and the ones who bury. If this <i data-commentator="Turei Zahav" data-order="4"></i> is impossible, we permit <i data-commentator="Magen Avraham" data-order="16"></i> <i data-commentator="Ba'er Hetev" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="לט"></i> them to ride on an animal on the second <i data-commentator="Mishnah Berurah" data-label="מ"></i> day of a holiday.
