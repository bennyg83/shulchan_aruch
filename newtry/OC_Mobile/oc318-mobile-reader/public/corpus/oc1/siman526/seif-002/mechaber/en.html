<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> If somebody dies on the first <i data-commentator="Mishnah Berurah" data-label="טו"></i> day of a holiday, it is forbidden to let him rest <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Sha'arei Teshuvah" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> until the second day so that Jews can deal with him.
