<i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i> <i data-commentator="Mishnah Berurah" data-label="מד"></i>9. If an infant <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> died in its first <i data-commentator="Mishnah Berurah" data-label="מה"></i> thirty days and it had grown hair and nails, it <i data-commentator="Magen Avraham" data-order="19"></i> is considered a child that will <i data-commentator="Mishnah Berurah" data-label="מו"></i> endure. It is treated <i data-commentator="Ba'er Hetev" data-order="17"></i> <i data-commentator="Sha'arei Teshuvah" data-order="17"></i> like an dead adult, even if we do not know if it was brought fully to <i data-commentator="Mishnah Berurah" data-label="מז"></i> term, because most women give birth to children that will endure.
