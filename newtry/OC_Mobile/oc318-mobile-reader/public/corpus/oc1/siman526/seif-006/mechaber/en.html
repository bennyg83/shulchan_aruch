<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i>6. It is permitted to accompany a corpse on the first <i data-commentator="Mishnah Berurah" data-label="לג"></i> day of a holiday within the techum. On the second <i data-commentator="Mishnah Berurah" data-label="לד"></i> day of the holiday,<i data-commentator="Magen Avraham" data-order="13"></i> <i data-commentator="Ba'er Hetev" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="לה"></i> it is allowed even outside of the techum. We then <i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="לו"></i> return that day. It is also <i data-commentator="Magen Avraham" data-order="14"></i> permitted to bring back the digging tools that were brought outside of the techum.
