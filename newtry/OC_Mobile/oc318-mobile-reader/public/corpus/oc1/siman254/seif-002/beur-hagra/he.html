<b>ס"ב ע"ג גחלים.</b> דוקא לפי' הרמב"ם:<br />
<b>חצי בשולו.</b> על פי' הרמב"ם עמ"א:<br />
<b>אפי' הוא.</b> כמ"ש התם בבשרא כו' ולרב אשי אין חילוק בין גדיא או ברחא ועיין מ"ש רמ"א בס"א:<br />
<b>דכיון.</b> הוא טעם לשיטתו דהטעם מפני שיתחרך:<br />
<b>אבל כשנצלה.</b> ר"ל אע"ג דלשיטת הרי"ף ורמב"ם אין חילוק בין כמב"ד או קודם כאן ע"ג גחלים מהני:
