<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> In our ovens, which do not <i data-commentator="Mishnah Berurah" data-label="מב"></i> have the removal of bread, it is permitted <i data-commentator="Mishnah Berurah" data-label="מג"></i> to take it <i data-commentator="Magen Avraham" data-order="23"></i> out prior to the <i data-commentator="Ba'er Hetev" data-order="11"></i> Third Meal with a knife or with something that it <i data-commentator="Mishnah Berurah" data-label="מד"></i> will stick to. Nevertheless, one should not remove [a loaf] with a baker’s shovel so that he not follow his ordinary weekday practice.
