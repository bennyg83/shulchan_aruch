<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i>5.<i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Ba'er Hetev" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i> Anyone that separates from the community (in times of distress), he will not see its consolation, and anyone that grieves with them, he will merit and see it in its consolation.
