<i data-commentator="Be'er HaGolah" data-label="ח" data-order="9"></i>6. If a person is filling the doorway, another person <i data-commentator="Mishnah Berurah" data-label="כד"></i> is permitted to sit beside him, even if eventually the first person gets up and leaves; the second <i data-commentator="Magen Avraham" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> person is not liable, rather he is permitted <i data-commentator="Be'er HaGolah" data-label="ט" data-order="10"></i> to do so; however the first person <i data-commentator="Mishnah Berurah" data-label="כו"></i> is liable.
