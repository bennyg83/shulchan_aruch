<i data-commentator="Be'er HaGolah" data-label="י" data-order="11"></i>7. Trapping snakes and scorpions on Shabbos or any other dangerous creatures: if for medicinal purposes – one is liable; if to protect oneself <i data-commentator="Mishnah Berurah" data-label="כז"></i> so as not to <i data-commentator="Magen Avraham" data-order="12"></i> get bitten – it is permitted.
