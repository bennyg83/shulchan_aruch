<i data-commentator="Be'er HaGolah" data-label="ז" data-order="8"></i>5. If <i data-commentator="Mishnah Berurah" data-label="יט"></i> a deer entered a house and a person bars the <i data-commentator="Mishnah Berurah" data-label="כ"></i> way, he is liable. If two people bar the way, they are exempt. If one person is incapable of <i data-commentator="Mishnah Berurah" data-label="כא"></i> barring the way and two <i data-commentator="Mishnah Berurah" data-label="כב"></i> people bar the way they are both liable. RAMA: If the door is already shut it is permitted to <i data-commentator="Magen Avraham" data-order="10"></i> <i data-commentator="Ba'er Hetev" data-order="6"></i> lock it. [R&quot;an; the Maggid]<small> <i data-commentator="Mishnah Berurah" data-label="כג"></i>]:</small>
