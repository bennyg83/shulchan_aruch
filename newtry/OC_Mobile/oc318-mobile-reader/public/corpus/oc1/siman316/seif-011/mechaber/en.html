<i data-commentator="Be'er HaGolah" data-label="ת" data-order="23"></i>11. One is forbidden to rub saliva <i data-commentator="Magen Avraham" data-order="24"></i> <i data-commentator="Mishnah Berurah" data-label="מט"></i>24) on <i data-commentator="Ba'er Hetev" data-order="16"></i> the ground with his foot because he is smoothing the crevices. However one may step on it in a mindless fashion as his intention is not to <i data-commentator="Turei Zahav" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="נ"></i> smooth the crevices and even though it will happen, it is <i data-commentator="Mishnah Berurah" data-label="נא"></i> nevertheless <i data-commentator="Magen Avraham" data-order="25"></i> permitted because <i data-commentator="Ba'er Hetev" data-order="17"></i> it is repulsive.
