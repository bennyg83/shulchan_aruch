<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> An outhouse situated between two houses that did not make a joint eruv: both parties <i data-commentator="Mishnah Berurah" data-label="כג"></i> have jurisdiction over it and it is therefore <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Ba'er Hetev" data-order="5"></i> forbidden to both.<small> <i data-commentator="Mishnah Berurah" data-label="כד"></i>((See also above, Siman 355.).</small>
