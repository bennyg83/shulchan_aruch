<b>דין לבישת בגדים. ובו ו סעיפים:</b><br>לא ילבש <i data-commentator="Turei Zahav" data-order="1"></i> One must <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> not don(<i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> his) <i data-commentator="Ba'er Hetev" data-order="1"></i> robe while seated (Tur); rather he should put his head and arms into it while still lying down, so that <i data-commentator="Mishnah Berurah" data-label="ב"></i> when he rises he is covered.
