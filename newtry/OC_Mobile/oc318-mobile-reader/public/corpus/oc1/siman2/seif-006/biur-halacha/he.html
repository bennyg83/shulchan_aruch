<b> ולא ילך ד' אמות</b> - עיין במ"ב סוף סקי"א במש"כ ואם מפלה ראשו שרי הן אמת בפמ"ג כתב ואם מפלה ראשו כה"ג שרי משמע מיניה דדוקא במכסה בידו ואנכי השמטתי תיבת כה"ג משום דמספר שמ"ח משמע דבזה שרי בכל גווני ולענ"ד שאין להחמיר בזה אחרי דחשש דובחוקותיהם לא שייך לדידיה לכ"ע כי הכל רואין שעושה זה רק לטובת עצמו:
