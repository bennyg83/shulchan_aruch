<b>וחצרות. </b> וחצרות שלנו נעשה קודש כיון שמתפללין שם תדיר כל זמן שהם נדחקין מהרי"ט עיין מ"א. גן ופרדס ואיצטבא שסביבה אע"פ שפתוח לבה"כ אין בה קדושה ואם היה פתוח נגד ההיכל יש להחמיר שלא להשתמש בהן שם:<br />
<b>הקודש. </b> הגה זו צ"ל בסעיף ג:<br />
<b>בחומה. </b> וה"ה הבנוי בכותל של עץ דהוי כחדר בעלמא. מ"א:
