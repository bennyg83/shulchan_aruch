<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i>[Regarding] those whose custom is to place the crowns of the Torah scroll on the head of the reader at the' <i data-commentator="Magen Avraham" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="מב"></i> culmination of the Torah - we do not protest against it. But those who place them on the heads of bridegrooms - we do protest <i data-commentator="Ba'er Hetev" data-order="13"></i> against that.
