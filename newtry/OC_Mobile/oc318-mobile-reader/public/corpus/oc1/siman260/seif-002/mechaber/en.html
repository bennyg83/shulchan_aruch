<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> When it is <i data-commentator="Mishnah Berurah" data-label="ט"></i> close to nightfall, one asks of the members of his household in <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> a gentle tone, have <i data-commentator="Mishnah Berurah" data-label="יא"></i> you tithed?<i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> Have you <i data-commentator="Sha'arei Teshuvah" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i> established the Eruv? Have you <i data-commentator="Turei Zahav" data-order="3"></i> separated Challah? And he <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="יד"></i> says to them, 'light the candle'.<small>In a place where one does not tithe, it is not necessary to ask if one tithed (Tur).</small>
