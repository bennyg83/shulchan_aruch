<b>ס"א כל גופו.</b> שם נשיתי טובה כו':<br />
<b>ומצוה.</b> שם ל"א א' ואצל מעשה דאבישי:<br />
<b>ולגלח כו' ואם כו'.</b> כמו בעי"ט וכמ"ש בירושלמי שם א"ר חגי ר"ש כו' פ"ק דר"ה ובמ"ר הביאו הרא"ש סוף ד"ה ומגלחין זקנם כו' ר"ל כמו בכל עי"ט:<br />
<b>ואם היו.</b> תענית ט"ו ב' וכמ"ש במ"ק י"ז א' כדי שלא כו' ומטעם זה מצוה לגלח הצפרנים כמ"ש ביבמות מ"ח א':
