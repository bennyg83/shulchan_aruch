<b>Whether it is permitted to roast two sheaves together and the laws of karmel. Containing 3 seifim: It</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Chok Yaakov" data-order="1"></i> is permitted to roast two sheaves together, and <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> we are not concerned that perhaps moisture will pass from one to the other, for <i data-commentator="Mishnah Berurah" data-label="א"></i> they are fruit juice and they do not cause leavening.
