<b>שמא ישכחם</b>. אבל מדאוריי' מותר להניחם:<br />
<b>שתשקע החמה</b>. היינו צאת הכוכבים [ב"י בשם מרדכי] ובסי' כ"ה כ' בשם הג"מ שחולצן כשמגיע בק"ש של ערבית לכימי השמים על הארץ והיינו כשמתפלל ערבית מבע"י:<br />
<b>ואין מורין כן</b>. ואם כן ברבים צריך לחלצן כמ"ש סי' י"ח:<br />
<b>כדי לשומרן</b>. וצריך שיאמר שעושה כדי לשומרן [כ"מ בגמ']:
