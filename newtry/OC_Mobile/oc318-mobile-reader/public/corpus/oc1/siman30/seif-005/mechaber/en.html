<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> There are those who say that <i data-commentator="Magen Avraham" data-order="7"></i> if one <i data-commentator="Ba'er Hetev" data-order="7"></i> prayed the evening prayer <i data-commentator="Mishnah Berurah" data-label="יז"></i> while it was still day, before he had donned tefillin,<i data-commentator="Turei Zahav" data-order="7"></i> he may no longer don them afterward.
