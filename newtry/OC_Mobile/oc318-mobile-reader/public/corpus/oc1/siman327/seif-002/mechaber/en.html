<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> One may anoint and rub for his pleasure through <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ו"></i> a change — that he anoints and rubs together, and he should not <i data-commentator="Mishnah Berurah" data-label="ז"></i> rub with force but with lightness of hands.
