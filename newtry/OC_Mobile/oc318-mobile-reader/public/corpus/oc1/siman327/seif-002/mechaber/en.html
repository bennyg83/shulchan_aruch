<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> It is permitted to anoint oneself and have <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ו"></i> one’s entire body massaged by hand for pleasure. And one should not massage <i data-commentator="Mishnah Berurah" data-label="ז"></i> vigorously, but [rather, he should massage] gently.
