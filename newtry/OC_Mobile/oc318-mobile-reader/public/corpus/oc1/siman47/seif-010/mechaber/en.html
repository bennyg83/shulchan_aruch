<i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> If one was interrupted from studying and gets involved with one's activities, since <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Turei Zahav" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כב"></i> it was in one's head <i data-commentator="Ba'er Hetev" data-order="10"></i> to return and study, this is not an interruption. And this is the law <i data-commentator="Mishnah Berurah" data-label="כג"></i> for sleep <i data-commentator="Magen Avraham" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> or the bathhouse or the outhouse, that it is not an interruption.
