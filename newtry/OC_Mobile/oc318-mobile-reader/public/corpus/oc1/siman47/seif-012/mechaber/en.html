<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> Even if one learned <i data-commentator="Mishnah Berurah" data-label="כו"></i> at night, the night comes after the day that passed, and <i data-commentator="Mishnah Berurah" data-label="כז"></i> there is no need to go back and bless [again] as long <i data-commentator="Magen Avraham" data-order="12"></i> as one <i data-commentator="Mishnah Berurah" data-label="כח"></i> did <i data-commentator="Ba'er Hetev" data-order="12"></i> <i data-commentator="Sha'arei Teshuvah" data-order="12"></i> not sleep.
