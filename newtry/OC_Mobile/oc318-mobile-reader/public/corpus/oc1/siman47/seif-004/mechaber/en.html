<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Magen Avraham" data-order="2"></i> One who contemplates words of Torah <i data-commentator="Mishnah Berurah" data-label="ה"></i> need <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Sha'arei Teshuvah" data-order="3"></i> not bless.<small>And the same <i data-commentator="Mishnah Berurah" data-label="ו"></i> applies to <i data-commentator="Mishnah Berurah" data-label="ז"></i> one who can rule on a halachic matter without giving reasons for his words [Ran, first chapter of Shabbos and chapter Kol HaTzalamim—he wrote that it is like contemplation].]:</small>
