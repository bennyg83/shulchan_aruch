<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> <i data-commentator="Turei Zahav" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="יז"></i> And there is reason to doubt whether one fulfills [one's obligation] by <i data-commentator="Ba'er Hetev" data-order="8"></i> reading the recitation of the Sh'ma adjoined to it [i.e. Ahavat Olam] immediately without <i data-commentator="Mishnah Berurah" data-label="יח"></i> an interruption, and therefore there is reason to be diligent to bless the Blessing of the Torah prior to Ahavat Olam.
