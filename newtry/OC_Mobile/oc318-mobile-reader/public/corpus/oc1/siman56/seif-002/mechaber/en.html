<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> When the shaliach tzibbur says yitbarakh, the entire congregation answers amen; similarly when he says b'rikh Hu, and similarly when he says v'imru amen.<small>The custom is not to <i data-commentator="Mishnah Berurah" data-label="יב"></i> say <i data-commentator="Ba'er Hetev" data-order="6"></i> <i data-commentator="Sha'arei Teshuvah" data-order="6"></i> amen after yitbarakh,<i data-commentator="Mishnah Berurah" data-label="יג"></i> nor after b'rikh Hu;<i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Magen Avraham" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="יד"></i> and one may not interrupt between b'rikh <i data-commentator="Ba'er Hetev" data-order="7"></i> Hu and le'eila mikol birkhata, etc.':</small>
