<i data-commentator="Be'er HaGolah" data-label="ט" data-order="32"></i>18.<i data-commentator="Mishnah Berurah" data-label="נא"></i> If one heard distant news of a death on Shabbat or yontif, he doesn't even observe private mourning practices. After Shabbat or yontif, he practices one hour of mourning, and this is sufficient.
