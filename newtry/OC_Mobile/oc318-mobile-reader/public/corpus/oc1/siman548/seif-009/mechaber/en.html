<i data-commentator="Be'er HaGolah" data-label="צ" data-order="19"></i>9. Regarding the holiday nullifying the shloshim period, this is only applicable to dead people that are not parents, for which it is <i data-commentator="Mishnah Berurah" data-label="לד"></i> forbidden to get a haircut until his friends scorn him. Even if the holiday occurs after the shloshim period, this practice is not nullified.
