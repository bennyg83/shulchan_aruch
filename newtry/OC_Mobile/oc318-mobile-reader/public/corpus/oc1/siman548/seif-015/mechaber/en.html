<i data-commentator="Be'er HaGolah" data-label="ה" data-order="28"></i>15. If one practiced mourning for one hour before Yom Kippur, the requirement for shiva <i data-commentator="Ba'er Hetev" data-order="14"></i> <i data-commentator="Sha'arei Teshuvah" data-order="14"></i> is nullified because of Yom Kippur. Shloshim will be nullified by the onset of Sukkot. He can <i data-commentator="Mishnah Berurah" data-label="מה"></i> shave the day before sukkot.
