<i data-commentator="Be'er HaGolah" data-label="י" data-order="33"></i>19. If one hears recent news <i data-commentator="Ba'er Hetev" data-order="15"></i> of a relative's death on Shabbat, Shabbat counts as <i data-commentator="Mishnah Berurah" data-label="נב"></i> the first day. The following <i data-commentator="Turei Zahav" data-order="5"></i> day he tears, and Friday will be the seventh day of mourning.
