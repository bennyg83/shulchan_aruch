<b>(Seif katan 1) He asks, etc.</b> And Maharam, etc., in the gloss on the Rif. It should read: in the glosses of Mordechai.<br />
<b>Not between the sections, etc.</b> In Sefer Eliyah Rabbah he wrote that it implies that when one is not standing between the sections, it is permitted to give greeting in the synagogue.
