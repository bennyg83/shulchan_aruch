<i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> If one stopped out of fear or honor after saying emet, or finished before the chazzan and joined &quot;Hashem Elokeikhem&quot; with emet and is <i data-commentator="Mishnah Berurah" data-label="לא"></i> waiting for the chazzan to begin and say it with him — he need not return and say emet again.
