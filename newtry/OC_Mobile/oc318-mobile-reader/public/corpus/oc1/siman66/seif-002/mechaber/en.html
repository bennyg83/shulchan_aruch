<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יד"></i> If one forgot to don tzitzit or tefillin, one may interrupt between sections [of <i data-commentator="Mishnah Berurah" data-label="טו"></i> Shema or its blessings] to don them and bless on them.<small>And there <i data-commentator="Magen Avraham" data-order="4"></i> are those who say one should not bless on them until after the Amidah;<i data-commentator="Turei Zahav" data-order="2"></i> and such is the custom regarding a <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Sha'arei Teshuvah" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> tallit (Beit Yosef).</small>
