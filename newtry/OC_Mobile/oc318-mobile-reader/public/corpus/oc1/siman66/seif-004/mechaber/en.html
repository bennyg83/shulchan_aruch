<i data-commentator="Ateret Zekenim" data-label="♦" data-order="5"></i> If a kohen was reciting Keriat <i data-commentator="Mishnah Berurah" data-label="כד"></i> Shema and they called him to read from the Torah: there is an opinion' <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> that says he interrupts, and <i data-commentator="Mishnah Berurah" data-label="כה"></i> there is an opinion <i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> that says he does not' <i data-commentator="Magen Avraham" data-order="8"></i> interrupt. And the <i data-commentator="Ba'er Hetev" data-order="10"></i> <i data-commentator="Sha'arei Teshuvah" data-order="10"></i> halachah is according <i data-commentator="Mishnah Berurah" data-label="כו"></i> to his words (i.e., the latter).
