<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> Even <i data-commentator="Mishnah Berurah" data-label="יח"></i> if the fruits were not before him at the time he blessed over <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Turei Zahav" data-order="4"></i> the bread — since they come to accompany the bread, they require no <i data-commentator="Mishnah Berurah" data-label="יט"></i> blessing at all.
