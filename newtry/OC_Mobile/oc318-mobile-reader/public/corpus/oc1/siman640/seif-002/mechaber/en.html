<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i>2. A minor that does not need his mother (when sleeping), when he is about <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> a boy <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Sha'arei Teshuvah" data-order="2"></i> of 5 or a boy of <i data-commentator="Magen Avraham" data-order="3"></i>6, is obligated in (the Mitzvah of) Sukkah from Divrei Sofrim (words of the scribes, Rabbinical) in <i data-commentator="Mishnah Berurah" data-label="ה"></i> order to train him in the Mitzvos.
