<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i>6. One is permitted to tie a rope to pen in a cow even <i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> when tied' <i data-commentator="Magen Avraham" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="ל"></i> to' <i data-commentator="Ba'er Hetev" data-order="14"></i> both sides of the opening and we are not afraid lest one unties one end and lets the animal out on that side and leaves the other end tied.
