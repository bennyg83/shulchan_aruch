<i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> A bow is permitted, for it is not a knot:<small>And <i data-commentator="Turei Zahav" data-order="7"></i> even if he makes <i data-commentator="Ba'er Hetev" data-order="13"></i> one knot below, the <i data-commentator="Magen Avraham" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="כט"></i> practice is to permit it (Agur).</small>
