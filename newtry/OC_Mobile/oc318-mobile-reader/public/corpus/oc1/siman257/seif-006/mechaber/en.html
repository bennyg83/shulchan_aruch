<i data-commentator="Magen Avraham" data-order="15"></i> <i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="לא"></i> One is allowed to store something <i data-commentator="Mishnah Berurah" data-label="לב"></i> cold in something that does not add heat so that it doesn’t get even colder or in order to take away <i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> its chill. But if it does add heat, even to store something completely cold even prior to Shabbos it is forbidden.
