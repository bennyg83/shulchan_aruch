<b> וכן עיקר</b> -  שכן פסקו כל הפוסקים ושיטת היש מקילין היא שיטה יחידאה:<br>
<b> כל צרכו</b> -  עיין במגן אברהם שכתב דלדעת י"א אפילו נתבשל כמאב"ד ועיין בא"ר שחולק עליו ועיין בתו"ש מה שכתב בזה ולבסוף מסיק גם הוא דבכונה נקט הרמ"א כ"צ לאשמעינן דבפחות מזה אף במקום שנהגו להקל יש למחות בידם מאחר דגם בשהיה יש דעות בזה ע"ש:
