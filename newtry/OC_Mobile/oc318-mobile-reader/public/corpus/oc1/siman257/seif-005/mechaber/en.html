<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="כח"></i> If one transfers food on Shabbos from the pot in which it was <i data-commentator="Mishnah Berurah" data-label="כט"></i> cooked to another pot,<i data-commentator="Magen Avraham" data-order="14"></i> <i data-commentator="Turei Zahav" data-order="5"></i>[then] Hatmana <i data-commentator="Ba'er Hetev" data-order="8"></i> may be done <i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="ל"></i> with a substance that does not add heat.
