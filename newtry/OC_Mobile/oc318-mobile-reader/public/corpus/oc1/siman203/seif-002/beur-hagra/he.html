<b>ס"ב דלא כו'. </b>כ"כ המרדכי והטור טעם על התותים וכ' גאון דהכי איתא בתוספתא וכ"כ הרא"ש בשם התוספתא וז"ל התוספתא ספ"ג דכלאים זה הכלל כל המוציא עליו מעיקרו ה"ז ירק וכל שאינו מוציא עליו מעיקרו ה"ז אילן וירושלמי ספ"ה דכלאים תני ר"ח בר פפא את שהוא עולה מן גזעו מין אילן מן שרשיו מין ירק ועי"ד סי' רצ"ו סט"ו:
