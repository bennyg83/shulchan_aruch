<i data-commentator="Be'er HaGolah" data-label="ו" data-order="7"></i> On ginger that <i data-commentator="Mishnah Berurah" data-label="ח"></i> they compound when it is moist — borei peri haAdamah; and it appears the same if <i data-commentator="Mishnah Berurah" data-label="ט"></i> they compound it dry, since through this it <i data-commentator="Mishnah Berurah" data-label="י"></i> is fit for eating <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Sha'arei Teshuvah" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="יא"></i>— the ginger is primary and one blesses upon it borei peri haAdamah.
