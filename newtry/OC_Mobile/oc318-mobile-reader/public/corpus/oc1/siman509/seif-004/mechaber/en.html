<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> It is <i data-commentator="Mishnah Berurah" data-label="כ"></i> permitted to cut on a Festival the bindings of young <i data-commentator="Mishnah Berurah" data-label="כא"></i> goats and fowl <i data-commentator="Mishnah Berurah" data-label="כב"></i> that are tied, and the threads <i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="כג"></i> that are sewn, and likewise one may burn a wick or rag with which the fowl is tied.
