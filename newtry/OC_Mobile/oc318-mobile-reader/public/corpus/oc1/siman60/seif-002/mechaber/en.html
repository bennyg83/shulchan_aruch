<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> If one recited the Shema without a blessing, one has fulfilled the obligation of <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> reciting the Shema. [Nonetheless,] one [later] goes <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Sha'arei Teshuvah" data-order="1"></i> back and recites the blessings without the Shema; however, it seems to me that it is proper to go back and recite <i data-commentator="Mishnah Berurah" data-label="ד"></i> the [entire] Shema with the blessings.
