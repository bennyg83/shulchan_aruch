<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> If one recited Keriat Shema without a berakhah, one has fulfilled the <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> obligation of Keriat Shema. [Nonetheless,] one returns <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Sha'arei Teshuvah" data-order="1"></i> and recites the berakhot without Keriat Shema; however, it seems to me that it is proper to return and recite <i data-commentator="Mishnah Berurah" data-label="ד"></i> Keriat Shema with the berakhot.
