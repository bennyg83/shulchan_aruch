<i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> The [wrong] order of the <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> berakhot does not impede;<i data-commentator="Magen Avraham" data-order="2"></i> therefore, if one recited <i data-commentator="Mishnah Berurah" data-label="ה"></i> the second before the first, one <i data-commentator="Mishnah Berurah" data-label="ו"></i> has fulfilled the obligation of the berakhot.
