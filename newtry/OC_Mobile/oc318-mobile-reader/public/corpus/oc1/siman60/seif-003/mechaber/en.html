<i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> The [wrong] order of the blessings <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> does not hold one back <i data-commentator="Magen Avraham" data-order="2"></i>[from fulfilling the commandment], therefore,<i data-commentator="Mishnah Berurah" data-label="ה"></i> if one recites the second [blessing] before the <i data-commentator="Mishnah Berurah" data-label="ו"></i> first, one has fulfilled one's obligation of [reciting the] blessings.
