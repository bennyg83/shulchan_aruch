<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="ז"></i> There are those who hold that the commandments do not require intention, and there are <i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> those who <i data-commentator="Mishnah Berurah" data-label="ח"></i> hold that they do need intention in order <i data-commentator="Mishnah Berurah" data-label="ט"></i> to fulfill the doing of that commandment - and such [i.e. the <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Sha'arei Teshuvah" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> latter] is the [correct] halacha.
