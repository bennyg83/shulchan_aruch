<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="ז"></i> There are those who hold that mitzvot do not require kavanah,<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> and <i data-commentator="Mishnah Berurah" data-label="ח"></i> there are those who hold that <i data-commentator="Mishnah Berurah" data-label="ט"></i> they require kavanah to fulfill in doing that mitzvah—and <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Sha'arei Teshuvah" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> such is the halachah.
