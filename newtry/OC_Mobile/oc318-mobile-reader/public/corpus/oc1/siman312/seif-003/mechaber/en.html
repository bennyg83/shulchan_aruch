<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> A clod upon which grass grew — it <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> is permitted <i data-commentator="Ba'er Hetev" data-order="3"></i> to wipe with <i data-commentator="Mishnah Berurah" data-label="יג"></i> it, and we are not concerned lest they be <i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> uprooted, for even if they are uprooted there is no prohibition, for it is a davar she'eino mitkavein.
