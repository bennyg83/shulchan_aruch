<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> A pebble upon which grass has grown —<i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> it is <i data-commentator="Ba'er Hetev" data-order="3"></i> permitted to wipe <i data-commentator="Mishnah Berurah" data-label="יג"></i> with it, and we are not concerned that the grass <i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> may be pulled off, for even if it is pulled off there is no violation since it is an unintended act.
