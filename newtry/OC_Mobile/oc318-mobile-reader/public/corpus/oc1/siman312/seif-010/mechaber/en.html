<i data-commentator="Be'er HaGolah" data-label="ש" data-order="21"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> Large stones that are arranged in the shape of a hollow seat, upon which one sits in fields in a place designated as a bathroom — it is permitted to <i data-commentator="Magen Avraham" data-order="10"></i> arrange them,<i data-commentator="Ba'er Hetev" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> and even though it is a temporary construction the Sages did not decree against it out of concern for human dignity.
