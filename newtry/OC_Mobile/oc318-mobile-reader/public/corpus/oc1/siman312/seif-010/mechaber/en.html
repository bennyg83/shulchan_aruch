<i data-commentator="Be'er HaGolah" data-label="ש" data-order="21"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> Large stones that they shape like a hollow seat, upon which one sits in fields in the place designated for a bathroom — it is permitted <i data-commentator="Magen Avraham" data-order="10"></i> to shape <i data-commentator="Ba'er Hetev" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> them, and even though it is temporary building the Sages did not decree against it because of human dignity.
