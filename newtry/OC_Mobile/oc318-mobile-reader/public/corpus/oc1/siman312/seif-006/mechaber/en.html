<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> On Shabbat one may wipe with moist grass even if they are attached, provided he does not <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יט"></i> move <i data-commentator="Ba'er Hetev" data-order="4"></i> them. And regarding benefit from something attached there is no concern, for <i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> they said this only regarding a tree but not regarding vegetation.
