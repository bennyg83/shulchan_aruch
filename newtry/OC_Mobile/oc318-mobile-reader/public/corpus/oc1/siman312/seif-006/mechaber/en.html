<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> One may wipe on Shabbat with moist grass even if it is still attached to the ground, provided one <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יט"></i> does not <i data-commentator="Ba'er Hetev" data-order="4"></i> move it. There is no concern of using something attached to the ground,<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> since that was only said regarding a tree but not regarding vegetation.
