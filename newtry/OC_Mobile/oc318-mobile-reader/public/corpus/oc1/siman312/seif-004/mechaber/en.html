<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> One may not move a lump of earth to wipe with it, because <i data-commentator="Mishnah Berurah" data-label="יד"></i> it is not fit for wiping since it crumbles. It is forbidden to wipe with pottery <i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> even on a weekday because of danger, lest the teeth of the krekhesa be detached (explained: the intestines hanging at the mouth of the ring).<small>(.</small>
