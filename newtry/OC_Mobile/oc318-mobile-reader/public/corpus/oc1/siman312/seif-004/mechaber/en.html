<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> One may not handle a clod of earth for wiping <i data-commentator="Mishnah Berurah" data-label="יד"></i> since it is not suitable for wiping as it crumbles. It is <i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> forbidden to wipe with a shard even on a weekday due to danger, lest it tear the rectal ligaments.<small>(.</small>
