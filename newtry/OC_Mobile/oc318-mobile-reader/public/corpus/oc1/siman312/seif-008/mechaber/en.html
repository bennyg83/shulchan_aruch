<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> <i data-commentator="Mishnah Berurah" data-label="כב"></i> To stimulate with a rod at the mouth of the ring — its law is like a clod, that he should hold it only with two fingers. And <i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i> it is forbidden to go out with a <i data-commentator="Magen Avraham" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כג"></i> rod even if it is <i data-commentator="Ba'er Hetev" data-order="6"></i> inserted entirely within the body.
