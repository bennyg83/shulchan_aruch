<i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> It is forbidden to relieve <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> oneself in <i data-commentator="Ba'er Hetev" data-order="7"></i> a plowed field on Shabbat, lest <i data-commentator="Magen Avraham" data-order="9"></i> he come to level furrows.<i data-commentator="Be'er HaGolah" data-label="ר" data-order="20"></i> And if it was another's field — forbidden even on a weekday, because he tramples his plowing and ruins it.
