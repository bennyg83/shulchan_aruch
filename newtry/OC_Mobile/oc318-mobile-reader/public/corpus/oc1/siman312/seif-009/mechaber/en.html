<i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> It is forbidden to relieve <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> oneself in <i data-commentator="Ba'er Hetev" data-order="7"></i> a plowed field on Shabbat, lest one <i data-commentator="Magen Avraham" data-order="9"></i> come to fill in holes. And <i data-commentator="Be'er HaGolah" data-label="ר" data-order="20"></i> if it is another person's field, even on a weekday it is forbidden since one treads upon his furrows and damages them.
