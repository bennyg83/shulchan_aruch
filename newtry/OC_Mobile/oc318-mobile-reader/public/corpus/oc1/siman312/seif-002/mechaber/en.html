If rain fell on the <i data-commentator="Mishnah Berurah" data-label="ט"></i> stones and they sank <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> into the ground —<i data-commentator="Mishnah Berurah" data-label="י"></i> if their impression is recognizable, it is permitted to take them in order <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> to wipe, and there is <i data-commentator="Mishnah Berurah" data-label="יא"></i> no concern of demolishing nor of grinding.
