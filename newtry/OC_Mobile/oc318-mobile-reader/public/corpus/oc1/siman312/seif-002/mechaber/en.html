If rain fell on stones <i data-commentator="Mishnah Berurah" data-label="ט"></i> and they sank <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> into the ground <i data-commentator="Mishnah Berurah" data-label="י"></i>— if their impression is visible it is permitted to take <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> them for wiping, and there <i data-commentator="Mishnah Berurah" data-label="יא"></i> is no concern of demolishing or grinding.
