<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ז"></i> It is not proper to say supplications before Yehi <i data-commentator="Ba'er Hetev" data-order="3"></i> L'Ratzon; rather, after finishing the Shemoneh Esrei one immediately <i data-commentator="Mishnah Berurah" data-label="ח"></i> says Yehi L'Ratzon; and if one comes to return and say it again after the supplications, permission is in his hands.
