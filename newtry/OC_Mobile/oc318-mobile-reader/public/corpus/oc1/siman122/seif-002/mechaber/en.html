<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ז"></i> It is not proper to say supplications before &quot;Yih'yu L'Ratzon&quot;,<i data-commentator="Ba'er Hetev" data-order="3"></i> rather, after the completion of the Shemoneh Esrei, one immediately says <i data-commentator="Mishnah Berurah" data-label="ח"></i>&quot;Yih'yu L'Ratzon&quot;, and if one wants to go back and say it another time after the supplications, the permission [to do so] is in one's hands.
