<b>Se'if 1: It is permitted, etc.</b> According to the Rosh's explanation there.<br />
<b>And it is permitted, etc.</b> Like spinning tzitzis; and see Tosafot, [Moed Katan] 19a, s.v. "and she spins," unlike the explanation of Tosafot [in] Terumas HaDeshen, siman 87; and see siman 545, se'if 3, in the gloss.
