<i data-commentator="Be'er HaGolah" data-label="ב" data-order="24"></i> There is one who says [regarding] holy silver vessels <i data-commentator="Mishnah Berurah" data-label="צד"></i> which they <i data-commentator="Magen Avraham" data-order="43"></i> were accustomed to always bring to the synagogue on holidays,<i data-commentator="Mishnah Berurah" data-label="צה"></i> that they may not be deconsecrated <i data-commentator="Ba'er Hetev" data-order="28"></i> <i data-commentator="Sha'arei Teshuvah" data-order="28"></i> and sold. And <i data-commentator="Eshel Avraham" data-label="א" data-order="4"></i> the congregation may seize them, such that they remain sanctified property after the <i data-commentator="Eshel Avraham" data-label="ב" data-order="5"></i> death of the one who sanctified them.
