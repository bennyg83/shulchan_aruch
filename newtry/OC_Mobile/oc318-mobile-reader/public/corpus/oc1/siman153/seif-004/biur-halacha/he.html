<b> יש אוסרים</b> -  עיין מ"ב ופשוט דמיירי שיש להם עוד ביהכ"נ להתפלל דאל"כ נכון יותר שיקנו ביהכ"נ כדי שיהיה להם מקום קבוע להתפלל וכמו שכתבתי במ"ב סק"ג עי"ש:<br>
<b> ויש מתירים</b> -  עיין בפמ"ג שמצדד דהכי הלכתא מדכתב המחבר להאי יש מתירין בסופו והוא מילתא דרבנן אבל במאירי ראיתי שכתב דרוב הגאונים סוברין דצריך עלוי דוקא:
