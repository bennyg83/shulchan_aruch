<b>Students.</b> This means where they have another synagogue. Taz.<br />
<b>Orphans.</b> The same applies to orphan girls. See Magen Avraham and Even HaEzer siman 1, seif katan 2. Likewise, one may sell a Torah scroll for redeeming captives. See Beit Yosef in Yoreh Deah siman 252 and Magen Avraham.
