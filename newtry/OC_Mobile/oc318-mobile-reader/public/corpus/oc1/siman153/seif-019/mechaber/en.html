<i data-commentator="Be'er HaGolah" data-label="ג" data-order="25"></i> There is one who says <i data-commentator="Mishnah Berurah" data-label="צו"></i> that if after the death of a person, a <i data-commentator="Turei Zahav" data-order="14"></i> written document is found [stating] that he dedicated vessels, yet there are no witnesses to it and he did not deliver it to the congregation - nevertheless,<i data-commentator="Magen Avraham" data-order="44"></i> <i data-commentator="Mishnah Berurah" data-label="צז"></i> it becomes sanctified property.
