<i data-commentator="Be'er HaGolah" data-label="ש" data-order="21"></i> <i data-commentator="Mishnah Berurah" data-label="פו"></i> A man may not forbid his section of the synagogue, nor of the scrolls [to others]. And if <i data-commentator="Eshel Avraham" data-label="א" data-order="3"></i> he forbids [them],<i data-commentator="Magen Avraham" data-order="38"></i> <i data-commentator="Mishnah Berurah" data-label="פז"></i> it is <i data-commentator="Ba'er Hetev" data-order="26"></i> <i data-commentator="Sha'arei Teshuvah" data-order="26"></i> nothing (ineffective).
