<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> When one recites the Recitation of the Sh'ma <i data-commentator="Magen Avraham" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> on one's bed (ie. before going to sleep), it is permitted to recite the entire passage and to [then] repeat <i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> it. And there are those that say that also with this, one needs to be careful about saying the first verse<small>Rem&quot;a: two times.</small>
