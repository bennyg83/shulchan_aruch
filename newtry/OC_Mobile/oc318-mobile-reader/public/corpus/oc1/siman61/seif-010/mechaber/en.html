<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> When one recites Keriat Shema on <i data-commentator="Magen Avraham" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> one's bed, it is permitted to recite the entire passage and to repeat it. And there <i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> are those who say that one should also be careful here not to say the first verse<small>two times.</small>
