<i data-commentator="Be'er HaGolah" data-label="ז" data-order="29"></i> One needs to recite Sh'ma with the cantillation (trop/ta'amim), just like they are [written when reading] in the Torah.<small>Rem&quot;a: But the custom is not <i data-commentator="Mishnah Berurah" data-label="לז"></i> like this in these lands. And in any case, those who <i data-commentator="Magen Avraham" data-order="14"></i> are precise [in general regarding mitzvot] are strict <i data-commentator="Ba'er Hetev" data-order="14"></i> <i data-commentator="Sha'arei Teshuvah" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="לח"></i> about this.</small>
