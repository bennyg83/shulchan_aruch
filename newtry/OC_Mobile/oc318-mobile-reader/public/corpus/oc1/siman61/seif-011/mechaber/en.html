<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> Those who say the verse Shema Yisrael twice in the night watch during Selichot, and on Yom Kippur in the Ne'ilah prayer—they should be taught not <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> to say it.
