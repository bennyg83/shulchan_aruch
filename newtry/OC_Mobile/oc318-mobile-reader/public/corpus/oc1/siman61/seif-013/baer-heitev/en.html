<b>Baruch shem kevod malchuso le'olam va'ed.</b> If he did not say ‘Baruch shem kevod malchuso le'olam va'ed,’ we do not make him go back. Shiltei Giborim, Bach. But the Levush wrote that even if he said it but did not say it with intent, he must go back; so it implies at the beginning of siman 66.
