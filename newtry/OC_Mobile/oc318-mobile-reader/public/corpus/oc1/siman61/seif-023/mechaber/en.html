<i data-commentator="Be'er HaGolah" data-label="ו" data-order="28"></i> One must be precise not to weaken the strong nor strengthen the weak, and not to rest <i data-commentator="Magen Avraham" data-order="13"></i> the moving shva nor move the resting <i data-commentator="Ba'er Hetev" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="לו"></i> shva.
