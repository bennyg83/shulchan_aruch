<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="6"></i> The custom is to place <i data-commentator="Ba'er Hetev" data-order="6"></i> <i data-commentator="Sha'arei Teshuvah" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יז"></i> one's hands on one's face during the recitation of the first verse, so that one does not look at something else that prevents one from having kavanah.
