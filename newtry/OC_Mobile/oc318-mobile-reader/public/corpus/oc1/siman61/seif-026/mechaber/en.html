<i data-commentator="Be'er HaGolah" data-label="ט" data-order="31"></i> <i data-commentator="Mishnah Berurah" data-label="מ"></i> There are those who practice to recite the Recitation of the Sh'ma in a loud voice and there are those who apractice to recite <i data-commentator="Magen Avraham" data-order="16"></i> it in a whisper. Gloss: And in any case, they say the first verse in a loud voice, and this [is what we] how we practice (Kol Bo).<small>]:</small>
