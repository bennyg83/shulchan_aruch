<i data-commentator="Be'er HaGolah" data-label="ט" data-order="31"></i> <i data-commentator="Mishnah Berurah" data-label="מ"></i> There are those who practice to recite Keriat Shema in a <i data-commentator="Magen Avraham" data-order="16"></i> loud voice, and there are those who practice to recite it in a whisper.<small>Nevertheless, they say the first verse in a loud voice, and so is the custom (Kol Bo).]:</small>
