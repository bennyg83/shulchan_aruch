<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i>[The verse states:] &quot;Which I have commanded you today,&quot; (Deuteronomy 6:6) - which teaches that every day it should appear in your eyes as if it was new, and not like someone who already heard it many times and is [therefore] not precious <i data-commentator="Mishnah Berurah" data-label="ה"></i> to him.
