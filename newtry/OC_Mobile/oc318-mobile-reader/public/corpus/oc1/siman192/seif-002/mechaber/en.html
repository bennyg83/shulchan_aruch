<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> If the one leading <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Sha'arei Teshuvah" data-order="5"></i> zimun erred with ten and the responders did not mention Eloheinu,<i data-commentator="Mishnah Berurah" data-label="י"></i> they cannot return; but if they have not yet answered after him, he should return <i data-commentator="Mishnah Berurah" data-label="יא"></i> and lead zimun with the Name.
