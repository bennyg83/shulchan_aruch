<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> If some of them ate in the house and some outside the house — if the one blessing sits on <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> the threshold of the house, he combines them.
