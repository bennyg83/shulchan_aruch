<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i>2. When some of them ate in the house and some of them ate outside the house, if the one leading the blessing sits on <i data-commentator="Magen Avraham" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> the threshold of the house, he combines the two groups.
