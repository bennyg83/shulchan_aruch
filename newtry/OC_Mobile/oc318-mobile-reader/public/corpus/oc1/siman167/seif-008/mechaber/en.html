<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> If one forgot and ate without reciting the HaMotzi blessing, then if he remembers during the meal, he should recite' <i data-commentator="Magen Avraham" data-order="20"></i> <i data-commentator="Mishnah Berurah" data-label="מז"></i> the blessing. But if he only remembers after he <i data-commentator="Turei Zahav" data-order="9"></i> has finished his meal, he does <i data-commentator="Magen Avraham" data-order="21"></i> <i data-commentator="Mishnah Berurah" data-label="מח"></i> not recite <i data-commentator="Ba'er Hetev" data-order="12"></i> the blessing.
