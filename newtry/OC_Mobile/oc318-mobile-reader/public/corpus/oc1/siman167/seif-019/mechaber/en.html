<i data-commentator="Magen Avraham" data-order="40"></i> <i data-commentator="Be'er HaGolah" data-label="ט" data-order="31"></i> One who is not eating <i data-commentator="Mishnah Berurah" data-label="צא"></i> cannot recite the HaMotzi blessing <i data-commentator="Mishnah Berurah" data-label="צב"></i> to fulfill <i data-commentator="Ba'er Hetev" data-order="24"></i> the obligation of those eating. However, he can <i data-commentator="Turei Zahav" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="צג"></i> recite <i data-commentator="Ba'er Hetev" data-order="25"></i> <i data-commentator="Be'er HaGolah" data-label="י" data-order="32"></i> it for children, even if he is not eating with them, in order to train them in the mitzvah.
