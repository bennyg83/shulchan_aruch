<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> If,<i data-commentator="Mishnah Berurah" data-label="נ"></i> instead of the HaMotzi blessing, he recited Shehakol <i data-commentator="Turei Zahav" data-order="11"></i> Nihyah Bidvaro,<i data-commentator="Mishnah Berurah" data-label="נא"></i> or said Barich Rachmana Malka Marei Dehai Pita (&quot;Blessed is the Merciful <i data-commentator="Magen Avraham" data-order="22"></i> One, King, Master <i data-commentator="Ba'er Hetev" data-order="13"></i> <i data-commentator="Sha'arei Teshuvah" data-order="13"></i> of this bread&quot;) —<i data-commentator="Mishnah Berurah" data-label="נב"></i> he has fulfilled his <i data-commentator="Mishnah Berurah" data-label="נג"></i> obligation.
