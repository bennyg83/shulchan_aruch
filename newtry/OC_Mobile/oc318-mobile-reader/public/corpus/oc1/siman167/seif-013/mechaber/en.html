<i data-commentator="Be'er HaGolah" data-label="ת" data-order="22"></i> In a case where they did not establish a fixed place—where we say that each one recites the blessing for himself—if the one reciting the <i data-commentator="Turei Zahav" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="סה"></i> blessing intended to fulfill the obligation on their behalf, and they intended to be fulfilled by his blessing, then they have <i data-commentator="Magen Avraham" data-order="28"></i> <i data-commentator="Ba'er Hetev" data-order="16"></i> fulfilled their obligation.
