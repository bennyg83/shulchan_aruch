<i data-commentator="Mishnah Berurah" data-label="פו"></i> <i data-commentator="Be'er HaGolah" data-label="ז" data-order="29"></i> The one breaking <i data-commentator="Mishnah Berurah" data-label="פז"></i> the bread should first extend his hand to the dish to eat. However, if he wishes to show respect to someone greater than him,<i data-commentator="Magen Avraham" data-order="37"></i> he is permitted to give the portion to that person first.
