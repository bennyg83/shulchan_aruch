<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Turei Zahav" data-order="6"></i> Soldiers who gave their flour to a Jew to bake bread for them — if they do not object when the Jew gives some of <i data-commentator="Mishnah Berurah" data-label="יג"></i> it to a child, it is <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="יד"></i> permitted to bake for <i data-commentator="Mishnah Berurah" data-label="טו"></i> them.
