<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> A bird that was trampled underfoot where there is concern that its organs were crushed —<i data-commentator="Mishnah Berurah" data-label="מו"></i> and therefore requires waiting a full day and examination after slaughter — may be slaughtered' <i data-commentator="Turei Zahav" data-order="7"></i> on Yom <i data-commentator="Mishnah Berurah" data-label="מז"></i> Tov, and we are <i data-commentator="Magen Avraham" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="מח"></i> not concerned that it may be found to <i data-commentator="Ba'er Hetev" data-order="10"></i> <i data-commentator="Sha'arei Teshuvah" data-order="10"></i> be a <i data-commentator="Turei Zahav" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="מט"></i> trefah, even though a defect has arisen in it.
