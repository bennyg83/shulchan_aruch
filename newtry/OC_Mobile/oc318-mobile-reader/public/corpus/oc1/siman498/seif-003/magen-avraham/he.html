<b>אין שוחטין</b>. ולמקילין בססי' תצ"ה מותר לשחוט אם לא הביאו בשבילו (טור) וביש"ש כ' דלכ"ע אסור:<br>
<b>אסורות</b>. היינו בעיר שאין רובה עכו"ם דאמרינן מסתמא הביאה לצורך ישראל:<br>
<b>ספק מותרות</b>. צ"ל דמיירי בעכו"ם השרוי עמו בעיר ובהמות מצויות לו תוך התחום דאל"כ אסור כמ"ש סי' תקט"ו ס"ז אבל הלשון לא משמע כן וע' בב"י וצ"ע:
