<i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> <i data-commentator="Mishnah Berurah" data-label="נז"></i> If a mother animal and her offspring both fell into a pit, one lifts out the first intending <i data-commentator="Magen Avraham" data-order="20"></i> <i data-commentator="Mishnah Berurah" data-label="נח"></i> to slaughter it but does not slaughter <i data-commentator="Ba'er Hetev" data-order="12"></i> it, then cunningly lifts out the second <i data-commentator="Mishnah Berurah" data-label="נט"></i>— whichever one he wishes he may slaughter.
