<i data-commentator="Be'er HaGolah" data-label="ד" data-order="26"></i> <i data-commentator="Turei Zahav" data-order="17"></i> If one <i data-commentator="Magen Avraham" data-order="32"></i> <i data-commentator="Ba'er Hetev" data-order="18"></i> brought a large <i data-commentator="Mishnah Berurah" data-label="פא"></i> quantity of earth into his house for <i data-commentator="Mishnah Berurah" data-label="פב"></i> his garden and it is piled in one place, one <i data-commentator="Mishnah Berurah" data-label="פג"></i> may cover with it — since as long as it is piled up he <i data-commentator="Mishnah Berurah" data-label="פד"></i> has it in mind for whatever he needs. But if he brought in only a basketful for his garden, it is voided since it is so little.
