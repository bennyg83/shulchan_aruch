<i data-commentator="Turei Zahav" data-order="6"></i> <i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="מג"></i> If one slaughtered an <i data-commentator="Ba'er Hetev" data-order="9"></i> animal in the field, he may not bring it on a pole or carrying frame as one does on <i data-commentator="Magen Avraham" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="מד"></i> a weekday, but must bring <i data-commentator="Mishnah Berurah" data-label="מה"></i> it by hand limb by limb.
