<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> If they rented from the <i data-commentator="Mishnah Berurah" data-label="כח"></i> non-Jew for a <i data-commentator="Mishnah Berurah" data-label="כט"></i> specified time and within that time the non-Jew rented his dwelling <i data-commentator="Turei Zahav" data-order="10"></i> to another, the first rental suffices.
