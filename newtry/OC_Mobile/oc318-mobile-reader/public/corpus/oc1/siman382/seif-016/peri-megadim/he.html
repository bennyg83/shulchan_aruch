<b>וישראל</b> עט״ז עירובין ס״ה ועב״י בשם הג״א ואם שכר החיצון רשות דריסת רגל העכו״ם א״צ לערב עם ישראל פנימי רגל המותרת במקומה יע״ש ומיהו כי לא שכר מעכו״ם אסור החיצונה אע״ג דבעינן ב׳ ישראלים אוסרים זע״ז כאן נמי אם נצרף עכו״ם הוי אוסרים ועתו״ש. ועא״ר אות י״ט יישב קצת דברי הלבוש ולדינא הסכים דפנימי מותר:
