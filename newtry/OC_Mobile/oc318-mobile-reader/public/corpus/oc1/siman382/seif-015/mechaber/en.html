<i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i> <i data-commentator="Mishnah Berurah" data-label="נ"></i> If an Israelite and a gentile dwell in one house—they must rent from the gentile and make an eruv with the Israelite:<small>If each has a dwelling by itself—and the same if two gentiles <i data-commentator="Be'er HaGolah" data-label="•" data-order="19"></i>(dwell thus in one <i data-commentator="Mishnah Berurah" data-label="נא"></i> house—they must rent (from both of them) (Beit Yosef in the name of Hagahot Alfasi):.</small>
