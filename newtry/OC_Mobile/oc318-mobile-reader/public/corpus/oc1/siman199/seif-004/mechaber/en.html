<i data-commentator="Mishnah Berurah" data-label="ג"></i>4. A gentile is not included in a zimun.<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> Even a convert who <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> was circumcised but <i data-commentator="Mishnah Berurah" data-label="ה"></i> did not immerse may not be included in a zimun. Someone who is a full fledged <i data-commentator="Mishnah Berurah" data-label="ו"></i> convert is included in a zimun and <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> he may recite birkas hamazon including the <i data-commentator="Mishnah Berurah" data-label="ז"></i> words Al Shehinchalta La'avoteinu
