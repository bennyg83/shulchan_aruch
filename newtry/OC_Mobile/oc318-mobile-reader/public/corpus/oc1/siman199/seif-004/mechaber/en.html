<i data-commentator="Mishnah Berurah" data-label="ג"></i> A gentile—they do not invite zimun on him.<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> Even a convert who <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> was circumcised and <i data-commentator="Mishnah Berurah" data-label="ה"></i> did not immerse—they do not invite zimun on him. But a complete convert—they invite zimun <i data-commentator="Mishnah Berurah" data-label="ו"></i> on him; and he may bless <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> birkat hamazon and say al shehinchalta <i data-commentator="Mishnah Berurah" data-label="ז"></i> to our forefathers.
