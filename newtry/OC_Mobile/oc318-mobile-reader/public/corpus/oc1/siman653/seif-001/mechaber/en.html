<b>It is forbidden to smell the myrtle. Containing 2 paragraphs</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Turei Zahav" data-order="1"></i> It is forbidden to <i data-commentator="Mishnah Berurah" data-label="א"></i> smell the <i data-commentator="Ba'er Hetev" data-order="1"></i> myrtle that <i data-commentator="Mishnah Berurah" data-label="ב"></i> is used for the <i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> mitzvah. Technically, it is permitted to smell the etrog, but because there is <i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> a disagreement about whether or not to bless on it,<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> one should refrain <i data-commentator="Mishnah Berurah" data-label="ג"></i> from smelling it.
