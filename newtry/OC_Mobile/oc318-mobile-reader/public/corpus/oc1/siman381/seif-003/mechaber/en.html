<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> There is renunciation of domain <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="יז"></i> in a ruin — if there were two houses with a ruin between them <i data-commentator="Mishnah Berurah" data-label="יח"></i> belonging to both, and they forgot and did not make an eruv, one may renounce his domain to the other and the other will be permitted in it.
