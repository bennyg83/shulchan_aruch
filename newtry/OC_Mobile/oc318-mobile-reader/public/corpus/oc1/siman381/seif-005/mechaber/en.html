<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> Two houses on two sides of a public domain that non-Jews enclosed with a partition on Shabbat, creating something like a courtyard to which both houses open, making them restrict one another —<i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Magen Avraham" data-order="8"></i> <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> they cannot renounce domain to each other.
