<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> An inheritor may renounce domain — if the deceased had not made an eruv and died on <i data-commentator="Mishnah Berurah" data-label="כו"></i> Shabbat and the inheritor comes to live in <i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> the courtyard and <i data-commentator="Mishnah Berurah" data-label="כז"></i> restricts, he may renounce his domain.
