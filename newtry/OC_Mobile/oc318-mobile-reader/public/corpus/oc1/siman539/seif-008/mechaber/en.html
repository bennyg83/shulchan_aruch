<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i>8. A Gentile who pays back a Jew (on Chol HaMoed) wine for his (loan) obligation, it is permitted <i data-commentator="Mishnah Berurah" data-label="כח"></i> to accept from him because it is like saving from his hand (that is a Devar HaAvid - a matter of Loss).
