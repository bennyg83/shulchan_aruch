<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i>6. A found object (on Chol Hamoed) is forbidden to exert and scavenge for it. For instance, a river that flooded fish on its bank. It is forbidden to gather them in <i data-commentator="Turei Zahav" data-order="4"></i> order to preserve them unless they are fit to eat from them on the Festival.
