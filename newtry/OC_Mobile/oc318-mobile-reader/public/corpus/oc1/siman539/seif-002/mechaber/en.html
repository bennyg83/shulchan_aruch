<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i>2. He who loans his friend coin(s) is <i data-commentator="Mishnah Berurah" data-label="ז"></i> permitted to demand on Chol Hamoed to collect (on <i data-commentator="Mishnah Berurah" data-label="ח"></i> what he is owed). And <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> it goes without saying that it is permitted to collect an obligation from a gentile.
