<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> If one wants to drink <i data-commentator="Mishnah Berurah" data-label="יב"></i> many cups, he has <i data-commentator="Chok Yaakov" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i> permission to do so.<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> Nevertheless,<i data-commentator="Mishnah Berurah" data-label="יד"></i> it's proper not to <i data-commentator="Mishnah Berurah" data-label="טו"></i> drink between the first and second cups, if there's no great need, so that he <i data-commentator="Chok Yaakov" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> won't get drunk and be prevented from performing the Seder and the reading of the Hagada.
