<i data-commentator="Be'er HaGolah" data-label="ע" data-order="17"></i> A <i data-commentator="Magen Avraham" data-order="10"></i> person who never circumcised —<i data-commentator="Ba'er Hetev" data-order="7"></i> <i data-commentator="Sha'arei Teshuvah" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="לו"></i> he shall not <i data-commentator="Eshel Avraham" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="לז"></i> circumcise on Shabbat; but if he already circumcised once —<i data-commentator="Mishnah Berurah" data-label="לח"></i> permitted to circumcise on Shabbat, even <i data-commentator="Mishnah Berurah" data-label="לט"></i> if he is the father of the child:<small>And see further laws of milah Tur Yoreh De'ah siman 266:</small>
