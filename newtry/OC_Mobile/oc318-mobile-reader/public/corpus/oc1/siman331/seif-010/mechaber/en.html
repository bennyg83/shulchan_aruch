<i data-commentator="Be'er HaGolah" data-label="ע" data-order="17"></i>10. A <i data-commentator="Magen Avraham" data-order="10"></i> man who has never performed a circumcision <i data-commentator="Ba'er Hetev" data-order="7"></i> <i data-commentator="Sha'arei Teshuvah" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="לו"></i> should not circumcise on <i data-commentator="Eshel Avraham" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="לז"></i> Shabbat. However, if he has performed one circumcision, he is allowed to circumcise on <i data-commentator="Mishnah Berurah" data-label="לח"></i> Shabbat, even if he is the father of the <i data-commentator="Mishnah Berurah" data-label="לט"></i> infant. Rem&quot;a: See more laws of circumcision in Yoreh Deah Chapter 266.<small></small>
