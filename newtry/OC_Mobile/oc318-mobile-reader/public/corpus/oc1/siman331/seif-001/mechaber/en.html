<b>דין מילה בשבת. ובו י סעיפים:</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i>1. We perform all that is needed for <i data-commentator="Mishnah Berurah" data-label="א"></i> circumcision on <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> Shabbat, including circumcising, periah [pulling back <i data-commentator="Mishnah Berurah" data-label="ב"></i> the foreskin], metitza [sucking the blood], and putting cumin <i data-commentator="Mishnah Berurah" data-label="ג"></i> on it.
