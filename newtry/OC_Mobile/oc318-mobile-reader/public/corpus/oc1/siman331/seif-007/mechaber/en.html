<i data-commentator="Be'er HaGolah" data-label="מ" data-order="14"></i>7. If one <i data-commentator="Mishnah Berurah" data-label="כג"></i> does not have cumin powdered before <i data-commentator="Mishnah Berurah" data-label="כד"></i> Shabbat, he should not powder it [on Shabbat] but should chew it with his teeth. If he didn't mix wine and <i data-commentator="Mishnah Berurah" data-label="כה"></i> oil yesterday to put on <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> it,<i data-commentator="Ba'er Hetev" data-order="5"></i> he shouldn't mix them today but should put <i data-commentator="Mishnah Berurah" data-label="כז"></i> each on separately.
