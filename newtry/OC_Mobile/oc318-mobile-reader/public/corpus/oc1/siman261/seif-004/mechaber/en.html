<i data-commentator="Magen Avraham" data-order="11"></i> <i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> After <i data-commentator="Mishnah Berurah" data-label="כח"></i> the answering of Barchu —<i data-commentator="Mishnah Berurah" data-label="כט"></i> even though it is still <i data-commentator="Magen Avraham" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="ל"></i> day <i data-commentator="Ba'er Hetev" data-order="7"></i> <i data-commentator="Sha'arei Teshuvah" data-order="7"></i>— one may not establish an eiruv and one may not insulate, because they accepted Shabbat <i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> upon themselves. And for us, the <i data-commentator="Magen Avraham" data-order="13"></i> recitation of Mizmor Shir leYom <i data-commentator="Ba'er Hetev" data-order="8"></i> HaShabbat is <i data-commentator="Mishnah Berurah" data-label="לא"></i> like the answering of Barchu for them:
