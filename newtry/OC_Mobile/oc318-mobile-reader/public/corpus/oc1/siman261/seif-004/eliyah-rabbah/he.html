[ד] <b>[לבוש] לדבר וכו'.</b> מיהו באש אסור אפילו לדבר מצוה אלא דמשמע טעמו משום שהוא תיקון מעליא וזה ליתא דמעשר נמי תיקון מעליא הוא אלא צריך לומר משום דאינו מלאכה גמורה אינו אלא שבות לא גזרו בין השמשות, אך קשה הוה ליה לש"ס [שבת] דף מ"ו למוקמי כולי מתניתין בעירובי תחומין ורישא שלא במקום מצוה ויש לתרץ:
