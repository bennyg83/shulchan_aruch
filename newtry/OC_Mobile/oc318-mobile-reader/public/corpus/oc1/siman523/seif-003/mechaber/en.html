<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> One does not deliver an animal on Yom Tov, but we assist it — holding the offspring so it does not fall to <i data-commentator="Mishnah Berurah" data-label="ה"></i> the ground, blowing into its nostrils, and placing the teat into its mouth.
