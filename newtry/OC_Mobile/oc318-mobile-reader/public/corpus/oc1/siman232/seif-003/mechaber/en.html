<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> That which a small meal is forbidden applies when one establishes a fixed meal; but tasting — meaning eating fruits — is permitted. Similarly eating bread <i data-commentator="Mishnah Berurah" data-label="לד"></i> the size <i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> of an egg in <i data-commentator="Magen Avraham" data-order="17"></i> <i data-commentator="Ba'er Hetev" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="לה"></i> the casual manner one eats without establishing a meal is permitted.
