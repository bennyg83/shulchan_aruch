<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> If a hen that sat on eggs <i data-commentator="Mishnah Berurah" data-label="לד"></i> for three days or more <i data-commentator="Mishnah Berurah" data-label="לה"></i> died, they place another under her so that <i data-commentator="Magen Avraham" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="לו"></i> the eggs not be ruined.
