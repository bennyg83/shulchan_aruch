<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> If a brooding hen died after sitting <i data-commentator="Mishnah Berurah" data-label="לד"></i> on the eggs three days <i data-commentator="Mishnah Berurah" data-label="לה"></i> or longer, one may place another in its <i data-commentator="Magen Avraham" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="לו"></i> stead lest the eggs become spoiled.
