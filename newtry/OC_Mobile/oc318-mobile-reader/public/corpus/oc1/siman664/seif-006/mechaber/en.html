<i data-commentator="Be'er HaGolah" data-label="ל" data-order="13"></i> One cannot fulfill the obligation with the willow from the lulav, even if it is lifted twice, once as a lulav and once as a willow. There are those who say that the <i data-commentator="Be'er HaGolah" data-label="•" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="כא"></i> obligation is fulfilled this way.
