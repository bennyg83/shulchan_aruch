Mishnah, Rosh Hashanah 16.<br />
Tur and Mordechai in chapter 3 of Sukkah; and the support for this is 'kapos' written without a vav, meaning that for six days it shall be bound.<br />
Meaning the upper binding; Rokeach.<br />
From that which we learned: and on that day they would circle, etc.; Sukkah 45.
