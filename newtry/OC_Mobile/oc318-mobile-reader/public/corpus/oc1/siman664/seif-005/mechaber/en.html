<i data-commentator="Be'er HaGolah" data-label="כ" data-order="12"></i> It should be taken alone. Nothing else should be <i data-commentator="Mishnah Berurah" data-label="כ"></i> bound with it. However, if there is something else in one's hand, it is <i data-commentator="Magen Avraham" data-order="7"></i> not a problem.
