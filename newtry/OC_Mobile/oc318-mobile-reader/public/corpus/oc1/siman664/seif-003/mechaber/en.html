<i data-commentator="Be'er HaGolah" data-label="ו" data-order="7"></i> <i data-commentator="Turei Zahav" data-order="3"></i> There is one who <i data-commentator="Mishnah Berurah" data-label="יד"></i> says that even on this day, we circle with the lulav and not the <i data-commentator="Be'er HaGolah" data-label="ז" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="טו"></i> willow. This is not our practice. Rather, we circle also with the willow.
