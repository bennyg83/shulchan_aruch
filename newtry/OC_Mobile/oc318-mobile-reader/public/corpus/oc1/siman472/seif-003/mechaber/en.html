<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> When he reclines, he should <i data-commentator="Mishnah Berurah" data-label="ט"></i> not lean on <i data-commentator="Chok Yaakov" data-order="6"></i> his back, nor on his face, nor <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Eshel Avraham" data-label="ה" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> on his right side, but on <i data-commentator="Chok Yaakov" data-order="7"></i> his left side.<small> <i data-commentator="Mishnah Berurah" data-label="יא"></i>((There is no distinction between a person who is lame and one who is not.}(Tur in the name of Rashi and the Tosefot, in siman 136))</small>:
