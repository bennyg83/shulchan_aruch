<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> One must drink four cups in order; and if <i data-commentator="Turei Zahav" data-order="7"></i> <i data-commentator="Magen Avraham" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> he drank them one after another <i data-commentator="Chok Yaakov" data-order="17"></i> <i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> not in order, he did <i data-commentator="Ba'er Hetev" data-order="10"></i> not fulfill <i data-commentator="Mishnah Berurah" data-label="כו"></i> his obligation.
