<i data-commentator="Magen Avraham" data-order="14"></i> <i data-commentator="Be'er HaGolah" data-label="נ" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="לג"></i> Over simlak and chilfei dema one blesses borei atzei besamim. Simlak —<i data-commentator="Be'er HaGolah" data-label="ס" data-order="16"></i> some explain it <i data-commentator="Mishnah Berurah" data-label="לד"></i> as rosemary;<i data-commentator="Be'er HaGolah" data-label="ע" data-order="17"></i> some as jasmine; and some <i data-commentator="Be'er HaGolah" data-label="פ" data-order="18"></i> explain it as a herb that has three rows of leaves, one above the other, and three leaves on each row. Chilfei <i data-commentator="Turei Zahav" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="לה"></i> dema is spikenard, which is <i data-commentator="Ba'er Hetev" data-order="14"></i> called ishpek.
