<i data-commentator="Be'er HaGolah" data-label="ק" data-order="20"></i> Nargis — which is the <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="ר" data-order="21"></i> narcissus, and <i data-commentator="Be'er HaGolah" data-label="ש" data-order="22"></i> some say it is the lily (lirio) — If it <i data-commentator="Be'er HaGolah" data-label="ת" data-order="23"></i> grows <i data-commentator="Magen Avraham" data-order="15"></i> <i data-commentator="Turei Zahav" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="לז"></i> in <i data-commentator="Ba'er Hetev" data-order="15"></i> a garden, one recites: “Who creates fragrant trees” (borei atzei besamim). If it grows in the field, one recites: “Who creates fragrant herbs” (borei isvei besamim).
