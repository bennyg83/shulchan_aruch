<i data-commentator="Be'er HaGolah" data-label="ק" data-order="20"></i> Narcissus, which is <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="ר" data-order="21"></i> chavatzalet; and <i data-commentator="Be'er HaGolah" data-label="ש" data-order="22"></i> some say it is lily. If it <i data-commentator="Be'er HaGolah" data-label="ת" data-order="23"></i> grows <i data-commentator="Magen Avraham" data-order="15"></i> <i data-commentator="Turei Zahav" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="לז"></i> in <i data-commentator="Ba'er Hetev" data-order="15"></i> a garden, one blesses borei atzei besamim; if it grows in a field, one blesses borei isvei besamim.
