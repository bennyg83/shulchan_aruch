<b>Laws of the blessing over fragrance, containing 14 seifim:</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> It is forbidden to <i data-commentator="Ba'er Hetev" data-order="1"></i> benefit from a <i data-commentator="Mishnah Berurah" data-label="ב"></i> pleasant fragrance until <i data-commentator="Mishnah Berurah" data-label="ג"></i> one blesses before smelling;<i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> however <i data-commentator="Magen Avraham" data-order="1"></i> afterward one need <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Sha'arei Teshuvah" data-order="2"></i> not bless.
