<b>Laws of the Blessing over Fragrance – containing 14 sections: It is</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> forbidden to benefit from a <i data-commentator="Ba'er Hetev" data-order="1"></i> pleasant fragrance before reciting <i data-commentator="Mishnah Berurah" data-label="ב"></i> a blessing; however,<i data-commentator="Mishnah Berurah" data-label="ג"></i> after smelling it, one does <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> not <i data-commentator="Magen Avraham" data-order="1"></i> need to recite <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Sha'arei Teshuvah" data-order="2"></i> a blessing retroactively.
