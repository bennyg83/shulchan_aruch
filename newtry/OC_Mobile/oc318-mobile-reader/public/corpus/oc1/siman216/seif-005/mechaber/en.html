<i data-commentator="Magen Avraham" data-order="11"></i> <i data-commentator="Be'er HaGolah" data-label="י" data-order="11"></i> Olive oil that <i data-commentator="Ba'er Hetev" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> has been crushed or ground until its fragrance is released — over it one recites the blessing: “Who <i data-commentator="Mishnah Berurah" data-label="כה"></i> creates fragrant trees” (borei atzei besamim).
