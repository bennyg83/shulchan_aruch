<i data-commentator="Be'er HaGolah" data-label="ה" data-order="28"></i> Regarding mugmar: if it is of wood,<i data-commentator="Mishnah Berurah" data-label="מט"></i> one blesses borei atzei besamim; if of herb, one <i data-commentator="Ba'er Hetev" data-order="19"></i> <i data-commentator="Mishnah Berurah" data-label="נ"></i> blesses borei isvei besamim; if of other species, one blesses borei minei besamim.
