<i data-commentator="Turei Zahav" data-order="6"></i> <i data-commentator="Be'er HaGolah" data-label="ט" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="כב"></i> Over <i data-commentator="Magen Avraham" data-order="10"></i> persimmon oil <i data-commentator="Ba'er Hetev" data-order="11"></i>(shemen afarsimon), one recites the blessing: “Who <i data-commentator="Mishnah Berurah" data-label="כג"></i> creates pleasant oil” (borei shemen arev).
