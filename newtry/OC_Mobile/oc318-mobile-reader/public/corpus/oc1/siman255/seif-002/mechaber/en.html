<i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> There are authorities who maintain that if coals [are used for kindling], even though the fire only started burning minimally [on its own while it was still day on Friday], it is permitted [to benefit from it], because they will continue to burn on their own.
