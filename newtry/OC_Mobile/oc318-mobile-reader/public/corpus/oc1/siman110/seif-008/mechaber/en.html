<i data-commentator="Turei Zahav" data-order="8"></i> <i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="לד"></i> One who <i data-commentator="Ba'er Hetev" data-order="13"></i> enters the study hall <i data-commentator="Magen Avraham" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="לה"></i> prays &quot;May it be your will, Lord, our God and the God of our ancestors, that I not falter in any legal matter, etc.&quot; And upon' <i data-commentator="Mishnah Berurah" data-label="לו"></i> one's departure, one says <i data-commentator="Mishnah Berurah" data-label="לז"></i>&quot;I give thanks before You, Lord my God, that placed my portion among those who sit in the the study hall, etc.&quot;':
