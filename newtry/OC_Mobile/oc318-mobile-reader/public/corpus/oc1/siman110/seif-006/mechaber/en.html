<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> Maharam of Rothenburg, when he would set out on the <i data-commentator="Magen Avraham" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="כז"></i> road in <i data-commentator="Ba'er Hetev" data-order="9"></i> <i data-commentator="Sha'arei Teshuvah" data-order="9"></i> the morning, would say it after &quot;May it be Your will...&quot; in order to juxtapose it to the blessing &quot;Who bestows kindness,&quot; so that it would be <i data-commentator="Magen Avraham" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="כח"></i> a blessing juxtaposed <i data-commentator="Ba'er Hetev" data-order="10"></i> to its fellow.
