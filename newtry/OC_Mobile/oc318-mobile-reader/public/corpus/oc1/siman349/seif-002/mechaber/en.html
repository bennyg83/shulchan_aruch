<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> These four amot are measured <i data-commentator="Mishnah Berurah" data-label="ו"></i> by their diagonal, meaning that he is allowed five and three-fifths amot. There <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ז"></i> is one who <i data-commentator="Mishnah Berurah" data-label="ח"></i> says that from four amot to 5 3/5 amot <i data-commentator="Mishnah Berurah" data-label="ט"></i> is exempt but forbidden.
