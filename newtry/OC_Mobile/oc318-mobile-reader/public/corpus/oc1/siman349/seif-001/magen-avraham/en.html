(א) Four amot confined. His body three amot and an amah in order to spread his hands and feet in it — so wrote from the view of Rabbenu Yehuda and Rambam:<br>
<br>
(ב) With his amah. That is, the forearm.<br>
<br>
(ג) His amah is small. And he is large — it is found that four amot do not suffice for him.
