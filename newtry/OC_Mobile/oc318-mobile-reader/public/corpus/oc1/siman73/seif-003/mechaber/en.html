<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="3"></i> If one was sleeping <i data-commentator="Mishnah Berurah" data-label="ז"></i> next to one's children while they are still minors, it is permitted to <i data-commentator="Mishnah Berurah" data-label="ח"></i> recite through turning one's face without the separation of a cloth. And if <i data-commentator="Mishnah Berurah" data-label="ט"></i> they are older, one needs the separation of a cloth.
