<i data-commentator="Magen Avraham" data-order="32"></i> <i data-commentator="Turei Zahav" data-order="17"></i> <i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> One should protest against those <i data-commentator="Mishnah Berurah" data-label="פד"></i> whose practice it is to wrap up a kettle of hot water while still day (on Erev Shabbos), and then pour it into a pot of food on Shabbos when the food begins to dry out .<small>((see below Siman 318).</small>
