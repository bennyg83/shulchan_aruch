<i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i> If one prays the weekday amidah and does not mention Shabbat, or if one does not pray at all and hears <i data-commentator="Mishnah Berurah" data-label="כז"></i> from the chazan the one blessing that encapsulates the seven from the beginning to the end,<i data-commentator="Magen Avraham" data-order="15"></i> <i data-commentator="Ba'er Hetev" data-order="13"></i> <i data-commentator="Sha'arei Teshuvah" data-order="13"></i> he has fulfilled <i data-commentator="Mishnah Berurah" data-label="כח"></i> his obligation.
