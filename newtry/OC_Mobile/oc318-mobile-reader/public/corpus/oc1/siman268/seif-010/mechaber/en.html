<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> We do not say one blessing that encapsulates the seven [blessings of the Shemoneh <i data-commentator="Magen Avraham" data-order="13"></i> <i data-commentator="Turei Zahav" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> Esreh] in the <i data-commentator="Ba'er Hetev" data-order="11"></i> house of newlyweds or mourners because there is <i data-commentator="Magen Avraham" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> not a reason for others to come and to [potentially] be injured [on the way to come to a mitzvah] [See Pesachim 8a].
