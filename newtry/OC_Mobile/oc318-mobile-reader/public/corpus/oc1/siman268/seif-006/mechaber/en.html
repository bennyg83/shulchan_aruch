<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> If one errs in the amidah of Shabbat and recites one in <i data-commentator="Turei Zahav" data-order="4"></i> the midst of the <i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="יד"></i> other, he does not return <i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="טו"></i>(to the <i data-commentator="Magen Avraham" data-order="8"></i> beginning). And there are those who <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> say that if he recited the amidah <i data-commentator="Mishnah Berurah" data-label="יז"></i> for Musaf or another prayer during Musaf he goes back.
