<i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> If one's garment was wrapped around their waist to cover themselves from <i data-commentator="Mishnah Berurah" data-label="כא"></i> the waist down, even though <i data-commentator="Mishnah Berurah" data-label="כב"></i> from the waist up he is naked, it is permitted to <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="כג"></i> recite the Sh'ma. But <i data-commentator="Ba'er Hetev" data-order="11"></i> to pray [the Amidah] is forbidden until he covers his <i data-commentator="Mishnah Berurah" data-label="כד"></i> heart.
