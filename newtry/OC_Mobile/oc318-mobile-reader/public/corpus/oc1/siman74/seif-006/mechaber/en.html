<i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> If one's talit was girded on his loins to cover him from <i data-commentator="Mishnah Berurah" data-label="כא"></i> his loins downward, even though <i data-commentator="Mishnah Berurah" data-label="כב"></i> from his loins upward he is naked, it is permitted <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="כג"></i> to recite Shema;<i data-commentator="Ba'er Hetev" data-order="11"></i> but to pray is forbidden until he covers his <i data-commentator="Mishnah Berurah" data-label="כד"></i> heart.
