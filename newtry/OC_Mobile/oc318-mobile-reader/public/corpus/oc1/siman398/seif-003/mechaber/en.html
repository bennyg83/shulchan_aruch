<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> When one circumscribes a rectangle [around a <i data-commentator="Mishnah Berurah" data-label="ז"></i> city], one circumscribes it per the cardinal directions, so that each of its sides extends according to one of the cardinal directions and is parallel to it.
