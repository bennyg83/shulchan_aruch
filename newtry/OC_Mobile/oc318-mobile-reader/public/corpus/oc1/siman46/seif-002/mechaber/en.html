<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> Nowadays, because the hands are not ritually clean <i data-commentator="Magen Avraham" data-order="6"></i> and because the ignorant do not know them, the practice is <i data-commentator="Mishnah Berurah" data-label="יא"></i> to arrange them in the <i data-commentator="Mishnah Berurah" data-label="יב"></i> synagogue; we answer Amen after them and thereby <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Sha'arei Teshuvah" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i> fulfill the obligation.
