<i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> Something whose species is not attached to the ground that was brought to a Jew on the first day of Rosh Hashanah is <i data-commentator="Turei Zahav" data-order="14"></i> <i data-commentator="Magen Avraham" data-order="25"></i> <i data-commentator="Mishnah Berurah" data-label="סו"></i> permitted on the second <i data-commentator="Be'er HaGolah" data-label="ר" data-order="20"></i> <i data-commentator="Mishnah Berurah" data-label="סז"></i> day. The same applies to Shabbat and Yom Tov that are adjacent to each other.
