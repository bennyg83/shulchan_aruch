<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> <i data-commentator="Mishnah Berurah" data-label="נז"></i> In a city where the majority of residents <i data-commentator="Mishnah Berurah" data-label="נח"></i> are non-Jews, it is assumed that whoever <i data-commentator="Magen Avraham" data-order="22"></i> <i data-commentator="Mishnah Berurah" data-label="נט"></i> brings produce brings <i data-commentator="Ba'er Hetev" data-order="15"></i> it for <i data-commentator="Mishnah Berurah" data-label="ס"></i> the majority.<small>Rema: If <i data-commentator="Magen Avraham" data-order="23"></i> <i data-commentator="Mishnah Berurah" data-label="סא"></i> it is half and half, or <i data-commentator="Mishnah Berurah" data-label="סב"></i> it is known that <i data-commentator="Mishnah Berurah" data-label="סג"></i> he gathered it for both Jews and non-Jews, it is forbidden. [Beit Yosef and Semag]]</small>:
