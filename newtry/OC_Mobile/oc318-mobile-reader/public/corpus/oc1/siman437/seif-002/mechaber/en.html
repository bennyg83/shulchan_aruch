<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ז"></i> If the tenant rents a house from his fellow on the 14th and does not know if it was checked — if <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Chok Yaakov" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="ח"></i> the landlord is in town <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> he asks him <i data-commentator="Eshel Avraham" data-label="ב" data-order="2"></i> if they checked; if <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> he is not in town, his presumption <i data-commentator="Chok Yaakov" data-order="8"></i> is that it was checked,<i data-commentator="Mishnah Berurah" data-label="י"></i> and he annuls in his heart and that suffices.
