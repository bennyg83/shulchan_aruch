<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> A <i data-commentator="Chok Yaakov" data-order="11"></i> <i data-commentator="Ba'er Hetev" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="יז"></i> house that was presumed to be inspected without the landlord checking, and they (a woman, a slave,<i data-commentator="Chok Yaakov" data-order="12"></i> <i data-commentator="Ba'er Hetev" data-order="8"></i> or a minor) said,<i data-commentator="Chok Yaakov" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="יח"></i>'We inspected it,' <i data-commentator="Magen Avraham" data-order="8"></i> they are believed.<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> <i data-commentator="Chok Yaakov" data-order="14"></i> However, the minor must be <i data-commentator="Ba'er Hetev" data-order="9"></i> of an <i data-commentator="Mishnah Berurah" data-label="יט"></i> age capable of inspection.
