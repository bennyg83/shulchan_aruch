<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Chok Yaakov" data-order="7"></i> <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> An olive's bulk of chametz on a beam —<i data-commentator="Mishnah Berurah" data-label="יג"></i> we obligate him to bring a ladder to remove it because sometimes it may fall from the beam. But if the chametz was in a <i data-commentator="Chok Yaakov" data-order="8"></i> pit,<i data-commentator="Mishnah Berurah" data-label="יד"></i> we do not obligate him to bring it up; rather he nullifies it <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="טו"></i> in his heart, and <i data-commentator="Mishnah Berurah" data-label="טז"></i> that suffices.
