<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Chok Yaakov" data-order="7"></i> <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> If there is a size of an olive of <i data-commentator="Mishnah Berurah" data-label="יג"></i> leaven on the roof, one is obligated to bring a ladder to remove it, as sometimes it may fall from the roof. But if the leaven was <i data-commentator="Chok Yaakov" data-order="8"></i> in a <i data-commentator="Mishnah Berurah" data-label="יד"></i> pit, one is not obligated to bring it up, rather they nullify it in <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="טו"></i> their heart, and it <i data-commentator="Mishnah Berurah" data-label="טז"></i> is sufficient.
