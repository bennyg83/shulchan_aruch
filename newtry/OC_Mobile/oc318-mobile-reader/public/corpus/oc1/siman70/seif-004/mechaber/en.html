<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> If one was occupied <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> with communal needs <i data-commentator="Ba'er Hetev" data-order="5"></i> and the <i data-commentator="Mishnah Berurah" data-label="יז"></i> time for Keriat Shema arrived,<i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="יח"></i> one should not interrupt what <i data-commentator="Mishnah Berurah" data-label="יט"></i> one was doing,<i data-commentator="Ba'er Hetev" data-order="6"></i> but rather finish one’s affairs <i data-commentator="Mishnah Berurah" data-label="כ"></i> and recite if time remains to recite.
