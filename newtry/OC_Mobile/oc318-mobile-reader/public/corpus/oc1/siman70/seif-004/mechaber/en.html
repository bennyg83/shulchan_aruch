<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> If one was occupied <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> with communal needs <i data-commentator="Ba'er Hetev" data-order="5"></i> and the time <i data-commentator="Mishnah Berurah" data-label="יז"></i> for the Recitation of the Sh'ma <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="יח"></i> arrived, they should not interrupt [what <i data-commentator="Mishnah Berurah" data-label="יט"></i> they were doing],<i data-commentator="Ba'er Hetev" data-order="6"></i> but rather finish their affairs and <i data-commentator="Mishnah Berurah" data-label="כ"></i> recite if there is time left to recite.
