<b>או על מנעליו</b>. וב"ח חולק בזה עס"ח:<br />
<b>אתי לאשויי גומות</b>. פי' שישכח ויכוין לאשויי גומות דאל"כ הוי דבר שאין מתכוין ושרי לאו פסיק רישיה הוא [מ"מ פכ"א ותוס']:<br />
<b>אף בכותל</b>. משום דמיחזי כמוסיף על הבנין ונ"ל דבכותל של עץ שרי כמו בקור':<br />
<b>שמתיר בשניהם</b>. דבנין חקלאה הוא וב"ח הכריע כהאוסרין:<br />
