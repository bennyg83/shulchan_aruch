<i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i>11. One who dirtied his hand with mud may wipe it on the tail of a horse or a <i data-commentator="Mishnah Berurah" data-label="נז"></i> cow or on a rough cloth that is made to hold thorns in it, but not on a cloth that is used to wipe hands, lest he act as he does on weekdays and come to wash the cloth.
