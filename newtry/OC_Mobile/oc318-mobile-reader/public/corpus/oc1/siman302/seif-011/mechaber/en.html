<i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> One whose hand became soiled with mud may wipe it on a horse's tail or a <i data-commentator="Mishnah Berurah" data-label="נז"></i> cow's tail (58) or on a hard cloth made to hold thorns, but not on a cloth with which one wipes hands, lest he act as on weekdays and come to launder the cloth.
