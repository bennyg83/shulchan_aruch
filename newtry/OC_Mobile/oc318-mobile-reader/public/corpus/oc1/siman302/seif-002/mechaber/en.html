<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ח"></i> One who gathers tufts on top of garments (3)(8),<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> such as those tufts on woolen vessels remaining in them from the weaving, is liable (1)(9) because of makeh bepatish (2)(5)(10),<i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> when he is particular about <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> them (5).<i data-commentator="Ba'er Hetev" data-order="5"></i> But if he removed them <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> in the manner of business (11) he <i data-commentator="Mishnah Berurah" data-label="יא"></i> is exempt.
