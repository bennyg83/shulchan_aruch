<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ח"></i>2. One who removes the weaving knots <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> from garments, like ones remaining after the weaving on woolen garments, is liable for Makeh bepatish <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i>, provided that one <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> is particular <i data-commentator="Ba'er Hetev" data-order="5"></i> about it. However, if <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> one removed them offhandedly, one is <i data-commentator="Mishnah Berurah" data-label="יא"></i> exempt.
