<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> One must place the entire eruv into one vessel,<i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="לא"></i> and if they divided it and placed it into two vessels, it is not the case of an eruv unless the first vessel <i data-commentator="Mishnah Berurah" data-label="לב"></i> became full, and thus it is permitted. And <i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> this is only a case when the two vessels are <i data-commentator="Mishnah Berurah" data-label="לג"></i> in one house.':
