<b>אפי' סמוכים</b>. דאע"ג דמציאת' לאביהם משום איבה מ"מ במה שהאב רוצה לזכות לאחרים ע"י בניו זוכין (ב"י רמב"ן):<br>
<b>קטנים</b>. דבדבר דרבנן קטן זוכה לאחרים:<br>
<b>וע"י אשתו</b>. דכשנותן לה אחר מתנה ע"מ שאין לבעלה רשות בה מהני ה"ה דיכול לזכות על ידה:<br>
<b>ואפי' יש לה בית</b>. דא"צ עירוב כמ"ש סי' ש"ע ס"ו:<br>
<b>שאינו מעלה לה</b>. דמציאת' לעצמ':
