<b>בע"ש. </b> ונ"ל דאם היה המנעל מתוקן מע"ש רק שתקנו והחליקו בשבת שרי דהא היה יכול ללובשו בלא"ה. מ"א:<br />
<b>ליקח. </b> אפילו לצורך שבת אסור ב"י ואפי' ע"י עכו"ם אסור להביאו. מ"א ע"ש:<br />
