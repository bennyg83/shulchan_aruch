<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> And if there was a well known melachah, and it <i data-commentator="Mishnah Berurah" data-label="כה"></i> is known that it is of a Jew and one performs it in a well publicized place, it is <i data-commentator="Magen Avraham" data-order="10"></i> good to be strict and <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Sha'arei Teshuvah" data-order="5"></i> to forbid it.
