<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> If they (the people who are counting) made a mistake on a cloudy day and they blessed on the counting <i data-commentator="Ba'er Hetev" data-order="11"></i> <i data-commentator="Chok Yaakov" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> of the Omer, they <i data-commentator="Mishnah Berurah" data-label="יג"></i> should go back to count when it <i data-commentator="Mishnah Berurah" data-label="יד"></i> got dark. Those who are punctilious, they do not count until the <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Magen Avraham" data-order="6"></i> stars <i data-commentator="Ba'er Hetev" data-order="12"></i> come out [namely, three stars], and <i data-commentator="Mishnah Berurah" data-label="טו"></i> this is a proper thing to do.
