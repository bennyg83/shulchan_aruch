<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> If they erred on an overcast day and blessed on counting the Omer,<i data-commentator="Ba'er Hetev" data-order="11"></i> <i data-commentator="Chok Yaakov" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> they return <i data-commentator="Mishnah Berurah" data-label="יג"></i> to count when it <i data-commentator="Mishnah Berurah" data-label="יד"></i> darkens. The meticulous do not count until the <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Magen Avraham" data-order="6"></i> emergence <i data-commentator="Ba'er Hetev" data-order="12"></i> of stars, and so <i data-commentator="Mishnah Berurah" data-label="טו"></i> it is proper to act.
