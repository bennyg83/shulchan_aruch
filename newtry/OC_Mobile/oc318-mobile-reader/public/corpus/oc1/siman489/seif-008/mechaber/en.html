<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> If <i data-commentator="Mishnah Berurah" data-label="לה"></i> he forgot to bless on one of the days, between the first day [of the omer] and the rest of <i data-commentator="Mishnah Berurah" data-label="לו"></i> the days, he should count the <i data-commentator="Ba'er Hetev" data-order="20"></i> <i data-commentator="Sha'arei Teshuvah" data-order="20"></i> <i data-commentator="Mishnah Berurah" data-label="לז"></i> rest <i data-commentator="Eshel Avraham" data-label="ב" data-order="2"></i> of the <i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> days without a blessing. But, if he uncertain if he skipped a single day and didn’t <i data-commentator="Mishnah Berurah" data-label="לח"></i> count, he should count the days with a blessing.
