<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> If <i data-commentator="Mishnah Berurah" data-label="לה"></i> he forgot to bless on one of the days, whether the first day or other days, he counts <i data-commentator="Mishnah Berurah" data-label="לו"></i> on the remaining days without <i data-commentator="Ba'er Hetev" data-order="20"></i> <i data-commentator="Sha'arei Teshuvah" data-order="20"></i> <i data-commentator="Mishnah Berurah" data-label="לז"></i> a <i data-commentator="Eshel Avraham" data-label="ב" data-order="2"></i> berachah; but <i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> if he is uncertain whether he skipped one day and did not count, he <i data-commentator="Mishnah Berurah" data-label="לח"></i> counts on the remaining days with a berachah.
