<i data-commentator="Be'er HaGolah" data-label="ד" data-order="26"></i> A house whose interior is not ten and whose roof completes it to ten <i data-commentator="Mishnah Berurah" data-label="נט"></i>— if it has four by <i data-commentator="Mishnah Berurah" data-label="ס"></i> four, its interior is <i data-commentator="Mishnah Berurah" data-label="סא"></i> karmelit and upon it is reshut <i data-commentator="Be'er HaGolah" data-label="ה" data-order="27"></i> <i data-commentator="Mishnah Berurah" data-label="סב"></i> ha-yachid; and if one hollows out in it <i data-commentator="Mishnah Berurah" data-label="סג"></i> four by four, even <i data-commentator="Magen Avraham" data-order="13"></i> <i data-commentator="Ba'er Hetev" data-order="13"></i> in the middle far from the walls, the whole becomes reshut ha-yachid:
