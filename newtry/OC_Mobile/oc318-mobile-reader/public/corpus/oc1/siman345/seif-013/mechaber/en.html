<i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> Holes in a wall that <i data-commentator="Mishnah Berurah" data-label="מה"></i> faces the public domain that are higher than three <i data-commentator="Mishnah Berurah" data-label="מו"></i>[tefachim above the ground] are not considered the public domain. Rather, they are assessed <i data-commentator="Mishnah Berurah" data-label="מז"></i> according to their dimensions.
