<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Ba'er Hetev" data-order="2"></i> Holes in the walls of reshut <i data-commentator="Mishnah Berurah" data-label="ט"></i> ha-yachid that face reshut <i data-commentator="Mishnah Berurah" data-label="י"></i> ha-yachid are reshut ha-yachid.<small>And if they face outward and do not pass through inward, they are judged according to their height <i data-commentator="Mishnah Berurah" data-label="יא"></i> and width, as will be explained in this siman seif 13 (Beit Yosef in the name of Rashba and the Maggid).</small>
