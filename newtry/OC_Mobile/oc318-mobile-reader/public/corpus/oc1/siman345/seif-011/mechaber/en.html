<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> A pit in reshut <i data-commentator="Mishnah Berurah" data-label="לט"></i> ha-rabbim — if it is not three deep it is <i data-commentator="Mishnah Berurah" data-label="מ"></i> reshut ha-rabbim; from three until ten, if it is four wide it is karmelit, and if not it is makom patur; and <i data-commentator="Mishnah Berurah" data-label="מא"></i> if it is ten <i data-commentator="Magen Avraham" data-order="10"></i> deep <i data-commentator="Ba'er Hetev" data-order="11"></i> it is reshut <i data-commentator="Mishnah Berurah" data-label="מב"></i> ha-yachid provided it is four wide:
