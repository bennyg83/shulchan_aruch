<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> If a pit in the <i data-commentator="Mishnah Berurah" data-label="לט"></i> public domain is not three [tefachim] deep, it is considered public <i data-commentator="Mishnah Berurah" data-label="מ"></i> domain. From three to ten, if it is four tefachim wide it is karmelit, and otherwise it is a place of exemption.<i data-commentator="Mishnah Berurah" data-label="מא"></i> If it is ten <i data-commentator="Magen Avraham" data-order="10"></i> deep,<i data-commentator="Ba'er Hetev" data-order="11"></i> it is private <i data-commentator="Mishnah Berurah" data-label="מב"></i> domain, assuming it is four wide.
