Seif 2: If there are no kohanim, etc. Tosafos Berachos 35a s.v. lo, etc.<br>
<br>
Until va'ani, etc. Magen Avraham, and see Tur in the name of Rashi.<br>
<br>
And the congregation does not answer, etc. For one does not answer Amen except after the one who blesses, but here it is the order of prayer.
