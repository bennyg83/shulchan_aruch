<i data-commentator="Be'er HaGolah" data-label="כ" data-order="12"></i> One who fell into a light sleep during his <i data-commentator="Mishnah Berurah" data-label="מח"></i> meal — this is not considered an interruption.<small>Rema: The same applies if he interrupted for other voluntary matters, such as needing to <i data-commentator="Mishnah Berurah" data-label="מט"></i> use the facilities and similar situations.</small>
