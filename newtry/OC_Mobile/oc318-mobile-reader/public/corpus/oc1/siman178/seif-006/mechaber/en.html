<i data-commentator="Be'er HaGolah" data-label="י" data-order="11"></i> One who remembered during his meal that he had not prayed and stood up and prayed — even if there is not enough time to finish his meal and pray, and he is <i data-commentator="Mishnah Berurah" data-label="מו"></i> obligated to interrupt and cannot eat until he prays —<i data-commentator="Turei Zahav" data-order="10"></i> this is nevertheless <i data-commentator="Magen Avraham" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="מז"></i> not considered <i data-commentator="Ba'er Hetev" data-order="10"></i> an interruption.
