<i data-commentator="Be'er HaGolah" data-label="ז" data-order="8"></i> If one ate bread in' <i data-commentator="Magen Avraham" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="מ"></i> one place and then ate <i data-commentator="Ba'er Hetev" data-order="8"></i> again in another place, he recites <i data-commentator="Turei Zahav" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="מא"></i> Grace After Meals only in <i data-commentator="Magen Avraham" data-order="11"></i> the second place,<i data-commentator="Mishnah Berurah" data-label="מב"></i> as is the custom of travelers who eat while walking and then sit and bless at the place where they finish eating.
