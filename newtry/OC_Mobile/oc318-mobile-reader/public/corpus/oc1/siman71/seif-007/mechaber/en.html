<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> It is forbidden to recite <i data-commentator="Mishnah Berurah" data-label="טו"></i> the <i data-commentator="Magen Avraham" data-order="4"></i> Recitation of the Sh'ma within 4 cubits of <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> the deceased or in <i data-commentator="Ba'er Hetev" data-order="9"></i> a cemetery, and if <i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> one recites, one has <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Ba'er Hetev" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="יז"></i> not fulfilled one's obligation.
