<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> It is forbidden to recite <i data-commentator="Mishnah Berurah" data-label="טו"></i> Keri'as <i data-commentator="Magen Avraham" data-order="4"></i> Shema within four cubits of the deceased <i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> or in a cemetery;<i data-commentator="Ba'er Hetev" data-order="9"></i> and if one recited,<i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> one did not <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Ba'er Hetev" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="יז"></i> fulfill one's obligation.
