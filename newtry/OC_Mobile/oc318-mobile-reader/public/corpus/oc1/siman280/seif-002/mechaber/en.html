<i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i>2. It is <i data-commentator="Ba'er Hetev" data-order="2"></i> permitted to engage in marital intimacy with a virgin for the first time on Shabbos. There is no prohibition because <i data-commentator="Mishnah Berurah" data-label="ד"></i> of causing pain or damage on Shabbos as a result of her initial intimate experience.
