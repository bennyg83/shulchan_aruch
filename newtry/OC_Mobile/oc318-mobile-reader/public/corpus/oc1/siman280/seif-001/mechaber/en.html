<b>1. The Laws Pertaining to Marital Intimacy on Shabbat, 2 Seifim: Marital</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> intimacy is one of the <i data-commentator="Ba'er Hetev" data-order="1"></i> expressions of Shabbos pleasure. Accordingly, [our Sages]<i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> determined that healthy <i data-commentator="Mishnah Berurah" data-label="א"></i> Torah scholars, who are obligated to fulfill their <i data-commentator="Mishnah Berurah" data-label="ב"></i> conjugal duties once a <i data-commentator="Mishnah Berurah" data-label="ג"></i> week, should do so each Friday night.
