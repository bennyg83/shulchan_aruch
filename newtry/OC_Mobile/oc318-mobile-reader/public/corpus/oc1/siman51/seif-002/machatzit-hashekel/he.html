<b>(ס"ק ב) קודם כו'</b> אמן אחר ברכותיו. דמגונה כדלקמן סימן רט"ו:<br />
ישתבח דכוותיהו דהיינו יהללוך שבסוף הלל ואחר ברכת שומר עמו ישראל לעד בערבית דהם עכ"פ ב' ברכות סמוכים והוה סיום ברכות:<br />
