<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> <i data-commentator="Magen Avraham" data-order="4"></i> In between these psalms one may ask [of another's welfare] out <i data-commentator="Mishnah Berurah" data-label="יב"></i> of respect [for that person] and may reply greetings to any person. And in <i data-commentator="Mishnah Berurah" data-label="יג"></i> the middle of [one of] the psalms he may ask [of another's welfare] out of fear and he may reply out of respect.
