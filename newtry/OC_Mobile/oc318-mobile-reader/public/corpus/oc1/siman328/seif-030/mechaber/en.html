<i data-commentator="Be'er HaGolah" data-label="נ" data-order="58"></i> <i data-commentator="Mishnah Berurah" data-label="צד"></i> One whose joint of hand or foot slipped from its place — he should not rub it much in cold water for that is its healing, but he washes in his usual way and if healed, healed.
