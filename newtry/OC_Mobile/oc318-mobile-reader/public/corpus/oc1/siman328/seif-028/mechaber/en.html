<i data-commentator="Be'er HaGolah" data-label="כ" data-order="55"></i> <i data-commentator="Mishnah Berurah" data-label="פז"></i> One who opens a boil on Shabbat to widen the mouth of the wound as doctors do, intending in healing to widen the mouth — behold he is liable for striking with a hammer, for that is the doctor's melacha; but if he opened it to <i data-commentator="Magen Avraham" data-order="32"></i> <i data-commentator="Ba'er Hetev" data-order="21"></i> <i data-commentator="Mishnah Berurah" data-label="פח"></i> remove the <i data-commentator="Mishnah Berurah" data-label="פט"></i> moisture in it — behold <i data-commentator="Magen Avraham" data-order="33"></i> <i data-commentator="Turei Zahav" data-order="21"></i> <i data-commentator="Mishnah Berurah" data-label="צ"></i> this is <i data-commentator="Be'er HaGolah" data-label="ל" data-order="56"></i> permitted.
