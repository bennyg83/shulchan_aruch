<i data-commentator="Be'er HaGolah" data-label="ב" data-order="24"></i> All <i data-commentator="Magen Avraham" data-order="8"></i> who are quick to desecrate Shabbat in a matter with danger — behold this is praiseworthy, even if <i data-commentator="Ba'er Hetev" data-order="6"></i> he thereby repairs something else, such as one who spread a net to lift a child who fell in the river and caught fish with <i data-commentator="Mishnah Berurah" data-label="לח"></i> it, and so all similar cases.
