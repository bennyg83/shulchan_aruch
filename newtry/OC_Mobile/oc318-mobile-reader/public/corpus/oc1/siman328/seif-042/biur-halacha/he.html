<b> כדי שייגע ויזיע</b> -  זה הוא מלשון הרמב"ם בביאורו על אין מתעמלין ורש"י שם פירש דהיינו שמשפשף בכח ומשמע אפילו אם אינו מזיע והעתיקו הטור ושו"ע לעיל בשכ"ז ס"ב ודברי השו"ע קשה לפ"ז וע"ז רמז הגר"א לעיל שם עי"ש ולדינא כתב הא"ר דיש לפסוק בזה כהרמב"ם שכן הסכים הרה"מ ובאמת בפיר"ח שלפנינו ג"כ נמצא כהרמב"ם:
