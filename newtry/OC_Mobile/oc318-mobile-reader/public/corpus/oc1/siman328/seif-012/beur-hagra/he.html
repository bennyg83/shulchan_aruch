<b>ס"יב כשמחללין.</b> כגי' הרי"ף והשמיט כותים שהן עכשיו כעו"ג:<br />
<b>אלא כו'.</b> למעוטי אינך שלשה:<br />
<b>וי"א דאם.</b> שבת קכ"ח ב' ושם קל"ג א' במתני' וע"ש תוס' ד"ה לועס כו'. רמב"ן:<br />
<b>ואם.</b> ר"ל דזה יותר טוב מלעשות אפילו ע"י עו"ג כמ"ש בסי"ז ע"ש ומ"ש ביומא שם ואין עושים ע"י עו"ג היינו במקום שיש לחוש שיתעצל וז"ש אבל במקום כו':
