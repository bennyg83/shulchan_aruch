<i data-commentator="Be'er HaGolah" data-label="ש" data-order="65"></i> <i data-commentator="Mishnah Berurah" data-label="קו"></i> One who faints —<i data-commentator="Ba'er Hetev" data-order="27"></i> permitted to nurse milk from an animal,<i data-commentator="Mishnah Berurah" data-label="קז"></i> for in a place of <i data-commentator="Eshel Avraham" data-label="א" data-order="2"></i> distress the Rabbis did not <i data-commentator="Magen Avraham" data-order="39"></i> <i data-commentator="Be'er HaGolah" data-label="ת" data-order="66"></i> <i data-commentator="Mishnah Berurah" data-label="קח"></i> decree; and some say if he has only distress of hunger <i data-commentator="Magen Avraham" data-order="40"></i> <i data-commentator="Mishnah Berurah" data-label="קט"></i>— forbidden <i data-commentator="Ba'er Hetev" data-order="28"></i> to nurse from an animal <i data-commentator="Mishnah Berurah" data-label="קי"></i> on Shabbat.
