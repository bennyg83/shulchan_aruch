<i data-commentator="Be'er HaGolah" data-label="ג" data-order="47"></i> They place a sponge and pieces of dry new <i data-commentator="Turei Zahav" data-order="17"></i> <i data-commentator="Be'er HaGolah" data-label="ד" data-order="48"></i> <i data-commentator="Mishnah Berurah" data-label="עח"></i> garments that are not for healing but so clothing not irritate the wound; but not old ones that heal — and this <i data-commentator="Be'er HaGolah" data-label="ה" data-order="49"></i> is old ones never placed on the wound; but if they were already on the wound, even old ones permitted because they no longer heal.
