<i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> They desecrate Shabbat <i data-commentator="Mishnah Berurah" data-label="יח"></i> for every wound made from iron;<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> and for a boil that <i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> comes in the anus;<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> and for simta, which is called pluncarno in a foreign <i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> language; and for one who <i data-commentator="Mishnah Berurah" data-label="יט"></i> has exceedingly hot <i data-commentator="Turei Zahav" data-order="2"></i> fever <i data-commentator="Mishnah Berurah" data-label="כ"></i> or <i data-commentator="Ba'er Hetev" data-order="3"></i> with simur.
