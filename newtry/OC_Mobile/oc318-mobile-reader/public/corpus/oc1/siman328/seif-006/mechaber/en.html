<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> A wound on the back of the hand and the back of the foot; and likewise one who <i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> swallowed a leech; and likewise one bitten by a mad <i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> dog or one of the deadly crawling creatures of the ground — even if it is doubtful whether it kills or not — behold they are like an internal wound.
