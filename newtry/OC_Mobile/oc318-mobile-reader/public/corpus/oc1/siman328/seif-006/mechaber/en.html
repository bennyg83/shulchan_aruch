<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> A wound that is on the back of the hand and the back of the foot, and so someone <i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> who swallowed a leech [?], and so someone who was <i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> bitten by a rabid dog, or one of the deadly crawling animals, even if it is a doubt as to whether it is deadly or not, it is like an internal injury.
