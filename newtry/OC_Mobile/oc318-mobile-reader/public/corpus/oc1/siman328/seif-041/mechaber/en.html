<i data-commentator="Turei Zahav" data-order="27"></i> <i data-commentator="Be'er HaGolah" data-label="י" data-order="76"></i> One who became intoxicated whose healing is <i data-commentator="Ba'er Hetev" data-order="32"></i> <i data-commentator="Mishnah Berurah" data-label="קכז"></i> to anoint palms of hands and feet with <i data-commentator="Mishnah Berurah" data-label="קכח"></i> oil (and salt) —) <i data-commentator="Magen Avraham" data-order="45"></i> permitted to anoint them on Shabbat.
