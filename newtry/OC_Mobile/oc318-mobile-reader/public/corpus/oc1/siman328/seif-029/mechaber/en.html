<i data-commentator="Turei Zahav" data-order="22"></i> <i data-commentator="Be'er HaGolah" data-label="מ" data-order="57"></i> One <i data-commentator="Mishnah Berurah" data-label="צא"></i> whose hand <i data-commentator="Magen Avraham" data-order="34"></i> <i data-commentator="Ba'er Hetev" data-order="22"></i> or foot was struck — they bind it in wine to set the blood,<i data-commentator="Mishnah Berurah" data-label="צב"></i> but not in vinegar because it is strong and has healing aspect; and if he finds wine pleasant <i data-commentator="Mishnah Berurah" data-label="צג"></i> to him like vinegar — also wine is like vinegar and forbidden.
