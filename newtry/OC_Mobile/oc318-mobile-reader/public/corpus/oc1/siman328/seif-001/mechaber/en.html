<b>דין חולה בשבת. ובו מט סעיפים:</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> The laws of a <i data-commentator="Mishnah Berurah" data-label="א"></i> sick person on Shabbat. And in it 49 seifim: One who has a mere pain, and he strengthens himself and walks like a healthy <i data-commentator="Mishnah Berurah" data-label="ב"></i> person — it is forbidden <i data-commentator="Mishnah Berurah" data-label="ג"></i> to do any healing for him, even through a non-Jew, as a decree on account of grinding spices.
