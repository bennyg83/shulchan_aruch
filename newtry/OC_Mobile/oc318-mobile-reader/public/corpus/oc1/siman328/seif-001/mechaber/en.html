<b>דין חולה בשבת. ובו מט סעיפים:</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> Someone who has <i data-commentator="Mishnah Berurah" data-label="א"></i> a mere bad feeling, but he strengthens himself and walks around like a healthy person, it is forbidden to <i data-commentator="Mishnah Berurah" data-label="ב"></i> do any healing for <i data-commentator="Mishnah Berurah" data-label="ג"></i> him, even by nonJews, because of grinding spices [lest one grind spices for medicine]...
