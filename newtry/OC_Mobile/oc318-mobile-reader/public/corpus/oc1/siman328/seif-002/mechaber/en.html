<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> One who has a life-threatening illness — it is <i data-commentator="Mishnah Berurah" data-label="ד"></i> a mitzvah to desecrate Shabbat for him; and one <i data-commentator="Mishnah Berurah" data-label="ה"></i> who is quick — behold he is praiseworthy;<i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ו"></i> and one who asks —<i data-commentator="Ba'er Hetev" data-order="1"></i> behold he spills blood.
