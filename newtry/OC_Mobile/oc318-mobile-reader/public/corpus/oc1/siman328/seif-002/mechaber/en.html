<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> For someone who has a dangerous illness, it <i data-commentator="Mishnah Berurah" data-label="ד"></i> is a commandment to break Shabbat for him.<i data-commentator="Mishnah Berurah" data-label="ה"></i> One who hurries to do this is <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ו"></i> praised. One who asks about <i data-commentator="Ba'er Hetev" data-order="1"></i> this is a murderer.
