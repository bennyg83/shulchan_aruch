<b>[18] [Levush] Because of bishul, etc.</b> See Yoreh Deah at the end of siman 113.<br />
<b>[19] [Levush] For we say regarding washing, etc.</b> Nowadays, when people do not ordinarily wash with wine, it is prohibited, as stated at the beginning of siman 327 by the Magen Avraham. See siman 326, seif 8.
