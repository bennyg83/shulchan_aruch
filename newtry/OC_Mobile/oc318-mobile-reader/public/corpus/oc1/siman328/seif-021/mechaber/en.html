<i data-commentator="Be'er HaGolah" data-label="פ" data-order="39"></i> A person may <i data-commentator="Magen Avraham" data-order="21"></i> <i data-commentator="Ba'er Hetev" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="סח"></i> soak eye salve from erev Shabbat and place on the surface of the eye, for it <i data-commentator="Magen Avraham" data-order="22"></i> <i data-commentator="Be'er HaGolah" data-label="צ" data-order="40"></i> appears only as one washing, and that he does <i data-commentator="Be'er HaGolah" data-label="ק" data-order="41"></i> <i data-commentator="Mishnah Berurah" data-label="סט"></i> not squeeze and open — and we are not concerned for grinding spices, for since they only permitted soaking from erev Shabbat there is recognition.
