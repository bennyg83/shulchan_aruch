<b>וחדשים</b> עט״ז כ״כ הב״ח דבגמרא קל״ד ב׳ ארומיא דכתיתין משני חדתי שרי ישנים אסור אבל ספוג אפילו ישנים שרי ולכן היפך המחבר ספוג לכ״ע שרי וכתיתין דוקא חדשים דלא כמו שכתוב בטור. וכ״מ בגמ׳ דתניא ברישא נותנין מוך יבש וספוג יבש ולא אמר נותנין מוך וספוג יבש ש״מ הא כדאיתא כו׳ יע״ש ובא״ר כ״ד השמיע תיבת עוד וצ״ע:
