<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> The <i data-commentator="Mishnah Berurah" data-label="כא"></i> roof of <i data-commentator="Mishnah Berurah" data-label="כב"></i> a lean-to or tower whose roofs are slanted — since for <i data-commentator="Mishnah Berurah" data-label="כג"></i> that reason their roofs are unfit for any use — do not require checking even if they are inside the house.
