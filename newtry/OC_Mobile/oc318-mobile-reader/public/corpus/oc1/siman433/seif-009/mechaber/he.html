<i data-commentator="Be'er HaGolah" data-label="ק" data-order="20"></i><i data-commentator="Magen Avraham" data-order="18"></i><i data-commentator="Chok Yaakov" data-order="21"></i><i data-commentator="Mishnah Berurah" data-label="מ"></i>מרתף שמסדרין בו שורות של חביות זו אצל זו עד שנתמלא כולו וחוזרין ומסדרין שורות אחרות על התחתונות עד הקורה <i data-commentator="Mishnah Berurah" data-label="מא"></i>א"צ לבדוק אלא שורה העליונה ואחרת למטה ממנה דהיינו שורה על פני רוחב המרתף <i data-commentator="Mishnah Berurah" data-label="מב"></i>ולא על כל שטח המרתף אלא עליונה הרואה את הקור' ואת הפתח ואחרת למטה ממנה:
