<i data-commentator="Be'er HaGolah" data-label="ס" data-order="16"></i> For a hole between one Jew and another, each checks as far as his hand reaches, and <i data-commentator="Magen Avraham" data-order="11"></i> <i data-commentator="Chok Yaakov" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="כט"></i> the rest he nullifies in his <i data-commentator="Eshel Avraham" data-label="ד" data-order="4"></i> heart, which <i data-commentator="Turei Zahav" data-order="6"></i> <i data-commentator="Be'er HaGolah" data-label="ע" data-order="17"></i> suffices. But between a Jew and a non-Jew one need <i data-commentator="Ba'er Hetev" data-order="7"></i> not check at <i data-commentator="Mishnah Berurah" data-label="ל"></i> all, lest the <i data-commentator="Chok Yaakov" data-order="14"></i> non-Jew say &quot;He is doing sorcery <i data-commentator="Ateret Zekenim" data-label="♦" data-order="7"></i> against me&quot;<i data-commentator="Magen Avraham" data-order="12"></i> <i data-commentator="Chok Yaakov" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="לא"></i> and this leads <i data-commentator="Eshel Avraham" data-label="ה" data-order="5"></i> to danger.
