<b>ס"א ואם עבר כו'. </b>ירושלמי וכי יש חמה בלילה תיפתר כו' הד"א אפי' ביום צריך לבדוק לאור הנר:<br />
<b>אם בדקה. </b>לשון הרמב"ם וכ"כ הרא"ש אע"ג דבגמ' אמרו לאורה נבדקת קאי על מ"ש ולא לאור החמה שאם לא בדק בלילה כנ"ל דלא כפי' רש"י וש"פ שכתבו לכתחילה לבדוק דהא אכתי איכא טעמא אחרינא בשעה שבני אדם מצויים כו' וע' מ"א.
