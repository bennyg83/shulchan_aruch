<small>Magen Avraham, seif katan 23.</small> <b>We have not found anyone who permits it.</b> So too Responsa Ginas Veradim, klal 4, siman 12, wrote this simply.<br />
<small>Seif 18.</small> <b>And if he scraped and separated it, it is valid.</b> See Responsa Avkas Rochel, siman 81, but his words require study.
