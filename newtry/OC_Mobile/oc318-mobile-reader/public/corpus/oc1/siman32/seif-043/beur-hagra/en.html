<b>43 — Groove, etc.</b> So the Rosh and Mordechai in the name of Yere'im — for Abbaye; Mordechai wrote: or it refers to the yod in shin; as in Hagahah; and so, etc.<br>
<br>
<b>And not, etc.</b> For the whole shin must be visible; and for Rashi "and all my people shall see," etc., because of shin.
