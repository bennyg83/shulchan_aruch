<i data-commentator="Be'er HaGolah" data-label="ד" data-order="48"></i> It is good to test the quill <i data-commentator="Mishnah Berurah" data-label="קה"></i> before he begins to write the parashah so that there is not too much ink on it and it is ruined; and likewise he should be careful before writing every Divine Name to read everything <i data-commentator="Mishnah Berurah" data-label="קו"></i> he wrote so that they do not come to require genizah on <i data-commentator="Mishnah Berurah" data-label="קז"></i> his account.
