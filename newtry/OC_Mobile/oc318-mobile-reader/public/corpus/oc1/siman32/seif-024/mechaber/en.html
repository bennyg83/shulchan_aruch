<i data-commentator="Be'er HaGolah" data-label="ז" data-order="51"></i> It is permitted to write on the <i data-commentator="Magen Avraham" data-order="34"></i> <i data-commentator="Ba'er Hetev" data-order="36"></i> <i data-commentator="Sha'arei Teshuvah" data-order="36"></i> <i data-commentator="Mishnah Berurah" data-label="קיג"></i> place of scraping and on the place of erasure, even a Divine Name;<i data-commentator="Be'er HaGolah" data-label="ח" data-order="52"></i> and he should not erase while it is still moist, rather he should dry it well, for then he can scrape easily and no impression will remain.
