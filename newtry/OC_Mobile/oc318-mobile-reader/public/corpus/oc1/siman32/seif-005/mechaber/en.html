<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i>[The scroll]<i data-commentator="Mishnah Berurah" data-label="יז"></i> must be written with his right hand even if he is ambidextrous. If he <i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> wrote with <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="יח"></i> his left <i data-commentator="Ba'er Hetev" data-order="8"></i> hand it <i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> is invalid when he can find others written with the right <i data-commentator="Magen Avraham" data-order="5"></i> hand. A left-handed person's left hand is <i data-commentator="Mishnah Berurah" data-label="יט"></i> considered <i data-commentator="Ba'er Hetev" data-order="9"></i> his right.
