<small>(ibid.)</small> In Taz, se'if kaf-vav — only the third parashah. See note: that is, the parashah of Shema in tefillin of Rabbeinu Tam; and in the parashah "and it shall be, if listening" — place at the end nine letters and begin Shema at the head of a line in tefillin of Rabbeinu Tam, as above.
