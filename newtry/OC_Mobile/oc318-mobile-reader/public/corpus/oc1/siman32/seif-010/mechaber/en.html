<i data-commentator="Be'er HaGolah" data-label="ג" data-order="25"></i> When one marks the perforations with an awl in the form of letters — even though <i data-commentator="Magen Avraham" data-order="12"></i> it is easy for a non-Jew to forge — we are not concerned, because the non-Jew fears lest the Jew recognize them by the <i data-commentator="Magen Avraham" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="לא"></i> impression of the <i data-commentator="Ba'er Hetev" data-order="14"></i> eye.
