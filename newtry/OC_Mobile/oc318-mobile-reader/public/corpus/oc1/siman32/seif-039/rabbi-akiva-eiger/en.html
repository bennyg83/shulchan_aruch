<small>Seif 39.</small> <b>That their squareness be exact.</b> See Rambam, Commentary to the Mishnah, Eruvin, chapter 4, mishnah 5, cited by the Bartenura there.<br />
<small>Magen Avraham, seif katan 61.</small> <b>For we are not concerned if the hair emerges.</b> See Nezirus Shimshon, who writes that Heaven forbid to be lenient in this.
