<i data-commentator="Be'er HaGolah" data-label="ג" data-order="47"></i> Each chapter, after he writes it, he' <i data-commentator="Mishnah Berurah" data-label="קד"></i> should read it well, with focus and meticulously, two or three times. And he should repeat and read it before he places it in its casing, in order so that one chapter shouldn't be switched with another.
