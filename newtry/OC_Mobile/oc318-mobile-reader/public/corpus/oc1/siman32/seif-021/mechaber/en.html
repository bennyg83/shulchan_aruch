<i data-commentator="Be'er HaGolah" data-label="ג" data-order="47"></i> Each parashah, after he writes it,' <i data-commentator="Mishnah Berurah" data-label="קד"></i> he should read it well with intent and precision two or three times, and he should read it again before placing it in its compartment so that one parashah is not switched with another.
