<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> The head [tefillin] should be written each [parasha] on its own parchment and the arm [tefillin] should be written all [four] of <i data-commentator="Turei Zahav" data-order="2"></i> them on a <i data-commentator="Mishnah Berurah" data-label="ו"></i> single piece <i data-commentator="Ba'er Hetev" data-order="4"></i> of parchment.
