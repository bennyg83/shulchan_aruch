<b>Both his hands together.</b> But if he washed one hand and poured from it onto the second, even if he intended to wash both of them, it is impure, as written in siman 159, seif 7. So wrote the Beit Yosef in Bedek HaBayis, siman 160, and so wrote Toras HaBayis, that one should not rely on Tosafot.
