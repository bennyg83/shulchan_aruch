<i data-commentator="Magen Avraham" data-order="13"></i> <i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="נה"></i> When rubbing the hands together, one must take care not to <i data-commentator="Mishnah Berurah" data-label="נו"></i> touch beyond the area where the water fell, because the hands defile each other in those areas.
