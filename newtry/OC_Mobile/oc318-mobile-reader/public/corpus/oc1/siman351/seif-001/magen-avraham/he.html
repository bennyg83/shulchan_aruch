<b>חשוב כגג</b>. דהוי רה"י עססי' שע"ד:<br />
<b>מן האויר</b>. דמקום פטור הוא ואם הוא למט' מי' הוי ר"ה:<br />
<b>שבולט ג'</b>. לא חשיב כגג:<br />
<b>יש בהן ד'</b>. הוי כרמלית:<br />
<b>למעלה מי'</b>. גזרי' שמא יהא רחב ד' והוי רה"י ואסור עמ"ש סי' שמ"ה ס"א דאם גדיים בוקעים תחתיו לא הוי רה"י הכא שאני דכיון שהגג רה"י הוי הצנור (חור רה"י) דומיא דזיז ע"ש סי"ו:
