<i data-commentator="Mishnah Berurah" data-label="יד"></i> When a person enters his friend's house and there are many <i data-commentator="Mishnah Berurah" data-label="טו"></i> groups eating, and each <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Turei Zahav" data-order="3"></i> one offers him a cup —<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> some say he recites borei pri hagafen over each one, since each time he is <i data-commentator="Ba'er Hetev" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> reconsidering.
