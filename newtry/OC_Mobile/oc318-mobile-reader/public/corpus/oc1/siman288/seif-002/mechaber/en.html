<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> Some say that a person who is harmed by eating, such that it is their delight not to eat,<i data-commentator="Mishnah Berurah" data-label="ג"></i> should not eat.<small>And so <i data-commentator="Turei Zahav" data-order="2"></i> with one who finds delight in weeping, in order that their pain will leave <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> their heart: such a person is permitted to weep on Shabbat. (Igur in the name of the Shibolei haLeket).</small>
