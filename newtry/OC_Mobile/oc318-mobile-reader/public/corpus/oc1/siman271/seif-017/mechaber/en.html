<i data-commentator="Be'er HaGolah" data-label="כ" data-order="33"></i>17. One does not need to pour from the cup of the one who makes kiddush into the cups in front of the <i data-commentator="Ba'er Hetev" data-order="24"></i> other diners unless <i data-commentator="Mishnah Berurah" data-label="פב"></i> they are blemished. For then one must pour into <i data-commentator="Be'er HaGolah" data-label="•" data-order="34"></i> each and <i data-commentator="Mishnah Berurah" data-label="פג"></i> every cup so everyone can drink from a cup that is unblemished.
