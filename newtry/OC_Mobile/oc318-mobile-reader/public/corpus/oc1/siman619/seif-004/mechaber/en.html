<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i> It is necessary to make one man stand to the right side of the reader <i data-commentator="Ateret Zekenim" data-label="♦" data-order="4"></i> and one to his left side (while he is saying these prayers). 161 While the reader is saying these prayers on the night of Yom Kippur he is to be flanked on both sides.
