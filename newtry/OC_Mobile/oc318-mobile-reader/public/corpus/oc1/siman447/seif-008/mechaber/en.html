<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> <i data-commentator="Turei Zahav" data-order="14"></i> Olives for which care was taken <i data-commentator="Chok Yaakov" data-order="42"></i> to cut <i data-commentator="Magen Avraham" data-order="38"></i> <i data-commentator="Mishnah Berurah" data-label="פט"></i> them with <i data-commentator="Ba'er Hetev" data-order="36"></i> a new knife — even if care was not taken to pickle them in a new <i data-commentator="Magen Avraham" data-order="39"></i> <i data-commentator="Chok Yaakov" data-order="43"></i> <i data-commentator="Mishnah Berurah" data-label="צ"></i> pot — if <i data-commentator="Ba'er Hetev" data-order="37"></i> it is not ben yomo, it <i data-commentator="Mishnah Berurah" data-label="צא"></i> is permitted according to all.
