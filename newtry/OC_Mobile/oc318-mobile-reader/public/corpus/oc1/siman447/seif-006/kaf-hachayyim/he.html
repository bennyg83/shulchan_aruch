<b>ו) שם. במשהו וכו'  </b>בין שממשו של חמץ נימוח בין שישנו בעין וליכא אלא טעמו הוי במשהו. הרשב"א בתשו' סי' ל' וג"ן. וכן מתבאר מדברי המחבר בסי' זה ובסי' תס"ז. פר"ח. וכן הסכים המט"י דגם בטעמו לבד אוסר במשהו יעי"ש. ועיין לעיל סי' תמ"ב או' ד' ולענין אם מותר למוכרו לעכו"ם חוץ מדמי איסור שבו עיין לקמן או' י"ג.
