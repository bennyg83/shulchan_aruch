<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> One who places his eruv <i data-commentator="Mishnah Berurah" data-label="כג"></i> in a private domain — even if it were a large city like <i data-commentator="Mishnah Berurah" data-label="כד"></i> Nineveh, or even a ruined city or a <i data-commentator="Mishnah Berurah" data-label="כה"></i> cave fit for dwelling — may walk <i data-commentator="Mishnah Berurah" data-label="כו"></i> through all of it and two thousand cubits beyond it in each direction.
