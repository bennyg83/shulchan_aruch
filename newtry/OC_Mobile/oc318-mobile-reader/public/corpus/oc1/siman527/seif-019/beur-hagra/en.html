<b>Se'if 19: One who did not, etc.</b> So Beis Yosef inferred carefully from the Rambam's wording, that he did not mention in the eruv formula 'to light a lamp'; and see Magen Avraham.<br />
<b>And some forbid.</b> As is written there, 'and they light,' etc.; and see Tosafos there, s.v. 'umadlikin,' etc.
