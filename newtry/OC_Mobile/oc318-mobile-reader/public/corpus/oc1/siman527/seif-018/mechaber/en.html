<i data-commentator="Be'er HaGolah" data-label="ז" data-order="29"></i> <i data-commentator="Turei Zahav" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="נא"></i> If one baked but did <i data-commentator="Mishnah Berurah" data-label="נב"></i> not cook or cooked but did not bake and then the eruv was eaten or lost, what he legally made, even if it was intended for the holiday, can be <i data-commentator="Magen Avraham" data-order="17"></i> <i data-commentator="Mishnah Berurah" data-label="נג"></i> left for Shabbat. He can then cook more food for the holiday.
