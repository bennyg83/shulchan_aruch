<i data-commentator="Turei Zahav" data-order="13"></i>14. If one made the eruv with the intention of relying on it <i data-commentator="Mishnah Berurah" data-label="מג"></i> as long as it exists, even on a different <i data-commentator="Be'er HaGolah" data-label="ב" data-order="24"></i> <i data-commentator="Mishnah Berurah" data-label="מד"></i> holiday, he should initially not rely on it on a different <i data-commentator="Be'er HaGolah" data-label="ג" data-order="25"></i> holiday, but after the <i data-commentator="Mishnah Berurah" data-label="מה"></i> fact, he can rely on it.
