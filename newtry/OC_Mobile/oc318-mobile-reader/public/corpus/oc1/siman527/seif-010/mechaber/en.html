<i data-commentator="Be'er HaGolah" data-label="ר" data-order="20"></i> <i data-commentator="Magen Avraham" data-order="11"></i>10. One who makes an <i data-commentator="Mishnah Berurah" data-label="לג"></i> eruv for others must transfer possession to them using a [symbolic] person. And everybody who can be used for <i data-commentator="Mishnah Berurah" data-label="לד"></i> a Shabbat eruv can be used for an eruv tavshilin, and everybody who cannot be used for that eruv cannot be used for this eruv. (And see above chapter 366).<small>()</small>:
