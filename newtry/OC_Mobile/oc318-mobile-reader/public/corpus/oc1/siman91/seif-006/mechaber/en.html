<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> It is the way of Torah scholars and their students to pray only when they are wrapped.<small>And at a time of wrath, one should clasp the hands during prayer like a servant before his master. And at a time of peace, one should adorn himself in fine garments to pray. (Tur)]:</small>
