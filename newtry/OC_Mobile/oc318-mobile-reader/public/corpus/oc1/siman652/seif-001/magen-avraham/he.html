<b>יטלנו אח"כ</b>. עב"י סי' תרס"ה בשם הר"ן משמע דאם לא נטלו עד ב"ה ביום ראשון נוטלו ב"ה דספק דאורייתא לחומרא משא"כ בשאר הימים דפטור ע"ש ומ"מ נ"ל דיטלנו ב"ה בלא ברכה:<br />
<b>משתנץ החמה</b>. ואם נטלו משעל' ע"ה יצא:<br />
<b>גם בשעת התפל'</b>. דכיון דלקיחתו מצוה לא מטרד ביה ושל"ה כתב שינענע בסוכה קודם הליכתו לבה"כ ע"ש:
