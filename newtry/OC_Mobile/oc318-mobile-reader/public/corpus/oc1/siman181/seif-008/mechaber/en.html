<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="יח"></i> There are those who say mayim acharonim do not require drying hands afterward; but <i data-commentator="Mishnah Berurah" data-label="יט"></i> per Rambam one <i data-commentator="Magen Avraham" data-order="6"></i> dries and afterward recites <i data-commentator="Ba'er Hetev" data-order="7"></i> the blessing.
