<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="יח"></i>8. There are those who say that mayim acharonim do not require drying [of the hands afterward], but according <i data-commentator="Mishnah Berurah" data-label="יט"></i> to the Rambam, one dries <i data-commentator="Magen Avraham" data-order="6"></i>[the hands] and afterwards recites the <i data-commentator="Ba'er Hetev" data-order="7"></i> blessing [birkat hamazon].
