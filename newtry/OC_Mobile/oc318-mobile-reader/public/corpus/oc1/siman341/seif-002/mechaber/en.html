<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> If someone swore to do some labor within some time period, and he had no chance to do it until the last day of the time period, if that last day is Shabbat <i data-commentator="Mishnah Berurah" data-label="ה"></i> and he has <i data-commentator="Mishnah Berurah" data-label="ו"></i> valid reasons to annul his vow, he may ask for its <i data-commentator="Mishnah Berurah" data-label="ז"></i> annulment even on Shabbat.
