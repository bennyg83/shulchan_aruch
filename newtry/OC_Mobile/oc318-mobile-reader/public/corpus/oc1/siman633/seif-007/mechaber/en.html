<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> If one builds <i data-commentator="Turei Zahav" data-order="7"></i> a shelf in the middle, if there is less than four amos from it to the wall on all sides <i data-commentator="Mishnah Berurah" data-label="כב"></i> it is valid with the shelf,<i data-commentator="Mishnah Berurah" data-label="כג"></i> even if it is <i data-commentator="Turei Zahav" data-order="8"></i> higher than <i data-commentator="Ba'er Hetev" data-order="7"></i> twenty. And if there is four amot between it and the wall it is invalid,<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> <i data-commentator="Turei Zahav" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> even if the shelf is higher <i data-commentator="Ba'er Hetev" data-order="8"></i> than twenty.
