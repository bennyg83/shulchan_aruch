<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> If it is taller than <i data-commentator="Mishnah Berurah" data-label="כו"></i> ten and palm leaves come down into that <i data-commentator="Turei Zahav" data-order="10"></i> ten tefachim space, even if its sunlit area is greater than <i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> its shade <i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Ba'er Hetev" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="כז"></i> it is invalid. However, if הנויין fall down into it it is valid.
