<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> If it was higher than ten <i data-commentator="Mishnah Berurah" data-label="כו"></i> tefachim and hutzin descend into the ten tefachim —<i data-commentator="Turei Zahav" data-order="10"></i> even if its sunlit area is greater than its shade it <i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> is invalid.<i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Ba'er Hetev" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="כז"></i> But if decorative hangings descend into the ten tefachim they do not invalidate.
