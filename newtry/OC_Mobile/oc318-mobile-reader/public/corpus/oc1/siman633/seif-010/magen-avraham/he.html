<b>ג"ט כשרה</b>. משמע אפי' חוץ לחקק, אבל הטור כ' דוקא תוך החקק אבל חוץ לחקק ליכא מחיצה כלל וכן עיקר [ב"ח] וא"כ צ"ע למה פסק ססי' תרל"א דמותר לישן תחת הדפנות וה"ה אם ניטל מן הסכך מלמטה עד שנעשית גבוה י' כשר' כמ"ש סי' תרל"ה:<br>
<b>ג"ט פסולה</b>. ולא אמרי' דופן עקומה דלא איקרי דופן כלל כיון דאינו גבוה י':
