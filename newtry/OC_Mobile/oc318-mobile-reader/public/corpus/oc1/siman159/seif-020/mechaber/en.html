<i data-commentator="Magen Avraham" data-order="31"></i> <i data-commentator="Be'er HaGolah" data-label="ע" data-order="38"></i> One who immerses his hands <i data-commentator="Mishnah Berurah" data-label="צו"></i> does not recite a blessing on the immersion itself but <i data-commentator="Turei Zahav" data-order="21"></i> rather on the washing of the hands.<small> <i data-commentator="Mishnah Berurah" data-label="צז"></i>[(Some say that one does bless on the immersion (על טבילת), and this <i data-commentator="Ba'er Hetev" data-order="24"></i> is the main opinion.) (Tur and Mordechai, chapter &quot;Eilu Devarim,&quot; and Semag and Agur).]:</small>
