<i data-commentator="Magen Avraham" data-order="25"></i> <i data-commentator="Be'er HaGolah" data-label="ו" data-order="28"></i> <i data-commentator="Mishnah Berurah" data-label="עה"></i> Ideally (l'chatchila), the one <i data-commentator="Ba'er Hetev" data-order="17"></i> who washes should intend for a washing that renders him fit to eat.' <small> <i data-commentator="Mishnah Berurah" data-label="עו"></i>[(And the intent of the one who pours also suffices — even l'chatchila — even if the one who washes had no intent at all) (Rashba, siman 510).]:</small>
