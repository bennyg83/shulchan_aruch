<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ו"></i> One whos head and most of his body is inside the sukkah,<i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Sha'arei Teshuvah" data-order="3"></i> and his table is outside the sukkah and he eats as if it he cannot eat in the sukkah -<i data-commentator="Mishnah Berurah" data-label="ז"></i> even if it is a large sukkah, there is a gezeirah (against this) on case he might <i data-commentator="Mishnah Berurah" data-label="ח"></i> be pulled after his table.
