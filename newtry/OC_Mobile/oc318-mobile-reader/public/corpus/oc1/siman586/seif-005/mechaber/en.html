<i data-commentator="Be'er HaGolah" data-label="כ" data-order="12"></i> <i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="כא"></i>5. If someone takes a vow to not <i data-commentator="Turei Zahav" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="כב"></i> receive benefit <i data-commentator="Ba'er Hetev" data-order="6"></i> from a [certain] shofar, if another person blows it, they <i data-commentator="Ateret Zekenim" data-label="♦" data-order="4"></i> <i data-commentator="Be'er HaGolah" data-label="ל" data-order="13"></i> fulfill their obligation. However,<i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Ba'er Hetev" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="כג"></i> if he says its sounding is konam <i data-commentator="Mishnah Berurah" data-label="כד"></i> to me, he is forbidden to sound it, even to fulfill the obligation.
