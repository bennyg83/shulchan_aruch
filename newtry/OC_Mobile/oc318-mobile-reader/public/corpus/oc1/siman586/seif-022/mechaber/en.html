<i data-commentator="Be'er HaGolah" data-label="א" data-order="46"></i>22. If a non-Jew brought a shofar <i data-commentator="Mishnah Berurah" data-label="פז"></i> from outside of the techum,<i data-commentator="Magen Avraham" data-order="24"></i> <i data-commentator="Ba'er Hetev" data-order="16"></i> we sound it. It is also the case that <i data-commentator="Mishnah Berurah" data-label="פח"></i> if <i data-commentator="Magen Avraham" data-order="25"></i> a non-Jew <i data-commentator="Ba'er Hetev" data-order="17"></i> made a shofar on the holiday, it is permitted to sound it.
