<i data-commentator="Be'er HaGolah" data-label="כ" data-order="34"></i> <i data-commentator="Mishnah Berurah" data-label="סו"></i>15. If instead of <i data-commentator="Turei Zahav" data-order="17"></i> removing the bone [that fills <i data-commentator="Magen Avraham" data-order="20"></i> the horn], one <i data-commentator="Mishnah Berurah" data-label="סז"></i> drilled it,<i data-commentator="Be'er HaGolah" data-label="ל" data-order="35"></i> it is kosher. However, if they removed the bone and made a shofar out of it <i data-commentator="Mishnah Berurah" data-label="סח"></i> by drilling into it, it is not kosher.
