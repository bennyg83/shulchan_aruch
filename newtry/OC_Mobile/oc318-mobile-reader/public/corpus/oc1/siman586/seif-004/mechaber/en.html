<i data-commentator="Be'er HaGolah" data-label="י" data-order="11"></i>4. Blowing the <i data-commentator="Mishnah Berurah" data-label="יט"></i> shofar made from an animal that was sacrificed for idol worship, even one owned by an idol worshipper, does not fulfill the obligation <i data-commentator="Mishnah Berurah" data-label="כ"></i> as [the idolatrous status of such a shofar] can never be nullified.':
