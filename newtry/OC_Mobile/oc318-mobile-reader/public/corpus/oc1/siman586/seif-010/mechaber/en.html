<i data-commentator="Be'er HaGolah" data-label="ד" data-order="27"></i> <i data-commentator="Mishnah Berurah" data-label="נז"></i>10. If one attached broken shofars to each other to make a shofar, it is <i data-commentator="Turei Zahav" data-order="15"></i> not kosher,<i data-commentator="Be'er HaGolah" data-label="ה" data-order="28"></i> <i data-commentator="Mishnah Berurah" data-label="נח"></i> even if the fragment closest to the mouth is big <i data-commentator="Magen Avraham" data-order="19"></i> enough to be a shofar.
