<i data-commentator="Be'er HaGolah" data-label="ו" data-order="29"></i>11. If one added <i data-commentator="Mishnah Berurah" data-label="נט"></i> to a shofar at all, whether with native or non-native material, it is not <i data-commentator="Be'er HaGolah" data-label="ז" data-order="30"></i> kosher, even if it initially had the minimal size of a shofar.
