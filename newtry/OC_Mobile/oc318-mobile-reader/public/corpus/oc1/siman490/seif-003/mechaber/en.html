<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> On Yom Tov, it is customary <i data-commentator="Chok Yaakov" data-order="4"></i> to say &quot;את יום טוב מקרא קודש הזה&quot; (This Yom Tov, a <i data-commentator="Eshel Avraham" data-label="ב" data-order="2"></i> holy convocation).<i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> On Chol HaMoed, one says <i data-commentator="Ba'er Hetev" data-order="3"></i>&quot;את יום מקרא קודש הזה&quot; (This day, a holy convocation).<i data-commentator="Magen Avraham" data-order="2"></i><small> <i data-commentator="Mishnah Berurah" data-label="ו"></i>(Gloss: Some <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Chok Yaakov" data-order="5"></i> <i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Sha'arei Teshuvah" data-order="4"></i> have the custom not to say &quot;מקרא קודש&quot; at all, neither on Yom Tov nor on Chol HaMoed (Tur).)</small>:
