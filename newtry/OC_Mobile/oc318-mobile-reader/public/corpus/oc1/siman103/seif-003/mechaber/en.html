<i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i> One who &quot;sneezes&quot; during [the middle of] one's prayer [i.e. Amidah]: [if it's] from below (i.e. one passes gas), it's a bad sign; [if it's] from above (i.e. a sneeze from one nose), it's a good sign.
