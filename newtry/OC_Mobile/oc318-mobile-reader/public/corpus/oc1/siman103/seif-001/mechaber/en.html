<b>One to Whom Gas Passes During His Prayer, or Sneezing. It Contains 3 Seifim: (1)</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> If one was standing in prayer and gas came out from below, he waits until (1) the <i data-commentator="Mishnah Berurah" data-label="א"></i> smell (2)<i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ב"></i> dissipates and <i data-commentator="Ba'er Hetev" data-order="1"></i> returns and prays.
