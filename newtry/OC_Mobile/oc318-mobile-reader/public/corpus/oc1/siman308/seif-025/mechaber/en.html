<i data-commentator="Be'er HaGolah" data-label="ט" data-order="55"></i> <i data-commentator="Mishnah Berurah" data-label="קה"></i> Dry hides, whether of <i data-commentator="Mishnah Berurah" data-label="קו"></i> a artisan <i data-commentator="Be'er HaGolah" data-label="י" data-order="56"></i> or of a layman, may be moved.<small>And <i data-commentator="Magen Avraham" data-order="47"></i> <i data-commentator="Mishnah Berurah" data-label="קז"></i> some say specifically hides of a coarse animal that are fit to sit on; but of a fine animal <i data-commentator="Magen Avraham" data-order="48"></i> <i data-commentator="Ba'er Hetev" data-order="33"></i> <i data-commentator="Mishnah Berurah" data-label="קח"></i> it is forbidden unless he thought to sit on them before Shabbat [Rashi, chapter BeMah Tomin]:]:</small>
