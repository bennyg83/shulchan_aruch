<i data-commentator="Be'er HaGolah" data-label="פ" data-order="40"></i>19. A tall attic <i data-commentator="Mishnah Berurah" data-label="עח"></i> ladder used to plaster the roof is forbidden <i data-commentator="Mishnah Berurah" data-label="עט"></i> to <i data-commentator="Magen Avraham" data-order="38"></i> move,<i data-commentator="Mishnah Berurah" data-label="פ"></i> however a ladder used for reaching <i data-commentator="Be'er HaGolah" data-label="צ" data-order="41"></i> nests may be moved from one place to another but not from one nest to another, so as not to follow the weekday manner which might lead to capturing.
