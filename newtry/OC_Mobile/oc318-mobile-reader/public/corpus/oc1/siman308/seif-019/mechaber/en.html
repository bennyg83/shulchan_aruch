<i data-commentator="Be'er HaGolah" data-label="פ" data-order="40"></i> A ladder of an attic <i data-commentator="Mishnah Berurah" data-label="עח"></i> that is large and made for plastering a roof <i data-commentator="Mishnah Berurah" data-label="עט"></i> with <i data-commentator="Magen Avraham" data-order="38"></i> is forbidden <i data-commentator="Mishnah Berurah" data-label="פ"></i> to move; but one of a <i data-commentator="Be'er HaGolah" data-label="צ" data-order="41"></i> dovecote may be leaned from place to place, but he may not carry it from dovecote to dovecote, so that he not act as he does on a weekday and come to trap.
