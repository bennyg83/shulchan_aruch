<i data-commentator="Be'er HaGolah" data-label="ר" data-order="66"></i>30. Date pits are <i data-commentator="Mishnah Berurah" data-label="קכב"></i> not Muktze where they are fed to animals, however, an important person <i data-commentator="Magen Avraham" data-order="55"></i> should be stringent <i data-commentator="Mishnah Berurah" data-label="קכג"></i> upon himself and refrain from moving them, unless moved <i data-commentator="Mishnah Berurah" data-label="קכד"></i> in an unusual manner.
