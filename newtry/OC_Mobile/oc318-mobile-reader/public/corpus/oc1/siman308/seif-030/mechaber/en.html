<i data-commentator="Be'er HaGolah" data-label="ר" data-order="66"></i> Date pits — in a <i data-commentator="Mishnah Berurah" data-label="קכב"></i> place where they feed them to animals, it is permitted to move them;<i data-commentator="Magen Avraham" data-order="55"></i> and an important <i data-commentator="Mishnah Berurah" data-label="קכג"></i> person should be stringent with himself not to move them <i data-commentator="Mishnah Berurah" data-label="קכד"></i> except in an unusual manner.
