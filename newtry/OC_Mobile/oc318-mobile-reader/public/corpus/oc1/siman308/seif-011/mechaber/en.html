<i data-commentator="Be'er HaGolah" data-label="א" data-order="23"></i> <i data-commentator="Mishnah Berurah" data-label="מו"></i>11. An unbroken needle may be used to remove a thorn. If <i data-commentator="Mishnah Berurah" data-label="מז"></i> the point <i data-commentator="Be'er HaGolah" data-label="ב" data-order="24"></i> or eye is missing <i data-commentator="Magen Avraham" data-order="24"></i> it <i data-commentator="Ba'er Hetev" data-order="20"></i> is forbidden. A new <i data-commentator="Turei Zahav" data-order="11"></i> <i data-commentator="Be'er HaGolah" data-label="ג" data-order="25"></i> <i data-commentator="Mishnah Berurah" data-label="מח"></i> one that has not yet been pierced <i data-commentator="Magen Avraham" data-order="25"></i> is permitted.
