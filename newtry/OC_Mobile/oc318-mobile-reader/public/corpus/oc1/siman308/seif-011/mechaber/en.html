<i data-commentator="Be'er HaGolah" data-label="א" data-order="23"></i> <i data-commentator="Mishnah Berurah" data-label="מו"></i> A whole needle may be moved to remove a thorn with; if its <i data-commentator="Mishnah Berurah" data-label="מז"></i> point or <i data-commentator="Be'er HaGolah" data-label="ב" data-order="24"></i> its hole is lost,<i data-commentator="Magen Avraham" data-order="24"></i> it <i data-commentator="Ba'er Hetev" data-order="20"></i> is forbidden; and a <i data-commentator="Turei Zahav" data-order="11"></i> <i data-commentator="Be'er HaGolah" data-label="ג" data-order="25"></i> <i data-commentator="Mishnah Berurah" data-label="מח"></i> new one that has not yet been pierced <i data-commentator="Magen Avraham" data-order="25"></i> is permitted.
