<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> Any utensil, even if it is very large <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Ba'er Hetev" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ח"></i> and very heavy — the name of utensil is not nullified from it, neither because of its <i data-commentator="Mishnah Berurah" data-label="ט"></i> size nor because of its weight.
