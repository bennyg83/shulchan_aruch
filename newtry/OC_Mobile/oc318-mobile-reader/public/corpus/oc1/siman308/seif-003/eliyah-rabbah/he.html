[ו] <b>שמלאכתו לאיסור וכו'.</b> כלומר שמיוחדת לדבר שאסור לעשות בשבת:<br />
[ז] <b>[לבוש] וכיון וכו'.</b> ונראה לי דאפילו שכח ונטלה בידו רשאי לטלטלו יותר ועיין סימן רס"ו סעיף י"ב. איתא בשבת דף קכ"ו שמותר לטלטלה מוקצה ברגליו דרך הילוכה (מגן אברהם), וצריך עיון דהתם כדקאמר טעמא כדי שיכנס ויוצא ועיין סימן של"ג:
