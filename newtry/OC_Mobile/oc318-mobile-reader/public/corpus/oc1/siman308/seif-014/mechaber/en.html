<i data-commentator="Be'er HaGolah" data-label="ח" data-order="30"></i> <i data-commentator="Mishnah Berurah" data-label="נו"></i>14. A new shoe may be removed from the mold even though it is melachto l’issur (meaning, a Keili generally used for doing an issur), as it <i data-commentator="Turei Zahav" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="נז"></i> is called a Keili. It <i data-commentator="Ba'er Hetev" data-order="22"></i> may therefore be moved <i data-commentator="Magen Avraham" data-order="27"></i> <i data-commentator="Be'er HaGolah" data-label="ט" data-order="31"></i> le’tzorech mekomo (i.e. in order to use the space the Muktze is occupying)
