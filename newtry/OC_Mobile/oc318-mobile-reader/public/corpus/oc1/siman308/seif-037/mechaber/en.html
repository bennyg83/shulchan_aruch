<i data-commentator="Be'er HaGolah" data-label="ז" data-order="75"></i>37. When <i data-commentator="Mishnah Berurah" data-label="קמ"></i> one is incurring a loss,<i data-commentator="Magen Avraham" data-order="63"></i> one may <i data-commentator="Ba'er Hetev" data-order="42"></i> place one’s bed next to the Graf shel re’i and <i data-commentator="Magen Avraham" data-order="64"></i> <i data-commentator="Mishnah Berurah" data-label="קמא"></i> dwell there, so as to take out the Graf shel re’i.
