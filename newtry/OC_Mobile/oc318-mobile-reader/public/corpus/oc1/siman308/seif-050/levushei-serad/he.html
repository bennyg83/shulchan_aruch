<small>מ"א ס"ק מ"ד</small> דהא הרשב"א מייתי. הוא היש מי שאומר שבש"ע דס"ל דאבן דפציעה לאו בר מיעבד מעשה ואפ"ה ס"ל דבעינן יחוד לעולם. כדיעה ראשונה דפליג היינו משום דס"ל דאבן דפציעה אורחא הוא. ויש חילוק בין אורחא ללאו אורחא וא"כ במידי דלאו אורחיה כ"ע בעי יחוד לעולם אפי' במידי דלאו בר מעשה ובאורחי' פליגי:
