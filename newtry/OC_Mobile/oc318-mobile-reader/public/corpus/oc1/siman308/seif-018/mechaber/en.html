<i data-commentator="Magen Avraham" data-order="37"></i> <i data-commentator="Ba'er Hetev" data-order="29"></i> <i data-commentator="Be'er HaGolah" data-label="ע" data-order="38"></i> <i data-commentator="Mishnah Berurah" data-label="עה"></i> A thorn placed in reshus harabim may be moved <i data-commentator="Mishnah Berurah" data-label="עו"></i> less than four cubits at a time; in a karmlis it is permitted to move it directly, since we are concerned that many may be harmed by <i data-commentator="Mishnah Berurah" data-label="עז"></i> it, and where there is widespread harm the Rabbis did not decree shevut.<i data-commentator="Be'er HaGolah" data-label="•" data-order="39"></i>:
