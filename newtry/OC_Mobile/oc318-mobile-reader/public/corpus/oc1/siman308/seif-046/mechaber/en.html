<i data-commentator="Be'er HaGolah" data-label="א" data-order="91"></i>46. It is forbidden to carry silkworm eggs under one’s armpits, because they are forbidden to be moved since they are not fit for anything. Also, one’s body heat causes the eggs <i data-commentator="Mishnah Berurah" data-label="קנט"></i> to hatch.
