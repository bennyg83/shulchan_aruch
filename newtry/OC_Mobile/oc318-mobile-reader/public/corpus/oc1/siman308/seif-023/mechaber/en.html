<i data-commentator="Be'er HaGolah" data-label="ג" data-order="48"></i>23. It is permitted to cut a palm branch before Shabbos and wave it at the table to <i data-commentator="Turei Zahav" data-order="17"></i> <i data-commentator="Mishnah Berurah" data-label="צח"></i> chase away the <i data-commentator="Ba'er Hetev" data-order="32"></i> <i data-commentator="Mishnah Berurah" data-label="צט"></i> flies, since it was <i data-commentator="Magen Avraham" data-order="45"></i> <i data-commentator="Mishnah Berurah" data-label="ק"></i> cut for a purpose, it becomes a Keili.
