<i data-commentator="Be'er HaGolah" data-label="ג" data-order="48"></i> It is permitted to cut a branch from a palm tree before Shabbat, and it is permitted to wave it on the table <i data-commentator="Turei Zahav" data-order="17"></i> <i data-commentator="Mishnah Berurah" data-label="צח"></i> on Shabbat to <i data-commentator="Ba'er Hetev" data-order="32"></i> <i data-commentator="Mishnah Berurah" data-label="צט"></i> chase away flies, since, because he <i data-commentator="Magen Avraham" data-order="45"></i> <i data-commentator="Mishnah Berurah" data-label="ק"></i> cut it for that purpose, he made it a complete utensil.
