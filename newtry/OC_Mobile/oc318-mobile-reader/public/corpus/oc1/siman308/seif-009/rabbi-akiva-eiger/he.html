<small>מג"א ס"ק י"ט</small> ומזה יש ללמוד. לענ"ד אין ראי' דהכא דעדיין הפתח להחזיר לבית לתשמישו הראשון ואין שם כלי עליו וע' מג"א בסמוך סקל"ח. אבל בכלי שמוקצה מחמת חסרון כיס שנשבר בשבת דעתה עומד למלאכה אחרת לא הוי מוקצה אלא לר"י מטעם מגו דאתקצי בה"ש אבל לר"ש שרי כמבוא' ריש ביצה. וזהו דינא דלקמן רסי' תק"א:
