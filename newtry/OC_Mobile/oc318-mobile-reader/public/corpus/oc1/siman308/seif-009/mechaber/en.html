<i data-commentator="Turei Zahav" data-order="9"></i> <i data-commentator="Be'er HaGolah" data-label="ש" data-order="21"></i> The door of a chest, box, and cabinet may be taken <i data-commentator="Magen Avraham" data-order="20"></i> <i data-commentator="Mishnah Berurah" data-label="לו"></i> from them, but it is forbidden to return it — a decree <i data-commentator="Magen Avraham" data-order="21"></i> <i data-commentator="Mishnah Berurah" data-label="לז"></i> lest he fix <i data-commentator="Mishnah Berurah" data-label="לח"></i> it; but the door of a coop and of a chicken coop is forbidden both to remove and <i data-commentator="Magen Avraham" data-order="22"></i> <i data-commentator="Mishnah Berurah" data-label="לט"></i> to return,<i data-commentator="Ba'er Hetev" data-order="18"></i> since, because it is attached <i data-commentator="Mishnah Berurah" data-label="מ"></i> to the ground, it involves building and demolition.
