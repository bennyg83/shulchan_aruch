<i data-commentator="Be'er HaGolah" data-label="ע" data-order="84"></i> A woman may lead her son <i data-commentator="Magen Avraham" data-order="70"></i> <i data-commentator="Be'er HaGolah" data-label="פ" data-order="85"></i> <i data-commentator="Mishnah Berurah" data-label="קנג"></i> even in reshus harabim, provided <i data-commentator="Be'er HaGolah" data-label="צ" data-order="86"></i> she does <i data-commentator="Magen Avraham" data-order="71"></i> <i data-commentator="Mishnah Berurah" data-label="קנד"></i> not <i data-commentator="Ba'er Hetev" data-order="45"></i> drag him; rather, one foot should be lifted and the other placed on the ground, and he should lean on it until he returns and places the foot he lifted — so that he is always leaning on one foot.
