<i data-commentator="Be'er HaGolah" data-label="ע" data-order="84"></i>41. A woman may walk her <i data-commentator="Magen Avraham" data-order="70"></i> <i data-commentator="Be'er HaGolah" data-label="פ" data-order="85"></i> <i data-commentator="Mishnah Berurah" data-label="קנג"></i> son even in a Reshus <i data-commentator="Be'er HaGolah" data-label="צ" data-order="86"></i> Harabim, as <i data-commentator="Magen Avraham" data-order="71"></i> <i data-commentator="Mishnah Berurah" data-label="קנד"></i> long <i data-commentator="Ba'er Hetev" data-order="45"></i> as she does not drag him. He should lift one leg and place the other on the ground, all the while leaning on her until he lowers the leg he raised. In this manner, he is constantly standing on one leg.
