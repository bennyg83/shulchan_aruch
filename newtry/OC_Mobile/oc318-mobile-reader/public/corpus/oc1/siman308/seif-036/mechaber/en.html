<i data-commentator="Turei Zahav" data-order="21"></i> <i data-commentator="Be'er HaGolah" data-label="ה" data-order="73"></i> One does not make a chamber pot l'chatchila — meaning, he does not bring a thing that will in the future become repulsive in order <i data-commentator="Magen Avraham" data-order="62"></i> <i data-commentator="Mishnah Berurah" data-label="קלט"></i> to remove it when it becomes repulsive; and if <i data-commentator="Be'er HaGolah" data-label="ו" data-order="74"></i> he transgressed and made it, it is permitted to remove it.
