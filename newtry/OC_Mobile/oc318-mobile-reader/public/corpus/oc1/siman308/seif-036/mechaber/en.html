<i data-commentator="Turei Zahav" data-order="21"></i> <i data-commentator="Be'er HaGolah" data-label="ה" data-order="73"></i>36. One may not place a Graf shel re’i (this is a vessel used for body waste) initially, which means that one may not place in one’s presence something <i data-commentator="Magen Avraham" data-order="62"></i> <i data-commentator="Mishnah Berurah" data-label="קלט"></i> which will become offensive, in order to remove it when <i data-commentator="Be'er HaGolah" data-label="ו" data-order="74"></i> it becomes offensive. If nevertheless, it was placed before him, it may be removed.
