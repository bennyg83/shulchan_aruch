<b>להיתר. </b> וה"ה כשמלאכתו לאיסור ולהיתר:<br />
<b>וכתבי הקודש. </b> ונייר חלק הוי מוקצה מחמת חסרון כיס כיון דעומד לכתיבה. ש"ג:<br />
<b>כלל. </b> וכוסות וקערות וצלוחית וסכין קטן שע"ג השלחן מותרין גם כן אפי' שלא לצורך כלל. שכנה"ג:<br />
<b>ותפילין. </b> עיין ט"ז ומ"א דאין לטלטלם כ"א לצורך גופו ומקומו וע"ל סי' כ"ט מש"ש:
