<i data-commentator="Be'er HaGolah" data-label="ד" data-order="26"></i> <i data-commentator="Mishnah Berurah" data-label="מט"></i> Remnants of mats may be <i data-commentator="Mishnah Berurah" data-label="נ"></i> moved, for they are fit to cover filth with; and if he threw <i data-commentator="Be'er HaGolah" data-label="ה" data-order="27"></i> <i data-commentator="Mishnah Berurah" data-label="נא"></i> them to the ash heap during the day, it is forbidden to move them.
