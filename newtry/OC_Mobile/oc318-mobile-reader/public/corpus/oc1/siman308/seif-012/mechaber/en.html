<i data-commentator="Be'er HaGolah" data-label="ד" data-order="26"></i> <i data-commentator="Mishnah Berurah" data-label="מט"></i>12. Pieces of mat may <i data-commentator="Mishnah Berurah" data-label="נ"></i> be moved because they can be used to cover filth, but if <i data-commentator="Be'er HaGolah" data-label="ה" data-order="27"></i> <i data-commentator="Mishnah Berurah" data-label="נא"></i> they were discarded before Shabbos they are Muktze (you cannot move them).
