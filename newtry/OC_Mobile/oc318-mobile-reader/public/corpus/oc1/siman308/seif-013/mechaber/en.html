<i data-commentator="Be'er HaGolah" data-label="ו" data-order="28"></i>13. Pieces of worn out rags: if they are three fingers <i data-commentator="Mishnah Berurah" data-label="נב"></i> by three fingers it is permitted to' <i data-commentator="Mishnah Berurah" data-label="נג"></i> move them, if not it is forbidden. There are those <i data-commentator="Magen Avraham" data-order="26"></i> <i data-commentator="Be'er HaGolah" data-label="ז" data-order="29"></i> <i data-commentator="Mishnah Berurah" data-label="נד"></i> who permit it even if they are less than three by three as long as they are <i data-commentator="Turei Zahav" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="נה"></i> not from a <i data-commentator="Ba'er Hetev" data-order="21"></i> mitzvah shawl.
