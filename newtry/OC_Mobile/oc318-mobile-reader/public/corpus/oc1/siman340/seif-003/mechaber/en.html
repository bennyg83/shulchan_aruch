<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> One who erases ink <i data-commentator="Mishnah Berurah" data-label="י"></i> that is on parchment <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="יא"></i> or wax that is on a ledger if in its place there is room to <i data-commentator="Mishnah Berurah" data-label="יב"></i> write two letters <i data-commentator="Mishnah Berurah" data-label="יג"></i>— liable:<small>It <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="יד"></i> is forbidden to break a <i data-commentator="Mishnah Berurah" data-label="טו"></i> cake on which <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Sha'arei Teshuvah" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> are written like letters even though he intends only to eat,<i data-commentator="Mishnah Berurah" data-label="יז"></i> for <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> it is erasing (Mordechai chapter Klal Gadol):.</small>
