<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="יח"></i>4. One should be careful not to use juice or ashes to write on a table with his <i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Ba'er Hetev" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יט"></i> finger. However, he is permitted to make gestures of letters with his <i data-commentator="Mishnah Berurah" data-label="כ"></i> fingers (Trumat <i data-commentator="Ba'er Hetev" data-order="7"></i> HaDeshen chapter 63).<small> <i data-commentator="Magen Avraham" data-order="8"></i> <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Ba'er Hetev" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כא"></i> <i data-commentator="Mishnah Berurah" data-label="כב"></i>.</small>
