<i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i>9. It is forbidden to gather <i data-commentator="Mishnah Berurah" data-label="לד"></i> salt from a salt deposit because <i data-commentator="Magen Avraham" data-order="15"></i> <i data-commentator="Ba'er Hetev" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="לה"></i> this is similar <i data-commentator="Mishnah Berurah" data-label="לו"></i> to binding sheaves. Similarly, it is forbidden to <i data-commentator="Mishnah Berurah" data-label="לז"></i> gather anything from the place that it grows.
