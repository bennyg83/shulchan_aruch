<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="לא"></i>8. If fabric fell out of a pillow, one is <i data-commentator="Mishnah Berurah" data-label="לב"></i> permitted to put it back, but it <i data-commentator="Turei Zahav" data-order="5"></i> is forbidden <i data-commentator="Magen Avraham" data-order="14"></i> to put it in the <i data-commentator="Ba'er Hetev" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="לג"></i> pillow for the first time.
