<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> <i data-commentator="Magen Avraham" data-order="16"></i> <i data-commentator="Ba'er Hetev" data-order="16"></i> One who gathers a fig cake and made from it a <i data-commentator="Magen Avraham" data-order="17"></i> circle <i data-commentator="Ba'er Hetev" data-order="17"></i> or pierced figs and inserted a rope in them until they gathered as one body — behold <i data-commentator="Mishnah Berurah" data-label="לח"></i> this is a toldah of me'amer and he is liable, and likewise all similar to this:
