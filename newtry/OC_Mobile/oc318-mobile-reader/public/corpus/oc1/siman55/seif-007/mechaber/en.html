<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> When one is praying alone, it <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="לה"></i> is proper that the others wait from saying Kaddish <i data-commentator="Ba'er Hetev" data-order="10"></i> until he <i data-commentator="Mishnah Berurah" data-label="לו"></i> finishes, so that <i data-commentator="Mishnah Berurah" data-label="לז"></i> he too will have merit.
