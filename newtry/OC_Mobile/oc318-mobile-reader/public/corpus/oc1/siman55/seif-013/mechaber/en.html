<i data-commentator="Be'er HaGolah" data-label="ש" data-order="21"></i> All ten must <i data-commentator="Eshel Avraham" data-label="ג" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="מח"></i> be in one place, with <i data-commentator="Ba'er Hetev" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="מט"></i> the shaliach tzibbur among them. One who stands in the doorway from the doorpost <i data-commentator="Be'er HaGolah" data-label="ת" data-order="22"></i> outward—that is, when the door is closed, from <i data-commentator="Magen Avraham" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="נ"></i>[the] <i data-commentator="Ba'er Hetev" data-order="14"></i> <i data-commentator="Sha'arei Teshuvah" data-order="14"></i> inner lip <i data-commentator="Mishnah Berurah" data-label="נא"></i> of the door's thickness outward—is considered as outside.
