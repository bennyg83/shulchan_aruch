<b>The laws of Kaddish. And in it 22 seifim:</b><br> <i data-commentator="Turei Zahav" data-order="1"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> They say Kaddish,<i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ב"></i> and one <i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> does not say it with fewer' <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> than ten <i data-commentator="Ba'er Hetev" data-order="3"></i> males who are free <i data-commentator="Mishnah Berurah" data-label="ד"></i> adults who have brought forth two hairs; and <i data-commentator="Mishnah Berurah" data-label="ה"></i> the same applies to kedushah and Barchu, which are not said with fewer than ten.
