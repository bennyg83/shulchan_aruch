<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="לח"></i> A deaf person who speaks but does not hear, or who hears but does not speak—they are like hearing people and combine. But one who neither hears nor speaks is like a shoteh and a minor.
