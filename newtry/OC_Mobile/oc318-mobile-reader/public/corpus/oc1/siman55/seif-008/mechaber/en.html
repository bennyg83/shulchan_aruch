<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="לח"></i> A deaf person that can speak but not hear, or hear but not speak, they are like hearing/speaking people and can be included. But if he is deaf and mute, he is treated like a mentally incompetent person or a minor.
