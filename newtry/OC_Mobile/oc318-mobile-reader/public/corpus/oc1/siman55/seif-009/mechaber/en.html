<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> He is always a minor until he brings <i data-commentator="Mishnah Berurah" data-label="לט"></i> forth two hairs <i data-commentator="Mishnah Berurah" data-label="מ"></i> after he is <i data-commentator="Mishnah Berurah" data-label="מא"></i> thirteen years <i data-commentator="Mishnah Berurah" data-label="מב"></i> and one day old; and the leap year is thirteen months.
