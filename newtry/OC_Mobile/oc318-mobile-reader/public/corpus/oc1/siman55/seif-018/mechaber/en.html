<i data-commentator="Be'er HaGolah" data-label="ז" data-order="29"></i> If some of the ten [men] are in the <i data-commentator="Mishnah Berurah" data-label="נז"></i> synagogue and some of them are in the <i data-commentator="Mishnah Berurah" data-label="נח"></i> courtyard, they do not join with each other.
