<i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i> A transgressor who transgressed the public decrees or transgressed a <i data-commentator="Mishnah Berurah" data-label="מו"></i> transgression: if they do not excommunicate <i data-commentator="Mishnah Berurah" data-label="מז"></i> him, then he is counted in the minyan of 10.
