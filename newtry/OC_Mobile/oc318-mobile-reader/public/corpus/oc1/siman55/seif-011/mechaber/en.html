<i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i> A transgressor who transgressed a public decree of the community, or who <i data-commentator="Mishnah Berurah" data-label="מו"></i> transgressed a transgression — if they did <i data-commentator="Mishnah Berurah" data-label="מז"></i> not excommunicate him, he is counted in the minyan of ten.
