<i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> One who is excommunicated,<i data-commentator="Ba'er Hetev" data-order="12"></i> we do not join him to anything that requires 10 [people],' <i data-commentator="Be'er HaGolah" data-label="ר" data-order="20"></i> but he is permitted to pray in a synagogue in which he is present, unless they specified to be stringent with him regarding this.
