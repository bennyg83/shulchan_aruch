<i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> One under nidui <i data-commentator="Ba'er Hetev" data-order="12"></i> is not counted toward anything requiring ten; but he' <i data-commentator="Be'er HaGolah" data-label="ר" data-order="20"></i> may pray in the synagogue where he is, unless they explicitly stipulated to be stringent with him in this regard.
