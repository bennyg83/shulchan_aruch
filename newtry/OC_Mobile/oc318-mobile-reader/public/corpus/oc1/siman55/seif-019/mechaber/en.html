<i data-commentator="Be'er HaGolah" data-label="ח" data-order="30"></i> <i data-commentator="Mishnah Berurah" data-label="נט"></i> A shaliach tzibbur in the ark <i data-commentator="Magen Avraham" data-order="14"></i> and nine in the synagogue combine, even though it is ten tefachim high and four amot wide and has walls ten tefachim high, because it is <i data-commentator="Turei Zahav" data-order="5"></i> nullified relative to the synagogue.<i data-commentator="Be'er HaGolah" data-label="ט" data-order="31"></i> And there is one who wrote that this applies only when the partitions do not reach the ceiling.
