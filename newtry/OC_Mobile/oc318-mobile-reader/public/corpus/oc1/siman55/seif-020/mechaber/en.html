<i data-commentator="Be'er HaGolah" data-label="י" data-order="32"></i> If ten were in one place and they say Kaddish or kedushah, even one who <i data-commentator="Mishnah Berurah" data-label="ס"></i> is not with them <i data-commentator="Mishnah Berurah" data-label="סא"></i> may answer.<i data-commentator="Ba'er Hetev" data-order="16"></i> And some <i data-commentator="Be'er HaGolah" data-label="כ" data-order="33"></i> <i data-commentator="Mishnah Berurah" data-label="סב"></i> say there must <i data-commentator="Mishnah Berurah" data-label="סג"></i> be no interposition of <i data-commentator="Mishnah Berurah" data-label="סד"></i> filth or <i data-commentator="Magen Avraham" data-order="15"></i> avodah <i data-commentator="Ba'er Hetev" data-order="17"></i> <i data-commentator="Sha'arei Teshuvah" data-order="17"></i> <i data-commentator="Mishnah Berurah" data-label="סה"></i> zarah.
