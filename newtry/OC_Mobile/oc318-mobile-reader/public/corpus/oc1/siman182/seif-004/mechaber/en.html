<i data-commentator="Mishnah Berurah" data-label="כג"></i> <i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> If the cups of those who were lounging were unfit, it is <i data-commentator="Turei Zahav" data-order="4"></i> necessary to put <i data-commentator="Mishnah Berurah" data-label="כד"></i> from the cup of blessing <i data-commentator="Ba'er Hetev" data-order="8"></i> into them.<i data-commentator="Turei Zahav" data-order="5"></i> <i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="כה"></i> And there is someone who says it is not necessary.<small>[<i data-commentator="Mishnah Berurah" data-label="כו"></i>]:</small>
