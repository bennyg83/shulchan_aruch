<b>עשיית</b> עט״ז עיין טור הטעם אהל עראי ועיין לבוש אע״ג כל שאין מכוין לאהל שרי בלא עשיית מחיצות כאן שנוטל כלי ונותן המשמרת עליה הוי עשיית אהל ומחיצות ביחד אבל הר״מ ז״ל פכ״א מה״ש הי״ז שמא יבא לשמר וכפשטא דגמרא קל״ח א׳ שלא יעשה כדרך שעושה בחול וא״כ אפילו בסיכתא אסור ועמ״א אות י״א ואי״ה שם יבואר עוד:
