<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="לו"></i> A sieve that they hang to place bran in it to strain — and they stretch its mouth to every side — is considered making <i data-commentator="Magen Avraham" data-order="11"></i> <i data-commentator="Turei Zahav" data-order="9"></i> an ohel, and it is forbidden <i data-commentator="Ba'er Hetev" data-order="11"></i> to spread it.
