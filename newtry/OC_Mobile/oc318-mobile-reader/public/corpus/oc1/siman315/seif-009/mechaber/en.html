<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="לו"></i>9. A strainer positioned in order to strain dregs whose mouth is stretched in all directions is considered tent-making,<i data-commentator="Magen Avraham" data-order="11"></i> <i data-commentator="Turei Zahav" data-order="9"></i> and is therefore forbidden to <i data-commentator="Ba'er Hetev" data-order="11"></i> set up.
