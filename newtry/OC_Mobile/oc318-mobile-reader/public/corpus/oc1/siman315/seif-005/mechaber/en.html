<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> A chair made in sections, and when they wish to sit upon it they open it and the leather spreads, and when they remove it they close it and the leather folds — it <i data-commentator="Magen Avraham" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כז"></i> is permitted <i data-commentator="Ba'er Hetev" data-order="7"></i> to open <i data-commentator="Mishnah Berurah" data-label="כח"></i> it l'chatchila.
