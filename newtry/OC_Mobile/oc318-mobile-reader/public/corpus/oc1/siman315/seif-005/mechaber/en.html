<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i>5. A chair comprised of different sections and in order to sit on it one opens the chair, which in turn unfolds its leather, and when its use is terminated it is closed and its <i data-commentator="Magen Avraham" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כז"></i> leather folds,<i data-commentator="Ba'er Hetev" data-order="7"></i> is permissible <i data-commentator="Mishnah Berurah" data-label="כח"></i> to open initially.
