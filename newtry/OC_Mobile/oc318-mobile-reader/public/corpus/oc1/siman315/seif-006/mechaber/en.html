<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i>6. When arranging barrels on top of each other in such a way that one is above two, one should hold the top one in the air and place the bottom <i data-commentator="Turei Zahav" data-order="5"></i> ones below.<i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="כט"></i> However one should <i data-commentator="Ba'er Hetev" data-order="8"></i> not place the bottom barrels first and then place the top one above them.
