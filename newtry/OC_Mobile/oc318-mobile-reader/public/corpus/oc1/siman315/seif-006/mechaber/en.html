<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> When arranging barrels one atop another, one atop two — he should hold in his hand the upper ones and arrange the lower ones beneath it;<i data-commentator="Turei Zahav" data-order="5"></i> but <i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="כט"></i> he should not <i data-commentator="Ba'er Hetev" data-order="8"></i> arrange the lower ones first and place the upper one upon them.
