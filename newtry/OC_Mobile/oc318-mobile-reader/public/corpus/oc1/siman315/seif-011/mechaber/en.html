<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="מ"></i> A bridal canopy that does not have a tefach in its roof nor less than three adjacent to its roof a width of a <i data-commentator="Magen Avraham" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="מא"></i> tefach — since it is <i data-commentator="Ba'er Hetev" data-order="16"></i> fixed for this, it is permitted to spread it and it is permitted to take it <i data-commentator="Magen Avraham" data-order="17"></i> <i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> down; and this is provided <i data-commentator="Ba'er Hetev" data-order="17"></i> that it not hang <i data-commentator="Mishnah Berurah" data-label="מב"></i> a tefach over the bed.
