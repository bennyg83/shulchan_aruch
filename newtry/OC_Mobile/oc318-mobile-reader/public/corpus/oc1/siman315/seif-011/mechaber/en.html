<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="מ"></i>11. A Choson (wedding) canopy which is not a tefach wide at its top, nor a tefach wide within three <i data-commentator="Magen Avraham" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="מא"></i> tefachim to its top <i data-commentator="Ba'er Hetev" data-order="16"></i> may be erected and dismantled, because it is preset to do so, provided <i data-commentator="Magen Avraham" data-order="17"></i> <i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> that it does not <i data-commentator="Ba'er Hetev" data-order="17"></i> drape down a <i data-commentator="Mishnah Berurah" data-label="מב"></i> tefach below the bed.
