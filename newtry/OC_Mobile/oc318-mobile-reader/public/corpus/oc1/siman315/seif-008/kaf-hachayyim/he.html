<b>ח) שם. להתיר סוכה וכו'  </b>כגון שאין לה רק שני דפנות ורוצה לעשות מחיצת עראי לדופן ג' כדי להכשירה ע"ד המבואר לקמן בסי' תר"ל. ולהתיר טלטול כגון שרוצה לעשות מחיצת עראי במקום דאסור לטלטל כדי שיוכל לטלטל על ידה ע"ד המבואר בסי' שס"ב יעו"ש וכיון דחשבינן לה מחיצה לענין היתר טלטול או להכשיר סוכה הו"ל כבונה:
