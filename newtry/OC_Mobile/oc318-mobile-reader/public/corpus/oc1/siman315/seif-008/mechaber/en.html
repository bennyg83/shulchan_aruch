<i data-commentator="Turei Zahav" data-order="8"></i> <i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="לב"></i> Any sloped ohel <i data-commentator="Mishnah Berurah" data-label="לג"></i> that does not <i data-commentator="Mishnah Berurah" data-label="לד"></i> have a tefach in its roof nor less than three adjacent to its roof a width of a tefach — behold this is a temporary ohel, and one who makes it l'chatchila <i data-commentator="Magen Avraham" data-order="10"></i> on Shabbat <i data-commentator="Ba'er Hetev" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="לה"></i> is exempt.
