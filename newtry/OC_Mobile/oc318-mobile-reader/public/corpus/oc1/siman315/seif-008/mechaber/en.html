<i data-commentator="Turei Zahav" data-order="8"></i> <i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="לב"></i>8. Any tent <i data-commentator="Mishnah Berurah" data-label="לג"></i> which is <i data-commentator="Mishnah Berurah" data-label="לד"></i> slanted so that it is not a tefach wide at its top, nor a tefach wide within three tefachim to its top is a makeshift tent, and one who erects it on <i data-commentator="Magen Avraham" data-order="10"></i> Shabbos is <i data-commentator="Ba'er Hetev" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="לה"></i> patur (exempt).
