<i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> The people occupied with the eulogy at the time that the body is lying before them <i data-commentator="Mishnah Berurah" data-label="ט"></i> slip away one by one and recite <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="י"></i>[the Sh'ma] and pray [the Amidah]. If the body is not lying before them, they recite [Sh'ma] and pray, and the pre-burial-mourner sits and <i data-commentator="Mishnah Berurah" data-label="יא"></i> is silent.
