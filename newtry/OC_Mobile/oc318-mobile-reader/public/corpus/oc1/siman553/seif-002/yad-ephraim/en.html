<b>In the Taz, s.k. 2.</b> And on the contrary, it is an obligation upon him to eat meat, etc. See what my master, my grandfather, wrote in Bechor Shor at the end of Taanis, that oneg is one thing and simcha is another; see there, where he agreed with the Magen Avraham; and see below, siman 688, s.k. 8.
