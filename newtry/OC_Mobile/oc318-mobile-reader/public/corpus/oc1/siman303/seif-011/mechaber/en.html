<i data-commentator="Be'er HaGolah" data-label="א" data-order="23"></i> <i data-commentator="Mishnah Berurah" data-label="כח"></i>(23)(28) She may not go out with a kulyar, an <i data-commentator="Mishnah Berurah" data-label="כט"></i> ornament with which she fastens the openings of her cloak, nor with <i data-commentator="Mishnah Berurah" data-label="ל"></i> a koveles (30)(31),<i data-commentator="Mishnah Berurah" data-label="לא"></i> a knot in which good-smelling spice is tied.
