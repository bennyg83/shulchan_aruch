<i data-commentator="Be'er HaGolah" data-label="א" data-order="23"></i> <i data-commentator="Mishnah Berurah" data-label="כח"></i>11. A woman should not go out [wearing] a brooch, i.e., an <i data-commentator="Mishnah Berurah" data-label="כט"></i> ornament that joins the openings of her cloak, nor [wearing] a koveles, i.e., a <i data-commentator="Mishnah Berurah" data-label="ל"></i> knotted bag [which hangs <i data-commentator="Mishnah Berurah" data-label="לא"></i> from her neck] containing spices that produce a pleasant fragrance.
