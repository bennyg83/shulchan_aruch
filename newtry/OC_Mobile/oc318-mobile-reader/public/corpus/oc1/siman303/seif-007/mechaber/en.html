<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i>(16) She <i data-commentator="Mishnah Berurah" data-label="יח"></i> may not go out with a katlah (18), meaning a garment that has laces like trousers, into which she inserts a wide strap and ties it around her neck while the garment hangs on her heart — it is important and decorated with gold.
