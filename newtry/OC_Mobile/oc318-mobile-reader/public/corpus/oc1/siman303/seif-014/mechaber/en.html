<i data-commentator="Be'er HaGolah" data-label="ו" data-order="28"></i>14. [A woman]<i data-commentator="Mishnah Berurah" data-label="לו"></i> may go out [wearing] strands of hair that are wound around her own hair, whether they are made from hair or from <i data-commentator="Mishnah Berurah" data-label="לז"></i> other things, and even if made from the <i data-commentator="Ba'er Hetev" data-order="8"></i> <i data-commentator="Be'er HaGolah" data-label="ז" data-order="29"></i> <i data-commentator="Mishnah Berurah" data-label="לח"></i> hair of an animal, except an older woman should go out with the [hair of]<i data-commentator="Turei Zahav" data-order="9"></i> a younger women and vice versa.
