<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i>6. It is permitted [for a woman] to go out [wearing] a resokia, i.e., a wide piece [of material] from a cape, provided it has short strands hanging from it with which to tie and fasten it around her. If it has no strands it <i data-commentator="Mishnah Berurah" data-label="יז"></i> is forbidden.
