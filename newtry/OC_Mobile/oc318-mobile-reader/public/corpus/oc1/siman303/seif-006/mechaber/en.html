<i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i>(15) A resokia, meaning a wide piece of a cloak — if it has short hanging straps with which to tie and tighten it around her, tightening is permitted; if it has no straps (17) it <i data-commentator="Mishnah Berurah" data-label="יז"></i> is forbidden.
