<i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i>5. A woman may go out wearing a kelilah - an ornament which is placed on her forehead from ear to ear and is fastened with <i data-commentator="Ba'er Hetev" data-order="4"></i> straps which <i data-commentator="Mishnah Berurah" data-label="טז"></i> are hung. This is so whether it was made of golden links strung on a thread or of golden links affixed to a cloth.
