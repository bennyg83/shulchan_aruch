<i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i>(14) A kelilah, an ornament she places on her forehead from ear to ear and ties with hanging straps — she <i data-commentator="Ba'er Hetev" data-order="4"></i> may go <i data-commentator="Mishnah Berurah" data-label="טז"></i> out with it (4)(16), whether made of gold pieces strung on a thread or those pieces fixed in a cloth.
