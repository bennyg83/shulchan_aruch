<i data-commentator="Be'er HaGolah" data-label="ז" data-order="51"></i>(51)(69) Young girls who pierce their ears to place rings when they grow, and so the holes not close — they put cumin in them; permitted to go <i data-commentator="Mishnah Berurah" data-label="סט"></i> out with them, and likewise if they put threads in those holes — permitted to go out with them if not dyed (52).<i data-commentator="Be'er HaGolah" data-label="ח" data-order="52"></i> But if dyed <i data-commentator="Magen Avraham" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="ע"></i>(16)(70) it is forbidden.
