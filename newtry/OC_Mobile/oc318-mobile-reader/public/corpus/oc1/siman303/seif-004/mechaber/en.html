<i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i>(12) She may not go out with a golden city — Rashi explained <i data-commentator="Mishnah Berurah" data-label="יד"></i> it is a round ornament on which they depict a city form and in the middle a tongue (14)(15)<i data-commentator="Mishnah Berurah" data-label="טו"></i> with which they attach it to the garment (13),<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> and Rabbeinu Tam explained it is like a crown for the head.
