<i data-commentator="Be'er HaGolah" data-label="ש" data-order="66"></i> <i data-commentator="Mishnah Berurah" data-label="פה"></i>(66)(86) Forbidden to comb with a comb on Shabbat (13), even one <i data-commentator="Ba'er Hetev" data-order="13"></i> made of pig <i data-commentator="Magen Avraham" data-order="22"></i> <i data-commentator="Mishnah Berurah" data-label="פו"></i> bristles <i data-commentator="Mishnah Berurah" data-label="פז"></i>(22)(87)(88) lest hairs be uprooted.<small>(But permitted (23) to <i data-commentator="Magen Avraham" data-order="23"></i> smooth and <i data-commentator="Mishnah Berurah" data-label="פח"></i> arrange with the hand (Beit Yosef).</small>
