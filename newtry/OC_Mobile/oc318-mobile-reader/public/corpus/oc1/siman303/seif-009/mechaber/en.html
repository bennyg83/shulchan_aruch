<i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> <i data-commentator="Mishnah Berurah" data-label="כא"></i>9. A woman may not go out with a needle. And if <i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="כב"></i> she does go out like this she is liable.<i data-commentator="Be'er HaGolah" data-label="ר" data-order="20"></i> If <i data-commentator="Turei Zahav" data-order="7"></i> it is a pin,<i data-commentator="Mishnah Berurah" data-label="כג"></i> and it is used <i data-commentator="Magen Avraham" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> to close her garments together, it <i data-commentator="Turei Zahav" data-order="8"></i> is permitted to go out with it. And if not, then it <i data-commentator="Mishnah Berurah" data-label="כה"></i> is forbidden.
