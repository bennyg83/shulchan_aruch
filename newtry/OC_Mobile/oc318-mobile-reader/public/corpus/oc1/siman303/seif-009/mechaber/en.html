<i data-commentator="Be'er HaGolah" data-label="ק" data-order="19"></i> <i data-commentator="Mishnah Berurah" data-label="כא"></i>(19)(21) She may not go out with a perforated needle, and if she <i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Ba'er Hetev" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="כב"></i> went out she is liable (7)(5)(22). With an unperforated one <i data-commentator="Be'er HaGolah" data-label="ר" data-order="20"></i>(20)<i data-commentator="Turei Zahav" data-order="7"></i>— if she uses <i data-commentator="Mishnah Berurah" data-label="כג"></i> it to fasten her <i data-commentator="Magen Avraham" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> knots (7)(23) she may go out <i data-commentator="Turei Zahav" data-order="8"></i> with it (8)(24); if she does not fasten her knots with it (25)<i data-commentator="Mishnah Berurah" data-label="כה"></i> it is forbidden.
