<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i>(17) She may <i data-commentator="Mishnah Berurah" data-label="יט"></i> not go out with nose <i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i> rings (18).<i data-commentator="Turei Zahav" data-order="6"></i> But she may <i data-commentator="Mishnah Berurah" data-label="כ"></i> go out (6)(20) with ear rings.<small>Because their ears are covered. And where they are accustomed to reveal the ears it is forbidden to go out with ear rings where it is their way to remove them from there (Or Zarua).</small>
