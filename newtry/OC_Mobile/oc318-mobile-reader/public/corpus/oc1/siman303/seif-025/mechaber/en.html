<i data-commentator="Be'er HaGolah" data-label="ס" data-order="60"></i>(60) It is forbidden for a woman to pass <i data-commentator="Mishnah Berurah" data-label="עט"></i> a comb over her face <i data-commentator="Magen Avraham" data-order="19"></i> on Shabbat (79) because of dyeing; and for this reason forbidden <i data-commentator="Be'er HaGolah" data-label="ע" data-order="61"></i> <i data-commentator="Mishnah Berurah" data-label="פ"></i>(61)(80) to apply kohl on Shabbat; and for this reason forbidden <i data-commentator="Be'er HaGolah" data-label="פ" data-order="62"></i> <i data-commentator="Mishnah Berurah" data-label="פא"></i>(62)(81) to smear dough on her face and when she removes it it reddens the flesh.
