<i data-commentator="Be'er HaGolah" data-label="ש" data-order="21"></i>10. A woman may not go out with a signet ring; and if <i data-commentator="Ba'er Hetev" data-order="6"></i> she does <i data-commentator="Magen Avraham" data-order="9"></i> go out <i data-commentator="Mishnah Berurah" data-label="כו"></i> with it, she <i data-commentator="Be'er HaGolah" data-label="ת" data-order="22"></i> is liable. If it has no signet, she should <i data-commentator="Mishnah Berurah" data-label="כז"></i> not go out, but if she does she is exempt.
