<i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> A blind person despite that he never saw lights, may <i data-commentator="Mishnah Berurah" data-label="יט"></i>&quot;poreis al Sh'ma&quot;, and bless &quot;the Former of the lights&quot;,<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> since he enjoys the lights that others see when they direct him on the road on which he walks.
