<i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> A blind person, even if he never saw light <i data-commentator="Mishnah Berurah" data-label="יט"></i> from birth, may poreis al Shema and bless Yotzer haMaoros,<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> because he benefits from the light others see when they show him the way he should walk.
