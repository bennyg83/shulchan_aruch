<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> A טלית used for the מצות [of <i data-commentator="Mishnah Berurah" data-label="ט"></i>ציצית] that wore out, a person should not use them.<i data-commentator="Mishnah Berurah" data-label="י"></i> And one is not permitted <i data-commentator="Mishnah Berurah" data-label="יא"></i> to wipe himself with them, and not to designate them for any disgusting use, rather he <i data-commentator="Mishnah Berurah" data-label="יב"></i> can throw them away, and <i data-commentator="Mishnah Berurah" data-label="יג"></i> they will wear out [on their own].
