<i data-commentator="Be'er HaGolah" data-label="2" data-order="2"></i>Talleisim used for a mitzvah that became worn out should be set aside by a person. <i data-commentator="Mishnah Berurah" data-label="9"></i>He may not <i data-commentator="Mishnah Berurah" data-label="10"></i>wipe himself with them or designate them for <i data-commentator="Mishnah Berurah" data-label="11"></i>a degrading use. Rather, <i data-commentator="Mishnah Berurah" data-label="12"></i>he should discard them and allow them to wear away on their own.
