<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> Tallisos used for a mitzvah that <i data-commentator="Mishnah Berurah" data-label="ט"></i> wore out — a person separates himself from <i data-commentator="Mishnah Berurah" data-label="י"></i> them. One may not <i data-commentator="Mishnah Berurah" data-label="יא"></i> wipe oneself with them, nor designate them for a degrading use; rather one throws <i data-commentator="Mishnah Berurah" data-label="יב"></i> them away and they <i data-commentator="Mishnah Berurah" data-label="יג"></i> become worn out on their own.
