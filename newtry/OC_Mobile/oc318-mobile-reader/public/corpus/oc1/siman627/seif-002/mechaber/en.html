<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> One who sleeps <i data-commentator="Mishnah Berurah" data-label="ד"></i> under a slanting canopy that surrounds a bed in <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ה"></i> a sukkah - if it is not higher than 10 tefachim or if' <i data-commentator="Mishnah Berurah" data-label="ו"></i> it has no roof the width of a tefach, he has fulfilled his obligation.
