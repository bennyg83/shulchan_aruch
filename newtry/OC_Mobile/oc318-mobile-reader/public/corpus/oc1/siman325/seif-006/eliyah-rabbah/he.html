[יד] <b>בכדי שיעשו וכו'.</b> הכל לפי שעשה אם היה על ידי שיירא ושהא יום אחד צריך להמתין יום אחד ואם היה רוכב סוס ושהא שעה אחת ימתין שעה אחת ואם המקום רחוק שלושה ימים אין צריך להמתין מיום ראשון נגד יום השבת שנעשה באיסורא (כנסת הגדולה), והיינו ביום ולא בלילה דבליל שבת ודאי לא רכב (מגן אברהם) וצריך עיון:
