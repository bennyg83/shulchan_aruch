<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="כו"></i> If he gathered and caught <i data-commentator="Mishnah Berurah" data-label="כז"></i> on behalf of a Jew,<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> or on behalf of a Jew and a non-Jew,<i data-commentator="Mishnah Berurah" data-label="כח"></i> one must wait until evening the time it <i data-commentator="Mishnah Berurah" data-label="כט"></i> would take to do them.
