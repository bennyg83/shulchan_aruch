<i data-commentator="Be'er HaGolah" data-label="כ" data-order="33"></i> If a non-Jew gathered and fed a Jew's animal — one <i data-commentator="Magen Avraham" data-order="29"></i> <i data-commentator="Mishnah Berurah" data-label="עא"></i> need not protest him for the moment; but if he <i data-commentator="Mishnah Berurah" data-label="עב"></i> is accustomed <i data-commentator="Magen Avraham" data-order="30"></i> to do so — one must protest.
