<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> Where there is concern for darkei shalom, or <i data-commentator="Mishnah Berurah" data-label="ט"></i> the non-Jew is mute, it is permitted to give him <i data-commentator="Mishnah Berurah" data-label="י"></i> or to send to him via another non-Jew. And <i data-commentator="Ba'er Hetev" data-order="4"></i> the same applies <i data-commentator="Magen Avraham" data-order="6"></i> for the need of a mitzvah, such as to remove chametz from his house on Pesach (Mordechai).<small> <i data-commentator="Mishnah Berurah" data-label="יא"></i> <i data-commentator="Mishnah Berurah" data-label="יב"></i>.</small>
