<i data-commentator="Be'er HaGolah" data-label="י" data-order="32"></i> Even when the Gentile is not <i data-commentator="Mishnah Berurah" data-label="סט"></i> acquainted with the Jew if he says that he is doing it for the Jew, or even when he does not say anything but his actions attest that his intentions are for the Jew, for example, he lights a candle in a Jew’s presence and leaves,<i data-commentator="Mishnah Berurah" data-label="ע"></i> it is prohibited to benefit from it.
