<i data-commentator="Be'er HaGolah" data-label="י" data-order="32"></i> Even though he does not recognize him <i data-commentator="Mishnah Berurah" data-label="סט"></i>— if he says explicitly that he does it for a Jew's need, or even if he does not say so and his actions prove that he does it for a Jew's need, such as that he lit a lamp in a house where a Jew is and the <i data-commentator="Mishnah Berurah" data-label="ע"></i> non-Jew went away — it is forbidden.
