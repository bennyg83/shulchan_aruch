<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> Fish that <i data-commentator="Mishnah Berurah" data-label="כא"></i> were caught and <i data-commentator="Mishnah Berurah" data-label="כב"></i> fruit <i data-commentator="Magen Avraham" data-order="12"></i> that were picked by <i data-commentator="Turei Zahav" data-order="4"></i> a Gentile for <i data-commentator="Mishnah Berurah" data-label="כג"></i> himself are forbidden <i data-commentator="Ba'er Hetev" data-order="8"></i> for a Jew.<i data-commentator="Magen Avraham" data-order="13"></i> <i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> Even if' <i data-commentator="Ba'er Hetev" data-order="9"></i> there is doubt as to whether they were caught or picked today they are forbidden on <i data-commentator="Mishnah Berurah" data-label="כה"></i> Shabbos. They are permitted immediately after Shabbos even if they were caught or picked on Shabbos.
