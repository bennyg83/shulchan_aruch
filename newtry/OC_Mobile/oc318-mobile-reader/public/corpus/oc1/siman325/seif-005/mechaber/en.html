<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> A non-Jew <i data-commentator="Mishnah Berurah" data-label="כא"></i> who caught fish <i data-commentator="Mishnah Berurah" data-label="כב"></i> or <i data-commentator="Magen Avraham" data-order="12"></i> gathered fruit for himself <i data-commentator="Turei Zahav" data-order="4"></i>— they are <i data-commentator="Mishnah Berurah" data-label="כג"></i> forbidden to a <i data-commentator="Ba'er Hetev" data-order="8"></i> Jew; and even <i data-commentator="Magen Avraham" data-order="13"></i> <i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> if there' <i data-commentator="Ba'er Hetev" data-order="9"></i> is doubt whether he gathered or caught them today, they are forbidden on that day; but <i data-commentator="Mishnah Berurah" data-label="כה"></i> in the evening they are permitted immediately, even if certainly he gathered and caught them that day.
