<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> Anyone who recites a <i data-commentator="Mishnah Berurah" data-label="יח"></i> blessing that is unnecessary is considered as one who takes the Name of Heaven in <i data-commentator="Mishnah Berurah" data-label="יט"></i> vain, and it is as if <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="כ"></i> he swore <i data-commentator="Ba'er Hetev" data-order="6"></i> a false <i data-commentator="Mishnah Berurah" data-label="כא"></i> oath. It is forbidden to respond &quot;Amen&quot; after him.
