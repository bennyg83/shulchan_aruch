<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> If it has thorny things on its spine, was smashed, shrunk, or bent forwards <i data-commentator="Mishnah Berurah" data-label="לג"></i> such that its spine <i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> <i data-commentator="Mishnah Berurah" data-label="לד"></i> was like <i data-commentator="Mishnah Berurah" data-label="לה"></i> the back of a hunchback, it is invalid. Similarly,<i data-commentator="Mishnah Berurah" data-label="לו"></i> if one side was bent, it' <i data-commentator="Be'er HaGolah" data-label="ס" data-order="15"></i> is invalid. But if it is bent backward,<i data-commentator="Mishnah Berurah" data-label="לז"></i> it is valid, because this is how it grows.
