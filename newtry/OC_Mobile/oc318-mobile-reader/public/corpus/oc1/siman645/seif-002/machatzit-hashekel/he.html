<b>(ס"ק ב) נפרצו כו'</b> דדמי לבהמ' שנשתברו ר"צ טריפה. ר"ל דחזינן לענין פסולי אתרוג מדמה הש"ס דף ל"ו ע"א לטריפות הריא' ס"ל למ"א דבלולב ג"כ מדמינן לטרפות בהמה. אולם בספר א"ר חולק חדא מנ"ל לדמות בזה לטרפות שנשברה שדרה. ועוד דגם בנשברה השדרה טרפה אם לא שהחוט קיים. וזה לא שייך בלולב. לכן פסק דבכל ענין פסול:
