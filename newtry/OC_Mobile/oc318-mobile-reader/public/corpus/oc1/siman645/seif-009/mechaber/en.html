<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> If <i data-commentator="Mishnah Berurah" data-label="לח"></i> it is bent at <i data-commentator="Mishnah Berurah" data-label="לט"></i> the top,<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> it is invalid. This is specifically when its <i data-commentator="Turei Zahav" data-order="10"></i> spine is <i data-commentator="Magen Avraham" data-order="8"></i> bent. However,<i data-commentator="Mishnah Berurah" data-label="מ"></i> if its leaves <i data-commentator="Mishnah Berurah" data-label="מא"></i> are bent at the top, as they are in many lulavs, it is <i data-commentator="Ba'er Hetev" data-order="9"></i> <i data-commentator="Mishnah Berurah" data-label="מב"></i> valid.
