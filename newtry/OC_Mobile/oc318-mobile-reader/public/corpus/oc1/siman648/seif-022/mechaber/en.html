<i data-commentator="Be'er HaGolah" data-label="י" data-order="33"></i>22. The dimensions of a small etrog that are smaller than an <i data-commentator="Mishnah Berurah" data-label="סו"></i> egg is invalid. If it is the size of <i data-commentator="Be'er HaGolah" data-label="כ" data-order="34"></i> an egg, even if it is <i data-commentator="Turei Zahav" data-order="19"></i> unripe and has <i data-commentator="Magen Avraham" data-order="24"></i> not finished growing, it is valid. It can be however big <i data-commentator="Mishnah Berurah" data-label="סז"></i> and is still <i data-commentator="Mishnah Berurah" data-label="סח"></i> valid.
