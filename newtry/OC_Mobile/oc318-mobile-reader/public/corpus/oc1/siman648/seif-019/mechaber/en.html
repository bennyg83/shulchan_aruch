<i data-commentator="Be'er HaGolah" data-label="ו" data-order="29"></i> <i data-commentator="Mishnah Berurah" data-label="ס"></i>19. If one grew it in a mold and shaped it to look like something else, it is invalid.<i data-commentator="Be'er HaGolah" data-label="ז" data-order="30"></i> If one shaped it to look like it <i data-commentator="Mishnah Berurah" data-label="סא"></i> should, it is valid even if it is shaped like many planks.
