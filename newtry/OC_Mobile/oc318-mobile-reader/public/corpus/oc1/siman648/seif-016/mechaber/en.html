<i data-commentator="Be'er HaGolah" data-label="ג" data-order="26"></i>16. If it is black or white in one place, it is invalid if it is the <i data-commentator="Mishnah Berurah" data-label="נו"></i> majority [of the etrog]. If [it is black or white] in two or three places, it is treated like boils, invalidating even in a minority.
