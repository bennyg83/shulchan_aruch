<i data-commentator="Be'er HaGolah" data-label="ד" data-order="4"></i> All the food (that one eats) is combined to this measure (of less than a date), even salt <i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> <i data-commentator="Turei Zahav" data-order="3"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> that is on meat and juice that is on a vegetable, but eating and drinking are not <i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> being combined (they do not add together to get the <i data-commentator="Mishnah Berurah" data-label="ה"></i> quantity of a date, they are measured separately).
