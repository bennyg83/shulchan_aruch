<i data-commentator="Magen Avraham" data-order="10"></i> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="6"></i> <i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="כא"></i> If one acted <i data-commentator="Ba'er Hetev" data-order="10"></i> <i data-commentator="Sha'arei Teshuvah" data-order="10"></i> intentionally and did not pray one prayer, there is no teshuvah for it, even at the prayer immediately adjoining it.<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> And if one <i data-commentator="Turei Zahav" data-order="5"></i> wishes, one may pray it as a <i data-commentator="Mishnah Berurah" data-label="כב"></i> voluntary prayer, and one does not need an innovation if one prays it at the prayer immediately adjoining it.
