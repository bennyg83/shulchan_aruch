<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> One who erred and mentioned an <i data-commentator="Turei Zahav" data-order="12"></i> event of the other <i data-commentator="Ba'er Hetev" data-order="18"></i> days in prayer when not <i data-commentator="Mishnah Berurah" data-label="לז"></i> at its time —<i data-commentator="Mishnah Berurah" data-label="לח"></i> it is not considered an interruption.<small>However, if one remembers that one erred, one stops, even in the middle of the blessing [Ohr Zarua in Tractate Berachot].]:</small>
