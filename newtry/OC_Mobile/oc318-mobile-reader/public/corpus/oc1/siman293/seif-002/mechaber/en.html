<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i>2. One must be careful <i data-commentator="Mishnah Berurah" data-label="ב"></i> not to do work until he <i data-commentator="Mishnah Berurah" data-label="ג"></i> sees three small stars <i data-commentator="Sha'arei Teshuvah" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> that are <i data-commentator="Magen Avraham" data-order="1"></i> not scattered, but rather in a <i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> row in one place [in the sky].<i data-commentator="Mishnah Berurah" data-label="ה"></i> If it <i data-commentator="Magen Avraham" data-order="2"></i> is a cloudy day, one should wait until he is no longer uncertain at <i data-commentator="Mishnah Berurah" data-label="ו"></i> all [that three stars will <i data-commentator="Mishnah Berurah" data-label="ז"></i> have appeared].
