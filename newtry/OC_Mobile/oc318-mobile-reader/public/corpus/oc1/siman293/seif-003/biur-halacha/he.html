<b> כגון שצריך להחשיך וכו'</b> -  מדברי המגן אברהם משמע דכדי שלא יתפלל בדרך במהלך בלבד מותר לו להקדים להתפלל בביתו ולא העתקתיו משום דהרי בסק"ה כתב דימתין לקרות ק"ש עד צה"כ ולא יסמוך גאולה לתפלה וכבר כתב בעצמו בסימן פ"ט דהעולם סומכין עכשיו אמ"ד סמיכת גאולה לתפלה עדיף מתפלה מעומד וכ"כ בספר תוספת שבת:
