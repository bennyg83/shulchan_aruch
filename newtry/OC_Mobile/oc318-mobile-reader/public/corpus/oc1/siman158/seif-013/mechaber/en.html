<i data-commentator="Be'er HaGolah" data-label="ת" data-order="22"></i> One who dunks his hands [in a mikvah] can <i data-commentator="Magen Avraham" data-order="18"></i> <i data-commentator="Mishnah Berurah" data-label="מו"></i> eat [bread]<i data-commentator="Ba'er Hetev" data-order="19"></i> without drying <i data-commentator="Be'er HaGolah" data-label="א" data-order="23"></i>[his hands]. Similarly, if he washed both hands at the same time with <i data-commentator="Ba'er Hetev" data-order="20"></i> a reviis of water or if he washed each hand separately with a reviis on each hand[, he does not need to dry <i data-commentator="Eshel Avraham" data-label="א" data-order="3"></i> his hands].
