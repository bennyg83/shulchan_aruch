<b>אין משנין</b>. כ' ב"י בשם הג"א מעות שחשב בלבו לחלקם ביום פורים אינו רשאי לשנותו עכ"ל ועבי"ד ססי' רנ"ח ובח"מ סי' רי"ב ס"ח:<br />
