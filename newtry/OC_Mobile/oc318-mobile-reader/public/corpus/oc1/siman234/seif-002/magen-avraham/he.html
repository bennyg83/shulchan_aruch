<b>קודם אשרי</b>. ומ"ע בתשו' סימן י"ד כתב בשם הזוהר לאומרה אחר אשרי משום דבסוכ' דף כ"ג אית' ששחרית היו מתפללין אחר הקרבת התמיד ומנחה היו מתפללין קודם הקרבת התמיד ואשרי הוה כמו תפלה ע"כ, וטוב לומר ג"כ פטום הקטורת, כ' ל"ח טוב לומר הודו לה' ברכו וכו' עד והוא רחום מפני שהיו אומרים אותו לפני הארון בערבית:
