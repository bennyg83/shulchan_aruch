<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> <i data-commentator="Turei Zahav" data-order="1"></i> The king's soldiers who entered Jewish homes, whether by force <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ו"></i> or willingly — if the <i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> homeowners have in those places where the gentiles entered utensils forbidden to <i data-commentator="Mishnah Berurah" data-label="ז"></i> move on Shabbat, [the gentiles] do <i data-commentator="Mishnah Berurah" data-label="ח"></i> not prevent [carrying]<i data-commentator="Mishnah Berurah" data-label="ט"></i> upon them.
