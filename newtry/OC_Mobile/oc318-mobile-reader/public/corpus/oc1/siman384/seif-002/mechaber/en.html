<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> <i data-commentator="Turei Zahav" data-order="1"></i> The king's soldiers who entered into the homes of Jews, whether <i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ו"></i> by force or willingly — if <i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> the homeowners have in those places where the non-Jews entered utensils that are <i data-commentator="Mishnah Berurah" data-label="ז"></i> forbidden to move on Shabbat, [the non-Jews]<i data-commentator="Mishnah Berurah" data-label="ח"></i> do not prevent [carrying]<i data-commentator="Mishnah Berurah" data-label="ט"></i> upon them.
