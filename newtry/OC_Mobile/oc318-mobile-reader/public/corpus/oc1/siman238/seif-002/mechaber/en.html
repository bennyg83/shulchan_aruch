<i data-commentator="Be'er HaGolah" data-label="ב" data-order="2"></i> If a person <i data-commentator="Mishnah Berurah" data-label="ג"></i> has a fixed daily portion of study and was preoccupied during the day and did not complete it, he <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Eshel Avraham" data-label="א" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ד"></i> should make it <i data-commentator="Ba'er Hetev" data-order="2"></i> up immediately <i data-commentator="Mishnah Berurah" data-label="ה"></i> at night.
