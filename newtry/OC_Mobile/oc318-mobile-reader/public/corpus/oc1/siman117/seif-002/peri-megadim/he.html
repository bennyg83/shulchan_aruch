<b>בש״ת</b> עט״ז העלה בחזרה אין לומר אף בש״ת ותן טל ומטר רק בלחש יכול לאומרה ומנהגינו לומר יה״ר ולא להזכיר בפי׳ תיבות אלו ותן טל ומטר כ״א בפסוקים ושאר לשונות ועא״ר. ויראה מ״ש המחבר יחיד אם שעה בברכת השנים אין חוזר הא הזיד ואמר בברכת השנים חוזר ואפשר לראש התפלה כבסימן קי״ד סעיף ז׳ יע״ש עמ״ש במ״א ד׳:
