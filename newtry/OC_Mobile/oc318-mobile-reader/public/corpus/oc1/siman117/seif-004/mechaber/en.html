<i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="טו"></i> <i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> If one didn't ask for rain in the rainy season,<i data-commentator="Ba'er Hetev" data-order="8"></i> <i data-commentator="Sha'arei Teshuvah" data-order="8"></i> we make [that person] go back [and pray again] even though <i data-commentator="Turei Zahav" data-order="3"></i>[that person] asked for dew.<i data-commentator="Ba'er Hetev" data-order="9"></i> But if [that person] asked for rain and not dew, we do not make [that person] go back [and pray again].
