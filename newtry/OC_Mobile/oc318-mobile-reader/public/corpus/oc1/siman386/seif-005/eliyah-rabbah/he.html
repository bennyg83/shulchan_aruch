[ה] <b>בכל מיני וכו'.</b> תמיהני שהשמיט מה שכתב בשולחן ערוך אפילו ארבע וחמשה מיני מאכל מצטרפין למזון שתי סעודות (מלבושי יום טוב), ולעניות דעתי דסבירא ליה ללבוש כראב"ד שהביא בית יוסף דדוקא עירובי תחומין מצטרפין וכן המגיד כתב הרשב"א לא הכריע, ויותר נראה לי שנחסר בדפוס וסימני הסעיפים מוכיחין שדילג מד' לו':
