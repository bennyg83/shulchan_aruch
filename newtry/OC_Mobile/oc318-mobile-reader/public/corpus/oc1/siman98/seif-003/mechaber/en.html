<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> One should pray in a manner of supplications, like a homeless man who <i data-commentator="Mishnah Berurah" data-label="ח"></i> asks [for something] at [someone's] entrance. And [one should pray] at a relaxed pace, so that it should <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="ט"></i> not appear as a burden from which one is seeking to be exempted.
