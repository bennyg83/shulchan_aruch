<i data-commentator="Be'er HaGolah" data-label="ז" data-order="8"></i>(6) One who employs a non-Jew for the period of a year or more is forbidden from sending a letter with him on the eve of Shabbat.<i data-commentator="Mishnah Berurah" data-label="יט"></i> RAMA: However, if he is only employed for letter-carrying,<i data-commentator="Magen Avraham" data-order="9"></i> <i data-commentator="Ba'er Hetev" data-order="8"></i> there some who permit this, as established prior in Siman 244: 6.<small> <i data-commentator="Mishnah Berurah" data-label="כ"></i></small>
