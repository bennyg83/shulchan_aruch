<i data-commentator="Be'er HaGolah" data-label="ד" data-order="5"></i> <i data-commentator="Mishnah Berurah" data-label="יג"></i>(3) If he employs him daily, something fixed every day when he travels and when he returns, but he isn't particular with him regarding when he travels, if it’s the eve of Shabbat <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יד"></i> then it’s forbidden because it’s considered like Shabbat [and] it appears he stipulated with him about it.
