<i data-commentator="Be'er HaGolah" data-label="ו" data-order="7"></i>(5) If the non-Jew <i data-commentator="Mishnah Berurah" data-label="יז"></i> is traveling to another location on his own accord and a Jew gives him a letter [to take to that <i data-commentator="Magen Avraham" data-order="8"></i> location], it <i data-commentator="Mishnah Berurah" data-label="יח"></i> is permitted <i data-commentator="Ba'er Hetev" data-order="7"></i> in all cases.
