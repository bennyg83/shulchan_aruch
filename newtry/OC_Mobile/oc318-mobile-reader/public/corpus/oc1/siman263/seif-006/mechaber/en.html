<i data-commentator="Be'er HaGolah" data-label="ל" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="כח"></i> Young men who go to study outside their homes must kindle a Shabbat candle in their room <i data-commentator="Mishnah Berurah" data-label="כט"></i> and bless <i data-commentator="Magen Avraham" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="ל"></i> on it; but one who is with his wife need <i data-commentator="Magen Avraham" data-order="14"></i> not kindle in his room <i data-commentator="Ba'er Hetev" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="לא"></i> and bless on it, since his wife blesses on his behalf.
