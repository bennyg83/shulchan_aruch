<i data-commentator="Be'er HaGolah" data-label="ל" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="כח"></i> Lads which travel to learn away from their homes must ignite the Sabbath lamp in their <i data-commentator="Mishnah Berurah" data-label="כט"></i> rooms, and <i data-commentator="Magen Avraham" data-order="13"></i> <i data-commentator="Mishnah Berurah" data-label="ל"></i> bless over them, but one who is married need <i data-commentator="Magen Avraham" data-order="14"></i> not ignite in his room <i data-commentator="Ba'er Hetev" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="לא"></i> and bless over them because his wife blesses in his stead.
