<i data-commentator="Be'er HaGolah" data-label="ת" data-order="23"></i> Even though the congregation has not yet prayed — if an individual preceded them and prayed Shabbat <i data-commentator="Mishnah Berurah" data-label="מט"></i> prayer from plag haminchah, acceptance of Shabbat falls upon him and melacha is forbidden;<i data-commentator="Mishnah Berurah" data-label="נ"></i> and even if he says he does not wish to accept Shabbat.
