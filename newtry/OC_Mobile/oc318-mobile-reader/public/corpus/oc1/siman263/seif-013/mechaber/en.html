<i data-commentator="Be'er HaGolah" data-label="ב" data-order="25"></i> A person who comes to a city on Erev Shabbat and the people of the city have already accepted Shabbat upon themselves — even though the day is still great, if he has money or any object on <i data-commentator="Magen Avraham" data-order="25"></i> <i data-commentator="Mishnah Berurah" data-label="נב"></i> him he must <i data-commentator="Ba'er Hetev" data-order="19"></i> drop it.
