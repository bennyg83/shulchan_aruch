<i data-commentator="Be'er HaGolah" data-label="ב" data-order="25"></i> A man that comes to a city on Sabbath Eve and already the city's residents have accepted the Sabbath -- even though the day yet stretches, if he has upon him some trifle or any object <i data-commentator="Magen Avraham" data-order="25"></i> <i data-commentator="Mishnah Berurah" data-label="נב"></i> he must <i data-commentator="Ba'er Hetev" data-order="19"></i> drop it.
