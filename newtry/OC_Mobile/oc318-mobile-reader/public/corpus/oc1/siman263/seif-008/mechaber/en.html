<i data-commentator="Be'er HaGolah" data-label="נ" data-order="15"></i> Two or three men that eat in one place — there are those who say <i data-commentator="Magen Avraham" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="לה"></i> that each one blesses on his own candelabra, but <i data-commentator="Ba'er Hetev" data-order="12"></i> this <i data-commentator="Be'er HaGolah" data-label="ס" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="לו"></i> is a fumbling of the issue.<i data-commentator="Be'er HaGolah" data-label="ע" data-order="17"></i> And it is correct to be wary of ambiguous blessings, so none bar one should bless. (). <small>(RAMA: But this <i data-commentator="Mishnah Berurah" data-label="לז"></i> is not our <i data-commentator="Mishnah Berurah" data-label="לח"></i> practice.</small>
