<i data-commentator="Be'er HaGolah" data-label="נ" data-order="15"></i> Two or three householders who eat in one place — there are those who say <i data-commentator="Magen Avraham" data-order="15"></i> <i data-commentator="Mishnah Berurah" data-label="לה"></i> that each one blesses on his own lamp; and <i data-commentator="Ba'er Hetev" data-order="12"></i> there <i data-commentator="Be'er HaGolah" data-label="ס" data-order="16"></i> <i data-commentator="Mishnah Berurah" data-label="לו"></i> are those who fumble in the <i data-commentator="Be'er HaGolah" data-label="ע" data-order="17"></i> matter; and it is correct to be careful regarding a doubtful blessing and not bless except one.. <small>(But we do <i data-commentator="Mishnah Berurah" data-label="לז"></i> not practice thus:<i data-commentator="Mishnah Berurah" data-label="לח"></i>.</small>
