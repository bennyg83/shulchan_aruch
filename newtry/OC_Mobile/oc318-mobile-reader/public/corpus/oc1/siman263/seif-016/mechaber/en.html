<i data-commentator="Be'er HaGolah" data-label="י" data-order="33"></i> If he comes to the synagogue close to the congregation's acceptance <i data-commentator="Mishnah Berurah" data-label="סב"></i> of Shabbat — he begins to pray Minchah, and even though while he is praying the congregation accepts Shabbat <i data-commentator="Magen Avraham" data-order="29"></i> <i data-commentator="Eshel Avraham" data-label="א" data-order="2"></i>— this is nothing,<i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="סג"></i> since he began in a permitted state.
