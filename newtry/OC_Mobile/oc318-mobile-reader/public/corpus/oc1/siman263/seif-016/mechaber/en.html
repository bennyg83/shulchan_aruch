<i data-commentator="Be'er HaGolah" data-label="י" data-order="33"></i> If he arrives at a synagogue close to the acceptance by the <i data-commentator="Mishnah Berurah" data-label="סב"></i> congregation of the Sabbath, he begins to pray the afternoon prayer and even though whilst he prays the congregation accepts <i data-commentator="Magen Avraham" data-order="29"></i> <i data-commentator="Eshel Avraham" data-label="א" data-order="2"></i> the Sabbath, this does not <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="סג"></i> matter -- behold, he has begun permissibly.
