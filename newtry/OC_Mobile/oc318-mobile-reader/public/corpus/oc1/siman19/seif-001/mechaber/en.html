<b>The time of the blessing on <i>tzitzis</i> — it contains two clauses.</b><br><i>Tzitzis</i> is an obligation on the person, not on the garment: whenever one is not wearing the <i>tallis</i> one is exempt from <i>tzitzis</i>; therefore one does not bless on making <i>tzitzis</i>, for the mitzvah is only in wearing it.
