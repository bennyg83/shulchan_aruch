<b>The time of the blessing on tzitzis — it</b><br> <i data-commentator="Ateret Zekenim" data-label="♦" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> contains two <i data-commentator="Turei Zahav" data-order="1"></i> clauses. Tzitzis is an obligation <i data-commentator="Ba'er Hetev" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="א"></i> on the person, not on the garment: whenever one is not wearing <i data-commentator="Mishnah Berurah" data-label="ב"></i> the tallis one is exempt from tzitzis; therefore one does <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Ba'er Hetev" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> not bless on making tzitzis, for the mitzvah is <i data-commentator="Mishnah Berurah" data-label="ד"></i> only in wearing it.
