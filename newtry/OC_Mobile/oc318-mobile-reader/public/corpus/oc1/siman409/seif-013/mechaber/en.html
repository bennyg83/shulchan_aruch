<i data-commentator="Be'er HaGolah" data-label="י" data-order="34"></i> This leniency was <i data-commentator="Mishnah Berurah" data-label="עג"></i> permitted only for one coming on the road, but not for one who is at home. If he said so, it does not count for him and he has only <i data-commentator="Mishnah Berurah" data-label="עד"></i> the shevitah of his home.
