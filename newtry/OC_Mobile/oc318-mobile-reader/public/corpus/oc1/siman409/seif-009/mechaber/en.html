<i data-commentator="Be'er HaGolah" data-label="ב" data-order="26"></i> If one person or many said to someone &quot;go and make an eruv for us&quot; and he made it for them <i data-commentator="Be'er HaGolah" data-label="ג" data-order="27"></i> <i data-commentator="Magen Avraham" data-order="18"></i> in whichever direction he chose — it is a valid eruv and they may use it,<i data-commentator="Mishnah Berurah" data-label="נב"></i> since they did not specify a direction for him.
