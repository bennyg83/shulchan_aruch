<i data-commentator="Mishnah Berurah" data-label="יז"></i> Whoever places his eruv in a <i data-commentator="Mishnah Berurah" data-label="יח"></i> place has four cubits at the place of his eruv. Therefore one who places <i data-commentator="Be'er HaGolah" data-label="ח" data-order="10"></i> his eruv of boundaries at the end of his boundary and it <i data-commentator="Mishnah Berurah" data-label="יט"></i> rolled within four cubits <i data-commentator="Ba'er Hetev" data-order="4"></i> <i data-commentator="Mishnah Berurah" data-label="כ"></i>— it is a <i data-commentator="Turei Zahav" data-order="4"></i> valid eruv. If <i data-commentator="Mishnah Berurah" data-label="כא"></i> it rolled beyond <i data-commentator="Turei Zahav" data-order="5"></i> four cubits, it is <i data-commentator="Mishnah Berurah" data-label="כב"></i> not a valid eruv.
