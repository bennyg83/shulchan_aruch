<i data-commentator="Be'er HaGolah" data-label="ו" data-order="8"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> If he placed it in a tower and locked it and the key was lost before Shabbat, or a rockslide fell upon it — if he can <i data-commentator="Be'er HaGolah" data-label="ז" data-order="9"></i> retrieve it without performing a d'oraisa prohibited melacha, it is a valid eruv.
