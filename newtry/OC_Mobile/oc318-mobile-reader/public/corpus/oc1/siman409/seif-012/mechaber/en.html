<i data-commentator="Be'er HaGolah" data-label="ט" data-order="33"></i> If there were two people, one who recognizes the place and one who does not — the one <i data-commentator="Mishnah Berurah" data-label="עב"></i> who does not recognize it entrusts his shevitah to the one who does and says &quot;our Shabbat rest is in such-and-such place.&quot;
