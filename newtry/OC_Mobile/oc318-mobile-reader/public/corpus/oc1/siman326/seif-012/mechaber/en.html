<i data-commentator="Be'er HaGolah" data-label="ת" data-order="22"></i> It is forbidden to enter a bathhouse [on Shabbos] even <i data-commentator="Mishnah Berurah" data-label="לה"></i> merely to break out in a sweat.<small>[[There are those who say that it is forbidden to even pass through a bathhouse in <i data-commentator="Mishnah Berurah" data-label="לו"></i> a place where one could break out in a sweat, (even when this is not one’s intent).] (Rashi and the Tur).</small>
