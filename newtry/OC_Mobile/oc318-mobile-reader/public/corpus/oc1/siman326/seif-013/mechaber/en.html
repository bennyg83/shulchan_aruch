<i data-commentator="Be'er HaGolah" data-label="א" data-order="23"></i> A city where Jews and gentiles dwell and there is a bathhouse that bathes on Shabbat <i data-commentator="Mishnah Berurah" data-label="לז"></i>— if <i data-commentator="Mishnah Berurah" data-label="לח"></i> the majority are gentiles, it is permitted to bathe there at Motzei Shabbat immediately; and if the <i data-commentator="Mishnah Berurah" data-label="לט"></i> majority are Jews, or even half and half,<i data-commentator="Turei Zahav" data-order="4"></i> it is forbidden until Motzei Shabbat <i data-commentator="Mishnah Berurah" data-label="מ"></i> until it can heat.
