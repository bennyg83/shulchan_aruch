<i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i> It is <i data-commentator="Mishnah Berurah" data-label="כה"></i> permitted to wash one's face, hands, and <i data-commentator="Mishnah Berurah" data-label="כו"></i> feet in things that do not remove hair mixed with things that remove hair, provided the majority <i data-commentator="Mishnah Berurah" data-label="כז"></i> is not from the <i data-commentator="Magen Avraham" data-order="9"></i> thing <i data-commentator="Ba'er Hetev" data-order="6"></i> that removes.
