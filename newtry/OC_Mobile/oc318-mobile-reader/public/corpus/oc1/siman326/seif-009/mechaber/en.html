<i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i> It is <i data-commentator="Mishnah Berurah" data-label="כה"></i> permissible to rinse one's face, hands and legs with <i data-commentator="Mishnah Berurah" data-label="כו"></i> substances that do not remove hair that are mixed with substances that do remove hair provided the majority [of the compound] is <i data-commentator="Mishnah Berurah" data-label="כז"></i> not composed of substances that <i data-commentator="Magen Avraham" data-order="9"></i> will certainly <i data-commentator="Ba'er Hetev" data-order="6"></i> remove hair.
