<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> Some say that that which it is permitted in Tiberias hot springs — specifically when the place is not roofed;<i data-commentator="Mishnah Berurah" data-label="י"></i> but if the place is roofed it is forbidden because one comes to perspire, which is forbidden. And some <i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> say <i data-commentator="Mishnah Berurah" data-label="יא"></i> it is permitted to perspire in Tiberias hot springs.
