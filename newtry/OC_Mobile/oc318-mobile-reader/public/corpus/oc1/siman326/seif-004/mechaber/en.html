<i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> One should not rinse the entire body in cold water and warm up opposite the fire, because one dissolves water on oneself and it turns out <i data-commentator="Mishnah Berurah" data-label="יז"></i> as though <i data-commentator="Magen Avraham" data-order="5"></i> bathing the entire body in hot water; but it is permitted to rinse in cold water <i data-commentator="Mishnah Berurah" data-label="יח"></i> after having warmed up by the fire.
