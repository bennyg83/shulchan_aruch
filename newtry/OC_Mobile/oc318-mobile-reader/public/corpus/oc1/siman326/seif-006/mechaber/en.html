<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> One is prohibited from placing a flask filled with hot water on one’s stomach, and <i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="יט"></i> it is prohibited <i data-commentator="Ba'er Hetev" data-order="4"></i> even on a weekday being it is dangerous, as sometimes the water is scalding hot.<small>[[However,<i data-commentator="Mishnah Berurah" data-label="כ"></i> one may warm a garment and place it on one’s stomach] [Tur].]:</small>
