<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> It is forbidden to place on one's stomach a vessel that has hot water, even on a weekday because <i data-commentator="Magen Avraham" data-order="7"></i> <i data-commentator="Mishnah Berurah" data-label="יט"></i> of danger, for sometimes <i data-commentator="Ba'er Hetev" data-order="4"></i> they boil over. [But it is permitted to heat a garment and place it on one's stomach] [Tur].<small>[<i data-commentator="Mishnah Berurah" data-label="כ"></i>]:</small>
