<i data-commentator="Be'er HaGolah" data-label="י" data-order="10"></i> Some add <i data-commentator="Turei Zahav" data-order="6"></i> penitential prayers in the blessing <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> of &quot;Forgive <i data-commentator="Ba'er Hetev" data-order="5"></i> us,&quot; and <i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> there are those who do not say penitential prayers until the end of the Amidah. This is the practice of the early authorities in Israel,<i data-commentator="Mishnah Berurah" data-label="יז"></i> and it is the right practice.
