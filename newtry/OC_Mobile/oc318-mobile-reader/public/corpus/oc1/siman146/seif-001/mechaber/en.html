<b>To Not Speak at the Time of the Torah Reading. Containing 4 S'ifim: It</b><br> <i data-commentator="Mishnah Berurah" data-label="א"></i> <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> is forbidden to exit [the synagogue] and leave the Torah while it is <i data-commentator="Mishnah Berurah" data-label="ב"></i> open. But between one person's <i data-commentator="Ba'er Hetev" data-order="1"></i>[aliyah] andanother,<i data-commentator="Magen Avraham" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="ג"></i> it is permitted.
