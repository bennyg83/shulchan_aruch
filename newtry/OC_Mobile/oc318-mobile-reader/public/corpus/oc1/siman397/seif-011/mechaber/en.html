<i data-commentator="Be'er HaGolah" data-label="נ" data-order="14"></i> One who borrowed a vessel from his fellow before Yom <i data-commentator="Mishnah Berurah" data-label="כו"></i> Tov — even if he did not take <i data-commentator="Turei Zahav" data-order="3"></i> it until nightfall — it follows the borrower's boundary. If he borrowed <i data-commentator="Mishnah Berurah" data-label="כז"></i> it on Yom Tov, even if he customarily borrows it every Yom Tov, it follows the lender's boundary.
