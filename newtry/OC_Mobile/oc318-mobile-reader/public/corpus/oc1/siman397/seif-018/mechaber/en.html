<i data-commentator="Be'er HaGolah" data-label="ג" data-order="25"></i> One who invited guests to his home <i data-commentator="Mishnah Berurah" data-label="מד"></i> on Yom Tov — they may not take portions with them to a place where the host cannot go, unless he transferred ownership of those portions to them before Yom Tov through another person.
