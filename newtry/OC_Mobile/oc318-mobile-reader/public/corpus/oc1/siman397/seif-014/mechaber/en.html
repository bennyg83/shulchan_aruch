<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> <i data-commentator="Magen Avraham" data-order="10"></i> <i data-commentator="Mishnah Berurah" data-label="לב"></i> A private cistern follows the boundary of <i data-commentator="Mishnah Berurah" data-label="לג"></i> its owner. One belonging to that town follows the boundary of the <i data-commentator="Magen Avraham" data-order="11"></i> <i data-commentator="Mishnah Berurah" data-label="לד"></i> town's residents.<i data-commentator="Ba'er Hetev" data-order="8"></i> One that is ownerless follows the boundary <i data-commentator="Mishnah Berurah" data-label="לה"></i> of whoever draws from it.
