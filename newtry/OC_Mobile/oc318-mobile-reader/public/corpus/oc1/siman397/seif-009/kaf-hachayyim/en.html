<b>9) There. Medium steps. </b>Their measure is one mil, which is eighteen minutes. Beis Yosef in Yoreh De'ah, siman 130. Shaarei Teshuvah writes likewise in the name of Chut HaShani, folio 109b. See there. See above, at the beginning of siman 261, in the gloss, and in the Shulchan Aruch there, se'if 2.
