<i data-commentator="Be'er HaGolah" data-label="ל" data-order="12"></i> Two people <i data-commentator="Mishnah Berurah" data-label="כא"></i> who borrowed a garment — one to wear in the <i data-commentator="Mishnah Berurah" data-label="כב"></i> morning and one in the evening — may only take it to a place where both can go. If one made an eruv toward the end of two thousand cubits to the east and the other to the west, it <i data-commentator="Mishnah Berurah" data-label="כג"></i> may not be moved from its place.
