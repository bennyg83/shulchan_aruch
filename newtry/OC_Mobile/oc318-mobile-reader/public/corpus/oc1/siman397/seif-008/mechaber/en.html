<i data-commentator="Be'er HaGolah" data-label="כ" data-order="11"></i> Vessels designated <i data-commentator="Mishnah Berurah" data-label="יט"></i> for one of the brothers in a household follow his boundary, and those not designated for any one of them may only be taken to a place <i data-commentator="Mishnah Berurah" data-label="כ"></i> where all of them can go.
