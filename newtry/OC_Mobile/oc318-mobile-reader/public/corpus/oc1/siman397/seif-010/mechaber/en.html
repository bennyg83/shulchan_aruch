<i data-commentator="Be'er HaGolah" data-label="מ" data-order="13"></i> Two people who <i data-commentator="Magen Avraham" data-order="7"></i> purchased an animal together and slaughtered it on Yom Tov — even if each took his portion — all the <i data-commentator="Turei Zahav" data-order="2"></i> <i data-commentator="Mishnah Berurah" data-label="כד"></i> meat follows <i data-commentator="Ba'er Hetev" data-order="6"></i> both their boundaries. But if they <i data-commentator="Magen Avraham" data-order="8"></i> purchased a barrel of wine and divided it on Yom Tov, each one's portion follows <i data-commentator="Mishnah Berurah" data-label="כה"></i> his own boundary.
