<i data-commentator="Be'er HaGolah" data-label="ע" data-order="16"></i> If one took a coal from his fellow on Yom Tov, he may only take <i data-commentator="Mishnah Berurah" data-label="ל"></i> it per the giver's boundary. But if he lit a candle or piece of wood from his fellow's flame, it follows the <i data-commentator="Mishnah Berurah" data-label="לא"></i> boundary of the one who lit it.
