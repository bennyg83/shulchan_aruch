<i data-commentator="Be'er HaGolah" data-label="ו" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="יא"></i> If he <i data-commentator="Magen Avraham" data-order="4"></i> <i data-commentator="Ba'er Hetev" data-order="3"></i> handed it to <i data-commentator="Mishnah Berurah" data-label="יב"></i> a shepherd — even if he gave it to him on Yom Tov —<i data-commentator="Be'er HaGolah" data-label="ז" data-order="7"></i> it follows the <i data-commentator="Magen Avraham" data-order="5"></i> <i data-commentator="Ba'er Hetev" data-order="4"></i> shepherd's boundary. If he handed it to two shepherds, it follows the <i data-commentator="Mishnah Berurah" data-label="יג"></i> owner's boundary since neither one acquired it.
