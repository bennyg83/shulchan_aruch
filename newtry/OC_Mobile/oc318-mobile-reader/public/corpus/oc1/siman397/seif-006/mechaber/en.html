<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> An <i data-commentator="Mishnah Berurah" data-label="יד"></i> ox <i data-commentator="Magen Avraham" data-order="6"></i> designated <i data-commentator="Mishnah Berurah" data-label="טו"></i> for slaughter follows the boundary of whoever purchased it to <i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> slaughter on Yom Tov. Similarly, if the owner slaughtered it on Yom Tov and sold the meat, each buyer may <i data-commentator="Mishnah Berurah" data-label="טז"></i> take his portion wherever he goes.
