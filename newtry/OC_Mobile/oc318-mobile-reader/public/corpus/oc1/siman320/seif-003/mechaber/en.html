<i data-commentator="Be'er HaGolah" data-label="ח" data-order="8"></i> Grape peels and seeds that had water poured over them in order to make a wine <i data-commentator="Mishnah Berurah" data-label="טו"></i> drink, one may draw the wine and drink it, and even if one did not pour water and the wine seeps out by itself, one <i data-commentator="Magen Avraham" data-order="6"></i> <i data-commentator="Mishnah Berurah" data-label="טז"></i> is permitted <i data-commentator="Ba'er Hetev" data-order="7"></i> to drink it.
