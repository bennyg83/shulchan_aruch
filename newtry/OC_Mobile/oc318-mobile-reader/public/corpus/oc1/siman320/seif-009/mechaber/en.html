<i data-commentator="Be'er HaGolah" data-label="פ" data-order="17"></i> It is prohibited to crush snow and ice into small pieces in <i data-commentator="Mishnah Berurah" data-label="לב"></i> order to produce water <i data-commentator="Turei Zahav" data-order="7"></i> but one may place <i data-commentator="Ba'er Hetev" data-order="12"></i> <i data-commentator="Mishnah Berurah" data-label="לג"></i> them into a <i data-commentator="Magen Avraham" data-order="13"></i> cup of wine or water and let them melt by themselves, without trepidation. They <i data-commentator="Mishnah Berurah" data-label="לד"></i> are also permitted <i data-commentator="Be'er HaGolah" data-label="צ" data-order="18"></i> if one <i data-commentator="Magen Avraham" data-order="14"></i> places them <i data-commentator="Ba'er Hetev" data-order="13"></i> in the sun or opposite a fire and <i data-commentator="Mishnah Berurah" data-label="לה"></i> they melted.
