<i data-commentator="Be'er HaGolah" data-label="ג" data-order="25"></i> It is prohibited to place a garment atop a barrel and place the vessel used for drawing water on top of it lest one comes to <i data-commentator="Mishnah Berurah" data-label="מב"></i> wring out the garment. It is permitted to place it on a garment designated for covering the barrel because one does not care to <i data-commentator="Mishnah Berurah" data-label="מג"></i> wring it out.
