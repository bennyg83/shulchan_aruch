<i data-commentator="Be'er HaGolah" data-label="ר" data-order="20"></i> One must take care in the winter <i data-commentator="Mishnah Berurah" data-label="לז"></i> not to wash one’s hands with water mixed with snow or ice and if one does, one must be careful not to press one's hands together <i data-commentator="Magen Avraham" data-order="16"></i> in order not <i data-commentator="Ba'er Hetev" data-order="15"></i> to crush.
