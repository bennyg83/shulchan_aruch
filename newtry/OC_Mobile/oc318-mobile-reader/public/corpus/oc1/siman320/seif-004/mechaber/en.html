<i data-commentator="Be'er HaGolah" data-label="ט" data-order="9"></i> One is permitted to squeeze a bunch of grapes into a pot that has food inside <i data-commentator="Mishnah Berurah" data-label="יז"></i> in order to enhance the food, because a liquid entering a food is like the food, but if <i data-commentator="Mishnah Berurah" data-label="יח"></i> there is no food inside it is forbidden.
