<b>מ"ג ביצים. </b> עם הקליפות. ב"ח ואחרונים:<br>
<b>ישער. </b> ולא ע"י משקל. וכ' ש"כ סי' שכ"ד שהוא שלשה קווארט שהם ג' זיידליך פחות מעט:<br>
<b>ולא</b> <b>ידחק. </b> ולא יניח ידו על הקמח ד"מ <small>(דלא ילוש יפה ואח"כ בבישולו יתחמץ)</small>:<br>
<b>לשם מצוה. </b> וכן בשאיבת המים וכן כשנותן מים לתוך הקמח כמש"ל סי' תנ"ה:
