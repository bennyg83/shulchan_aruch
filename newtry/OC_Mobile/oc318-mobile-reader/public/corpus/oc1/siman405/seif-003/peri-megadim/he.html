<b>המוקפת</b> עט״ז דעיירות שלנו בתים מוקפים וצ״ה מוקף לדירה מהלך כולה ויראה אף שלא עירבו ואסור לטלטל מבתים למבוי מ״מ רה״י גמור והולך כולה כד״א דבמבוי גופא ובחצר רשאי לטלטל כולה כלים ששבתו בחצר ול״ד לקרפף יותר מב״ס שלא הוקף לדירה דשם כרמלית עליו ואסור לטלטל בתוכה יותר מד׳ אמות אין מהלך כולה משא״כ כה״ג:
