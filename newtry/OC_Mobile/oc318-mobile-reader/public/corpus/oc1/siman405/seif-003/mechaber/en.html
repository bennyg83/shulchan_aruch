<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> One upon whom the day was sanctified <i data-commentator="Mishnah Berurah" data-label="ד"></i> while he was outside the city techum, even one cubit — may not enter <i data-commentator="Mishnah Berurah" data-label="ה"></i> to be like the people of the city; he walks only two thousand cubits in every direction from where the day was sanctified upon him.
