<i data-commentator="Be'er HaGolah" data-label="ג" data-order="3"></i> One, when Shabbat begins, is outside the <i data-commentator="Mishnah Berurah" data-label="ד"></i> barrier of the city, even a single amah, he should not enter to be like <i data-commentator="Mishnah Berurah" data-label="ה"></i> a member of the city, and he should only walk two thousand amot in each direction from the place he was in when Shabbat began.
