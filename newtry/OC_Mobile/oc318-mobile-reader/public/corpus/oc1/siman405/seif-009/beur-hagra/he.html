<b>ס"ט שכל העיר כו' ואם היא כו'.</b> רש"י שם:<br>
<b>ואפי' לאותו.</b> תוס' שם ד"ה לא הפסידו כו' ולמדו כן ממשמעות הגמ' לא הפסידו:<br>
<b>אפי' מי שלא.</b> תוס' שם ד"ה במזי ד כו' מדקאמר סתם לא יאכלו וכמ"ש במבשל סתם לא יאכל אין חילוק רק במקום שחילק שם בפירוש:<br>
<b>ויש מתירים.</b> כמו ע"י א"י שם מ' א' ומ"ז ב' ופ"ג די"ט כ"ד א':
