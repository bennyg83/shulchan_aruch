<b>דין היוצא חוץ לתחום. ובו ט סעיפים:</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> The law of one who leaves the techum. One who left <i data-commentator="Ba'er Hetev" data-order="1"></i> the techum,<i data-commentator="Mishnah Berurah" data-label="א"></i> even one cubit — may not enter to be like the people of the <i data-commentator="Ba'er Hetev" data-order="2"></i> city; he has only <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ב"></i> four cubits from where he stands and outward.
