<b>דין היוצא חוץ לתחום. ובו ט סעיפים:</b><br> <i data-commentator="Be'er HaGolah" data-label="א" data-order="1"></i> Laws of those who leave the Techum One who leaves the Shabbat <i data-commentator="Ba'er Hetev" data-order="1"></i> barrier even <i data-commentator="Mishnah Berurah" data-label="א"></i> a single amah (cubit), he should not enter to be like a member of the city,<i data-commentator="Ba'er Hetev" data-order="2"></i> and he only has <i data-commentator="Magen Avraham" data-order="1"></i> <i data-commentator="Mishnah Berurah" data-label="ב"></i> four amot from [where] he is standing and out.
