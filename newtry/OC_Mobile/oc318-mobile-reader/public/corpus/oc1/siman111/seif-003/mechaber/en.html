<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> If before he recited Shema he found the congregation praying, he should not pray with them; rather he <i data-commentator="Mishnah Berurah" data-label="יא"></i> recites Shema and afterward prays, for juxtaposing redemption to prayer is preferable.**** END <i data-commentator="Ba'er Hetev" data-order="4"></i> BLOCK ****
