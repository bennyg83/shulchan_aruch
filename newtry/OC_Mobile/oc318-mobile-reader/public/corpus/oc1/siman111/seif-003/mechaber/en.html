<i data-commentator="Be'er HaGolah" data-label="ה" data-order="5"></i> If one found the congregation praying [the Amidah], when one has not yet recited the Recitation of the Shema, one should not pray with <i data-commentator="Mishnah Berurah" data-label="יא"></i> them, rather one should recite the Recitation of the Shema and subsequently pray, since juxtaposing “redemption” to “prayer”<i data-commentator="Ba'er Hetev" data-order="4"></i> is preferred.
