<b>ב"ש אות ל"ג לפ"ז נראה דניזונית.</b> נ"ב לענ"ד הא התם מבואר דהוא איבעי דלא אפשטא ומספק אמרי' דעמד חוזר. וא"כ הכא במת דההקדש זכה בודאי והוי ס' אם מחיים אם לא"מ א"כ מס' א"י לגבות מהקדש. ובזה מיושב קושי' הח"מ ס"ק ל"א דשפיר סתם הרמ"א דכל הקדש הוי כמתנת בריא. והיינו מספק דשמא לגבי הקדש גמר ומקדיש מחרים:
