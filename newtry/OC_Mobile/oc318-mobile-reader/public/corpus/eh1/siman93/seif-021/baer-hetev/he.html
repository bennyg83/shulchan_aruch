<b>מזונות. </b> זהו תקנות הגאונים דניזונית מן המטלטלין:<br>
<b>מזונות. </b> וה"ה אם מכרו מטלטלין א"צ לשלם מן הדמים. עי"ן בח"מ סי' ק"ז בטור. וכנה"ג דף קי"ב ע"ב ס' נ"ה:<br>
<b>שתזון וכו'. </b> כתב הח"מ מאחר שתנאי ממון הוא וניזונין מן הדין עכשיו מן המטלטלין ולא מחמת התקנה א"כ אפילו מכרו המטלטלין צריכין לזון מן הדמים כמו בקרקע:
