<b>מומחין. </b> משמע אם משום בב"ד מומחין א"י לבטל המקח אפילו אם רוצים ליתן את שלה א"כ מוכח בכתובה שומא לא הדרא וכן פסק מהרש"ל בתשובה סי' נו"ן. והרב רמ"א בתשובתו סי' ט' חולק עליו ע"ש ועיין ב"ח. ואם הניחה בעלה רשאית ושלטנית לכל מה שתעשה ואנש לא ימחה בידה אם מכרה לעצמה מכרה קיים כנה"ג בשם תשובת כ"י ע"ש:
