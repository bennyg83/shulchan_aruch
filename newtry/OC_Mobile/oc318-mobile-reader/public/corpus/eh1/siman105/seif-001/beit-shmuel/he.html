<b>יכולה האשה למכור וכו'</b>. ולא חיישינן שתהיה קלה בעיניו להוציאה דהא כשירצה לגרשה יתבע הלוקח אותו עם הכתובה אבל כשמוכר' לבעלה אז תהיה קלה בעיניו לגרשה וצריך לכתוב לה כתובה אחרת:<br>
<b>המכר מכר</b>. ואם מת קודם שכתב לה כתובה אחרת אין לה כתובה ואם חי הוא צריך לכתוב לה כתובה אחרת היינו מתנה ועיין סס"ז:
