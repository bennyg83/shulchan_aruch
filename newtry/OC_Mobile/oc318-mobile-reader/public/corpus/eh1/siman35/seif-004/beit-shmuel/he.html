<b>שגילה דעתו</b>. נלמד מסוגיא קדושין דף מ"ה דהקשה שם דלמא ארצויה קמיה פי' הרא"ש הבן גילה דעתו שרוצה שיקדש לו אשה זו והיינו ראיה של יש מי שאומר שהיא בסעיף אח"ז (כלומר מסוגיא זו למדו היינו כ"א לפי שיטתו ומ"ש הב"י דהרא"ש חולק על הרמ"ה אין מוכרח) ולמ"ד ש"ה צריך למנות לפני עדים צ"ל דגילה דעתו לפני עדים:
