<b>גרושה כו' </b> דדוקא באלמנה נמנעו מלהשביעה דבההיא הנאה דטרפא קמי יתמי אתיא לאורוי היתר וסבורה שלשכר טירחא נוטלתו אבל בגרושה דליכא למימר הכי משביעין אותה וכבר זכרתי בסוף סעיף א' דשבועה של הגרושה נגד המגרש אינה כשבועת אלמנה נגד יתמי דבגרושה הוה כמו שאר שט"ח שצריך שיאמר המגרש השבע לי כמ"ש בח"מ סי' פ"ב:
