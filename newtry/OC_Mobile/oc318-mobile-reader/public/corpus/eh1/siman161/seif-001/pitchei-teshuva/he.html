<b>לא רצה. </b> עב"ש סק"ג שכ' היינו שלא רצה ליבם ורוצה לחלוץ מ"מ חוזרים כו' עד ודלא כב"ח. ועיין בתשובת אא"ז פמ"א ח"ב סי' א' שהשיג ג"כ על הב"ח בזה והבי' דבחידושי מהריב"ן ביבמות שם כתב לתרץ דעת הב"ח אבל דבריו תמוהין ע"ש ועיין בס' ישועת יעקב שכ' ליישב דברי הב"ח באופן נאות ומ"מ לדינ' הסכים עם הב"ש ע"ש.
