<small>סעיף ט'</small> <b>האשה שמכר' מנכסי מלוג אחר שנשאת וכו'</b> נ"ב הנה זה הדין הוא מתקנות אושא וע' בתוס' ב"ק דפ"ט ובפ' י"נ מה שהקשו למ"ד קנין הפירות ככה"ג דמי למה לי תקנות אושא ומה שיש להקשות על דבריהם וליישבם כתבתי בחיבורי על יו"ד מהדורא וא"ו סי' רכ"ג בתשובתי ל"ק קארשטשוב הסמוך לוארשא ע"ש וד"ק:
