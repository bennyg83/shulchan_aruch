<b>וכיון שכן כו'. </b> שם לא נתנה זקוקה ליבם:<br>
<b>ואם א"ל כו'. </b> עבה"ג וכמ"ש ע"ו ב' מעכשיו א"ל כו' ובעיא שם בגמ' לאלתר כ"ש דהא אוקים כו' ולא איפשטא וכ"ה מחלוקת בירושלמי ואזלינן בתר המחמיר וכמש"ל סימן קמ"ד ס"ג אלמא שאע"פ שא"א שיתבטל התנאי אין מחזיקין הגט בבעל עד שיהיה התנאי מבוטל בפועל וכאן א"א כו':
