טור בשם הרמב"ם<br>
שם וכ"כ הרשב"א והר"ן ומפרשים אחרים כמ"ש ה"ה והב"י<br>
וכבר כתב הכ"מ שם בשם הרשב"א שנראה שדעתו ז"ל דהתם שאני מפני שהיא רשאה לשתות אחר מיתתו ונמצא שלא נאסרה ביין לעולם אבל זו נאסרה בנשואיו לעולם וכו' וכ"כ הר"ן שם.<br>
פי' שאסורה להנשא בגט כזה ופסלה לכהונ' ואם קיבלה קידושין מאחר צריכ' גט ממנו
