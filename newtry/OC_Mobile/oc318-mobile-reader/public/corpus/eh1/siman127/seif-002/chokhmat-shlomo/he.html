<small>ס"ב</small> <b>אם הי' מוקדם</b> נ"ב עיין בטור מ"ש בשם תשובת הרא"ש דבגט מוקדם אין קדושין תופסין ומה שתמה עליו הב"י והג"פ מתרץ ועיין מ"ש במהדורא ח' סימן ק' בתשובתי ל"ק קעשינוב בזה ודוק ומ"ש בהגהות רמ"א סעיף ה' ומיהו נהגו להחמיר ולכתוב אחר עי' מ"ש בתשובה ל"ק בארשטשוב בחיבור מ"ה סימן כ"ג ע"ש ודוק:
