<b>שנשא בתולה. </b> עיין בס' זכור לאברהם שכ' אלמון מן האירוסין שנשא אלמנה וכן הנושא אשה לשם בעולה ונמצאת בתולה יברך ז"ב כל ז' ימי החופה. הרב אדמת קודש ח"ב סי' ג'. וע' בס' שיורי ברכה להרב חיד"א ז"ל דמודה ליה בחדא ופליג עליה בחדא בנושא לשם בעולה ונמצאת בתולה דלא יברך כל ז' ומיהו אהני שישמח עמה כל ז' ע"ש:
