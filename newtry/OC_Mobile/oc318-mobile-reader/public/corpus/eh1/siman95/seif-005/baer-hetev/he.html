<b>והותירה. </b> דוקא שצמצמה והותיר בידה אבל אם צמצמה עצמה ממה שפסקו לה הב"ד והאכילה לבנים ממה שהיתה צריכה לתת לתוך פיה. הוא שלה הר"ם מטראני ח"א סי' שי"ב:<br>
<b>ליורשים. </b> וכתב ב"ש כשהיא אמם לא אמרינן כי היכא דתתגנה עליהם. וכן לענין שאר מלאכות אם היא אמם אינה חייבת לעשות להם. מיהו עשיות צמר חייבת שלא תשב בטל ע"ש:
