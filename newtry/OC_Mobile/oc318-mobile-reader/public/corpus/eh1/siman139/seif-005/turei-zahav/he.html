<b>ויש מי שאומר כו' </b> הוא דעת הרמב"ם דס"ל דכאן שהוא למעלה והוא זורק הגט שלא כדרך הטבע של זריקה שהיה דרך ירידה ע"כ אין האויר ולא סמוך לגג ג"ט מהני אלא אם אח"כ מגיע לה ואם קדשה אחר קודם שמגיע לידה לאו כלום הוא וע"כ אם נשרף אפי' תוך ג"ט לא מהני כיון שאין מגיע לידת בסוף ובש"ע צ"ל קודם שיגיע לה וכו':
