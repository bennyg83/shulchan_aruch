<b>או שהיתה קטנה</b>. אף שאביה חי אשכחן מיאון כגון שאביה השיא אותה ונתגרשה כשהיתה קטנה שוב אין לאביה רשות בה והלכה ונשאת ש"ס:<br>
<b>ומיאנה בו</b>. וכן אם לא מיאנה הואיל והיא קטנה וקידושי' מדרבנן לכן צרתה חולצת ואסורה ליבם, מתני' ריש יבמות אלא קמ"ל אפי' מיאנה מ"מ צרתה אסור' ליבם הואיל ונראה בשעת נפילה כצרת בתו:
