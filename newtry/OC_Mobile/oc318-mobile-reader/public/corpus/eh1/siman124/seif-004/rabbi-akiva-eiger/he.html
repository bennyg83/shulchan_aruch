<b>ס"ו ה"ז ספק מגורשת.</b> נ"ב ואם כתב הגט על קרן של פרה שמתוך שהפרה שלו ויוצא מתח"י י"ל כיון דהפרה לחו בר דעת וגם גט כתוב עליו רגלים לדבר שהוא נתן לה ע' בתוס' ויש להוכיח קצת מדנקט האיבעי' בעבד דמשכחת לה רק בדרך איסור דכתובת קעקע ולא נקט דאיבעי בקרן של פרה אע"כ דבזה באמת ליכא איבעי' ולא בזה מנפשי' עייל:
