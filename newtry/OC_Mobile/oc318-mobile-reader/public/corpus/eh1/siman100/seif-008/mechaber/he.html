<i data-commentator="Be'er HaGolah" data-label="ג" data-order="25"></i>באה ואמרה מת בעלי התירוני לינשא ותנו לי כתובתי מתירין אותה לינשא ונותנין לה כתובה אבל אם באה ואמרה מת בעלי תנו לי כתובתי והתירוני לינשא מתירים אותה ואין נותנים לה כתובה ואם תפסה אין מוציאים אותה מידה ויש מי שאומר דבין בזו ובין בזו אין מתירים אותה כיון שהזכירה כתובה:
