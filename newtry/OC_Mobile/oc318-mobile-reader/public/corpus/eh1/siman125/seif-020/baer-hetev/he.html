<b>קרוע. </b> עיין בתשובת מ"ב סי' כ"ג אפילו אם קרוע לתוך האות והוא מטורף כשר לכ"ע ליתן לה הגט לכתחלה כשאינו קרוע שתי וערב. והיינו כשהאות אינו משתנה ומ"מ למעשה אין להקל שלא במקום הדחק אם נקרע תוך האות. ועי' בש"ך ח"מ סימן נ"ב ס"ק ז' מש"ש. ופר"ח כאן חולק עליו ע"ש. ועיין תשובת מהר"ן ששון סימן למ"ד ועיין כנה"ג:
