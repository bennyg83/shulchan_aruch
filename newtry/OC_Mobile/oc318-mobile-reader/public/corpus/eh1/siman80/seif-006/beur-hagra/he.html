<b>יש כו'. </b> דבצמר ומצעת אין חילוק כנ"ל:<br>
<b>מת כו'. </b> ירוש' ומניקה את בנה א"ר חגי לא אמרו אלא בנה אבל תאומים לא ולמה אמרו בנה שלא תניק בן חברתה כהדא דתניא אין האיש כופה את אשתו להניק בנו של חבירו ולא האשה כופה את בעלה שתנוק בנה של חברתה ופי' בן חברתה אפי' הוא בן בעלה הרא"ש וש"פ ופי' הר"נ דר"ל אם מת בנה.
