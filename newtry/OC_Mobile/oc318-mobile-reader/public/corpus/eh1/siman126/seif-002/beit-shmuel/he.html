<b>בשלישי וכו'</b>. והא דאין כותבין בגט בלשון זכרון עדות או בפנינו עדים משום לשון הגט אין העדים מגידים אלא הבעל בעצמו מספר דברים אלו כמ"ש לקמן, לבוש, גם בימי חדש כותבין בשלישי וכיוצא בזה בבי"ת כמ"ש בסדר גט רמ"א ובלבוש ולא כנ"ש:<br>
