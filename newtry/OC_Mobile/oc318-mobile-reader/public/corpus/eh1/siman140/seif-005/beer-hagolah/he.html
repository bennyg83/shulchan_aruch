שם במשנה<br>
משנה התקבל גט זה לאשתי וכו' אם רצה לחזור יחזור וכמו שפי' רש"י שם<br>
נ"י בשם הרשב"א שכן הוא מוכח בירושלמי<br>
כדפשט רבא לרבינא מהא דאמר ריש לקיש טב למיתב טן דו וכו' יבמות דף קיח ע"ב ומשמע דפשוט ליה ניחא דגופא עדיף וכהירושלמי<br>
הר"ן שם בגיטין כתב שהוא אבעיא ולא נפשטא ומ"ש הב"י פירושו בגמרא
