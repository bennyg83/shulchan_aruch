<b>מנעל של ע"א</b>. עיין בתו' שם אם הוא ע"א של ישראל או עכו"ם והפקיר ובא ליד ישראל אז הוי כע"א של ישראל ואין לו ביטול ומכתת שיעורי' אלא איירי בע"א של עכו"ם והפקיר וכוונתו שלא לקנות המנעל או ע"ז של גוי ולא הפקיר אז לא קנה הישראל ב"ח, לפ"ז אסור לחלוץ בו מטעם שאין שלו המנעל ולר"ת איירי בע"א של עכו"ם ובטלו:
