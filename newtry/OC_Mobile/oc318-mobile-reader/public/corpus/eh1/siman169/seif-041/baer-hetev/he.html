<b>זב. </b> ל"ד אלא כיון שהרוק בא מחמת דבר אחר לא הוי רקיקה אפילו לא זב. מיהו במוצצת י"ל דמהני לכ"ע. וכתב בש"ג אם רקקה מחמת דבר אחר לא הוי רקיקה כלל ולא נפסלה על האחין. ב"ש:<br>
<b>כלום. </b> טוב שיזהירו היבמה בבוקר וכן בערב שלא תאכל ולא תשתה למחרתו קודם החליצה. ואם למחרתו הוא תענית ציבור א"צ להזהירה מבערב:
