<i data-commentator="Beit Shmuel" data-order="49"></i><i data-commentator="Be'er HaGolah" data-label="ד" data-order="51"></i>One should not split the name <i data-commentator="Ba'er Hetev" data-order="45"></i>of the man or the name of the woman over two lines. But on one line, some names that can bear it may perhaps be split, like Kedar Laomer. <small>So too Immanu El; and if he wrote it as one word, he has not invalidated it (Seder Gittin).</small>
