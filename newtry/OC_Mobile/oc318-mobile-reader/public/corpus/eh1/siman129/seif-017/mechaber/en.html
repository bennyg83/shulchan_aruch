<i data-commentator="Beur HaGra" data-order="28"></i>If the second name is in a foreign language and both are one name, for example Chaim <i data-commentator="Turei Zahav" data-order="30"></i><i data-commentator="Be'er HaGolah" data-label="•" data-order="29"></i>Bibant, <i data-commentator="Be'er HaGolah" data-label="ז" data-order="30"></i>we write: Chaim, who is called Bibant. For every nickname we write "who is called," whether it is in Hebrew or in a foreign language. <small>It has already been explained that this is not our practice.</small>
