(א) <b>Slaves fell to her, etc.</b> For we hold like Rabban Shimon ben Gamliel wherever his reason is logical.<br>
(ב) <b>And it is not, etc.</b> The Gemara there.<br>
(ג) <b>If they produce, etc.</b> The Yerushalmi, brought by the Rif and Rosh there.<br>
(ד) <b>And if not, etc.</b> Like the first Tanna.
