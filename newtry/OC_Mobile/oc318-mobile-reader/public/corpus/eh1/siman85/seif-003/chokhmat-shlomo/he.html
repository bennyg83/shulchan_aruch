<small>סעיף טו</small> <b>נפלו לה פירות המחוברת לקרקע הרי אילו של בעל ב"ב</b> עיין בח"מ ס"ק ל"ה מ"ש ראי' מעז לחלבה עיי"ש ולדעתי תמוה דל"ד כלל בשלמא בעז לחלבה אם יאכל החלב והביצה יהי' חלב אחר אבל בפירות המחוברין אם יאכל אותם לא יהא לה פירות אחרים והוי לי' ליקח שדה ויאכל הפירות כמו בתלוש כמ"ש חילוק זה בב"ש ודוק וצ"ע:
