<b>התנאי. </b> אפי' ש"מ נוטה למות וגוסס אסור להתייחד בלא עד רשב"א ד"מ ב"ש:<br>
<b>שפחה. </b> וה"ה נערה בת י"ב שנה שיודעת ובושה ממנה הוי שומר ויוכל להתייחד על פיה מהרי"ט מהראנ"ח:<br>
<b>אותם. </b> הטעם אם נתייחד עמה חיישינן לקדושין שמקדש אותה מחדש מש"ה בעינן שראו העדים עיין ב"ש והרדב"ז ח"א סי' ד' ורע"ה:
