<b>מכת מרדות. </b> הוא י"ג מכות מהרא"י בביאורו רש"י ס"פ כי תצא. ומ"א בא"ח סי' תצ"ו כתב עליו וברמב"ם לא משמע כן. ועיין רש"י בחולין דף קמ"א ע"ב שכתב מכת מרדות אין לה קצבה אלא עד שיקבל עליו ע"ש:<br>
<b>כרבלתו. </b> הטעם דאין מסרס אותו רק עי"ז מתאבל על שניטל הודו. ומותר לקשור את הנקיבה שלא יעלה עליה זכרים שם:
