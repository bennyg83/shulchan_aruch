<b>הרי כו'. </b> כנ"ל שכל שאינו נוגע באיברי הזרע אינו לוקה שהרי לר"י אף בביצים אינו לוקה אע"ג שמסתרס כנ"ל ועבה"ג ור"ל מדמצרכינן שם או לרבות את המצמם:<br>
<b>אבל מותר כו'. </b> שבת שם.<br>
