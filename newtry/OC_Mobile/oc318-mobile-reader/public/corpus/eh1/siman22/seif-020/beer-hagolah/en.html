Mishnah Kiddushin 82a.<br>
There in Gemara.<br>
There in mishnah as explained in Gemara there.<br>
Per view of our master that which we conclude R' Eliezer — dwelling with him — means dwelling with him in schoolhouse — and we do not hold like R' Eliezer but like first tanna — and so primary Beit HaLevi.
