<b>(עוד מצאתי)</b> אודות יחוד בלילה מפורש בש"ע להחמיר כשישינים בני הבית ומכל מקום נראה שאין זה כי אם כשאין נר דולק שאז כיון שיש גם שינה יש חשש מה שאין כן בנר דולק אימתא עליה דלמא פקח חד עיניה רגע וצלע"ע ועל כל פנים בספק שינה או ניעור מי מהם יש צד להקל שהרי זה כיוצא ונכנס ושארי קולות שבה' יי"נ בזה ע"ש:
