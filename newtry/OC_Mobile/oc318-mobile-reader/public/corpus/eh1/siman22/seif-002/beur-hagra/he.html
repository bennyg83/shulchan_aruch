<b>חוץ כו'. </b> מתניתין שם ואע"ג דאמר שמואל שם אסור להתייחד כו' הא פריך עליה ממתניתין ושני תנאי היא וה"ל סתם מתני' ומחלוקת בברייתא והלכה כסתם מתני' וכן מתני' שם פ"ב א' דלא כוותיה ואף ר' יהודה לא אמר אלא ברועה ורווק וכל האמוראי שם דעבדי כשמואל ממדת חסידות עשו וכמ"ש הרמב"ן ר"ן. אבל הרא"ש פסק כרב אסי:
