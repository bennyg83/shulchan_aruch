<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1ea" />
    <title>Orach Chayim — Web Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <p style="margin: 2rem; font-family: Georgia, serif; color: #2c2824">Loading reader…</p>
    </div>
    <script>
      (function () {
        var root = document.getElementById("root");
        function showErr(msg) {
          if (!root) return;
          root.innerHTML =
            '<div style="margin:2rem;font-family:Georgia,serif;max-width:40rem">' +
            '<p style="color:#a63d3d;font-weight:700">Reader failed to start</p>' +
            '<pre style="white-space:pre-wrap;font-size:13px;margin:1rem 0">' +
            String(msg).replace(/</g, "&lt;") +
            "</pre>" +
            "<p style=\"color:#5c564e;font-size:14px\">Use <strong>Chrome or Edge</strong> at the URL from the terminal (often <code>http://localhost:5174</code>). " +
            "Stop other <code>npm run dev</code> instances if the port was in use.</p></div>";
        }
        window.addEventListener("error", function (e) {
          showErr(e.message || (e.error && e.error.message) || e);
        });
        window.addEventListener("unhandledrejection", function (e) {
          showErr(e.reason && e.reason.message ? e.reason.message : e.reason);
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
